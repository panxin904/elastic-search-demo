name: VPS add gz locations
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: echo "hello from VPS $(hostname) and date $(date)"
