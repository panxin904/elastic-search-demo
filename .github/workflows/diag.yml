name: VPS gzip check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set +e
            echo "=== /etc/nginx/sites-enabled/sites-hub.conf (sitemap/llms/feed 段) ==="
            grep -B 1 -A 3 "sitemap\|llms\|feed" /etc/nginx/sites-enabled/sites-hub.conf /etc/nginx/conf.d/sites-hub.conf 2>&1
            echo ""
            echo "=== auth_basic 段 ==="
            grep -B 1 -A 3 "auth_basic" /etc/nginx/sites-enabled/sites-hub.conf /etc/nginx/conf.d/sites-hub.conf 2>&1
            echo ""
            echo "=== sitemap.xml 和 .gz 文件 size + mtime ==="
            ls -la /var/www/sites-hub/current/www/sitemap.xml /var/www/sites-hub/current/www/sitemap.xml.gz 2>&1
