name: VPS mime check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== mime.types 里的 gz 类型 ==="
            grep -E "\.gz|gzip" /etc/nginx/mime.types /etc/nginx/conf.d/mime-types-extra.conf 2>&1
            echo "---"
            echo "=== /etc/nginx/nginx.conf mime.types include ==="
            grep -B 1 -A 2 "mime.types" /etc/nginx/nginx.conf | head -10
