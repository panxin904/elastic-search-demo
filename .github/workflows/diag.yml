name: VPS fix
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set +e
            echo "=== /etc/nginx/sites-enabled/sites-hub.conf 完整 P1 段 ==="
            grep -B 2 -A 3 "P1.*公开元数据" /etc/nginx/sites-enabled/sites-hub.conf
            echo ""
            echo "=== 替换 alias 路径为 current/www ==="
            sed -i 's|alias /var/www/sites-hub/www/sitemap.xml;|alias /var/www/sites-hub/current/www/sitemap.xml;|; s|alias /var/www/sites-hub/www/sitemap.xml.gz;|alias /var/www/sites-hub/current/www/sitemap.xml.gz;|; s|alias /var/www/sites-hub/www/llms.txt;|alias /var/www/sites-hub/current/www/llms.txt;|; s|alias /var/www/sites-hub/www/llms-full.txt;|alias /var/www/sites-hub/current/www/llms-full.txt;|; s|alias /var/www/sites-hub/www/feed.xml;|alias /var/www/sites-hub/current/www/feed.xml;|; s|alias /var/www/sites-hub/www/robots.txt;|alias /var/www/sites-hub/current/www/robots.txt;|; s|alias /var/www/sites-hub/www/manifest.webmanifest;|alias /var/www/sites-hub/current/www/manifest.webmanifest;|; s|alias /var/www/sites-hub/www/ld.json;|alias /var/www/sites-hub/current/www/ld.json;|' /etc/nginx/sites-enabled/sites-hub.conf
            echo "替换完成"
            echo ""
            echo "=== nginx -t ==="
            nginx -t 2>&1
            echo ""
            echo "=== reload nginx ==="
            nginx -s reload 2>&1
            echo ""
            echo "=== 验证 ==="
            curl -sI https://java-px.bot.cd/sitemap.xml.gz 2>&1 | head -8
