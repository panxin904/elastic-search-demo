name: VPS mime
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== mime.types 全部 ==="
            cat /etc/nginx/mime.types
            echo "---"
            echo "=== conf.d/ 全部 ==="
            ls /etc/nginx/conf.d/
