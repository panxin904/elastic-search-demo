name: VPS mime2
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== /etc/nginx/conf.d/mime-types-extra.conf ==="
            cat /etc/nginx/conf.d/mime-types-extra.conf
            echo "---"
            echo "=== Add application/gzip gz ==="
            echo 'types { application/gzip gz; }' | sudo tee -a /etc/nginx/conf.d/mime-types-extra.conf
            sudo nginx -t 2>&1 | head -3
            sudo nginx -s reload
            echo "---"
            echo "=== Verify Content-Type ==="
            curl -sI https://java-px.bot.cd/sitemap.xml.gz 2>&1 | grep -i content-type
