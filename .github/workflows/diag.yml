name: VPS verify
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== sed 后的 sitemap.xml.gz alias ==="
            grep -A 1 "sitemap.xml.gz" /etc/nginx/sites-enabled/sites-hub.conf
            echo "---"
            echo "=== HTTP 验证（带 Host header）==="
            curl -sI -H 'Host: java-px.bot.cd' https://localhost/sitemap.xml.gz 2>&1 | head -8
