name: VPS fix gz
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 替换所有 .gz alias 加上 default_type
            sed -i -E 's|alias (/var/www/sites-hub/current/www/[^ ]+\.gz);|alias \1; default_type application/gzip;|g' /etc/nginx/sites-enabled/sites-hub.conf
            echo "=== 修改后的 .gz alias ==="
            grep "alias.*\.gz" /etc/nginx/sites-enabled/sites-hub.conf
            sudo nginx -t 2>&1 | head -3
            sudo nginx -s reload
            echo "---"
            for f in sitemap.xml.gz llms.txt.gz llms-full.txt.gz feed.xml.gz; do
              echo -n "$f: "
              curl -sI https://java-px.bot.cd/$f 2>&1 | head -1
            done
