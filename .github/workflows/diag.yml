name: VPS gzip check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set +e
            echo "=== 4 个 .gz 文件 ==="
            ls -la /var/www/sites-hub/current/www/*.gz 2>&1
            echo ""
            echo "=== HTTP /sitemap.xml.gz (Vary + Content-Length) ==="
            curl -sI https://java-px.bot.cd/sitemap.xml.gz 2>&1 | head -10
            echo ""
            echo "=== HTTP /sitemap.xml (正常未压缩) ==="
            curl -sI https://java-px.bot.cd/sitemap.xml 2>&1 | head -8
