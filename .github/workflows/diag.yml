name: VPS fix final
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 在每个 .gz location 后加 default_type application/gzip;
            sed -i 's|location = /sitemap.xml.gz { auth_basic off; access_log off; alias /var/www/sites-hub/current/www/sitemap.xml.gz; }|location = /sitemap.xml.gz { auth_basic off; access_log off; alias /var/www/sites-hub/current/www/sitemap.xml.gz; default_type application/gzip; }|' /etc/nginx/sites-enabled/sites-hub.conf
            sed -i 's|location = /llms-full.txt.gz.*|&\ndefault_type application/gzip;|' /etc/nginx/sites-enabled/sites-hub.conf
            # 在 [sitemap.xml.gz] location 块验证 default_type 已加
            grep -A 1 "sitemap.xml.gz {" /etc/nginx/sites-enabled/sites-hub.conf
            sudo nginx -t 2>&1 | head -3
            sudo nginx -s reload
            echo "---"
            curl -sI https://java-px.bot.cd/sitemap.xml.gz 2>&1 | grep -i content-type
