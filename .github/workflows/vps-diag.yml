name: VPS diag (one-off)

on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: SSH to VPS and check nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set +e
            echo "=== 1. nginx package installed ==="
            dpkg -l 2>/dev/null | grep -E "nginx-(core|full|light|extras)" | awk '{printf "  %s %s\n", $2, $3}'
            echo ""
            echo "=== 2. nginx -V | grep gzip_static ==="
            nginx -V 2>&1 | tr ' ' '\n' | grep -E "http_gzip_static|gzip_static" && echo "  ✓ gzip_static module LOADED" || echo "  ✗ gzip_static module MISSING"
            echo ""
            echo "=== 3. nginx version ==="
            nginx -v 2>&1
            echo ""
            echo "=== 4. nginx status ==="
            systemctl is-active nginx
            echo ""
            echo "=== 5. /healthz ==="
            curl -fsS http://localhost/healthz
            echo ""
            echo "=== 6. /sitemap.xml.gz HTTP status ==="
            curl -sI http://localhost/sitemap.xml.gz 2>&1 | head -3
            echo ""
            echo "=== 7. /sitemap.xml.gz file on disk ==="
            ls -la /var/www/sites-hub/current/www/sitemap.xml.gz 2>&1
