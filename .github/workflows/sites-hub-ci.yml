name: sites-hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip rebuild, deploy existing artifact only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx-full (need limit_req + stub_status)
        run: sudo apt-get update && sudo apt-get install -y nginx-full

      - name: Check SITES consistency
        run: bash sites-hub/scripts/check-sites.sh

      - name: Re-render nginx.conf from sites.sh
        run: bash sites-hub/scripts/render-nginx-conf.sh

      - name: Patch macOS → Linux paths
        run: |
          if grep -q "/opt/homebrew/etc/nginx" sites-hub/conf/nginx.conf; then
            sed -i "s|/opt/homebrew/etc/nginx/|/etc/nginx/|g" sites-hub/conf/nginx.conf
            echo "Patched macOS paths"
          fi

      - name: nginx -t
        run: sudo nginx -c $PWD/sites-hub/conf/nginx.conf -p $PWD/sites-hub/ -t

      - name: Smoke-test Python helpers
        run: |
          python3 -m py_compile sites-hub/scripts/inject-stats.py
          python3 -m py_compile sites-hub/scripts/build-sitemap-and-llms.py
          python3 -m py_compile sites-hub/scripts/build-updates-from-git.py
          python3 -m py_compile sites-hub/scripts/audit-content.py

      - name: Smoke-test Bash deploy scripts
        run: |
          bash -n sites-hub/scripts/setup-goaccess.sh
          bash -n sites-hub/scripts/setup-fail2ban.sh
          bash -n sites-hub/scripts/deploy-release.sh
          bash -n sites-hub/scripts/check-sites.sh
          bash -n sites-hub/scripts/spell-check.sh
          echo "Bash syntax OK" 

      - name: Verify PWA assets
        run: |
          test -f sites-hub/www/manifest.webmanifest
          test -f sites-hub/www/favicon-192.png
          test -f sites-hub/www/favicon-512.png
          test -f sites-hub/www/og-cover.png

      - name: Verify nginx config guards
        run: |
          grep -q gzip_types sites-hub/conf/nginx.conf
          grep -q stub_status sites-hub/conf/nginx.conf
          grep -q "limit_req_zone.*zone=auth" sites-hub/conf/nginx.conf
          grep -q "location = /healthz" sites-hub/conf/nginx.conf
          grep -q "location = /metrics" sites-hub/conf/nginx.conf
          grep -q "location = /csp-report" sites-hub/conf/nginx.conf
          grep -q "Content-Security-Policy" sites-hub/conf/nginx.conf

  build-all:
    runs-on: ubuntu-22.04
    needs: check
    # workflow_dispatch + skip_build=true → 跳过 28 站重建，复用上次 artifact
    if: "!(github.event_name == 'workflow_dispatch' && inputs.skip_build == 'true')"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site:
        - es
        - mysql
        - redis
        - cloud
        - python
        - kafka
        - java
        - tools
        - frontend
        - linux
        - cloud-native
        - ai
        - bigdata
        - network
        - video
        - filesystem
        - java-language
        - architecture
        - system-design
        - postgresql
        - observability
        - security
        - devops
        - rust
        - go
        - clickhouse
        - design-pattern
        - chaos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build site + Pagefind
        run: |
          source sites-hub/scripts/sites.sh
          proj=$(site_to_project "${{ matrix.site }}")
          cd "$proj"
          echo "Building $proj..."
          npm install --no-audit --no-fund  # 允许 lockfile 与 package.json 略不同步
          npm run docs:build
          npx pagefind --site .vitepress/dist

      - name: Tar dist (preserve proj path)
        run: |
          source sites-hub/scripts/sites.sh
          proj=$(site_to_project "${{ matrix.site }}")
          # 切到 proj 父目录，tar proj/.vitepress/dist 保留完整路径
          tar czf /tmp/dist-${{ matrix.site }}.tar.gz -C "$(dirname "$proj")" "$(basename "$proj")/.vitepress/dist"
          ls -lh /tmp/dist-${{ matrix.site }}.tar.gz

      - name: Upload site dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.site }}
          path: /tmp/dist-${{ matrix.site }}.tar.gz
          if-no-files-found: error


  release:
    needs: [check, build-all]
    runs-on: ubuntu-22.04
    # push 自动；workflow_dispatch 也跑（build-all 的 if 已决定要不要重建）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all site dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: /tmp/dists

      - name: Extract 28 site dists
        run: |
          cd ${{ github.workspace }}
          for f in /tmp/dists/dist-*/*.tar.gz; do
            echo "Extracting $f..."
            tar xzf "$f"
          done
          # 验证
          source sites-hub/scripts/sites.sh
          for s in "${SITES[@]}"; do
            proj=$(site_to_project "$s")
            test -d "$proj/.vitepress/dist/pagefind" -a -f "$proj/.vitepress/dist/pagefind/pagefind.js" || { echo "MISSING $proj"; exit 1; }
          done
          echo "All 28 site dists verified with pagefind index" 
          source sites-hub/scripts/sites.sh
          for s in "${SITES[@]}"; do
            proj=$(site_to_project "$s")
            test -d "$proj/.vitepress/dist" || { echo "MISSING $proj"; exit 1; }
          done
          echo "All 28 site dists extracted"

      - name: Build static release (MOCK_BUILD=1 reuses dists)
        run: MOCK_BUILD=1 bash sites-hub/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sites-hub-static
          path: release/sites-hub-static.tar.gz

  deploy:
    needs: [release]
    runs-on: ubuntu-22.04
    # push 自动；workflow_dispatch 也跑（release 已决定要不要重新构建）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # 启用 GitHub Environment 做 deployment gate 时把下面 environment 块打开：
    # environment:
    #   name: production
    #   url: https://java-px.bot.cd
    timeout-minutes: 10
    steps:
      - name: Download sites-hub-static artifact
        uses: actions/download-artifact@v4
        with:
          name: sites-hub-static
          path: /tmp/release
          if-no-files-found: error

      - name: Verify artifact
        run: |
          ls -la /tmp/release/
          test -f /tmp/release/sites-hub-static.tar.gz || { echo "missing tarball"; exit 1; }
          echo "Artifact size: $(du -h /tmp/release/sites-hub-static.tar.gz | cut -f1)"

      - name: SCP tarball + run deploy-release.sh on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "==> Pre-deploy: previous release"
            ls -la /var/www/sites-hub/current 2>&1 | head -2 || echo "no previous release"
            echo "==> SCP tarball to VPS"
            scp -o StrictHostKeyChecking=no -P ${{ secrets.VPS_PORT || 22 }} /tmp/release/sites-hub-static.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/sites-hub-static.tar.gz
            echo "==> Running deploy-release.sh"
            sudo /var/www/sites-hub/scripts/deploy-release.sh /tmp/sites-hub-static.tar.gz
            echo "==> Post-deploy: verify"
            curl -fsS http://localhost/healthz || { echo "healthz failed"; exit 1; }
            echo "==> Cleanup"
            rm -f /tmp/sites-hub-static.tar.gz

