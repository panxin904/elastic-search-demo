<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>5xx · 服务异常 · Scholar's Atlas</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #f6f1e8; --bg-elev: #fbf7ee; --ink: #1a1a2e; --ink-soft: #44475a; --accent: #c4623d; --line: rgba(26,26,46,.12); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "DM Sans", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  display: grid; place-items: center; text-align: center; padding: 24px;
}
h1 { font-family: "Fraunces", serif; font-style: italic; font-size: clamp(56px, 12vw, 120px); color: var(--accent); margin-bottom: 16px; }
p { color: var(--ink-soft); max-width: 480px; margin: 0 auto 24px; line-height: 1.6; }
.btn { padding: 12px 24px; border-radius: 10px; background: var(--ink); color: var(--bg); text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>5xx</h1>
  <p>服务暂时异常，工程师已收到通知。</p>
  <p>请稍后再试，或返回门户首页。</p>
  <a class="btn" href="/">🏠 返回门户</a>
</main>
</body>
</html>
