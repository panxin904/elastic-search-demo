# /etc/fail2ban/filter.d/nginx-auth.conf
# fail2ban filter for nginx basic auth failures.
# Matches lines like:
#   2026-08-13 12:34:56 [error] 1234#0: *1 user "admin": password mismatch, client: 1.2.3.4, server: ...

[Definition]
failregex = ^\s*\S+\s+\S+\s+\[\S+\]\s+\d+#\d+:\s+\*\d+ user "\S+": password mismatch, client: <HOST>, server:.*$
ignoreregex =
