# /etc/fail2ban/jail.d/nginx-auth.conf
# T3: 防 Basic Auth 暴力破解
# 安装：
#   sudo apt install fail2ban
#   sudo cp nginx-auth.conf /etc/fail2ban/filter.d/
#   sudo cp fail2ban-nginx-auth.conf /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
#
# 验证：
#   sudo fail2ban-client status nginx-auth

[nginx-auth]
enabled  = true
filter   = nginx-auth
logpath  = /var/log/nginx/auth.log
port     = http,https
maxretry = 5
findtime = 600
bantime  = 3600
