        - paragraph [ref=f2e251]: 部署 ES 集群到生产前，请确认：
        - list [ref=f2e252]:
          - listitem [ref=f2e253]:
            - text: "[ ]"
            - strong [ref=f2e254]: OS
            - text: ：Linux x86_64，内核 ≥ 3.10
          - listitem [ref=f2e255]:
            - text: "[ ]"
            - strong [ref=f2e256]: 内存
            - text: ：每节点 ≥ 16G（生产 ≥ 32G）
          - listitem [ref=f2e257]:
            - text: "[ ]"
            - strong [ref=f2e258]: 磁盘
            - text: ：SSD 推荐，RAID 或多盘 JBOD，单独挂载点
          - listitem [ref=f2e259]:
            - text: "[ ]"
            - strong [ref=f2e260]: 网络
            - text: ：千兆网卡，节点间低延迟（< 10ms）
          - listitem [ref=f2e261]:
            - text: "[ ]"
            - strong [ref=f2e262]: JDK 17
            - text: （ES 7.x 推荐 11，7.17+ 支持 17）
          - listitem [ref=f2e263]:
            - text: "[ ]"
            - strong [ref=f2e264]: vm.max_map_count ≥ 262144
          - listitem [ref=f2e265]:
            - text: "[ ]"
            - strong [ref=f2e266]: 关闭 swap
          - listitem [ref=f2e267]:
            - text: "[ ]"
            - strong [ref=f2e268]: 关闭 THP (transparent_hugepage)
          - listitem [ref=f2e269]:
            - text: "[ ]"
            - strong [ref=f2e270]: ulimit nofile ≥ 65536
          - listitem [ref=f2e271]:
            - text: "[ ]"
            - strong [ref=f2e272]: 3 / 5 / 7 节点奇数
            - text: （master 需要 majority）
          - listitem [ref=f2e273]:
            - text: "[ ]"
            - strong [ref=f2e274]: DNS 解析
            - text: ：节点间用主机名而非 IP
          - listitem [ref=f2e275]:
            - text: "[ ]"
            - strong [ref=f2e276]: 时间同步
            - text: ：NTP 服务，所有节点时间一致
          - listitem [ref=f2e277]:
            - text: "[ ]"
            - strong [ref=f2e278]: 安全
            - text: ：9200 / 9300 端口只允许内网访问
