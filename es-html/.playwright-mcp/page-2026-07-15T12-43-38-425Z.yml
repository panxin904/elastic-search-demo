          - generic [ref=e149]: 🛠️ 安装方式
          - generic [ref=e150]:
            - generic [ref=e151]:
              - strong [ref=e152]: Tar 包单机部署（生产推荐）
              - generic [ref=e153]:
                - generic [ref=e154]: Tar
                - generic [ref=e155]: Linux
            - generic [ref=e156]: 从官网下载 7.17.10 tar 包，适合生产裸机/虚拟机部署。
            - group [ref=e157]:
              - generic "完整部署命令" [ref=e158] [cursor=pointer]
              - generic [ref=e159]: "# 1. 下载（7.17.10 与本项目配套版本） wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-7.17.10-linux-x86_64.tar.gz wget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-7.17.10-linux-x86_64.tar.gz.sha512 shasum -a 512 -c elasticsearch-7.17.10-linux-x86_64.tar.gz.sha512 # 2. 解压 tar -xzf elasticsearch-7.17.10-linux-x86_64.tar.gz cd elasticsearch-7.17.10 # 3. 创建专用用户（不能用 root 启动） useradd -m -s /bin/bash esuser chown -R esuser:esuser /opt/elasticsearch-7.17.10 # 4. 修改系统限制 cat >> /etc/security/limits.conf <<EOF esuser - nofile 65536 esuser - nproc 4096 esuser - memlock unlimited EOF # 5. 禁用 swap（必须） swapoff -a # 永久：/etc/fstab 中注释掉 swap 行 # 6. 调整 vm.max_map_count sysctl -w vm.max_map_count=262144 echo 'vm.max_map_count=262144' >> /etc/sysctl.conf # 7. 编辑配置（详见\"集群配置\"主题） vi config/elasticsearch.yml # 8. 启动（后台模式） su esuser -c \"./bin/elasticsearch -d -p pid\" # 9. 验证 curl http://localhost:9200/_cluster/health?pretty"
              - button "📋 复制" [ref=e161] [cursor=pointer]
            - generic [ref=e162]:
              - generic [ref=e163]: 📌 关键说明
              - list [ref=e164]:
                - listitem [ref=e165]: "**不能用 root 启动**：ES 启动时会主动检查 UID，root 启动会报错并退出"
                - listitem [ref=e166]: "**vm.max_map_count ≥ 262144**：ES 用 mmap 大量文件，不足会导致 out of memory errors"
                - listitem [ref=e167]: "**关闭 swap**：JVM 在内存压力下可能换出堆，导致 GC 抖动甚至节点失联"
                - listitem [ref=e168]: "**kernel 参数**：THP (transparent_hugepage) 建议关闭，避免与 G1GC 冲突：`echo never > /sys/kernel/mm/transparent_hugepage/enabled`"
          - generic [ref=e169]:
            - generic [ref=e170]:
              - strong [ref=e171]: Docker 单机部署（开发测试）
              - generic [ref=e172]:
                - generic [ref=e173]: Docker
                - generic [ref=e174]: 单机
            - generic [ref=e175]: Docker 单容器部署，适合本地开发或 CI 测试。生产不推荐。
            - group [ref=e176]:
              - generic "docker run 命令" [ref=e177] [cursor=pointer]
              - generic [ref=e178]: "# 单节点 + 启用安全 + 内存锁定 docker run -d --name es \\ -p 9200:9200 -p 9300:9300 \\ -e \"discovery.type=single-node\" \\ -e \"ES_JAVA_OPTS=-Xms2g -Xmx2g\" \\ -e \"bootstrap.memory_lock=true\" \\ -e \"xpack.security.enabled=true\" \\ -e \"ELASTIC_PASSWORD=changeme\" \\ -v es_data:/usr/share/elasticsearch/data \\ --ulimit memlock=-1:-1 \\ docker.elastic.co/elasticsearch/elasticsearch:7.17.10 # 验证（生产模式需要 https + 密码） curl -k -u elastic:changeme https://localhost:9200/_cluster/health?pretty"
              - button "📋 复制" [ref=e180] [cursor=pointer]
            - generic [ref=e181]:
              - generic [ref=e182]: 📌 关键说明
              - list [ref=e183]:
                - listitem [ref=e184]: "**版本一致性**：必须使用 7.17.10 镜像，与 Java Client 版本一致"
                - listitem [ref=e185]: "**生产慎用**：Docker 在 Linux 上有 ulimit/内存限制，难以配置节点角色"
                - listitem [ref=e186]: "**开发推荐**：docker-compose 一键起 ES + Kibana + Cerebro 全套"
                - listitem [ref=e187]: "**Mac/Windows 性能差**：docker desktop 的虚拟化层带来 30%+ 性能损耗"
          - generic [ref=e188]:
            - generic [ref=e189]:
              - strong [ref=e190]: Docker Compose 3 节点集群（推荐开发）
              - generic [ref=e191]:
                - generic [ref=e192]: Docker Compose
                - generic [ref=e193]: 集群
            - generic [ref=e194]: 本地用 Docker Compose 启动 3 节点 ES 集群，适合学习集群行为、调优测试。
            - group [ref=e195]:
              - generic "docker-compose.yml" [ref=e196] [cursor=pointer]
              - generic [ref=e197]: "# docker-compose.yml version: '3.8' services: es01: image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10 environment: - node.name=es01 - cluster.name=es-dev-cluster - discovery.seed_hosts=es02,es03 - cluster.initial_master_nodes=es01,es02,es03 - \"ES_JAVA_OPTS=-Xms1g -Xmx1g\" - bootstrap.memory_lock=true - xpack.security.enabled=true - ELASTIC_PASSWORD=changeme ulimits: memlock: { soft: -1, hard: -1 } volumes: ['./data/es01:/usr/share/elasticsearch/data'] ports: ['9200:9200'] networks: ['esnet'] es02: image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10 environment: - node.name=es02 - cluster.name=es-dev-cluster - discovery.seed_hosts=es01,es03 - cluster.initial_master_nodes=es01,es02,es03 - \"ES_JAVA_OPTS=-Xms1g -Xmx1g\" ulimits: memlock: { soft: -1, hard: -1 } volumes: ['./data/es02:/usr/share/elasticsearch/data'] networks: ['esnet'] es03: image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10 environment: - node.name=es03 - cluster.name=es-dev-cluster - discovery.seed_hosts=es01,es02 - cluster.initial_master_nodes=es01,es02,es03 - \"ES_JAVA_OPTS=-Xms1g -Xmx1g\" ulimits: memlock: { soft: -1, hard: -1 } volumes: ['./data/es03:/usr/share/elasticsearch/data'] networks: ['esnet'] networks: esnet: driver: bridge # 启动 docker-compose up -d # 查看状态 docker-compose ps # 查看节点 curl -k -u elastic:changeme https://localhost:9200/_cat/nodes?v"
              - button "📋 复制" [ref=e199] [cursor=pointer]
            - generic [ref=e200]:
              - generic [ref=e201]: 📌 关键说明
              - list [ref=e202]:
                - listitem [ref=e203]: "**奇数节点**：3 / 5 / 7 节点（避免脑裂，master 需要 majority）"
                - listitem [ref=e204]: "**内存配置**：生产环境每个节点堆内存至少 8G，推荐 16-32G"
                - listitem [ref=e205]: "**data 目录**：挂载到宿主机，避免容器删除时数据丢失"
                - listitem [ref=e206]: "**network mode**：单机可以省略，跨机部署需要 overlay"
          - generic [ref=e207]:
            - generic [ref=e208]:
              - strong [ref=e209]: RPM 包安装（CentOS/RHEL）
              - generic [ref=e210]:
                - generic [ref=e211]: RPM
                - generic [ref=e212]: Systemd
            - generic [ref=e213]: CentOS/RHEL 用 RPM 包安装，自动注册 systemd 服务。
            - group [ref=e214]:
              - generic "RPM 安装步骤" [ref=e215] [cursor=pointer]
              - generic [ref=e216]: "# 1. 导入 GPG key rpm --import https://artifacts.elastic.co/GPG-KEY-elasticsearch # 2. 添加 yum repo cat > /etc/yum.repos.d/elasticsearch.repo <<EOF [elasticsearch-7.x] name=Elasticsearch repository for 7.x packages baseurl=https://artifacts.elastic.co/packages/7.x/yum gpgcheck=1 gpgkey=https://artifacts.elastic.co/GPG-KEY-elasticsearch enabled=1 autorefresh=1 type=rpm-md EOF # 3. 安装 yum install -y elasticsearch-7.17.10 # 4. 配置 vim /etc/elasticsearch/elasticsearch.yml vim /etc/elasticsearch/jvm.options # 5. 启动（systemd） systemctl daemon-reload systemctl enable elasticsearch.service systemctl start elasticsearch.service systemctl status elasticsearch.service # 6. 查看日志 journalctl -u elasticsearch -f # 7. 验证 curl http://localhost:9200/_cluster/health?pretty"
              - button "📋 复制" [ref=e218] [cursor=pointer]
            - generic [ref=e219]:
              - generic [ref=e220]: 📌 关键说明
              - list [ref=e221]:
                - listitem [ref=e222]: "**安装位置**：/usr/share/elasticsearch（程序）、/etc/elasticsearch（配置）、/var/lib/elasticsearch（数据）"
                - listitem [ref=e223]: "**systemd 集成**：service 文件位于 /usr/lib/systemd/system/elasticsearch.service"
                - listitem [ref=e224]: "**权限问题**：RPM 安装的文件属于 root:elasticsearch，需要保证数据目录权限正确"
                - listitem [ref=e225]: "**升级**：直接 yum update，旧数据可复用（仅 minor 版本）"
