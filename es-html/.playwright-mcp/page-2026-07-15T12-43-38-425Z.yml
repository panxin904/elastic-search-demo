        - paragraph [ref=e251]: 部署 ES 集群到生产前，请确认：
        - list [ref=e252]:
          - listitem [ref=e253]:
            - text: "[ ]"
            - strong [ref=e254]: OS
            - text: ：Linux x86_64，内核 ≥ 3.10
          - listitem [ref=e255]:
            - text: "[ ]"
            - strong [ref=e256]: 内存
            - text: ：每节点 ≥ 16G（生产 ≥ 32G）
          - listitem [ref=e257]:
            - text: "[ ]"
            - strong [ref=e258]: 磁盘
            - text: ：SSD 推荐，RAID 或多盘 JBOD，单独挂载点
          - listitem [ref=e259]:
            - text: "[ ]"
            - strong [ref=e260]: 网络
            - text: ：千兆网卡，节点间低延迟（< 10ms）
          - listitem [ref=e261]:
            - text: "[ ]"
            - strong [ref=e262]: JDK 17
            - text: （ES 7.x 推荐 11，7.17+ 支持 17）
          - listitem [ref=e263]:
            - text: "[ ]"
            - strong [ref=e264]: vm.max_map_count ≥ 262144
          - listitem [ref=e265]:
            - text: "[ ]"
            - strong [ref=e266]: 关闭 swap
          - listitem [ref=e267]:
            - text: "[ ]"
            - strong [ref=e268]: 关闭 THP (transparent_hugepage)
          - listitem [ref=e269]:
            - text: "[ ]"
            - strong [ref=e270]: ulimit nofile ≥ 65536
          - listitem [ref=e271]:
            - text: "[ ]"
            - strong [ref=e272]: 3 / 5 / 7 节点奇数
            - text: （master 需要 majority）
          - listitem [ref=e273]:
            - text: "[ ]"
            - strong [ref=e274]: DNS 解析
            - text: ：节点间用主机名而非 IP
          - listitem [ref=e275]:
            - text: "[ ]"
            - strong [ref=e276]: 时间同步
            - text: ：NTP 服务，所有节点时间一致
          - listitem [ref=e277]:
            - text: "[ ]"
            - strong [ref=e278]: 安全
            - text: ：9200 / 9300 端口只允许内网访问
