[project]
name = "notebooklm"
version = "0.1.0"
description = "NotebookLM-style RAG architecture rebuilt with LangGraph + Elasticsearch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sisyphus" }]

dependencies = [
    # LangGraph orchestration
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    # LLM providers
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # Elasticsearch client
    "elasticsearch>=8.11.0,<9.0.0",
    # Document loaders
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    # Reranker
    "sentence-transformers>=3.0.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "testcontainers[elasticsearch]>=4.8.0",
    "freezegun>=1.5.0",
    "respx>=0.21.0",
]

[project.scripts]
notebooklm = "notebooklm.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TID"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: requires Elasticsearch (testcontainers)",
    "slow: long-running tests",
]
