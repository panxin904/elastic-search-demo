<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔍 跨站搜索 - Scholar's Atlas</title>
  <meta name="description" content="在 28 个 VitePress 子站中全文搜索" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/inter.css" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f8fafc;
      --text: #1a1a1a;
      --text-2: #4a4a4a;
      --text-3: #6a6a6a;
      --brand: #8b5cf6;
      --border: rgba(60, 60, 67, 0.12);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e10;
        --bg-soft: #1a1a1d;
        --text: #f5f5f7;
        --text-2: #c8c8cc;
        --text-3: #a8a8ad;
        --border: rgba(255, 255, 255, 0.10);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    .subtitle { color: var(--text-2); margin-bottom: 2rem; }
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--text);
      font-family: inherit;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    button {
      padding: 0.75rem 1.5rem;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { opacity: 0.9; }
    .sites {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .site-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.8rem;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 0.875rem;
      color: var(--text-2);
      text-decoration: none;
      transition: all 0.15s;
    }
    .site-chip:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .results { margin-top: 2rem; }
    .result-group { margin-bottom: 1.5rem; }
    .result-group h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      color: var(--brand);
    }
    .result-item {
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--brand);
      background: var(--bg-soft);
      margin-bottom: 0.5rem;
      border-radius: 0 6px 6px 0;
    }
    .result-item a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    .result-item a:hover { text-decoration: underline; }
    .result-item .excerpt {
      color: var(--text-2);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .meta {
      color: var(--text-3);
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }
    .empty { color: var(--text-3); padding: 2rem; text-align: center; }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--text-2);
      text-decoration: none;
    }
    .back-link:hover { color: var(--brand); }
    .hint {
      background: var(--bg-soft);
      border-left: 3px solid var(--brand);
      padding: 1rem;
      border-radius: 0 6px 6px 0;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--text-2);
    }
    .hint code {
      background: var(--bg);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回门户</a>
    <h1>🔍 跨站全文搜索</h1>
    <p class="subtitle">在 28 个子站 1464 个文档页中搜索</p>

    <div class="hint">
      <strong>提示</strong>：每个子站都有独立的 Pagefind 全文索引（中文支持）。
      点击下面的站点快速跳转到该站搜索，或在主门户输入关键词后选择查询范围。
      完整跨站结果由各子站 Pagefind 索引聚合，详见 <code>CONTRIBUTING.md</code>。
    </div>

    <div class="search-box">
      <input type="text" id="q" placeholder="输入关键词（如 Kafka / Spring / JWT）..." autofocus />
      <button onclick="doSearch()">搜索</button>
    </div>

    <div class="sites" id="sites"></div>
    <div class="results" id="results">
      <div class="empty">输入关键词开始搜索 ↑</div>
    </div>
  </div>

  <script>
    // 28 子站列表（来自 sites.sh）
    const SITES = [
      'ai', 'architecture', 'bigdata', 'chaos', 'clickhouse',
      'cloud-native', 'design-pattern', 'devops', 'es', 'filesystem',
      'frontend', 'go', 'java-language', 'java', 'kafka',
      'linux', 'mysql', 'network', 'observability', 'postgresql',
      'python', 'redis', 'rust', 'security', 'springcloud',
      'system-design', 'tools', 'video'
    ];

    const SITE_LABELS = {
      'ai': 'AI 工程', 'architecture': '企业级架构', 'bigdata': '大数据', 'chaos': '混沌工程',
      'clickhouse': 'ClickHouse', 'cloud-native': '云原生', 'design-pattern': '设计模式',
      'devops': 'DevOps', 'es': 'Elasticsearch', 'filesystem': '文件系统',
      'frontend': '前端 & Node', 'go': 'Go 语言', 'java-language': 'Java 语言',
      'java': 'Java Web', 'kafka': 'Kafka', 'linux': 'Linux 服务器',
      'mysql': 'MySQL', 'network': '计算机网络', 'observability': '可观测性',
      'postgresql': 'PostgreSQL', 'python': 'Python', 'redis': 'Redis',
      'rust': 'Rust', 'security': '安全', 'springcloud': 'Spring Cloud',
      'system-design': '系统设计', 'tools': '在线工具', 'video': '视频处理'
    };

    // 渲染 site chips
    const sitesEl = document.getElementById('sites');
    SITES.forEach(s => {
      const a = document.createElement('a');
      a.href = `https://java-px.bot.cd/${s}/?q=`;  // 各站 Pagefind UI 接受 ?q= 参数
      a.target = '_blank';
      a.className = 'site-chip';
      a.textContent = SITE_LABELS[s] || s;
      a.title = `在 ${SITE_LABELS[s]} 站搜索`;
      sitesEl.appendChild(a);
    });

    // 回车搜索
    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    async function doSearch() {
      const q = document.getElementById('q').value.trim();
      const resultsEl = document.getElementById('results');
      if (!q) {
        resultsEl.innerHTML = '<div class="empty">输入关键词开始搜索 ↑</div>';
        return;
      }

      // 显示加载中
      resultsEl.innerHTML = '<div class="empty">搜索中...（调用各站 Pagefind 索引）</div>';

      // 跨站并行查询（用 iframe + postMessage 隔离 origin）
      // MVP 简化：跳转到各站搜索页
      const site = prompt('在哪个站点搜索？\n留空 = 主门户聚合\n输入: ' + Object.keys(SITE_LABELS).join(' / '));
      if (site === null) {
        resultsEl.innerHTML = '<div class="empty">已取消</div>';
        return;
      }
      if (site === '') {
        // 主门户聚合（暂未实现 Pagefind index 合并，跳到子站选择）
        alert('主门户聚合搜索尚未部署，请选择具体子站或点击上方站点 chip');
        return;
      }
      if (!SITE_LABELS[site]) {
        alert('未知站点: ' + site);
        return;
      }
      window.open(`https://java-px.bot.cd/${site}/?q=${encodeURIComponent(q)}`, '_blank');
    }

    // URL 携带 ?q= 时自动填入
    const params = new URLSearchParams(location.search);
    if (params.get('q')) {
      document.getElementById('q').value = params.get('q');
      doSearch();
    }
  </script>
</body>
</html>
