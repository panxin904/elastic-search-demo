<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">环路滤波（去块效应）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">DBK + SAO/H.265 + Film Grain · 解码环路里的画质优化</text>

  <!-- 块效应问题 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 块效应来源（为什么需要滤波）</text>

    <rect class="at-hover-card" x="40" y="100" width="245" height="155" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="162" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">❌ 无滤波的解码图</text>

    <rect x="55" y="140" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="92" y="140" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="129" y="140" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="166" y="140" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="203" y="140" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="55" y="177" width="35" height="35" fill="#dbeafe" stroke="#dc2626" stroke-width="2"/>
    <rect x="92" y="177" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="129" y="177" width="35" height="35" fill="#10b981" stroke="#dc2626" stroke-width="2"/>
    <rect x="166" y="177" width="35" height="35" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
    <rect x="203" y="177" width="35" height="35" fill="#dbeafe" stroke="#dc2626" stroke-width="2"/>
    <text x="162" y="240" text-anchor="middle" font-size="9" fill="#991b1b">⚠️ 块边界突变 · 视觉割裂</text>

    <rect class="at-hover-card" x="315" y="100" width="245" height="155" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="437" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">✅ 滤波后</text>

    <rect x="330" y="140" width="35" height="35" fill="#fef3c7"/>
    <rect x="367" y="140" width="35" height="35" fill="#fde68a"/>
    <rect x="404" y="140" width="35" height="35" fill="#fef3c7"/>
    <rect x="441" y="140" width="35" height="35" fill="#fde68a"/>
    <rect x="478" y="140" width="35" height="35" fill="#fef3c7"/>
    <rect x="330" y="177" width="35" height="35" fill="#bfdbfe"/>
    <rect x="367" y="177" width="35" height="35" fill="#fef3c7"/>
    <rect x="404" y="177" width="35" height="35" fill="#6ee7b7"/>
    <rect x="441" y="177" width="35" height="35" fill="#fef3c7"/>
    <rect x="478" y="177" width="35" height="35" fill="#bfdbfe"/>
    <text x="437" y="240" text-anchor="middle" font-size="9" fill="#10b981">边界平滑 · 主观画质提升</text>
  </g>

  <!-- 两种滤波 -->
  <g>
    <text x="50" y="280" font-size="13" font-weight="700" fill="#1e293b">② H.265 双滤波（DBK + SAO）</text>

    <rect class="at-hover-card" x="40" y="290" width="245" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="162" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">DBK 去块滤波</text>
    <text x="55" y="332" font-size="10" fill="#475569">· 检测块边界是否"真实"</text>
    <text x="55" y="348" font-size="10" fill="#475569">· 是 → 平滑；否 → 保留</text>
    <text x="55" y="364" font-size="9" fill="#3b82f6">用 BS（边界强度）0/1/2 区分</text>

    <rect class="at-hover-card" x="315" y="290" width="245" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="437" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">SAO 样本自适应偏移</text>
    <text x="330" y="332" font-size="10" fill="#475569">· 对像素值加偏移补偿</text>
    <text x="330" y="348" font-size="10" fill="#475569">· Edge / Band / Off 三模式</text>
    <text x="330" y="364" font-size="9" fill="#10b981">H.265 独有，压缩率 +5-10%</text>
  </g>

  <!-- 编码环路位置 -->
  <g>
    <text x="50" y="390" font-size="13" font-weight="700" fill="#1e293b">③ 在解码环路中的位置</text>

    <rect class="at-hover-card" x="40" y="400" width="510" height="65" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="423" font-size="10" font-weight="700" fill="#10b981">解码环路顺序：</text>
    <text x="55" y="440" font-size="10" fill="#e2e8f0" font-family="monospace">熵解码 → 反量化 → IDCT → 预测补偿 → 重建 → DBK → SAO → 输出</text>
    <text x="55" y="458" font-size="9" fill="#94a3b8">⚠️ 滤波后的像素 = 参考帧（用于下一帧预测）→ 必须保证编解码一致</text>
  </g>
</svg>
