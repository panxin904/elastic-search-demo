<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="--apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">MySQL 架构分层</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">连接层 → 服务层 → 存储引擎层 → 文件系统层</text>

  <!-- 客户端 -->
  <rect x="50" y="100" width="500" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="300" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">客户端 (Connection Pool / JDBC / mysql client)</text>

  <!-- 连接层 -->
  <rect x="50" y="155" width="500" height="40" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="300" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">连接层：连接管理 / 鉴权 / 线程管理</text>

  <!-- 服务层 -->
  <rect x="50" y="210" width="500" height="100" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">服务层 (SQL Layer)</text>

  <rect x="70" y="245" width="100" height="50" rx="3" fill="#fbbf24"/>
  <text x="120" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="white">查询解析</text>
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="white">Parser</text>

  <rect x="180" y="245" width="100" height="50" rx="3" fill="#fbbf24"/>
  <text x="230" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="white">查询优化</text>
  <text x="230" y="280" text-anchor="middle" font-size="10" fill="white">Optimizer</text>

  <rect x="290" y="245" width="100" height="50" rx="3" fill="#fbbf24"/>
  <text x="340" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="white">执行器</text>
  <text x="340" y="280" text-anchor="middle" font-size="10" fill="white">Executor</text>

  <rect x="400" y="245" width="130" height="50" rx="3" fill="#fbbf24"/>
  <text x="465" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="white">缓存 (Query Cache*)</text>
  <text x="465" y="280" text-anchor="middle" font-size="10" fill="white">* MySQL 8 已移除</text>

  <!-- 存储引擎层 -->
  <rect x="50" y="325" width="500" height="60" rx="4" fill="#d1fae5" stroke="#10b981"/>
  <text x="300" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">存储引擎层 (Pluggable Storage Engines)</text>
  <rect x="80" y="358" width="80" height="22" rx="2" fill="#10b981"/>
  <text x="120" y="373" text-anchor="middle" font-size="10" font-weight="600" fill="white">InnoDB</text>
  <rect x="170" y="358" width="80" height="22" rx="2" fill="#6ee7b7"/>
  <text x="210" y="373" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">MyISAM</text>
  <rect x="260" y="358" width="80" height="22" rx="2" fill="#6ee7b7"/>
  <text x="300" y="373" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Memory</text>
  <rect x="350" y="358" width="120" height="22" rx="2" fill="#10b981"/>
  <text x="410" y="373" text-anchor="middle" font-size="10" font-weight="600" fill="white">InnoDB (默认)</text>

  <!-- 文件系统层 -->
  <rect x="50" y="400" width="500" height="50" rx="4" fill="#f1f5f9" stroke="#64748b"/>
  <text x="300" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">文件系统层</text>
  <text x="300" y="442" text-anchor="middle" font-size="10" fill="#64748b">.frm / .ibd / redo log / undo log / binlog / 数据文件</text>

  <!-- 右侧注释 -->
  <line x1="80" y1="295" x2="80" y2="320" stroke="#64748b" stroke-width="1.5"/>
  <line x1="80" y1="385" x2="80" y2="395" stroke="#64748b" stroke-width="1.5"/>
</svg>
