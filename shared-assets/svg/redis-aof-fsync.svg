<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Redis AOF 三种 fsync 策略</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">always / everysec / no · 数据安全 vs 性能权衡</text>

  <!-- 三策略对比 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 三种策略对比（appendfsync 配置）</text>

    <!-- always -->
    <rect class="at-hover-card" x="40" y="105" width="165" height="200" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="122" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">always</text>
    <text x="122" y="148" text-anchor="middle" font-size="9" fill="#475569">每次写命令</text>
    <text x="122" y="162" text-anchor="middle" font-size="9" fill="#475569">都 fsync</text>

    <text x="55" y="184" font-size="10" font-weight="700" fill="#1e293b">数据安全</text>
    <text x="55" y="200" font-size="10" fill="#065f46">⭐⭐⭐⭐⭐</text>

    <text x="55" y="220" font-size="10" font-weight="700" fill="#1e293b">性能</text>
    <text x="55" y="236" font-size="10" fill="#dc2626">⭐ (极慢)</text>

    <text x="55" y="256" font-size="10" font-weight="700" fill="#1e293b">丢失数据</text>
    <text x="55" y="272" font-size="10" fill="#065f46">0 条</text>

    <text x="55" y="290" font-size="9" fill="#475569">适用：金融</text>

    <!-- everysec -->
    <rect class="at-hover-card" x="220" y="105" width="165" height="200" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="302" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">everysec</text>
    <text x="302" y="148" text-anchor="middle" font-size="9" fill="#475569">后台线程</text>
    <text x="302" y="162" text-anchor="middle" font-size="9" fill="#475569">每秒 fsync 一次</text>

    <text x="235" y="184" font-size="10" font-weight="700" fill="#1e293b">数据安全</text>
    <text x="235" y="200" font-size="10" fill="#065f46">⭐⭐⭐⭐</text>

    <text x="235" y="220" font-size="10" font-weight="700" fill="#1e293b">性能</text>
    <text x="235" y="236" font-size="10" fill="#f59e0b">⭐⭐⭐⭐</text>

    <text x="235" y="256" font-size="10" font-weight="700" fill="#1e293b">丢失数据</text>
    <text x="235" y="272" font-size="10" fill="#f59e0b">≤ 1 秒</text>

    <text x="235" y="290" font-size="9" fill="#475569">推荐：默认</text>

    <!-- no -->
    <rect class="at-hover-card" x="400" y="105" width="160" height="200" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="480" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">no</text>
    <text x="480" y="148" text-anchor="middle" font-size="9" fill="#475569">OS 控制</text>
    <text x="480" y="162" text-anchor="middle" font-size="9" fill="#475569">一般 30 秒</text>

    <text x="415" y="184" font-size="10" font-weight="700" fill="#1e293b">数据安全</text>
    <text x="415" y="200" font-size="10" fill="#dc2626">⭐⭐</text>

    <text x="415" y="220" font-size="10" font-weight="700" fill="#1e293b">性能</text>
    <text x="415" y="236" font-size="10" fill="#065f46">⭐⭐⭐⭐⭐</text>

    <text x="415" y="256" font-size="10" font-weight="700" fill="#1e293b">丢失数据</text>
    <text x="415" y="272" font-size="10" fill="#dc2626">~30s</text>

    <text x="415" y="290" font-size="9" fill="#475569">不推荐</text>
  </g>

  <!-- 写入流程 -->
  <g>
    <text x="60" y="325" font-size="13" font-weight="700" fill="#1e293b">② AOF 写入流程（以 everysec 为例）</text>

    <rect class="at-hover-card" x="40" y="340" width="520" height="120" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="355" width="105" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Client SET</text>
    <text x="107" y="386" text-anchor="middle" font-size="8" fill="#475569">k1 v1</text>

    <path d="M 160 372 L 185 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="185" y="355" width="105" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="237" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">AOF 缓冲</text>
    <text x="237" y="386" text-anchor="middle" font-size="8" fill="#475569">append to buf</text>

    <path d="M 290 372 L 315 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="315" y="355" width="105" height="35" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="367" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">OS PageCache</text>
    <text x="367" y="386" text-anchor="middle" font-size="8" fill="#475569">write() 系统调用</text>

    <path d="M 420 372 L 445 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="445" y="355" width="105" height="35" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="497" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">磁盘 AOF</text>
    <text x="497" y="386" text-anchor="middle" font-size="8" fill="#475569">fsync (1s 后)</text>

    <text x="60" y="415" font-size="10" fill="#475569">主线程只写 buffer（μs 级）→ 后台线程每秒 fsync 一次</text>
    <text x="60" y="430" font-size="10" fill="#475569">崩溃最差丢失 1s 数据（已经 write 但未 fsync 的部分）</text>
    <text x="60" y="448" font-size="9" font-weight="700" fill="#065f46">⚡ AOF 重写（BGREWRITEAOF）解决文件膨胀问题</text>
  </g>
</svg>
