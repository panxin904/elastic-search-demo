<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >HTTPS 握手（TLS 1.3）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">1-RTT 握手 · 0-RTT 恢复 · 前向保密</text>

  <!-- Client / Server -->
  <g font-size="13" font-weight="600">
    <rect x="80" y="100" width="120" height="40" rx="8" fill="#3b82f6" opacity="0.9"/>
    <text x="140" y="125" text-anchor="middle" fill="white">Client</text>

    <rect x="400" y="100" width="120" height="40" rx="8" fill="#10b981" opacity="0.9"/>
    <text x="460" y="125" text-anchor="middle" fill="white">Server</text>
  </g>

  <line x1="140" y1="160" x2="140" y2="410" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="460" y1="160" x2="460" y2="410" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Client Hello -->
  <g stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="180" x2="460" y2="180"/>
  </g>
  <text x="300" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">① ClientHello + 加密套件 + key_share</text>

  <!-- Server Hello -->
  <g stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="460" y1="220" x2="140" y2="220"/>
  </g>
  <text x="300" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">② ServerHello + 证书 + key_share + Finished</text>

  <!-- Client Finished -->
  <g stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="260" x2="460" y2="260"/>
  </g>
  <text x="300" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">③ Finished + 应用数据</text>

  <!-- 加密通道 -->
  <g font-size="11">
    <rect x="80" y="290" width="440" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="313" text-anchor="middle" font-weight="700" fill="#064e3b">🔒 加密通道建立 · 前向保密（PFS）· ECDHE 密钥交换</text>
  </g>

  <!-- 关键概念 -->
  <g font-size="11">
    <rect x="50" y="345" width="155" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="127" y="365" text-anchor="middle" font-weight="700" fill="#92400e">X.509 证书链</text>
    <text x="127" y="381" text-anchor="middle" fill="#78350f">CA 签名 · 域名验证</text>

    <rect x="222" y="345" width="155" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="299" y="365" text-anchor="middle" font-weight="700" fill="#1e3a8a">ECDHE 密钥交换</text>
    <text x="299" y="381" text-anchor="middle" fill="#1e40af">临时密钥 · PFS</text>

    <rect x="394" y="345" width="155" height="48" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="471" y="365" text-anchor="middle" font-weight="700" fill="#9f1239">AEAD 加密</text>
    <text x="471" y="381" text-anchor="middle" fill="#9d174d">AES-GCM / ChaCha20</text>
  </g>

  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#94a3b8">TLS 1.3 仅 1-RTT · TLS 1.2 为 2-RTT · 0-RTT 模式有重放风险</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">HSTS 强制 HTTPS · OCSP Stapling · Certificate Transparency</text>
</svg>
