<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Docker 架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Client · Daemon · Registry · Container</text>

  <!-- 客户端 -->
  <rect x="40" y="120" width="100" height="40" rx="6" fill="#3b82f6" opacity="0.9"/>
  <text x="90" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="white">docker CLI</text>

  <!-- Daemon -->
  <rect x="200" y="120" width="180" height="50" rx="10" fill="#10b981" opacity="0.95"/>
  <text x="290" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="white">dockerd</text>
  <text x="290" y="162" text-anchor="middle" font-size="11" fill="#d1fae5">Daemon · REST API</text>

  <!-- Registry -->
  <rect x="440" y="120" width="120" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
  <text x="500" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="white">Registry</text>

  <!-- 容器层 -->
  <rect x="200" y="220" width="180" height="180" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="290" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Container Runtime</text>

  <g font-size="11" font-weight="700">
    <rect x="220" y="255" width="60" height="60" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="250" y="280" text-anchor="middle" fill="white">C1</text>
    <text x="250" y="297" text-anchor="middle" font-size="9" fill="#dbeafe">nginx</text>
    <text x="250" y="310" text-anchor="middle" font-size="9" fill="#dbeafe">80/tcp</text>

    <rect x="290" y="255" width="60" height="60" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="320" y="280" text-anchor="middle" fill="white">C2</text>
    <text x="320" y="297" text-anchor="middle" font-size="9" fill="#d1fae5">app</text>
    <text x="320" y="310" text-anchor="middle" font-size="9" fill="#d1fae5">8080</text>

    <rect x="220" y="325" width="60" height="60" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="250" y="350" text-anchor="middle" fill="white">C3</text>
    <text x="250" y="367" text-anchor="middle" font-size="9" fill="#fef3c7">db</text>
    <text x="250" y="380" text-anchor="middle" font-size="9" fill="#fef3c7">3306</text>

    <rect x="290" y="325" width="60" height="60" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="320" y="350" text-anchor="middle" fill="white">C4</text>
    <text x="320" y="367" text-anchor="middle" font-size="9" fill="#fce7f3">cache</text>
    <text x="320" y="380" text-anchor="middle" font-size="9" fill="#fce7f3">6379</text>
  </g>

  <!-- 镜像 -->
  <rect x="40" y="260" width="120" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="283" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Images</text>
  <text x="100" y="303" text-anchor="middle" font-size="10" fill="#78350f">分层只读</text>
  <text x="100" y="320" text-anchor="middle" font-size="10" fill="#78350f">Copy-on-Write</text>
  <text x="100" y="337" text-anchor="middle" font-size="10" fill="#78350f">联合文件系统</text>
  <text x="100" y="354" text-anchor="middle" font-size="10" fill="#78350f">AUFS / Overlay2</text>

  <!-- 网络 / Volume -->
  <rect x="440" y="260" width="120" height="100" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="283" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">资源隔离</text>
  <text x="500" y="303" text-anchor="middle" font-size="10" fill="#065f46">Namespace 隔离</text>
  <text x="500" y="320" text-anchor="middle" font-size="10" fill="#065f46">PID/Net/Mount</text>
  <text x="500" y="337" text-anchor="middle" font-size="10" fill="#065f46">cgroup 限额</text>
  <text x="500" y="354" text-anchor="middle" font-size="10" fill="#065f46">CPU/内存/IO</text>

  <!-- 箭头 -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="140" x2="200" y2="140"/>
  </g>
  <text x="170" y="135" font-size="10" font-weight="600" fill="#1e3a8a">REST API</text>

  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3">
    <line x1="380" y1="140" x2="440" y2="140"/>
  </g>
  <text x="395" y="135" font-size="10" font-weight="600" fill="#92400e">pull/push</text>

  <g stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="290" y1="170" x2="290" y2="220"/>
  </g>
</svg>
