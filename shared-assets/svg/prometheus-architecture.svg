<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Prometheus 监控架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Pull 模型 · TSDB · PromQL · 告警</text>

  <!-- 4 个目标 -->
  <g font-size="11" font-weight="700">
    <rect x="40" y="120" width="100" height="60" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="90" y="142" text-anchor="middle" fill="white">App</text>
    <text x="90" y="158" text-anchor="middle" font-size="9" fill="#dbeafe">/metrics</text>
    <text x="90" y="172" text-anchor="middle" font-size="9" fill="#dbeafe">暴露</text>

    <rect x="40" y="200" width="100" height="60" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="90" y="222" text-anchor="middle" fill="white">Exporter</text>
    <text x="90" y="238" text-anchor="middle" font-size="9" fill="#d1fae5">node-exporter</text>
    <text x="90" y="252" text-anchor="middle" font-size="9" fill="#d1fae5">redis-exporter</text>

    <rect x="40" y="280" width="100" height="60" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="90" y="302" text-anchor="middle" fill="white">Pushgateway</text>
    <text x="90" y="318" text-anchor="middle" font-size="9" fill="#fef3c7">批/Job</text>
    <text x="90" y="332" text-anchor="middle" font-size="9" fill="#fef3c7">短期指标</text>

    <rect x="40" y="360" width="100" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="90" y="378" text-anchor="middle" fill="white">cAdvisor</text>
    <text x="90" y="392" text-anchor="middle" font-size="9" fill="#fce7f3">容器指标</text>
  </g>

  <!-- Prometheus 中心 -->
  <rect x="200" y="120" width="220" height="280" rx="12" fill="#ef4444" opacity="0.95"/>
  <text x="310" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="white">Prometheus Server</text>

  <g font-size="11" font-weight="700">
    <rect x="220" y="170" width="180" height="40" rx="4" fill="#fff" opacity="0.95"/>
    <text x="310" y="187" text-anchor="middle" fill="#7f1d1d">Retrieval（抓取）</text>
    <text x="310" y="201" text-anchor="middle" font-size="9" fill="#991b1b">HTTP pull · 服务发现</text>

    <rect x="220" y="220" width="180" height="40" rx="4" fill="#fff" opacity="0.95"/>
    <text x="310" y="237" text-anchor="middle" fill="#7f1d1d">TSDB 存储</text>
    <text x="310" y="251" text-anchor="middle" font-size="9" fill="#991b1b">时序压缩 · 块存储</text>

    <rect x="220" y="270" width="180" height="40" rx="4" fill="#fff" opacity="0.95"/>
    <text x="310" y="287" text-anchor="middle" fill="#7f1d1d">PromQL 引擎</text>
    <text x="310" y="301" text-anchor="middle" font-size="9" fill="#991b1b">即时查询</text>

    <rect x="220" y="320" width="180" height="40" rx="4" fill="#fff" opacity="0.95"/>
    <text x="310" y="337" text-anchor="middle" fill="#7f1d1d">Rules + AlertManager</text>
    <text x="310" y="351" text-anchor="middle" font-size="9" fill="#991b1b">阈值告警</text>
  </g>

  <!-- 抓取箭头 -->
  <g stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M140,150 Q170,150 200,170"/>
    <path d="M140,230 Q170,230 200,200"/>
    <path d="M140,310 Q170,310 200,250"/>
    <path d="M140,380 Q170,380 200,330"/>
  </g>

  <!-- 右侧 Alertmanager + Grafana -->
  <g font-size="11" font-weight="700">
    <rect x="460" y="120" width="120" height="60" rx="6" fill="#8b5cf6" opacity="0.9"/>
    <text x="520" y="145" text-anchor="middle" fill="white">AlertManager</text>
    <text x="520" y="160" text-anchor="middle" font-size="9" fill="#ede9fe">去重 · 分组</text>
    <text x="520" y="173" text-anchor="middle" font-size="9" fill="#ede9fe">Email/Slack</text>

    <rect x="460" y="200" width="120" height="60" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="520" y="225" text-anchor="middle" fill="white">Grafana</text>
    <text x="520" y="240" text-anchor="middle" font-size="9" fill="#fce7f3">可视化</text>
    <text x="520" y="253" text-anchor="middle" font-size="9" fill="#fce7f3">PromQL 查询</text>

    <rect x="460" y="280" width="120" height="60" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="520" y="305" text-anchor="middle" fill="white">Loki / Tempo</text>
    <text x="520" y="320" text-anchor="middle" font-size="9" fill="#dbeafe">日志 / 链路</text>
    <text x="520" y="333" text-anchor="middle" font-size="9" fill="#dbeafe">关联查询</text>
  </g>

  <g stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <line x1="420" y1="300" x2="460" y2="145"/>
    <line x1="420" y1="320" x2="460" y2="225"/>
    <line x1="420" y1="350" x2="460" y2="305"/>
  </g>

  <!-- 关键说明 -->
  <g font-size="11">
    <rect x="40" y="420" width="520" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="60" y="438" font-weight="700" fill="#1e293b">Pull 模型优势：</text>
    <text x="60" y="455" fill="#475569">✓ 服务发现 · 健康检查天然 · 可控抓取频率 · 多副本 federate</text>
    <text x="60" y="466" fill="#475569">⚠ 短生命周期任务 → Pushgateway · 大规模 → Cortex / Mimir 分片</text>
  </g>
</svg>
