<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">MCP 协议架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Model Context Protocol · Host ↔ Client ↔ Server · 标准化 LLM 工具接入</text>

  <!-- 左侧 Host -->
  <g>
    <rect x="30" y="95" width="170" height="350" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="115" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">MCP Host</text>
    <text x="115" y="135" text-anchor="middle" font-size="10" fill="#475569">Claude / Cursor / IDE</text>

    <rect x="45" y="155" width="140" height="40" rx="6" fill="white" stroke="#3b82f6"/>
    <text x="115" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">LLM Runtime</text>

    <rect x="45" y="205" width="140" height="40" rx="6" fill="white" stroke="#10b981"/>
    <text x="115" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">MCP Client</text>
    <text x="115" y="241" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">1 Host : N Clients</text>

    <rect x="45" y="255" width="140" height="40" rx="6" fill="white" stroke="#10b981"/>
    <text x="115" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">MCP Client</text>

    <rect x="45" y="305" width="140" height="40" rx="6" fill="white" stroke="#10b981"/>
    <text x="115" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">MCP Client</text>

    <rect x="45" y="355" width="140" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="115" y="377" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">stdio / SSE / HTTP</text>
  </g>

  <!-- 中间 transport -->
  <g>
    <text x="225" y="130" text-anchor="middle" font-size="10" fill="#64748b">JSON-RPC 2.0</text>
  </g>

  <!-- 右侧 Servers -->
  <g>
    <rect x="290" y="95" width="280" height="350" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">MCP Servers（工具集）</text>

    <rect x="305" y="140" width="250" height="55" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="430" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Filesystem Server</text>
    <text x="430" y="180" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">read_file · write_file · glob</text>
    <text x="430" y="192" text-anchor="middle" font-size="9" fill="#475569">本地文件操作</text>

    <rect x="305" y="205" width="250" height="55" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="430" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">GitHub Server</text>
    <text x="430" y="245" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">create_issue · search_code</text>
    <text x="430" y="257" text-anchor="middle" font-size="9" fill="#475569">GitHub API 封装</text>

    <rect x="305" y="270" width="250" height="55" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="430" y="293" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Database Server</text>
    <text x="430" y="310" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">query_sql · list_tables</text>
    <text x="430" y="322" text-anchor="middle" font-size="9" fill="#475569">只读查询 · schema 浏览</text>

    <rect x="305" y="335" width="250" height="55" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="430" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Web Fetch Server</text>
    <text x="430" y="375" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">fetch_url · web_search</text>
    <text x="430" y="387" text-anchor="middle" font-size="9" fill="#475569">HTTP 抓取 + 解析</text>

    <rect x="305" y="400" width="250" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="430" y="423" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">+ Resources · Prompts · Sampling</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M185,225 L290,165"/>
    <path d="M185,275 L290,230"/>
    <path d="M185,325 L290,295"/>
    <path d="M185,375 L290,360"/>
  </g>

  <g font-size="10" fill="#64748b">
    <rect x="20" y="455" width="555" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4"/>
    <text x="40" y="470">⚡ 类似 LSP（Language Server Protocol）之于 IDE：MCP 之于 AI 工具生态</text>
  </g>
</svg>
