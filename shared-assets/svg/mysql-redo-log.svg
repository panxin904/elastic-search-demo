<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">MySQL InnoDB Redo Log（WAL）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">预写日志 · 物理日志 · 循环写 · Crash-safe 核心</text>

  <!-- 整体架构 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① InnoDB 内存与磁盘组件</text>

    <rect x="40" y="105" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="55" y="118" width="180" height="70" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Buffer Pool</text>
    <text x="145" y="156" text-anchor="middle" font-size="9" fill="#475569">数据页 / 索引页</text>
    <text x="145" y="172" text-anchor="middle" font-size="9" fill="#475569">16KB per page</text>

    <rect x="245" y="118" width="180" height="70" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="335" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Log Buffer</text>
    <text x="335" y="156" text-anchor="middle" font-size="9" fill="#475569">redo log 缓冲</text>
    <text x="335" y="172" text-anchor="middle" font-size="9" fill="#475569">innodb_log_buffer_size</text>

    <rect x="435" y="118" width="115" height="70" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="492" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Disk</text>
    <text x="492" y="156" text-anchor="middle" font-size="9" fill="#475569">tablespace</text>
    <text x="492" y="172" text-anchor="middle" font-size="9" fill="#475569">redo log files</text>
  </g>

  <!-- WAL 写入流程 -->
  <g>
    <text x="60" y="225" font-size="13" font-weight="700" fill="#1e293b">② WAL 写入流程（4 步）</text>

    <rect x="40" y="240" width="520" height="140" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="55" y="258" width="105" height="100" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">1. UPDATE</text>
    <text x="107" y="295" text-anchor="middle" font-size="9" fill="#475569">改 Buffer Pool</text>
    <text x="107" y="312" text-anchor="middle" font-size="9" fill="#475569">页标脏</text>
    <text x="107" y="332" text-anchor="middle" font-size="9" fill="#475569">（不写盘）</text>

    <path d="M 160 285 L 195 285" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="178" y="278" font-size="8" fill="#dc2626" font-weight="700">先写</text>

    <rect x="195" y="258" width="110" height="100" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="250" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2. log buffer</text>
    <text x="250" y="295" text-anchor="middle" font-size="9" fill="#475569">写 redo log buf</text>
    <text x="250" y="312" text-anchor="middle" font-size="9" fill="#475569">顺序写</text>
    <text x="250" y="332" text-anchor="middle" font-size="9" fill="#475569">（μs 级）</text>

    <path d="M 305 285 L 340 285" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="323" y="278" font-size="8" fill="#dc2626" font-weight="700">commit</text>

    <rect x="340" y="258" width="105" height="100" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="392" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">3. fsync</text>
    <text x="392" y="295" text-anchor="middle" font-size="9" fill="#475569">log file 刷盘</text>
    <text x="392" y="312" text-anchor="middle" font-size="9" fill="#475569">顺序 IO</text>
    <text x="392" y="332" text-anchor="middle" font-size="9" fill="#475569">保证持久</text>

    <path d="M 445 285 L 475 285" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3,2"/>

    <rect x="475" y="258" width="75" height="100" rx="4" fill="#1e293b"/>
    <text x="512" y="285" text-anchor="middle" font-size="10" font-weight="700" fill="#a7f3d0">4. 脏页</text>
    <text x="512" y="302" text-anchor="middle" font-size="9" fill="#a7f3d0">后台</text>
    <text x="512" y="316" text-anchor="middle" font-size="9" fill="#a7f3d0">Checkpoint</text>
    <text x="512" y="335" text-anchor="middle" font-size="9" fill="#a7f3d0">异步刷</text>

    <text x="60" y="370" font-size="9" fill="#475569">⚠️ 关键顺序：先 redo log 再 data page → 即使 crash 也可 replay（重做）</text>
  </g>

  <!-- Redo log 循环写 -->
  <g>
    <text x="60" y="400" font-size="13" font-weight="700" fill="#1e293b">③ Redo Log 循环写（innodb_log_files_in_group）</text>

    <rect x="40" y="415" width="520" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="55" y="428" width="100" height="30" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="105" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">log file 1</text>

    <path d="M 155 443 L 175 443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="175" y="428" width="100" height="30" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="225" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">log file 2</text>

    <path d="M 275 443 L 295 443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="295" y="428" width="100" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="345" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">log file 3</text>

    <path d="M 395 443 L 415 443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="415" y="428" width="135" height="30" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="482" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">→ 循环到 1</text>

    <text x="60" y="462" font-size="9" fill="#475569">两个 LSN：write pos（当前写位）+ checkpoint（已刷盘位）·write pos 追 checkpoint 则需 flush 脏页</text>
  </g>
</svg>
