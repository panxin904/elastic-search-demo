<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL Group Replication（MGR）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">基于 Paxos 的强一致组复制 · 多主/单主模式 · 冲突检测</text>

  <!-- 三节点环形拓扑 -->
  <g>
    <text x="60" y="95" font-size="13" font-weight="700" fill="#1e293b">三节点环形复制（任一节点接收写）</text>

    <!-- 三个节点 -->
    <rect class="at-hover-card" x="60" y="120" width="140" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Node A (Primary)</text>
    <text x="130" y="165" font-size="10" fill="#475569">gtid_executed: 1-10</text>
    <text x="130" y="183" font-size="10" fill="#475569">certify_queue: [tx_8,tx_9]</text>
    <text x="130" y="201" font-size="10" fill="#475569">applier: 活跃</text>

    <rect class="at-hover-card" x="230" y="120" width="140" height="100" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Node B (Secondary)</text>
    <text x="300" y="165" font-size="10" fill="#475569">gtid_executed: 1-10</text>
    <text x="300" y="183" font-size="10" fill="#475569">applier: 同步中</text>
    <text x="300" y="201" font-size="10" fill="#475569">view: ONLINE</text>

    <rect class="at-hover-card" x="400" y="120" width="140" height="100" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="470" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Node C (Secondary)</text>
    <text x="470" y="165" font-size="10" fill="#475569">gtid_executed: 1-10</text>
    <text x="470" y="183" font-size="10" fill="#475569">applier: 同步中</text>
    <text x="470" y="201" font-size="10" fill="#475569">view: ONLINE</text>

    <!-- 环形箭头 -->
    <path d="M 200 170 Q 215 100 230 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 370 170 Q 385 100 400 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 540 170 L 60 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4,2"/>

    <text x="225" y="110" font-size="9" fill="#475569" text-anchor="middle">write set</text>
    <text x="385" y="110" font-size="9" fill="#475569" text-anchor="middle">write set</text>
    <text x="300" y="195" font-size="9" fill="#475569" text-anchor="middle" font-weight="700">Paxos 共识广播（半数通过）</text>
  </g>

  <!-- 写流程 -->
  <g>
    <text x="60" y="248" font-size="13" font-weight="700" fill="#1e293b">写入流程（五阶段）</text>

    <rect class="at-hover-card" x="40" y="262" width="100" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="90" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">1. 本地写</text>
    <text x="90" y="295" text-anchor="middle" font-size="9" fill="#475569">binlog</text>

    <path d="M 140 282 L 160 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="160" y="262" width="100" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="210" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">2. 写集提取</text>
    <text x="210" y="295" text-anchor="middle" font-size="9" fill="#475569">row changeset</text>

    <path d="M 260 282 L 280 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="280" y="262" width="100" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="330" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">3. 冲突检测</text>
    <text x="330" y="295" text-anchor="middle" font-size="9" fill="#475569">certify</text>

    <path d="M 380 282 L 400 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="400" y="262" width="100" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="450" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">4. Paxos</text>
    <text x="450" y="295" text-anchor="middle" font-size="9" fill="#475569">半数同意</text>

    <path d="M 500 282 L 520 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="520" y="262" width="60" height="40" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="550" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">5. 应用</text>
    <text x="550" y="295" text-anchor="middle" font-size="9" fill="#475569">apply</text>
  </g>

  <!-- 模式选择 -->
  <g>
    <text x="60" y="335" font-size="13" font-weight="700" fill="#1e293b">两种模式选择</text>

    <rect class="at-hover-card" x="40" y="350" width="250" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="165" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">单主模式（默认）</text>
    <text x="55" y="392" font-size="10" fill="#475569">• 只有一个 Primary 接收写</text>
    <text x="55" y="408" font-size="10" fill="#475569">• 自动选主（基于权重）</text>
    <text x="55" y="424" font-size="10" fill="#475569">• 适合：传统主从 + 强一致</text>
    <text x="55" y="440" font-size="10" fill="#475569">• 写扩展：靠加节点读，写单点</text>

    <rect class="at-hover-card" x="310" y="350" width="250" height="100" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">多主模式</text>
    <text x="325" y="392" font-size="10" fill="#475569">• 所有节点都可写</text>
    <text x="325" y="408" font-size="10" fill="#475569">• 冲突检测：certify 阶段</text>
    <text x="325" y="424" font-size="10" fill="#475569">• 适合：异地多写</text>
    <text x="325" y="440" font-size="10" fill="#475569">• 风险：热点行冲突率上升</text>
  </g>
</svg>
