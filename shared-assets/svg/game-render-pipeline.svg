<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >实时渲染管线</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">CPU 阶段 → GPU 阶段 · 每帧完整执行一次</text>

  <!-- 4 个 GPU 阶段方块 -->
  <g font-size="13" font-weight="600">
    <rect x="50" y="110" width="120" height="70" rx="8" fill="#3b82f6" opacity="0.9"/>
    <text x="110" y="138" text-anchor="middle" fill="white">顶点处理</text>
    <text x="110" y="158" text-anchor="middle" font-size="11" fill="#dbeafe">Vertex Shader</text>

    <rect x="190" y="110" width="120" height="70" rx="8" fill="#10b981" opacity="0.9"/>
    <text x="250" y="138" text-anchor="middle" fill="white">光栅化</text>
    <text x="250" y="158" text-anchor="middle" font-size="11" fill="#d1fae5">Rasterization</text>

    <rect x="330" y="110" width="120" height="70" rx="8" fill="#f59e0b" opacity="0.9"/>
    <text x="390" y="138" text-anchor="middle" fill="white">片元处理</text>
    <text x="390" y="158" text-anchor="middle" font-size="11" fill="#fef3c7">Fragment Shader</text>

    <rect x="470" y="110" width="80" height="70" rx="8" fill="#ec4899" opacity="0.9"/>
    <text x="510" y="138" text-anchor="middle" fill="white">输出合并</text>
    <text x="510" y="158" text-anchor="middle" font-size="11" fill="#fce7f3">Output</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="145" x2="190" y2="145"/>
    <line x1="310" y1="145" x2="330" y2="145"/>
    <line x1="450" y1="145" x2="470" y2="145"/>
  </g>

  <!-- CPU 阶段（左） -->
  <rect x="50" y="220" width="120" height="60" rx="8" fill="#94a3b8" opacity="0.85"/>
  <text x="110" y="248" text-anchor="middle" font-size="13" fill="white" font-weight="600">应用阶段</text>
  <text x="110" y="265" text-anchor="middle" font-size="11" fill="#f1f5f9">C++ / 脚本逻辑</text>

  <rect x="190" y="220" width="120" height="60" rx="8" fill="#94a3b8" opacity="0.85"/>
  <text x="250" y="248" text-anchor="middle" font-size="13" fill="white" font-weight="600">几何阶段</text>
  <text x="250" y="265" text-anchor="middle" font-size="11" fill="#f1f5f9">DrawCall / Cull</text>

  <!-- 关键概念框 -->
  <g font-size="11">
    <rect x="50" y="320" width="155" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="127" y="342" text-anchor="middle" font-weight="700" fill="#92400e">Draw Call 优化</text>
    <text x="127" y="358" text-anchor="middle" fill="#78350f">合批 / 合并 / GPU Instancing</text>

    <rect x="222" y="320" width="155" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="299" y="342" text-anchor="middle" font-weight="700" fill="#1e3a8a">Z-Buffer 深度测试</text>
    <text x="299" y="358" text-anchor="middle" fill="#1e40af">Early-Z / Hi-Z</text>

    <rect x="394" y="320" width="155" height="55" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="471" y="342" text-anchor="middle" font-weight="700" fill="#064e3b">PBR 着色</text>
    <text x="471" y="358" text-anchor="middle" fill="#065f46">金属度 / 粗糙度 / AO</text>
  </g>

  <!-- CPU → GPU -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="3 2">
    <line x1="110" y1="280" x2="110" y2="130"/>
    <line x1="250" y1="280" x2="250" y2="130"/>
  </g>
  <text x="60" y="200" font-size="10" fill="#94a3b8">CPU → GPU</text>

  <text x="300" y="425" text-anchor="middle" font-size="11" fill="#94a3b8">现代 GPU 可编程阶段：Vertex / Geometry / Tessellation / Fragment / Compute</text>
  <text x="300" y="445" text-anchor="middle" font-size="11" fill="#94a3b8">Forward / Deferred / Forward+ / Clustered · 决定光照与材质处理时机</text>
</svg>
