<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >策略模式（Strategy Pattern）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">算法族可替换 · 避免多重 if-else</text>

  <!-- Context -->
  <rect class="at-hover-card" x="50" y="180" width="130" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="208" text-anchor="middle" font-weight="700" fill="#1e3a8a">Context</text>
  <text x="115" y="225" text-anchor="middle" font-size="10" fill="#1e40af">上下文</text>
  <text x="115" y="248" text-anchor="middle" font-size="11" fill="#1e40af">strategy: Strategy</text>
  <text x="115" y="265" text-anchor="middle" font-size="11" fill="#1e40af">execute()</text>

  <!-- Strategy 接口 -->
  <rect class="at-hover-card" x="250" y="110" width="140" height="50" rx="6" fill="#3b82f6" opacity="0.95"/>
  <text x="320" y="132" text-anchor="middle" font-weight="700" fill="white">«interface» Strategy</text>
  <text x="320" y="148" text-anchor="middle" font-size="10" fill="#dbeafe">+ algorithm()</text>

  <!-- 3 个实现 -->
  <g font-size="11" font-weight="700">
    <rect class="at-hover-card" x="430" y="100" width="130" height="55" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="495" y="125" text-anchor="middle" fill="white">StrategyA</text>
    <text x="495" y="142" text-anchor="middle" font-size="10" fill="#d1fae5">快速排序</text>

    <rect class="at-hover-card" x="430" y="200" width="130" height="55" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="495" y="225" text-anchor="middle" fill="white">StrategyB</text>
    <text x="495" y="242" text-anchor="middle" font-size="10" fill="#fef3c7">归并排序</text>

    <rect class="at-hover-card" x="430" y="300" width="130" height="55" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="495" y="325" text-anchor="middle" fill="white">StrategyC</text>
    <text x="495" y="342" text-anchor="middle" font-size="10" fill="#fce7f3">堆排序</text>
  </g>

  <!-- 实现箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <line x1="390" y1="125" x2="430" y2="125"/>
    <line x1="390" y1="225" x2="430" y2="225"/>
    <line x1="390" y1="325" x2="430" y2="325"/>
  </g>

  <!-- Context → Strategy 组合 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="220" x2="248" y2="135"/>
  </g>
  <text x="200" y="180" font-size="10" fill="#475569" font-weight="600">使用</text>

  <!-- 关键特性 -->
  <g font-size="11">
    <rect class="at-hover-card" x="50" y="380" width="500" height="75" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="400" text-anchor="middle" font-weight="700" fill="#1e293b">使用场景</text>
    <text x="60" y="420" fill="#475569">✓ 多算法可选 · 运行时切换</text>
    <text x="60" y="438" fill="#475569">✓ 避免 if-else / switch 大量分支</text>
    <text x="320" y="420" fill="#475569">✓ 算法独立扩展（OCP）</text>
    <text x="320" y="438" fill="#475569">✗ 类数量增多 · 客户端需了解差异</text>
  </g>
</svg>
