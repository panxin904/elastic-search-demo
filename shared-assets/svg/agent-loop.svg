<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Agent 推理循环</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Think → Act → Observe → 反思 → 继续 / 终止（ReAct 模式）</text>

  <!-- 中心圆 LLM -->
  <g>
    <circle cx="300" cy="245" r="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">LLM</text>
    <text x="300" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Brain</text>
    <text x="300" y="275" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">决策核心</text>
  </g>

  <!-- 4 个外围节点 -->
  <g>
    <rect x="60" y="100" width="150" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="135" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">① Thought 思考</text>
    <text x="135" y="143" text-anchor="middle" font-size="10" fill="#475569">拆解目标 + 制定计划</text>
    <text x="135" y="158" text-anchor="middle" font-size="9" fill="#475569">Chain-of-Thought</text>

    <rect x="390" y="100" width="150" height="70" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="465" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">② Action 执行</text>
    <text x="465" y="143" text-anchor="middle" font-size="10" fill="#475569">调用工具 / API</text>
    <text x="465" y="158" text-anchor="middle" font-size="9" fill="#065f46">Tool Use · Function Call</text>

    <rect x="60" y="320" width="150" height="70" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="135" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">③ Observation</text>
    <text x="135" y="363" text-anchor="middle" font-size="10" fill="#475569">观察结果</text>
    <text x="135" y="378" text-anchor="middle" font-size="9" fill="#5b21b6">Function 输出</text>

    <rect x="390" y="320" width="150" height="70" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="465" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">④ Reflect 反思</text>
    <text x="465" y="363" text-anchor="middle" font-size="10" fill="#475569">结果是否符合预期</text>
    <text x="465" y="378" text-anchor="middle" font-size="9" fill="#9d174d">Re-plan</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M210,135 L260,205"/>
    <path d="M390,135 L340,205"/>
    <path d="M390,355 L340,285"/>
    <path d="M210,355 L260,285"/>
  </g>

  <!-- Memory -->
  <g>
    <rect x="60" y="410" width="480" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="80" y="432" font-size="11" font-weight="700" fill="#475569">Memory 记忆</text>
    <text x="80" y="450" font-size="10" fill="#475569">短期：当前任务上下文（Prompt）</text>
    <text x="80" y="463" font-size="10" fill="#475569">长期：向量库 / 知识图谱 · 历史对话摘要</text>
    <text x="320" y="432" font-size="11" font-weight="700" fill="#475569">Tools 工具</text>
    <text x="320" y="450" font-size="10" fill="#475569">搜索 · 代码执行 · 数据库 · MCP Server</text>
    <text x="320" y="463" font-size="10" fill="#475569">OpenAPI · 自定义函数</text>
  </g>

  <!-- 终止 -->
  <g>
    <rect x="240" y="180" width="120" height="35" rx="18" fill="#d1fae5" stroke="#10b981"/>
    <text x="300" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">目标完成？</text>
  </g>
  <g stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <path d="M340,200 L375,200"/>
  </g>
  <text x="365" y="195" font-size="9" fill="#475569">yes → 输出</text>
</svg>
