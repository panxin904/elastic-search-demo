<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">JWT Token 结构剖析</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Header.Payload.Signature · 三段 Base64URL · 无状态会话</text>

  <!-- JWT 完整示例 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① JWT 三段式结构（eyJ... 是 Base64URL 编码）</text>

    <rect class="at-hover-card" x="40" y="100" width="520" height="50" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="123" font-size="11" font-weight="700" fill="#ef4444">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</text>
    <text x="55" y="143" font-size="11" font-weight="700" fill="#10b981">.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ</text>
    <text x="55" y="143" font-size="11" font-weight="700" fill="#10b981"></text>
  </g>

  <!-- 3 段对比 -->
  <g>
    <rect class="at-hover-card" x="40" y="165" width="170" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="125" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Header 头部</text>
    <text x="55" y="208" font-size="10" font-weight="700" fill="#475569">算法 + 类型</text>
    <rect x="55" y="218" width="140" height="80" rx="4" fill="#fef3c7"/>
    <text x="63" y="234" font-size="9" font-family="monospace" fill="#475569">{</text>
    <text x="73" y="250" font-size="9" font-family="monospace" fill="#dc2626">"alg": "HS256",</text>
    <text x="73" y="265" font-size="9" font-family="monospace" fill="#dc2626">"typ": "JWT"</text>
    <text x="63" y="280" font-size="9" font-family="monospace" fill="#475569">}</text>
    <text x="125" y="320" text-anchor="middle" font-size="9" fill="#991b1b">⚠️ 不存敏感信息</text>

    <rect class="at-hover-card" x="220" y="165" width="170" height="170" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="305" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Payload 载荷</text>
    <text x="235" y="208" font-size="10" font-weight="700" fill="#475569">Claims 数据</text>
    <rect x="235" y="218" width="140" height="80" rx="4" fill="#d1fae5"/>
    <text x="243" y="234" font-size="9" font-family="monospace" fill="#475569">{</text>
    <text x="253" y="250" font-size="9" font-family="monospace" fill="#10b981">"sub": "123",</text>
    <text x="253" y="265" font-size="9" font-family="monospace" fill="#10b981">"name": "Alice",</text>
    <text x="253" y="280" font-size="9" font-family="monospace" fill="#10b981">"exp": 1735689600</text>
    <text x="243" y="294" font-size="9" font-family="monospace" fill="#475569">}</text>
    <text x="305" y="320" text-anchor="middle" font-size="9" fill="#10b981">⚠️ 可解码，仅签名</text>

    <rect class="at-hover-card" x="400" y="165" width="160" height="170" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="480" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Signature 签名</text>
    <text x="415" y="208" font-size="10" font-weight="700" fill="#475569">防篡改</text>
    <text x="415" y="228" font-size="9" fill="#475569" font-family="monospace">HMACSHA256(</text>
    <text x="425" y="244" font-size="9" fill="#475569" font-family="monospace">base64(header)+</text>
    <text x="425" y="260" font-size="9" fill="#475569" font-family="monospace">base64(payload),</text>
    <text x="425" y="276" font-size="9" fill="#475569" font-family="monospace">secret_key</text>
    <text x="415" y="292" font-size="9" fill="#475569" font-family="monospace">)</text>
    <text x="415" y="312" font-size="9" fill="#3b82f6">RS256 用私钥签名</text>
    <text x="480" y="328" text-anchor="middle" font-size="9" fill="#1e40af">🔐 不可逆</text>
  </g>

  <!-- 3 种签名算法 -->
  <g>
    <text x="50" y="365" font-size="13" font-weight="700" fill="#1e293b">② 3 类签名算法对比</text>

    <rect class="at-hover-card" x="40" y="375" width="170" height="55" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="125" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">HS256 对称</text>
    <text x="125" y="412" text-anchor="middle" font-size="9" fill="#475569">单 secret</text>
    <text x="125" y="425" text-anchor="middle" font-size="9" fill="#10b981">⭐ 单服务</text>

    <rect class="at-hover-card" x="220" y="375" width="170" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="305" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">RS256 非对称</text>
    <text x="305" y="412" text-anchor="middle" font-size="9" fill="#475569">私钥签 / 公钥验</text>
    <text x="305" y="425" text-anchor="middle" font-size="9" fill="#3b82f6">⭐⭐⭐ 微服务</text>

    <rect class="at-hover-card" x="400" y="375" width="160" height="55" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="480" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">ES256 椭圆曲线</text>
    <text x="480" y="412" text-anchor="middle" font-size="9" fill="#475569">更短 · 更快</text>
    <text x="480" y="425" text-anchor="middle" font-size="9" fill="#8b5cf6">⭐ 移动端</text>
  </g>

  <!-- 关键点 -->
  <text x="300" y="455" text-anchor="middle" font-size="10" fill="#dc2626">⚠️ 常见误区：Payload 仅 Base64 不加密 → 不可放密码/手机号等敏感信息</text>
  <text x="300" y="470" text-anchor="middle" font-size="10" fill="#10b981">📌 Access Token 短期（15min）· Refresh Token 长期 + HttpOnly Cookie 存储</text>
</svg>
