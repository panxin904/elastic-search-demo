<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Android Activity 生命周期</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">7 个核心回调 · 完整流转 + 异常场景</text>

  <!-- 圆圈节点 -->
  <g font-size="13" font-weight="600">
    <circle cx="100" cy="180" r="48" fill="#10b981" opacity="0.9"/>
    <text x="100" y="178" text-anchor="middle" fill="white">onCreate</text>
    <text x="100" y="196" text-anchor="middle" font-size="10" fill="#d1fae5">初始化</text>

    <circle cx="220" cy="120" r="48" fill="#10b981" opacity="0.9"/>
    <text x="220" y="118" text-anchor="middle" fill="white">onStart</text>
    <text x="220" y="136" text-anchor="middle" font-size="10" fill="#d1fae5">可见</text>

    <circle cx="370" cy="120" r="48" fill="#10b981" opacity="0.9"/>
    <text x="370" y="118" text-anchor="middle" fill="white">onResume</text>
    <text x="370" y="136" text-anchor="middle" font-size="10" fill="#d1fae5">前台</text>

    <circle cx="500" cy="180" r="48" fill="#10b981" opacity="0.9"/>
    <text x="500" y="178" text-anchor="middle" fill="white">Running</text>
    <text x="500" y="196" text-anchor="middle" font-size="10" fill="#d1fae5">运行中</text>

    <circle cx="500" cy="320" r="48" fill="#f59e0b" opacity="0.9"/>
    <text x="500" y="318" text-anchor="middle" fill="white">onPause</text>
    <text x="500" y="336" text-anchor="middle" font-size="10" fill="#fef3c7">失去焦点</text>

    <circle cx="370" cy="380" r="48" fill="#f59e0b" opacity="0.9"/>
    <text x="370" y="378" text-anchor="middle" fill="white">onStop</text>
    <text x="370" y="396" text-anchor="middle" font-size="10" fill="#fef3c7">不可见</text>

    <circle cx="220" cy="380" r="48" fill="#ec4899" opacity="0.9"/>
    <text x="220" y="378" text-anchor="middle" fill="white">onDestroy</text>
    <text x="220" y="396" text-anchor="middle" font-size="10" fill="#fce7f3">销毁</text>
  </g>

  <!-- 箭头（前向） -->
  <g stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="148" y1="180" x2="172" y2="120"/>
    <line x1="268" y1="120" x2="322" y2="120"/>
    <line x1="418" y1="120" x2="452" y2="180"/>
  </g>
  <!-- 箭头（后向） -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M500,228 Q500,260 500,272"/>
    <path d="M452,320 Q410,355 418,380"/>
    <path d="M322,380 Q280,400 268,380"/>
    <line x1="172" y1="380" x2="100" y2="225" stroke="#94a3b8" stroke-dasharray="3 2"/>
  </g>

  <!-- 异常场景 -->
  <g font-size="11">
    <rect class="at-hover-card" x="50" y="270" width="155" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="127" y="290" text-anchor="middle" font-weight="700" fill="#7f1d1d">配置变化（旋转）</text>
    <text x="127" y="306" text-anchor="middle" fill="#991b1b">onPause → onStop → onDestroy</text>

    <rect class="at-hover-card" x="50" y="330" width="155" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="127" y="350" text-anchor="middle" font-weight="700" fill="#1e3a8a">系统回收（OOM）</text>
    <text x="127" y="366" text-anchor="middle" fill="#1e40af">onPause → onSaveInstance</text>
  </g>

  <text x="300" y="445" text-anchor="middle" font-size="11" fill="#94a3b8">前台状态 = onResume → onPause 之间 · ViewModel 不受生命周期影响可保留数据</text>
</svg>
