<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Elasticsearch ILM 生命周期</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Hot → Warm → Cold → Frozen → Delete · 自动 Rollover</text>

  <!-- 四阶段流水线 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 四阶段生命周期</text>

    <!-- Hot -->
    <rect class="at-hover-card" x="40" y="105" width="115" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="97" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Hot 🔥</text>
    <text x="55" y="148" font-size="9" fill="#475569">频繁写入 / 查询</text>
    <text x="55" y="163" font-size="9" fill="#475569">高性能 SSD</text>
    <text x="55" y="178" font-size="9" fill="#475569">副本 1-2</text>

    <path d="M 155 145 L 175 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Warm -->
    <rect class="at-hover-card" x="175" y="105" width="115" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="232" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Warm 🌡</text>
    <text x="190" y="148" font-size="9" fill="#475569">只读 / 偶尔查询</text>
    <text x="190" y="163" font-size="9" fill="#475569">force_merge 减段</text>
    <text x="190" y="178" font-size="9" fill="#475569">副本 0-1</text>

    <path d="M 290 145 L 310 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Cold -->
    <rect class="at-hover-card" x="310" y="105" width="115" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="367" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Cold ❄</text>
    <text x="325" y="148" font-size="9" fill="#475569">极少查询</text>
    <text x="325" y="163" font-size="9" fill="#475569">frozen tier</text>
    <text x="325" y="178" font-size="9" fill="#475569">searchable snapshot</text>

    <path d="M 425 145 L 445 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Frozen -->
    <rect class="at-hover-card" x="445" y="105" width="115" height="80" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="502" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Frozen 🧊</text>
    <text x="460" y="148" font-size="9" fill="#475569">归档 / 备份</text>
    <text x="460" y="163" font-size="9" fill="#475569">对象存储 S3</text>
    <text x="460" y="178" font-size="9" fill="#475569">极低成本</text>

    <!-- Delete -->
    <rect class="at-hover-card" x="240" y="215" width="120" height="35" rx="4" fill="#1e293b" stroke="#0f172a"/>
    <text x="300" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Delete 🗑</text>

    <path d="M 502 185 L 502 200 L 360 200 L 360 215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 触发条件 -->
  <g>
    <text x="60" y="272" font-size="13" font-weight="700" fill="#1e293b">② 阶段切换触发条件</text>

    <rect class="at-hover-card" x="40" y="285" width="520" height="80" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="60" y="298" width="155" height="55" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="137" y="316" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">时间触发</text>
    <text x="70" y="332" font-size="9" font-family="monospace" fill="#1e293b">min_age: "7d"</text>
    <text x="70" y="347" font-size="9" fill="#475569">写入 7 天后迁移</text>

    <rect class="at-hover-card" x="225" y="298" width="155" height="55" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="302" y="316" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">大小触发</text>
    <text x="235" y="332" font-size="9" font-family="monospace" fill="#1e293b">max_size: 50gb</text>
    <text x="235" y="347" font-size="9" fill="#475569">超 50GB rollover</text>

    <rect class="at-hover-card" x="390" y="298" width="160" height="55" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="470" y="316" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">文档数触发</text>
    <text x="400" y="332" font-size="9" font-family="monospace" fill="#1e293b">max_docs: 200000000</text>
    <text x="400" y="347" font-size="9" fill="#475569">2 亿文档 rollover</text>
  </g>

  <!-- Rollover 机制 -->
  <g>
    <text x="60" y="383" font-size="13" font-weight="700" fill="#1e293b">③ Rollover（热阶段内索引切换）</text>

    <rect class="at-hover-card" x="40" y="395" width="520" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="408" width="80" height="45" rx="3" fill="#fff" stroke="#3b82f6"/>
    <text x="95" y="425" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">write_alias</text>
    <text x="95" y="442" text-anchor="middle" font-size="9" fill="#475569">→ 指向新索引</text>

    <path d="M 140 430 L 165 430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="165" y="408" width="85" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="207" y="422" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">logs-000001</text>

    <rect class="at-hover-card" x="260" y="408" width="85" height="22" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="302" y="422" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">logs-000002</text>

    <rect class="at-hover-card" x="355" y="408" width="85" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="397" y="422" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">logs-000003</text>

    <rect class="at-hover-card" x="450" y="408" width="100" height="22" rx="3" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="500" y="422" text-anchor="middle" font-size="9" font-weight="700" fill="#4338ca">logs-000004 ↑</text>

    <text x="350" y="448" font-size="9" fill="#475569" text-anchor="middle">当前写入 alias 自动滚动到 000004，旧索引按策略进入下一阶段</text>
  </g>
</svg>
