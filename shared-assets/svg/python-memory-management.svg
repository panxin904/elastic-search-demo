<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">Python 内存管理三件套</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">引用计数（核心）· GC（兜底）· 内存池（优化）</text>

  <!-- 三件套架构 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 三件套协同（自上而下分层）</text>

    <rect class="at-hover-card" x="40" y="100" width="520" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="55" y="125" font-size="11" font-weight="700" fill="#1e40af">👤 业务代码</text>
    <text x="160" y="125" font-size="10" fill="#475569">x = [1, 2, 3]  ·  y = {"a": 1}  ·  z = "hello"</text>
    <text x="160" y="145" font-size="9" fill="#3b82f6">所有对象创建 / 引用 / 销毁</text>

    <path d="M300,155 L300,175" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="40" y="175" width="520" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="55" y="198" font-size="11" font-weight="700" fill="#047857">📊 引用计数（refcount）</text>
    <text x="200" y="198" font-size="10" fill="#475569">每对象头部 8 字节 · 增加/释放引用时 +1/-1 · 归零即释放</text>
    <text x="200" y="215" font-size="9" fill="#10b981">99% 场景靠它实时回收（O(1) · 无延迟）</text>

    <path d="M300,225 L300,245" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="40" y="245" width="520" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="268" font-size="11" font-weight="700" fill="#92400e">🗑️ 循环引用 GC（gen0/1/2）</text>
    <text x="270" y="268" font-size="10" fill="#475569">检测容器对象（list/dict/class）循环引用 · 分代回收</text>
    <text x="270" y="285" font-size="9" fill="#f59e0b">兜底机制：解决循环引用导致的 refcount 永不归零</text>

    <path d="M300,295 L300,315" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="40" y="315" width="520" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="55" y="338" font-size="11" font-weight="700" fill="#5b21b6">📦 内存池（PyMalloc）</text>
    <text x="210" y="338" font-size="10" fill="#475569">小对象 &lt; 512B → arena → pool → block（256 字节对齐）</text>
    <text x="210" y="355" font-size="9" fill="#8b5cf6">避免频繁调 malloc/free · 大对象 &gt; 512B 直接调系统 malloc</text>
  </g>

  <!-- 循环引用场景 -->
  <g>
    <text x="50" y="395" font-size="13" font-weight="700" fill="#1e293b">② 循环引用场景（refcount 解决不了）</text>

    <rect class="at-hover-card" x="40" y="405" width="510" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="55" y="427" font-size="11" font-weight="700" fill="#991b1b">⚠️ classic case</text>
    <text x="160" y="427" font-size="10" font-family="monospace" fill="#475569">a = []; b = []; a.append(b); b.append(a)</text>
    <text x="55" y="448" font-size="10" fill="#dc2626">a / b 引用计数 = 1，del a, b → 仍 = 1，refcount 归零不了</text>
  </g>
</svg>
