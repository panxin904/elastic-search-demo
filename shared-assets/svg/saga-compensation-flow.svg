<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Saga 补偿流程（编排式）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">正向步骤 + 补偿步骤 · Orchestrator 协调 · 最终一致性</text>

  <!-- 时间线 -->
  <g>
    <line x1="60" y1="240" x2="540" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="60" y="232" font-size="9" fill="#94a3b8">t=0</text>
    <text x="540" y="232" font-size="9" fill="#94a3b8" text-anchor="end">t=T</text>

    <!-- 步骤 1: 下订单 -->
    <circle cx="100" cy="240" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">1</text>
    <text x="100" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">创建订单</text>
    <text x="100" y="305" text-anchor="middle" font-size="9" fill="#475569">Order Svc</text>

    <!-- 步骤 2: 扣库存 -->
    <circle cx="220" cy="240" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="220" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">2</text>
    <text x="220" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">扣减库存</text>
    <text x="220" y="305" text-anchor="middle" font-size="9" fill="#475569">Stock Svc</text>

    <!-- 步骤 3: 扣款 -->
    <circle cx="340" cy="240" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="340" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">3</text>
    <text x="340" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">扣款支付</text>
    <text x="340" y="305" text-anchor="middle" font-size="9" fill="#475569">Payment Svc</text>

    <!-- 步骤 4: 发货 -->
    <circle cx="460" cy="240" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="460" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">4</text>
    <text x="460" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">发货（FAIL）</text>
    <text x="460" y="305" text-anchor="middle" font-size="9" fill="#475569">Ship Svc</text>
  </g>

  <!-- 补偿步骤 -->
  <g>
    <!-- 补偿 C3 -->
    <rect x="305" y="340" width="70" height="30" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="340" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">退款 C3</text>

    <!-- 补偿 C2 -->
    <rect x="185" y="340" width="70" height="30" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="220" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">还库存 C2</text>

    <!-- 补偿 C1 -->
    <rect x="65" y="340" width="70" height="30" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="100" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">取消订单 C1</text>

    <!-- 补偿连线 -->
    <g stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4" marker-end="url(#arr-red)">
      <path d="M455,265 L380,345"/>
      <path d="M335,365 L260,365"/>
      <path d="M195,365 L130,365"/>
    </g>
  </g>

  <!-- Orchestrator -->
  <g>
    <rect x="20" y="395" width="560" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="40" y="418" font-size="12" font-weight="700" fill="#1e40af">Orchestrator（编排器 · Saga Coordinator）</text>
    <text x="40" y="438" font-size="10" fill="#475569">负责：定义步骤执行顺序、监听失败事件、触发反向补偿</text>
    <text x="40" y="455" font-size="10" fill="#475569">⚡ 关键属性：补偿必须有（幂等 + 业务可逆）· 失败重试 + 超时 · 持久化 saga 状态（重启可恢复）</text>
  </g>

  <!-- 顶部注释 -->
  <g font-size="10" fill="#64748b">
    <rect x="20" y="80" width="560" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4"/>
    <text x="40" y="100" font-weight="700" fill="#1e293b">⚡ 适用场景</text>
    <text x="40" y="118" font-size="10">跨服务长事务 · 不需要 2PC 强一致 · 业务可补偿（撤销订单 / 退款 / 还库存）</text>
    <text x="40" y="130" font-size="10">⚡ 局限：补偿终态一致性窗口期；不适合资金等强一致场景</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M122,240 L198,240"/>
    <path d="M242,240 L318,240"/>
    <path d="M362,240 L438,240"/>
  </g>
</svg>
