<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">Python asyncio 事件循环</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">单线程协程调度 · Ready/Run/Wait 三态 · IO 等待让出控制</text>

  <!-- 事件循环主流程 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 事件循环 4 步循环</text>

    <rect class="at-hover-card" x="40" y="100" width="120" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1. 取出 Task</text>
    <text x="100" y="140" text-anchor="middle" font-size="9" fill="#475569">从 Ready 队列</text>

    <path d="M160,127 L185,127" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="185" y="100" width="120" height="55" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="245" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">2. 执行</text>
    <text x="245" y="140" text-anchor="middle" font-size="9" fill="#475569">直到 await</text>

    <path d="M305,127 L330,127" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="330" y="100" width="120" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="390" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3. 等待 IO</text>
    <text x="390" y="140" text-anchor="middle" font-size="9" fill="#475569">挂起 → Wait 队列</text>

    <path d="M450,127 L475,127" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="475" y="100" width="85" height="55" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="517" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">4. 回调</text>
    <text x="517" y="140" text-anchor="middle" font-size="9" fill="#475569">就绪入队</text>

    <path d="M517,155 L517,170 L100,170 L100,155" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Task 状态机 -->
  <g>
    <text x="50" y="200" font-size="13" font-weight="700" fill="#1e293b">② Task 状态机（4 态转换）</text>

    <rect class="at-hover-card" x="40" y="210" width="120" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="100" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Pending</text>
    <text x="100" y="250" text-anchor="middle" font-size="9" fill="#475569">刚创建</text>

    <path d="M160,237 L195,237" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="195" y="210" width="120" height="55" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="255" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Running</text>
    <text x="255" y="250" text-anchor="middle" font-size="9" fill="#475569">正在执行</text>

    <path d="M315,237 L350,237" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="350" y="210" width="120" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="410" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Suspended</text>
    <text x="410" y="250" text-anchor="middle" font-size="9" fill="#475569">await 挂起</text>

    <path d="M470,237 L505,237" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="505" y="210" width="55" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="532" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Done</text>
    <text x="532" y="250" text-anchor="middle" font-size="9" fill="#475569">完成</text>

    <path d="M470,237 L350,237" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)" transform="translate(0,-15)"/>
    <text x="410" y="200" text-anchor="middle" font-size="9" fill="#64748b">IO 完成</text>
  </g>

  <!-- 协程 vs 线程 -->
  <g>
    <text x="50" y="295" font-size="13" font-weight="700" fill="#1e293b">③ asyncio vs threading 对比</text>

    <rect class="at-hover-card" x="40" y="305" width="255" height="155" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="167" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">asyncio（单线程）</text>
    <text x="55" y="350" font-size="10" fill="#475569">✅ 轻量：协程 ~ KB 级</text>
    <text x="55" y="368" font-size="10" fill="#475569">✅ 高并发：万级连接</text>
    <text x="55" y="386" font-size="10" fill="#475569">✅ 无 GIL 竞争</text>
    <text x="55" y="404" font-size="10" fill="#475569">❌ 不能并行（CPU 密集）</text>
    <text x="55" y="422" font-size="10" fill="#475569">❌ 同步代码阻塞全循环</text>
    <text x="167" y="448" text-anchor="middle" font-size="9" fill="#10b981">⭐ IO 密集型首选</text>

    <rect class="at-hover-card" x="305" y="305" width="255" height="155" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="432" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">threading（多线程）</text>
    <text x="320" y="350" font-size="10" fill="#475569">❌ 重：线程 ~ MB 级</text>
    <text x="320" y="368" font-size="10" fill="#475569">❌ 数百线程受限</text>
    <text x="320" y="386" font-size="10" fill="#475569">⚠️ 受 GIL 限制</text>
    <text x="320" y="404" font-size="10" fill="#475569">✅ 同步阻塞 IO 友好</text>
    <text x="320" y="422" font-size="10" fill="#475569">✅ 兼容旧代码</text>
    <text x="432" y="448" text-anchor="middle" font-size="9" fill="#f59e0b">适合简单并发</text>
  </g>
</svg>
