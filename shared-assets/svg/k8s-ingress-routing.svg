<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">K8s Ingress 七层路由</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Host + Path 规则 · TLS 终结 · 替代多个 LoadBalancer</text>

  <!-- 外部流量 -->
  <g>
    <rect x="40" y="85" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Internet</text>
    <text x="100" y="124" text-anchor="middle" font-size="10" fill="#475569">HTTPS 请求</text>

    <path d="M160,110 L210,110" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Ingress Controller -->
  <g>
    <rect x="210" y="85" width="180" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="300" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Ingress Controller</text>
    <text x="300" y="124" text-anchor="middle" font-size="10" fill="#475569">nginx / traefik / HAProxy</text>

    <path d="M390,110 L440,110" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Ingress 资源 -->
  <g>
    <rect x="440" y="85" width="120" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="500" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Ingress 资源</text>
    <text x="500" y="124" text-anchor="middle" font-size="10" fill="#475569">路由规则定义</text>
  </g>

  <!-- 路由规则表 -->
  <g>
    <text x="50" y="170" font-size="13" font-weight="700" fill="#1e293b">② 路由规则（Host + Path）</text>

    <rect x="40" y="180" width="170" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="125" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">api.bot.cd</text>
    <text x="55" y="222" font-size="10" fill="#475569">/v1/*    → api-svc:8080</text>
    <text x="55" y="238" font-size="10" fill="#475569">/v2/*    → api-v2-svc:80</text>
    <text x="55" y="258" font-size="10" fill="#475569">/admin/* → admin-svc:9000</text>
    <text x="125" y="274" text-anchor="middle" font-size="9" fill="#3b82f6">3 个 Path 路径</text>

    <rect x="220" y="180" width="170" height="100" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="305" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">web.bot.cd</text>
    <text x="235" y="222" font-size="10" fill="#475569">/        → web-svc:80</text>
    <text x="235" y="238" font-size="10" fill="#475569">/static  → cdn-svc:80</text>
    <text x="235" y="258" font-size="10" fill="#475569">/api/*   → api-svc:8080</text>
    <text x="305" y="274" text-anchor="middle" font-size="9" fill="#10b981">跨域路由</text>

    <rect x="400" y="180" width="170" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="485" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">*.bot.cd</text>
    <text x="415" y="222" font-size="10" fill="#475569">通配符 Host 匹配</text>
    <text x="415" y="238" font-size="10" fill="#475569">子域名自动解析</text>
    <text x="415" y="258" font-size="10" fill="#475569">灰度/多租户场景</text>
    <text x="485" y="274" text-anchor="middle" font-size="9" fill="#f59e0b">泛域名</text>
  </g>

  <!-- TLS 终结 -->
  <g>
    <text x="50" y="315" font-size="13" font-weight="700" fill="#1e293b">③ TLS 终结 + 后端 HTTP</text>

    <rect x="40" y="325" width="520" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="60" y="348" font-size="12" font-weight="700" fill="#991b1b">🔒 TLS 终结</text>
    <text x="60" y="365" font-size="10" fill="#475569">HTTPS → Ingress Controller 解密 → 后端 HTTP 明文（节省 Pod CPU）</text>
    <text x="480" y="348" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">✅ 集中证书管理</text>
    <text x="480" y="365" font-size="10" fill="#475569" text-anchor="end">Let's Encrypt 自动续期</text>
  </g>

  <!-- 后端服务 -->
  <g>
    <text x="50" y="410" font-size="13" font-weight="700" fill="#1e293b">④ 后端 Service 路由</text>

    <rect x="40" y="420" width="160" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">api-svc:8080</text>

    <rect x="220" y="420" width="160" height="40" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">web-svc:80</text>

    <rect x="400" y="420" width="160" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">admin-svc:9000</text>
  </g>

  <!-- 关键点 -->
  <text x="300" y="475" text-anchor="middle" font-size="10" fill="#64748b">💡 七层路由（L7）· 替代多个 LoadBalancer · 节省云厂商成本</text>
</svg>
