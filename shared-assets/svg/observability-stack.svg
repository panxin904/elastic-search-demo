<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Observability 三支柱</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64768b">Metrics · Logs · Traces · 关联查询</text>

  <!-- 三支柱方框 -->
  <g font-size="12" font-weight="700">
    <!-- Metrics -->
    <rect x="40" y="100" width="160" height="160" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="125" text-anchor="middle" font-size="14" fill="#1e3a8a">Metrics</text>
    <text x="120" y="145" text-anchor="middle" font-size="11" fill="#1e40af">指标</text>
    <text x="120" y="170" text-anchor="middle" font-size="10" fill="#1e40af">数值 + 时间戳</text>
    <text x="120" y="188" text-anchor="middle" font-size="10" fill="#1e40af">Counter / Gauge</text>
    <text x="120" y="206" text-anchor="middle" font-size="10" fill="#1e40af">Histogram / Summary</text>
    <text x="120" y="224" text-anchor="middle" font-size="11" fill="#3b82f6">Prometheus</text>
    <text x="120" y="244" text-anchor="middle" font-size="11" fill="#3b82f6">InfluxDB · Mimir</text>

    <!-- Logs -->
    <rect x="220" y="100" width="160" height="160" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="125" text-anchor="middle" font-size="14" fill="#064e3b">Logs</text>
    <text x="300" y="145" text-anchor="middle" font-size="11" fill="#065f46">日志</text>
    <text x="300" y="170" text-anchor="middle" font-size="10" fill="#065f46">离散事件记录</text>
    <text x="300" y="188" text-anchor="middle" font-size="10" fill="#065f46">结构化 JSON</text>
    <text x="300" y="206" text-anchor="middle" font-size="10" fill="#065f46">级别：DEBUG/INFO</text>
    <text x="300" y="224" text-anchor="middle" font-size="11" fill="#10b981">ELK / EFK</text>
    <text x="300" y="244" text-anchor="middle" font-size="11" fill="#10b981">Loki · Splunk</text>

    <!-- Traces -->
    <rect x="400" y="100" width="160" height="160" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="480" y="125" text-anchor="middle" font-size="14" fill="#9f1239">Traces</text>
    <text x="480" y="145" text-anchor="middle" font-size="11" fill="#9d174d">链路追踪</text>
    <text x="480" y="170" text-anchor="middle" font-size="10" fill="#9d174d">请求因果</text>
    <text x="480" y="188" text-anchor="middle" font-size="10" fill="#9d174d">Span 树形</text>
    <text x="480" y="206" text-anchor="middle" font-size="10" fill="#9d174d">traceId 串联</text>
    <text x="480" y="224" text-anchor="middle" font-size="11" fill="#ec4899">Jaeger / Zipkin</text>
    <text x="480" y="244" text-anchor="middle" font-size="11" fill="#ec4899">Tempo · SkyWalking</text>
  </g>

  <!-- 统一采集层 -->
  <rect x="40" y="285" width="520" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">OpenTelemetry（统一采集）</text>
  <text x="60" y="325" text-anchor="middle" font-size="11" fill="#475569">SDK · 自动埋点 · OTLP 协议 · Collector 汇聚</text>

  <!-- 应用层 -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <line x1="120" y1="260" x2="120" y2="285"/>
    <line x1="300" y1="260" x2="300" y2="285"/>
    <line x1="480" y1="260" x2="480" y2="285"/>
  </g>

  <!-- 应用 -->
  <rect x="40" y="365" width="520" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="385" font-size="13" font-weight="700" fill="#92400e">应用 / 服务（产生三类数据）</text>

  <g font-size="11">
    <text x="60" y="408" fill="#78350f">✓ 业务指标：QPS / 延迟 / 错误率 · RED（Rate / Errors / Duration）</text>
    <text x="60" y="425" fill="#78350f">✓ 关键日志：请求 ID · 用户 ID · 业务上下文</text>
    <text x="60" y="442" fill="#78350f">✓ 链路追踪：traceId 跨服务传递 · 服务依赖分析</text>
    <text x="320" y="408" fill="#78350f">USE（Utilization / Saturation / Errors）· 资源视角</text>
    <text x="320" y="425" fill="#78350f">SLI / SLO · 错误预算</text>
    <text x="320" y="442" fill="#78350f">关联：traceId → log → metric · 一键跳转</text>
  </g>

  <g stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <line x1="300" y1="340" x2="300" y2="365"/>
  </g>
</svg>
