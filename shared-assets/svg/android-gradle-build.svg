<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Android Gradle 构建流水线</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">compileSdk → class → dex → apk → sign</text>

  <!-- 主流程 6 阶段 -->
  <g font-size="13" font-weight="600">
    <rect class="at-hover-card" x="40" y="130" width="90" height="60" rx="8" fill="#3b82f6" opacity="0.9"/>
    <text x="85" y="156" text-anchor="middle" fill="white">资源合并</text>
    <text x="85" y="174" text-anchor="middle" font-size="10" fill="#dbeafe">aapt2 link</text>

    <rect class="at-hover-card" x="150" y="130" width="90" height="60" rx="8" fill="#10b981" opacity="0.9"/>
    <text x="195" y="156" text-anchor="middle" fill="white">编译 .class</text>
    <text x="195" y="174" text-anchor="middle" font-size="10" fill="#d1fae5">kotlinc / javac</text>

    <rect class="at-hover-card" x="260" y="130" width="90" height="60" rx="8" fill="#f59e0b" opacity="0.9"/>
    <text x="305" y="156" text-anchor="middle" fill="white">转 dex</text>
    <text x="305" y="174" text-anchor="middle" font-size="10" fill="#fef3c7">d8 / R8</text>

    <rect class="at-hover-card" x="370" y="130" width="90" height="60" rx="8" fill="#8b5cf6" opacity="0.9"/>
    <text x="415" y="156" text-anchor="middle" fill="white">打包 apk</text>
    <text x="415" y="174" text-anchor="middle" font-size="10" fill="#ede9fe">zipalign</text>

    <rect class="at-hover-card" x="480" y="130" width="80" height="60" rx="8" fill="#ec4899" opacity="0.9"/>
    <text x="520" y="156" text-anchor="middle" fill="white">签名</text>
    <text x="520" y="174" text-anchor="middle" font-size="10" fill="#fce7f3">apksigner</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="160" x2="150" y2="160"/>
    <line x1="240" y1="160" x2="260" y2="160"/>
    <line x1="350" y1="160" x2="370" y2="160"/>
    <line x1="460" y1="160" x2="480" y2="160"/>
  </g>

  <!-- 中间产物 -->
  <g font-size="11" fill="#64748b">
    <text x="85" y="120" text-anchor="middle">res.ap_</text>
    <text x="195" y="120" text-anchor="middle">*.class</text>
    <text x="305" y="120" text-anchor="middle">classes.dex</text>
    <text x="415" y="120" text-anchor="middle">app-unsigned.apk</text>
    <text x="520" y="120" text-anchor="middle">app.apk</text>
  </g>

  <!-- 关键优化点 -->
  <g font-size="11">
    <rect class="at-hover-card" x="50" y="240" width="155" height="55" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="127" y="262" text-anchor="middle" font-weight="700" fill="#064e3b">增量编译</text>
    <text x="127" y="278" text-anchor="middle" fill="#065f46">仅重编译变更模块</text>

    <rect class="at-hover-card" x="222" y="240" width="155" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="299" y="262" text-anchor="middle" font-weight="700" fill="#92400e">R8 优化</text>
    <text x="299" y="278" text-anchor="middle" fill="#78350f">混淆 / 压缩 / 内联</text>

    <rect class="at-hover-card" x="394" y="240" width="155" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="471" y="262" text-anchor="middle" font-weight="700" fill="#1e3a8a">构建缓存</text>
    <text x="471" y="278" text-anchor="middle" fill="#1e40af">build cache + remote</text>
  </g>

  <!-- 多模块 -->
  <rect class="at-hover-card" x="50" y="330" width="500" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">多模块并行构建（app / core / feature-x）</text>
  <text x="300" y="374" text-anchor="middle" font-size="11" fill="#78350f">独立编译单元 · 配置隔离 · 团队并行开发 · 减少 rebuild 范围</text>

  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#94a3b8">KSP/KAPT 注解处理 · R8 vs ProGuard · APK/AAB 输出 · Play Asset Delivery</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">v2/v3/v4 签名方案 · Play Integrity · Bundle 体积优化（5MB 限制）</text>
</svg>
