<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Kubernetes RBAC 鉴权流程</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Subject → RoleBinding → Role → Resource · allow/deny 决策链</text>

  <!-- 三角色框 -->
  <g>
    <!-- User -->
    <rect x="30" y="100" width="120" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">User / ServiceAccount</text>
    <text x="90" y="148" text-anchor="middle" font-size="10" fill="#475569">Subject</text>
    <text x="90" y="165" text-anchor="middle" font-size="9" fill="#64748b">kind: User/SA/Group</text>

    <!-- RoleBinding -->
    <rect x="220" y="100" width="160" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">RoleBinding / ClusterRoleBinding</text>
    <text x="300" y="148" text-anchor="middle" font-size="10" fill="#475569">绑定关系</text>
    <text x="300" y="165" text-anchor="middle" font-size="9" fill="#64748b">subjects + roleRef</text>

    <!-- Role -->
    <rect x="450" y="100" width="120" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="510" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Role / ClusterRole</text>
    <text x="510" y="148" text-anchor="middle" font-size="10" fill="#475569">权限定义</text>
    <text x="510" y="165" text-anchor="middle" font-size="9" fill="#64748b">rules: verbs+resources</text>

    <!-- 连接箭头 -->
    <line x1="150" y1="140" x2="220" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="380" y1="140" x2="450" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Role 内容示例 -->
  <g>
    <rect x="40" y="220" width="520" height="120" rx="6" fill="#1f2937"/>
    <text x="60" y="245" font-size="11" fill="#a5f3fc" font-family="monospace">apiVersion: rbac.authorization.k8s.io/v1</text>
    <text x="60" y="262" font-size="11" fill="#fef3c7" font-family="monospace">kind: Role</text>
    <text x="60" y="279" font-size="11" fill="#e0e7ff" font-family="monospace">metadata:</text>
    <text x="60" y="296" font-size="11" fill="#e0e7ff" font-family="monospace">  namespace: production</text>
    <text x="60" y="313" font-size="11" fill="#86efac" font-family="monospace">rules:</text>
    <text x="60" y="330" font-size="11" fill="#e0e7ff" font-family="monospace">- apiGroups: ["apps"]                # 资源组</text>
  </g>

  <!-- 鉴权决策 -->
  <g>
    <rect x="40" y="365" width="250" height="80" rx="8" fill="#fef9c3" stroke="#facc15" stroke-width="2"/>
    <text x="165" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">kube-apiserver 鉴权决策</text>
    <text x="60" y="410" font-size="11" fill="#475569">1. Authentication（你是谁？）</text>
    <text x="60" y="426" font-size="11" fill="#475569">2. Authorization（RBAC → 允许？）</text>
    <text x="60" y="442" font-size="11" fill="#475569">3. Admission Control（Mutation+Valid）</text>

    <rect x="310" y="365" width="250" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="435" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">⚠️ 默认拒绝</text>
    <text x="330" y="410" font-size="11" fill="#475569">无匹配 RoleBinding → 403 Forbidden</text>
    <text x="330" y="426" font-size="11" fill="#475569">read ≠ list ≠ watch</text>
    <text x="330" y="442" font-size="11" fill="#475569">Verb 必须逐个授权</text>
  </g>

  <!-- 底部 -->
  <text x="300" y="465" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">最佳实践：最小权限 · 用 Role 而非 ClusterRole · SA 绑定而非 User</text>
</svg>
