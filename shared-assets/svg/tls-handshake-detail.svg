<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >TLS 1.3 握手流程</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">1-RTT（默认） · 0-RTT（恢复会话） · 支持前向保密（PFS）</text>

  <!-- Client / Server -->
  <g>
    <rect x="40" y="90" width="100" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="90" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Client</text>

    <rect x="460" y="90" width="100" height="40" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="510" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Server</text>
  </g>

  <!-- ClientHello -->
  <g>
    <line x1="90" y1="135" x2="510" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="300" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">① ClientHello</text>
    <text x="300" y="153" text-anchor="middle" font-size="9" fill="#475569">cipher_suites · key_share(ECDHE) · supported_versions · SNI</text>
  </g>

  <!-- ServerHello + Finished -->
  <g>
    <line x1="510" y1="180" x2="90" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="300" y="173" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">② ServerHello + EncryptedExtensions + Cert + CertVerify + Finished</text>
    <text x="300" y="198" text-anchor="middle" font-size="9" fill="#475569">选择 cipher · 返回证书 · DH 参数 · Finished(MAC)</text>
  </g>

  <!-- Client Finished -->
  <g>
    <line x1="90" y1="225" x2="510" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="300" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">③ Finished（验证握手）</text>
    <text x="300" y="243" text-anchor="middle" font-size="9" fill="#475569">双方导出 master secret · 切换到加密信道</text>
  </g>

  <!-- App Data -->
  <g>
    <rect x="40" y="265" width="100" height="35" rx="6" fill="#10b981" opacity="0.85"/>
    <text x="90" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="white">App Data</text>
    <line x1="140" y1="282" x2="460" y2="282" stroke="#10b981" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr)"/>
    <text x="300" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">④ 应用数据（加密 + AEAD）</text>
  </g>

  <!-- 关键概念 -->
  <g>
    <rect x="20" y="315" width="560" height="155" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

    <text x="40" y="340" font-size="12" font-weight="700" fill="#1e293b">⚡ 关键点</text>

    <text x="40" y="360" font-size="10" fill="#475569">• 1-RTT：3 次报文完成（vs TLS 1.2 的 2-RTT）</text>
    <text x="40" y="376" font-size="10" fill="#475569">• PFS（前向保密）：每次会话用临时 ECDHE 密钥，即使长期私钥泄露历史会话不可解</text>
    <text x="40" y="392" font-size="10" fill="#475569">• 0-RTT：恢复会话时复用 PSK + Early Data（防重放靠 single-use ticket）</text>
    <text x="40" y="408" font-size="10" fill="#475569">• AEAD：ChaCha20-Poly1305 / AES-GCM 同时保证机密性 + 完整性</text>
    <text x="40" y="424" font-size="10" fill="#475569">• 不再支持：静态 RSA 密钥交换、3DES、MD5、SHA-1 签名（全部禁用）</text>
    <text x="40" y="440" font-size="10" fill="#475569">• 验证证书链：CA 证书 → 中间证书 → 服务器证书 · CRL / OCSP 检查吊销</text>
    <text x="40" y="456" font-size="10" fill="#475569">• 应用：HTTPS / mTLS 服务网格（Istio sidecar 间）/ 数据库 TLS / SMTP STARTTLS</text>
  </g>

  <!-- cipher suite 例子 -->
  <g>
    <rect x="20" y="220" width="170" height="22" fill="#fef3c7" stroke="#f59e0b" opacity="0.0"/>
  </g>
</svg>
