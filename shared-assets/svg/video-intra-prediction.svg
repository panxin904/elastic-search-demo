<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">H.264 帧内预测 9 种模式</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">用邻居块预测当前块 · 残差编码 · I 帧关键</text>

  <!-- 4×4 9 模式 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 4×4 块 9 种帧内预测模式</text>

    <rect class="at-hover-card" x="40" y="100" width="250" height="170" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="165" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">4×4 亮度预测（9 模式）</text>

    <!-- 9 模式列表 -->
    <text x="55" y="145" font-size="9" fill="#475569">Mode 0 (V)  · 垂直预测</text>
    <text x="55" y="160" font-size="9" fill="#475569">Mode 1 (H)  · 水平预测</text>
    <text x="55" y="175" font-size="9" fill="#475569">Mode 2 (DC) · 均值预测</text>
    <text x="55" y="190" font-size="9" fill="#475569">Mode 3 (DDL) · 左下对角</text>
    <text x="55" y="205" font-size="9" fill="#475569">Mode 4 (DDR) · 右下对角</text>
    <text x="55" y="220" font-size="9" fill="#475569">Mode 5 (VR)  · 垂直右斜</text>
    <text x="55" y="235" font-size="9" fill="#475569">Mode 6 (HD) · 水平下斜</text>
    <text x="55" y="250" font-size="9" fill="#475569">Mode 7 (VL) · 垂直左斜</text>
    <text x="55" y="265" font-size="9" fill="#475569">Mode 8 (HU) · 水平上斜</text>

    <rect class="at-hover-card" x="305" y="100" width="255" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="432" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">16×16 亮度预测（4 模式）</text>
    <text x="320" y="142" font-size="9" fill="#475569">Mode 0 (V)  · 垂直</text>
    <text x="320" y="158" font-size="9" fill="#475569">Mode 1 (H)  · 水平</text>
    <text x="320" y="174" font-size="9" fill="#475569">Mode 2 (DC) · 均值</text>
    <text x="320" y="190" font-size="9" fill="#10b981">Mode 3 (Plane) · 平面（适合缓变）</text>

    <rect class="at-hover-card" x="305" y="200" width="255" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="432" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">色度预测（4 模式）</text>
    <text x="320" y="242" font-size="9" fill="#475569">DC / H / V / Plane（与亮度类似）</text>
    <text x="320" y="258" font-size="9" fill="#f59e0b">色度块总是 8×8</text>
  </g>

  <!-- 预测示意 -->
  <g>
    <text x="50" y="305" font-size="13" font-weight="700" fill="#1e293b">② 帧内预测示意（用左/上邻居）</text>

    <rect class="at-hover-card" x="40" y="315" width="510" height="105" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="338" font-size="10" font-weight="700" fill="#10b981">预测流程：</text>
    <text x="55" y="356" font-size="10" fill="#e2e8f0" font-family="monospace">1. 取当前块左边（A-M）和上边（a-h）已编码像素</text>
    <text x="55" y="373" font-size="10" fill="#e2e8f0" font-family="monospace">2. 用 9 种模式生成 9 个预测块 → 计算 SAD（残差绝对值和）</text>
    <text x="55" y="390" font-size="10" fill="#e2e8f0" font-family="monospace">3. 选 SAD 最小的模式（rate-distortion optimization）</text>
    <text x="55" y="407" font-size="10" font-weight="700" fill="#10b981">输出：</text>
    <text x="115" y="407" font-size="10" fill="#e2e8f0" font-family="monospace">最佳模式编号 + 残差块 → 后续 DCT + 量化 + 熵编码</text>
  </g>

  <!-- 关键点 -->
  <text x="50" y="445" font-size="10" fill="#64748b">💡 H.265 帧内预测更精细（35 种模式），AV1 进一步扩展（56 种），编码复杂度大幅提升</text>
  <text x="50" y="465" font-size="10" fill="#10b981">📌 I 帧越大压缩率越差，但 P/B 帧依赖 I 帧 → 直播场景常用"短 GOP"（每 1 秒一个 I 帧）</text>
</svg>
