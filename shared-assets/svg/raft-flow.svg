<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="--apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Raft 一致性协议</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Leader 选举 + 日志复制 + 安全性</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-raft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 3 个节点 -->
  <rect class="at-hover-card" x="100" y="130" width="120" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Node A</text>
  <text x="160" y="173" text-anchor="middle" font-size="11" fill="#78350f">Follower</text>
  <text x="160" y="190" text-anchor="middle" font-size="10" fill="#a16207">term: 1</text>

  <rect class="at-hover-card" x="240" y="130" width="120" height="80" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
  <text x="300" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Node B</text>
  <text x="300" y="173" text-anchor="middle" font-size="11" fill="#78350f">⭐ Leader</text>
  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#a16207">term: 2</text>

  <rect class="at-hover-card" x="380" y="130" width="120" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Node C</text>
  <text x="430" y="173" text-anchor="middle" font-size="11" fill="#78350f">Follower</text>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#a16207">term: 1</text>

  <!-- 心跳 -->
  <line x1="240" y1="160" x2="222" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-raft)" stroke-dasharray="4,3"/>
  <line x1="360" y1="160" x2="378" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-raft)" stroke-dasharray="4,3"/>
  <text x="231" y="148" font-size="10" fill="#92400e">心跳</text>
  <text x="369" y="148" font-size="10" fill="#92400e">心跳</text>

  <!-- 步骤说明 -->
  <rect class="at-hover-card" x="50" y="240" width="500" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="265" font-size="13" font-weight="700" fill="#1e293b">三个核心机制：</text>

  <text x="70" y="290" font-size="12" font-weight="600" fill="#3b82f6">① Leader 选举</text>
  <text x="70" y="307" font-size="11" fill="#475569">· Follower 心跳超时（150-300ms）→ 变 Candidate → term++ → RequestVote RPC</text>
  <text x="70" y="322" font-size="11" fill="#475569">· 获多数票 (n/2+1) → 成为 Leader</text>

  <text x="70" y="345" font-size="12" font-weight="600" fill="#10b981">② 日志复制</text>
  <text x="70" y="362" font-size="11" fill="#475569">· 客户端请求 → Leader 追加本地 log → AppendEntries RPC 给所有 Follower</text>
  <text x="70" y="377" font-size="11" fill="#475569">· 多数节点持久化后 → commit → 状态机应用</text>

  <text x="70" y="400" font-size="12" font-weight="600" fill="#f59e0b">③ 安全性</text>
  <text x="70" y="417" font-size="11" fill="#475569">· 选举限制：Candidate 的 log 必须至少与多数节点一样新（up-to-date）</text>
  <text x="70" y="432" font-size="11" fill="#475569">· 已 commit 的 entry 不会被覆盖（State Machine Safety）</text>
</svg>
