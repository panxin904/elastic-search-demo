<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Service Mesh Sidecar 注入</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Istio/Linkerd · Envoy 代理 · iptables 流量劫持 · mTLS 零信任</text>

  <!-- 传统架构对比 -->
  <g>
    <text x="60" y="95" font-size="13" font-weight="700" fill="#1e293b">传统 vs Service Mesh</text>

    <!-- 传统 -->
    <rect x="40" y="115" width="240" height="100" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="160" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">传统微服务</text>
    <rect x="60" y="150" width="80" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="100" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">App A</text>

    <rect x="180" y="150" width="80" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="220" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">App B</text>

    <line x1="140" y1="175" x2="180" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="160" y="170" text-anchor="middle" font-size="9" fill="#475569">SDK</text>
    <text x="160" y="205" text-anchor="middle" font-size="9" fill="#dc2626">应用承担网络逻辑</text>

    <!-- Mesh -->
    <rect x="320" y="115" width="240" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="440" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Service Mesh</text>

    <!-- Pod 1 -->
    <rect x="335" y="150" width="100" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="385" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">App A</text>
    <rect x="385" y="145" width="50" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="410" y="160" text-anchor="middle" font-size="8" fill="#92400e">Envoy</text>

    <!-- Pod 2 -->
    <rect x="445" y="150" width="100" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="495" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">App B</text>
    <rect x="495" y="145" width="50" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="520" y="160" text-anchor="middle" font-size="8" fill="#92400e">Envoy</text>

    <line x1="460" y1="175" x2="485" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="440" y="205" text-anchor="middle" font-size="9" fill="#065f46">sidecar 代理网络</text>
  </g>

  <!-- Sidecar 注入流程 -->
  <g>
    <text x="60" y="240" font-size="13" font-weight="700" fill="#1e293b">Sidecar 注入流程（Istio）</text>

    <!-- 步骤 -->
    <rect x="40" y="260" width="120" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="100" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">① Mutating</text>
    <text x="100" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Webhook</text>
    <text x="100" y="312" text-anchor="middle" font-size="9" fill="#475569">sidecar.istio.io/inject</text>

    <line x1="160" y1="290" x2="190" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="190" y="260" width="120" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="250" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">② 注入 Envoy</text>
    <text x="250" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">容器到 Pod</text>

    <line x1="310" y1="290" x2="340" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="340" y="260" width="120" height="60" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="400" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">③ iptables</text>
    <text x="400" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">劫持流量</text>

    <line x1="460" y1="290" x2="490" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="490" y="260" width="80" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="530" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">④ mTLS</text>
    <text x="530" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">加密</text>

    <!-- 流量劫持示意 -->
    <rect x="40" y="335" width="525" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="358" font-size="11" font-weight="700" fill="#1e293b">流量劫持（iptables 规则）：</text>
    <text x="60" y="378" font-size="10" font-family="monospace" fill="#1e2937">-A ISTIO_OUTPUT -p tcp --dport 15001 -j RETURN   # Envoy 自己端口跳过</text>
    <text x="60" y="395" font-size="10" font-family="monospace" fill="#1e2937">-A ISTIO_OUTPUT -p tcp -j ISTIO_REDIRECT       # 其他 → 走 Envoy</text>
    <text x="60" y="415" font-size="10" fill="#475569">→ 所有出站流量透明走 sidecar，应用代码无感知</text>
  </g>

  <!-- 控制面 -->
  <g>
    <rect x="40" y="435" width="525" height="35" rx="6" fill="#fef9c3" stroke="#facc15"/>
    <text x="60" y="455" font-size="11" font-weight="700" fill="#854d0e">数据面（Envoy sidecar）</text>
    <text x="60" y="468" font-size="10" fill="#854d0e">Istiod 控制面 → xDS API → 推送路由/熔断/TLS 策略</text>
  </g>
</svg>
