<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL Online DDL 三种算法</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">ALGORITHM=INSTANT/INPLACE/COPY · LOCK=NONE/SHARED/EXCLUSIVE</text>

  <!-- 三列对比 -->
  <g>
    <!-- INSTANT -->
    <rect class="at-hover-card" x="40" y="90" width="165" height="320" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="122" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">INSTANT</text>
    <text x="122" y="132" text-anchor="middle" font-size="9" fill="#475569">MySQL 8.0+</text>

    <text x="60" y="158" font-size="11" font-weight="700" fill="#065f46">⚡ 最快</text>
    <text x="60" y="178" font-size="10" fill="#475569">• 仅修改元数据</text>
    <text x="60" y="195" font-size="10" fill="#475569">• 不动数据文件</text>
    <text x="60" y="212" font-size="10" fill="#475569">• 瞬间完成</text>

    <text x="60" y="240" font-size="11" font-weight="700" fill="#475569">支持：</text>
    <text x="60" y="258" font-size="10" fill="#475569">• 加列（默认值）</text>
    <text x="60" y="273" font-size="10" fill="#475569">• 改列默认值</text>
    <text x="60" y="288" font-size="10" fill="#475569">• 加/删索引</text>

    <rect class="at-hover-card" x="60" y="305" width="125" height="30" rx="4" fill="#1f2937"/>
    <text x="68" y="325" font-size="9" font-family="monospace" fill="#86efac">ALTER TABLE t</text>
    <text x="68" y="338" font-size="9" font-family="monospace" fill="#86efac">ADD c INT DEFAULT 0</text>

    <text x="122" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">LOCK=NONE</text>

    <!-- INPLACE -->
    <rect class="at-hover-card" x="220" y="90" width="165" height="320" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="302" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">INPLACE</text>
    <text x="302" y="132" text-anchor="middle" font-size="9" fill="#475569">原地修改</text>

    <text x="240" y="158" font-size="11" font-weight="700" fill="#92400e">⚙ 中等</text>
    <text x="240" y="178" font-size="10" fill="#475569">• 不复制整表</text>
    <text x="240" y="195" font-size="10" fill="#475569">• 临时排他锁短暂</text>
    <text x="240" y="212" font-size="10" fill="#475569">• 重建表空间</text>

    <text x="240" y="240" font-size="11" font-weight="700" fill="#475569">支持：</text>
    <text x="240" y="258" font-size="10" fill="#475569">• 加/删列（无默认）</text>
    <text x="240" y="273" font-size="10" fill="#475569">• 改列类型</text>
    <text x="240" y="288" font-size="10" fill="#475569">• 加/删主键</text>

    <rect class="at-hover-card" x="240" y="305" width="125" height="30" rx="4" fill="#1f2937"/>
    <text x="248" y="325" font-size="9" font-family="monospace" fill="#86efac">ALTER TABLE t</text>
    <text x="248" y="338" font-size="9" font-family="monospace" fill="#86efac">ADD COLUMN c TEXT</text>

    <text x="302" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">LOCK=NONE/SHARED</text>

    <!-- COPY -->
    <rect class="at-hover-card" x="400" y="90" width="165" height="320" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="482" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">COPY</text>
    <text x="482" y="132" text-anchor="middle" font-size="9" fill="#475569">整表拷贝</text>

    <text x="420" y="158" font-size="11" font-weight="700" fill="#7f1d1d">⚠ 最慢</text>
    <text x="420" y="178" font-size="10" fill="#475569">• 复制整张表</text>
    <text x="420" y="195" font-size="10" fill="#475569">• 全程排他锁</text>
    <text x="420" y="212" font-size="10" fill="#475569">• 阻塞读写</text>

    <text x="420" y="240" font-size="11" font-weight="700" fill="#475569">不可避免：</text>
    <text x="420" y="258" font-size="10" fill="#475569">• 改字符集</text>
    <text x="420" y="273" font-size="10" fill="#475569">• 加全文索引</text>
    <text x="420" y="288" font-size="10" fill="#475569">• 加 SPATIAL 索引</text>

    <rect class="at-hover-card" x="420" y="305" width="125" height="30" rx="4" fill="#1e2937"/>
    <text x="428" y="325" font-size="9" font-family="monospace" fill="#86efac">ALTER TABLE t</text>
    <text x="428" y="338" font-size="9" font-family="monospace" fill="#86efac">ADD FULLTEXT(c)</text>

    <text x="482" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#7f1d1d">LOCK=SHARED</text>
  </g>

  <!-- 执行流程 -->
  <g>
    <text x="60" y="430" font-size="13" font-weight="700" fill="#1e293b">INPLACE 执行阶段</text>
    <text x="60" y="448" font-size="11" fill="#475569">① prepare（短暂 LOCK）→ ② 执行（允许并发 DML）→ ③ commit（再次短暂 LOCK）</text>
  </g>
</svg>
