<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Rust 所有权与借用</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Ownership · Move · Borrow · Lifetime · Drop</text>

  <!-- 三大规则 -->
  <g>
    <rect class="at-hover-card" x="30" y="90" width="540" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="50" y="113" font-size="13" font-weight="700" fill="#92400e">① 每个值有且只有一个 owner</text>
    <text x="50" y="133" font-size="11" fill="#475569">   let s = String::from("hi");&nbsp;&nbsp;// s 是这个 String 的 owner</text>
    <text x="50" y="153" font-size="13" font-weight="700" fill="#92400e">② owner 离开作用域 → 自动 drop（无 GC）</text>
  </g>

  <!-- Move 语义 -->
  <g>
    <text x="30" y="200" font-size="13" font-weight="700" fill="#1e293b">Move 语义（默认行为）</text>
    <rect class="at-hover-card" x="30" y="210" width="160" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="110" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">let s1 = String::from("hi")</text>
    <text x="110" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">let s2 = s1</text>

    <path d="M190,240 L240,240" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
    <text x="215" y="232" text-anchor="middle" font-size="10" fill="#ef4444">move</text>

    <rect class="at-hover-card" x="245" y="210" width="160" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="325" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">s2 拥有数据</text>
    <text x="325" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">s1 失效（编译错误）</text>

    <text x="430" y="240" text-anchor="middle" font-size="10" fill="#64748b">↑ 防止 double-free</text>
  </g>

  <!-- Borrow -->
  <g>
    <text x="30" y="305" font-size="13" font-weight="700" fill="#1e293b">借用（Borrow）</text>
    <rect class="at-hover-card" x="30" y="315" width="170" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="115" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">&amp;T 不可变借用</text>
    <text x="115" y="358" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">fn read(s: &amp;String)</text>
    <text x="115" y="378" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">let r1 = &amp;s</text>
    <text x="115" y="395" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">let r2 = &amp;s  // ok</text>
    <text x="115" y="410" text-anchor="middle" font-size="10" fill="#065f46">✓ 多个读者</text>

    <rect class="at-hover-card" x="215" y="315" width="170" height="100" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="300" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">&amp;mut T 可变借用</text>
    <text x="300" y="358" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">fn write(s: &amp;mut String)</text>
    <text x="300" y="378" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">let w = &amp;mut s</text>
    <text x="300" y="395" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">// &amp;s + &amp;mut s ❌</text>
    <text x="300" y="410" text-anchor="middle" font-size="10" fill="#5b21b6">✓ 一个写者</text>

    <rect class="at-hover-card" x="400" y="315" width="170" height="100" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="485" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">Lifetime 'a</text>
    <text x="485" y="358" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">fn longest&lt;'a&gt;(</text>
    <text x="485" y="375" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">  x: &amp;'a str,</text>
    <text x="485" y="392" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">  y: &amp;'a str,</text>
    <text x="485" y="410" text-anchor="middle" font-size="10" fill="#9d174d">) -&gt; &amp;'a str</text>
  </g>

  <!-- 底部说明 -->
  <g font-size="10" fill="#64748b">
    <rect class="at-hover-card" x="30" y="430" width="540" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4"/>
    <text x="50" y="450">⚡ Copy 标量（i32/bool/char）走 Copy trait 不走 move；Box&lt;T&gt;/Vec&lt;T&gt; 默认 move</text>
    <text x="50" y="462">⚡ 借用规则：&amp;T 与 &amp;mut T 不能共存；借用在 owner 作用域内有效（NLL 非词法）</text>
  </g>
</svg>
