<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL MVCC 与 Undo Log 原理</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">多版本并发控制 · ReadView · undo log 链 · 快照读 vs 当前读</text>

  <!-- 数据行 + 事务版本链 -->
  <g>
    <text x="60" y="95" font-size="13" font-weight="700" fill="#1e293b">一行数据的多版本（update 3 次）</text>

    <!-- 当前行 -->
    <rect class="at-hover-card" x="60" y="115" width="480" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="135" font-size="11" font-weight="700" fill="#1e40af">当前行（buffer pool）</text>
    <text x="80" y="155" font-size="11" font-family="monospace" fill="#1e2937">id=1, name='Jerry', trx_id=103</text>

    <!-- undo 版本链 -->
    <g>
      <rect class="at-hover-card" x="60" y="185" width="480" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="80" y="202" font-size="10" font-weight="700" fill="#92400e">v2 undo</text>
      <text x="80" y="218" font-size="10" font-family="monospace" fill="#1e2937">id=1, name='Tom', trx_id=102, roll_ptr→v1</text>

      <rect class="at-hover-card" x="60" y="235" width="480" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="80" y="252" font-size="10" font-weight="700" fill="#92400e">v1 undo</text>
      <text x="80" y="268" font-size="10" font-family="monospace" fill="#1e2937">id=1, name='Alex', trx_id=101, roll_ptr→NULL</text>

      <!-- 连接箭头 -->
      <line x1="300" y1="165" x2="300" y2="185" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="300" y1="225" x2="300" y2="235" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
    </g>
  </g>

  <!-- ReadView 决策 -->
  <g>
    <text x="60" y="300" font-size="13" font-weight="700" fill="#1e293b">ReadView 可见性判断（SELECT 触发）</text>

    <rect class="at-hover-card" x="40" y="315" width="520" height="125" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>

    <text x="60" y="340" font-size="11" fill="#475569">活跃事务 trx_ids = [101, 102] · min_id=101 · max_id=103 · creator_trx_id=104</text>

    <text x="60" y="362" font-size="11" font-family="monospace" fill="#1e2937">① trx_id &lt; min_id</text>
    <text x="80" y="378" font-size="10" fill="#10b981">  → 已提交，可见 ✓</text>

    <text x="60" y="395" font-size="11" font-family="monospace" fill="#1e2937">② trx_id &gt; max_id</text>
    <text x="80" y="411" font-size="10" fill="#dc2626">  → 未来事务，不可见 ✗</text>

    <text x="60" y="428" font-size="11" font-family="monospace" fill="#1e2937">③ min_id ≤ trx_id ≤ max_id 且在 trx_ids 中</text>
    <text x="80" y="442" font-size="10" fill="#dc2626">  → 活跃事务，不可见 ✗（沿 undo log 找旧版本）</text>
  </g>

  <!-- 隔离级别对比 -->
  <g>
    <rect class="at-hover-card" x="40" y="455" width="250" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="60" y="470" font-size="11" font-weight="700" fill="#1e40af">RC: 每次 SELECT 创建新 ReadView</text>

    <rect class="at-hover-card" x="310" y="455" width="250" height="20" rx="4" fill="#d1fae5" stroke="#10b981"/>
    <text x="330" y="470" font-size="11" font-weight="700" fill="#065f46">RR: 事务第一次 SELECT 创建，复用</text>
  </g>
</svg>
