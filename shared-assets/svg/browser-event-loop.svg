<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">浏览器 Event Loop 调度模型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">宏任务 + 微任务 · 渲染时机 · 单线程并发</text>

  <!-- 浏览器事件循环分层 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 浏览器事件循环分层（Chrome 为例）</text>

    <rect class="at-hover-card" x="40" y="100" width="135" height="200" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="107" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">GUI 线程</text>
    <text x="55" y="146" font-size="10" fill="#475569">唯一渲染线程</text>
    <text x="55" y="162" font-size="10" fill="#475569">JS 主线程</text>
    <text x="55" y="180" font-size="10" fill="#475569">Event Loop 调度</text>
    <text x="55" y="198" font-size="10" fill="#475569">Style/Layout/Paint</text>
    <text x="55" y="216" font-size="9" fill="#3b82f6">⚠️ JS 长任务阻塞渲染</text>
    <text x="55" y="232" font-size="9" fill="#3b82f6">requestIdleCallback</text>
    <text x="55" y="248" font-size="9" fill="#3b82f6">scheduler.yield()</text>
    <text x="55" y="280" text-anchor="middle" font-size="10" fill="#475569">JS 栈 → 微任务</text>

    <rect class="at-hover-card" x="185" y="100" width="135" height="200" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="252" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">宏任务队列</text>
    <text x="200" y="146" font-size="10" fill="#475569">setTimeout</text>
    <text x="200" y="162" font-size="10" fill="#475569">setInterval</text>
    <text x="200" y="180" font-size="10" fill="#475569">I/O 回调</text>
    <text x="200" y="198" font-size="10" fill="#475569">UI 事件</text>
    <text x="200" y="216" font-size="10" fill="#475569">postMessage</text>
    <text x="200" y="234" font-size="9" fill="#10b981">每个宏任务结束</text>
    <text x="200" y="250" font-size="9" fill="#10b981">→ 清空微任务队列</text>
    <text x="200" y="266" font-size="9" fill="#10b981">→ 才进入下一帧渲染</text>
    <text x="252" y="285" text-anchor="middle" font-size="9" fill="#475569">每轮 1 个</text>

    <rect class="at-hover-card" x="330" y="100" width="135" height="200" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="397" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">微任务队列</text>
    <text x="345" y="146" font-size="10" fill="#475569">Promise.then</text>
    <text x="345" y="162" font-size="10" fill="#475569">queueMicrotask</text>
    <text x="345" y="180" font-size="10" fill="#475569">MutationObserver</text>
    <text x="345" y="198" font-size="10" fill="#475569">process.nextTick</text>
    <text x="345" y="234" font-size="9" fill="#f59e0b">⭐ 优先级最高</text>
    <text x="345" y="250" font-size="9" fill="#f59e0b">必须全部清空</text>
    <text x="345" y="266" font-size="9" fill="#f59e0b">才推进下一轮</text>
    <text x="397" y="285" text-anchor="middle" font-size="9" fill="#475569">每轮全部</text>

    <rect class="at-hover-card" x="475" y="100" width="85" height="200" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="517" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">渲染步骤</text>
    <text x="485" y="146" font-size="9" fill="#475569">1. Style</text>
    <text x="485" y="162" font-size="9" fill="#475569">2. Layout</text>
    <text x="485" y="178" font-size="9" fill="#475569">3. Layer</text>
    <text x="485" y="194" font-size="9" fill="#475569">4. Paint</text>
    <text x="485" y="210" font-size="9" fill="#475569">5. Composite</text>
    <text x="485" y="230" font-size="9" fill="#8b5cf6">rAF 时机</text>
    <text x="485" y="246" font-size="9" fill="#8b5cf6">~16.7ms/帧</text>
    <text x="485" y="282" text-anchor="middle" font-size="9" fill="#475569">@60fps</text>
  </g>

  <!-- 一轮循环 -->
  <g>
    <text x="50" y="330" font-size="13" font-weight="700" fill="#1e293b">② 一轮循环执行顺序</text>

    <rect class="at-hover-card" x="40" y="340" width="520" height="105" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="362" font-size="10" font-weight="700" fill="#10b981">while (true) {</text>
    <text x="75" y="380" font-size="10" fill="#e2e8f0" font-family="monospace">1. 执行一个宏任务（最旧的那个）</text>
    <text x="75" y="397" font-size="10" fill="#e2e8f0" font-family="monospace">2. 清空所有微任务队列（每添加一个立即执行）</text>
    <text x="75" y="414" font-size="10" fill="#e2e8f0" font-family="monospace">3. 可选：执行 requestAnimationFrame 回调</text>
    <text x="75" y="430" font-size="10" fill="#e2e8f0" font-family="monospace">4. 浏览器判断是否需要渲染（&gt; 16.7ms）</text>
    <text x="55" y="445" font-size="10" font-weight="700" fill="#10b981">}</text>
  </g>

  <!-- 关键概念 -->
  <g>
    <text x="50" y="470" font-size="10" fill="#64748b">💡 Node.js 与浏览器同源但 Node 用 libuv 调度；前端 setTimeout(fn, 0) 实际最小 4ms</text>
  </g>
</svg>
