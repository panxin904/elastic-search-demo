<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Kubernetes 集群架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Control Plane + Worker Nodes · 声明式 API</text>

  <!-- Control Plane -->
  <rect class="at-hover-card" x="40" y="100" width="520" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="120" font-size="13" font-weight="700" fill="#1e3a8a">Control Plane（控制面）</text>

  <g font-size="11" font-weight="700">
    <rect class="at-hover-card" x="60" y="135" width="105" height="65" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="112" y="160" text-anchor="middle" fill="white">API Server</text>
    <text x="112" y="178" text-anchor="middle" font-size="9" fill="#dbeafe">REST · 鉴权</text>
    <text x="112" y="192" text-anchor="middle" font-size="9" fill="#dbeafe">etcd 网关</text>

    <rect class="at-hover-card" x="180" y="135" width="105" height="65" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="232" y="160" text-anchor="middle" fill="white">etcd</text>
    <text x="232" y="178" text-anchor="middle" font-size="9" fill="#d1fae5">分布式 KV</text>
    <text x="232" y="192" text-anchor="middle" font-size="9" fill="#d1fae5">集群状态</text>

    <rect class="at-hover-card" x="300" y="135" width="105" height="65" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="352" y="160" text-anchor="middle" fill="white">Scheduler</text>
    <text x="352" y="178" text-anchor="middle" font-size="9" fill="#fef3c7">Pod 调度</text>
    <text x="352" y="192" text-anchor="middle" font-size="9" fill="#fef3c7">资源感知</text>

    <rect class="at-hover-card" x="420" y="135" width="120" height="65" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="480" y="160" text-anchor="middle" fill="white">Controller Manager</text>
    <text x="480" y="180" text-anchor="middle" font-size="9" fill="#fce7f3">状态调和</text>
  </g>

  <!-- Worker Nodes -->
  <g font-size="11" font-weight="700">
    <rect class="at-hover-card" x="40" y="250" width="160" height="200" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="270" text-anchor="middle" fill="#064e3b">Worker Node 1</text>
    <rect class="at-hover-card" x="55" y="285" width="130" height="30" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="120" y="305" text-anchor="middle" font-size="10" fill="white">kubelet</text>
    <rect class="at-hover-card" x="55" y="320" width="60" height="60" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="85" y="350" text-anchor="middle" font-size="9" fill="white">Pod</text>
    <text x="85" y="362" text-anchor="middle" font-size="9" fill="#dbeafe">nginx</text>
    <rect class="at-hover-card" x="125" y="320" width="60" height="60" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="155" y="350" text-anchor="middle" font-size="9" fill="white">Pod</text>
    <text x="155" y="362" text-anchor="middle" font-size="9" fill="#dbeafe">app</text>
    <rect class="at-hover-card" x="55" y="390" width="130" height="40" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="120" y="408" text-anchor="middle" font-size="9" fill="white">kube-proxy</text>
    <text x="120" y="420" text-anchor="middle" font-size="9" fill="#f1f5f9">Container Runtime</text>

    <rect class="at-hover-card" x="220" y="250" width="160" height="200" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="270" text-anchor="middle" fill="#064e3b">Worker Node 2</text>
    <rect class="at-hover-card" x="235" y="285" width="130" height="30" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="300" y="305" text-anchor="middle" font-size="10" fill="white">kubelet</text>
    <rect class="at-hover-card" x="235" y="320" width="130" height="60" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="300" y="355" text-anchor="middle" fill="white">Pod (multi-container)</text>
    <rect class="at-hover-card" x="235" y="390" width="130" height="40" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="300" y="408" text-anchor="middle" font-size="9" fill="white">kube-proxy</text>
    <text x="300" y="420" text-anchor="middle" font-size="9" fill="#f1f5f9">CRI</text>

    <rect class="at-hover-card" x="400" y="250" width="160" height="200" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="270" text-anchor="middle" fill="#064e3b">Worker Node N</text>
    <text x="480" y="320" text-anchor="middle" font-size="10" fill="#475569">...</text>
  </g>

  <!-- 元数据说明 -->
  <g font-size="11">
    <rect class="at-hover-card" x="40" y="455" width="520" height="20" rx="4" fill="#f1f5f9"/>
    <text x="300" y="468" text-anchor="middle" fill="#475569">Pod 是最小调度单元 · 共享网络/存储 · 由 Controller 副本数维持 · YAML 声明</text>
  </g>
</svg>
