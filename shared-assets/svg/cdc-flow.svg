<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">CDC 变更数据捕获</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">MySQL binlog → Canal/Debezium → Kafka → 下游（数仓/缓存/搜索）</text>

  <!-- 源 -->
  <g>
    <rect x="20" y="95" width="120" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">MySQL</text>
    <text x="80" y="138" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">binlog ROW</text>
    <text x="80" y="153" text-anchor="middle" font-size="9" fill="#475569">写入即追加</text>
    <text x="80" y="167" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">Row 模式记录前后</text>
  </g>

  <!-- 中间件 -->
  <g>
    <rect x="180" y="95" width="240" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">CDC 采集器</text>
    <text x="300" y="138" text-anchor="middle" font-size="10" fill="#475569">伪装从库 · 拉取 binlog · 解析事件</text>
    <text x="300" y="153" text-anchor="middle" font-size="9" font-family="monospace" fill="#92400e">Canal · Debezium · Maxwell</text>
    <text x="300" y="167" text-anchor="middle" font-size="9" fill="#475569">维护位点 · 断点续传</text>
  </g>

  <!-- 消息队列 -->
  <g>
    <rect x="460" y="95" width="120" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="520" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Kafka</text>
    <text x="520" y="138" text-anchor="middle" text-size="10" font-family="monospace" fill="#475569">cdc.orders</text>
    <text x="520" y="153" text-anchor="middle" font-size="9" fill="#475569">顺序 + 持久化</text>
    <text x="520" y="167" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">解耦下游</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M140,135 L180,135"/>
    <path d="M420,135 L460,135"/>
  </g>

  <!-- 下游 4 消费方 -->
  <g>
    <text x="300" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">下游消费者（订阅 topic）</text>

    <rect x="20" y="240" width="125" height="80" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="82" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Elasticsearch</text>
    <text x="82" y="282" text-anchor="middle" font-size="9" fill="#475569">同步索引</text>
    <text x="82" y="296" text-anchor="middle" font-size="9" fill="#475569">搜索实时</text>
    <text x="82" y="310" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">增量更新</text>

    <rect x="165" y="240" width="125" height="80" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="227" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Redis 缓存</text>
    <text x="227" y="282" text-anchor="middle" font-size="9" fill="#475569">失效缓存</text>
    <text x="227" y="296" text-anchor="middle" font-size="9" fill="#475569">写穿/旁路</text>
    <text x="227" y="310" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">一致性</text>

    <rect x="310" y="240" width="125" height="80" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="372" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">数仓 / ClickHouse</text>
    <text x="372" y="282" text-anchor="middle" font-size="9" fill="#475569">实时 ODS</text>
    <text x="372" y="296" text-anchor="middle" font-size="9" fill="#475569">T+0 报表</text>
    <text x="372" y="310" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">明细入仓</text>

    <rect x="455" y="240" width="125" height="80" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="517" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">其他 DB</text>
    <text x="517" y="282" text-anchor="middle" font-size="9" fill="#475569">异地多活</text>
    <text x="517" y="296" text-anchor="middle" font-size="9" fill="#475569">数据分发</text>
    <text x="517" y="310" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">单向同步</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M520,175 L82,240"/>
    <path d="M520,175 L227,240"/>
    <path d="M520,175 L372,240"/>
    <path d="M520,175 L517,240"/>
  </g>

  <!-- 对比 -->
  <g>
    <text x="300" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">CDC vs 传统同步</text>

    <rect x="20" y="365" width="270" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="155" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">传统定时同步（轮询）</text>
    <text x="40" y="408" font-size="10" fill="#475569">✗ 延迟大（分钟级）</text>
    <text x="40" y="424" font-size="10" fill="#475569">✗ 浪费资源（无变化也跑）</text>
    <text x="40" y="440" font-size="10" fill="#475569">✗ 全量比对代价高</text>
    <text x="40" y="456" font-size="10" fill="#475569">✗ 难以捕获 DELETE</text>

    <rect x="310" y="365" width="270" height="100" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="445" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">CDC 实时同步</text>
    <text x="330" y="408" font-size="10" fill="#475569">✓ 秒级延迟（准实时）</text>
    <text x="330" y="424" font-size="10" fill="#475569">✓ 只传变更事件</text>
    <text x="330" y="440" font-size="10" fill="#475569">✓ INSERT/UPDATE/DELETE 全捕获</text>
    <text x="330" y="456" font-size="10" fill="#475569">✓ 对源库无侵入</text>
  </g>
</svg>
