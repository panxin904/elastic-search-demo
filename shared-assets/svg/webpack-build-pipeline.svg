<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">Webpack 构建流水线</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Entry → Loader → Plugin → Module Graph → Output</text>

  <!-- 构建流水线 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 完整构建流程（5 个阶段）</text>

    <rect class="at-hover-card" x="40" y="105" width="100" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1. 启动</text>
    <text x="90" y="145" text-anchor="middle" font-size="9" fill="#475569">读 config</text>
    <text x="90" y="158" text-anchor="middle" font-size="9" fill="#3b82f6">找到 Entry</text>

    <path d="M140,135 L170,135" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="170" y="105" width="100" height="60" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">2. Loader</text>
    <text x="220" y="145" text-anchor="middle" font-size="9" fill="#475569">.ts/.css/...</text>
    <text x="220" y="158" text-anchor="middle" font-size="9" fill="#10b981">转译为 JS</text>

    <path d="M270,135 L300,135" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="300" y="105" width="100" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="350" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3. 解析</text>
    <text x="350" y="145" text-anchor="middle" font-size="9" fill="#475569">AST 解析</text>
    <text x="350" y="158" text-anchor="middle" font-size="9" fill="#f59e0b">依赖收集</text>

    <path d="M400,135 L430,135" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="430" y="105" width="100" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="480" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">4. 打包</text>
    <text x="480" y="145" text-anchor="middle" font-size="9" fill="#475569">模块合并</text>
    <text x="480" y="158" text-anchor="middle" font-size="9" fill="#8b5cf6">Tree Shaking</text>

    <path d="M520,140 L540,140 L540,220 L535,220" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)" transform="translate(-2, 0)"/>

    <rect class="at-hover-card" x="430" y="220" width="100" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="480" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">5. 输出</text>
    <text x="480" y="260" text-anchor="middle" font-size="9" fill="#475569">dist/*.js</text>
    <text x="480" y="273" text-anchor="middle" font-size="9" fill="#dc2626">写文件</text>

    <path d="M430,250 L170,250" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="300" y="240" text-anchor="middle" font-size="9" fill="#64748b">🪝 Plugin 钩子贯穿整个流程</text>
  </g>

  <!-- Module Graph -->
  <g>
    <text x="50" y="305" font-size="13" font-weight="700" fill="#1e293b">② Module Graph（依赖关系图）</text>

    <rect class="at-hover-card" x="40" y="315" width="510" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="55" y="338" font-size="10" fill="#475569">入口 index.js</text>
    <text x="55" y="358" font-size="10" fill="#475569">↓ import</text>

    <rect class="at-hover-card" x="120" y="335" width="80" height="25" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="160" y="353" text-anchor="middle" font-size="9" fill="#047857">app.ts</text>

    <rect class="at-hover-card" x="220" y="335" width="80" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="260" y="353" text-anchor="middle" font-size="9" fill="#92400e">utils.js</text>

    <rect class="at-hover-card" x="320" y="335" width="80" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="360" y="353" text-anchor="middle" font-size="9" fill="#92400e">config.js</text>

    <rect class="at-hover-card" x="420" y="335" width="80" height="25" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="460" y="353" text-anchor="middle" font-size="9" fill="#991b1b">react</text>

    <text x="465" y="395" text-anchor="middle" font-size="9" fill="#64748b">递归构建：每个模块都被处理 → 形成完整图</text>
  </g>

  <!-- 关键优化 -->
  <g>
    <text x="50" y="410" font-size="13" font-weight="700" fill="#1e293b">③ 性能优化 5 大手段</text>

    <rect class="at-hover-card" x="40" y="420" width="255" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="55" y="440" font-size="10" font-weight="700" fill="#047857">⚡ 构建速度</text>
    <text x="55" y="455" font-size="10" fill="#475569">thread-loader · cache · 缩小 include · exclude node_modules · swc/esbuild 替代 babel</text>
    <text x="55" y="467" font-size="9" fill="#10b981">缓存命中后 1s 内完成增量</text>

    <rect class="at-hover-card" x="305" y="420" width="255" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="320" y="440" font-size="10" font-weight="700" fill="#1e40af">📦 产物体积</text>
    <text x="320" y="455" font-size="10" fill="#475569">Tree Shaking · Code Split · SplitChunks · Gzip · 资源压缩</text>
    <text x="320" y="467" font-size="9" fill="#3b82f6">vendor 拆 chunk 长期缓存</text>
  </g>
</svg>
