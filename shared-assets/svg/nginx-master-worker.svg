<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Nginx Master-Worker 模型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">多进程 · 异步非阻塞 · 热升级 · accept_mutex · 高性能</text>

  <!-- Master -->
  <g>
    <rect x="220" y="85" width="160" height="65" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Master 进程（1 个）</text>
    <text x="300" y="123" text-anchor="middle" font-size="9" fill="#475569">root 权限启动</text>
    <text x="300" y="135" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">PID = nginx.conf → /var/run/nginx.pid</text>
  </g>

  <!-- 职责 -->
  <g>
    <rect x="40" y="170" width="520" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="60" y="193" font-size="11" font-weight="700" fill="#92400e">Master 职责</text>
    <text x="60" y="212" font-size="10" fill="#475569">① 读取 & 校验 nginx.conf</text>
    <text x="60" y="227" font-size="10" fill="#475569">② fork worker 进程（worker_processes auto = CPU 核数）</text>
    <text x="60" y="242" font-size="10" fill="#475569">③ 接收信号：HUP（reload）/ USR1（日志切割）/ USR2（热升级）/ QUIT（优雅关闭）/ WINCH（worker 优雅退出）</text>
  </g>

  <!-- Workers -->
  <g>
    <rect x="40" y="265" width="520" height="170" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="288" font-size="11" font-weight="700" fill="#065f46">Worker 进程（N 个 · 默认 = CPU 核数）</text>

    <rect x="60" y="305" width="120" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="120" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Worker 1</text>
    <text x="120" y="343" text-anchor="middle" font-size="9" fill="#475569">独立 event loop</text>

    <rect x="195" y="305" width="120" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="255" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Worker 2</text>

    <rect x="330" y="305" width="120" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="390" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Worker N-1</text>

    <rect x="465" y="305" width="80" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="505" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Worker N</text>

    <text x="60" y="380" font-size="10" fill="#475569">⚡ 每个 worker 独立处理 accept + 数千并发连接（epoll/IO 多路复用）</text>
    <text x="60" y="398" font-size="10" fill="#475569">⚡ accept_mutex：避免惊群（多个 worker 同时 accept），1.11.3+ 默认 on</text>
    <text x="60" y="416" font-size="10" fill="#475569">⚡ 进程隔离：一个 worker 崩溃不影响其他（与 Apache prefork 区别）</text>
  </g>

  <!-- 关键点 -->
  <g>
    <rect x="40" y="450" width="520" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="55" y="465" font-size="10" fill="#475569">⚡ reload 不中断服务（USR1 + HUP）· 热升级 1×N 进程并行滚动</text>
  </g>
</svg>
