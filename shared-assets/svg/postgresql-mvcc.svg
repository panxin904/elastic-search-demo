<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="380"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >PostgreSQL MVCC 原理</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">多版本并发控制 · 每行维护 xmin/xmax · 读不阻塞写</text>

  <!-- 表中行示例 -->
  <g>
    <text x="40" y="100" font-size="11" font-weight="700" fill="#475569">account 表 · 同一时刻 3 个事务视角</text>

    <!-- Tx 1（看到 row1 + row2） -->
    <rect x="40" y="115" width="520" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="60" y="135" font-size="11" font-weight="700" fill="#1e40af">Tx A (BEGIN ... SELECT)</text>
    <text x="60" y="155" font-size="10" fill="#1e40af">id=1 name=Alice  ✓ (xmin=100, xmax=null)</text>
    <text x="60" y="167" font-size="10" fill="#1e40af">id=2 name=Bob    ✓ (xmin=100, xmax=200)</text>

    <!-- Tx 2（看不见 row2 的旧版） -->
    <rect x="40" y="185" width="520" height="60" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="60" y="205" font-size="11" font-weight="700" fill="#065f46">Tx B (UPDATE name=Bob2 → xmax=200)</text>
    <text x="60" y="225" font-size="10" fill="#065f46">id=1 name=Alice  ✓ (xmin=100, xmax=null)</text>
    <text x="60" y="237" font-size="10" fill="#065f46">id=2 name=Bob2   ⭐ NEW (xmin=200, xmax=null)</text>

    <!-- Tx 3（隔离级别 REPEATABLE READ） -->
    <rect x="40" y="255" width="520" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="60" y="275" font-size="11" font-weight="700" fill="#92400e">Tx C (REPEATABLE READ · snapshot=150)</text>
    <text x="60" y="295" font-size="10" fill="#92400e">id=1 name=Alice   ✓</text>
    <text x="60" y="307" font-size="10" fill="#dc2626">id=2 name=Bob     ← 看不见 Bob2 (snapshot &lt; xmin=200)</text>
  </g>

  <!-- 隔离级别对照 -->
  <g>
    <rect x="40" y="325" width="520" height="40" rx="6" fill="#fff" stroke="#e2e8f0"/>
    <text x="60" y="345" font-size="10" font-weight="700" fill="#7c3aed">隔离级别：</text>
    <text x="120" y="345" font-size="10" fill="#475569">READ COMMITTED → REPEATABLE READ → SERIALIZABLE (SSI)</text>
  </g>

  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v6 · postgresql · 行级 MVCC，无锁并发读</text>
</svg>
