<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">OAuth 2.0 Authorization Code 流程</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">最安全的授权模式 · 适合第三方应用</text>

  <!-- 4 角色 -->
  <g font-size="12" font-weight="600">
    <rect x="40" y="100" width="100" height="40" rx="8" fill="#3b82f6" opacity="0.9"/>
    <text x="90" y="124" text-anchor="middle" fill="white">用户</text>

    <rect x="180" y="100" width="100" height="40" rx="8" fill="#10b981" opacity="0.9"/>
    <text x="230" y="124" text-anchor="middle" fill="white">客户端 App</text>

    <rect x="320" y="100" width="100" height="40" rx="8" fill="#f59e0b" opacity="0.9"/>
    <text x="370" y="124" text-anchor="middle" fill="white">授权服务器</text>

    <rect x="460" y="100" width="100" height="40" rx="8" fill="#ec4899" opacity="0.9"/>
    <text x="510" y="124" text-anchor="middle" fill="white">资源服务器</text>
  </g>

  <line x1="90" y1="160" x2="90" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="230" y1="160" x2="230" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="370" y1="160" x2="370" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="510" y1="160" x2="510" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- 步骤 1：用户授权请求 -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="180" x2="230" y2="180"/>
  </g>
  <text x="160" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">① 授权请求</text>

  <!-- 步骤 2：客户端跳转用户到授权服务器 -->
  <g stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="230" y1="215" x2="370" y2="215"/>
  </g>
  <text x="300" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">② 跳转 + client_id + scope</text>

  <!-- 步骤 3：用户登录授权 -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="250" x2="370" y2="250"/>
  </g>
  <text x="230" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">③ 用户登录 + 同意授权</text>

  <!-- 步骤 4：返回授权码 -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="370" y1="285" x2="230" y2="285"/>
  </g>
  <text x="300" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">④ 返回 authorization_code</text>

  <!-- 步骤 5：客户端用 code 换 token -->
  <g stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="230" y1="320" x2="370" y2="320"/>
  </g>
  <text x="300" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">⑤ code + client_secret → token</text>

  <!-- 步骤 6：返回 access_token -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="370" y1="355" x2="230" y2="355"/>
  </g>
  <text x="300" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">⑥ 返回 access_token + refresh_token</text>

  <!-- 步骤 7：客户端用 token 访问资源 -->
  <g stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="230" y1="390" x2="510" y2="390"/>
  </g>
  <text x="370" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">⑦ Bearer access_token 访问资源</text>

  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">PKCE 扩展防拦截 · JWT 自包含 token · refresh_token 离线续约</text>
</svg>
