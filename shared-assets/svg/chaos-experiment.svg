<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">混沌实验流程</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">稳态假设 → 实验设计 → 注入故障 → 观测 → 分析恢复</text>

  <!-- 5 阶段 -->
  <g>
    <circle cx="80" cy="130" r="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1. 假设</text>
    <text x="80" y="143" text-anchor="middle" font-size="9" fill="#1e40af">稳态</text>

    <circle cx="190" cy="130" r="35" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="190" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">2. 设计</text>
    <text x="190" y="143" text-anchor="middle" font-size="9" fill="#065f46">爆炸半径</text>

    <circle cx="300" cy="130" r="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3. 注入</text>
    <text x="300" y="143" text-anchor="middle" font-size="9" fill="#92400e">故障</text>

    <circle cx="410" cy="130" r="35" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="410" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">4. 观测</text>
    <text x="410" y="143" text-anchor="middle" font-size="9" fill="#5b21b6">指标</text>

    <circle cx="520" cy="130" r="35" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="520" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">5. 恢复</text>
    <text x="520" y="143" text-anchor="middle" font-size="9" fill="#9d174d">总结</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M115,130 L155,130"/>
    <path d="M225,130 L265,130"/>
    <path d="M335,130 L375,130"/>
    <path d="M445,130 L485,130"/>
  </g>

  <!-- 详情 -->
  <g>
    <rect x="20" y="200" width="110" height="200" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="75" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">稳态假设</text>
    <text x="75" y="245" text-anchor="middle" font-size="10" fill="#475569">• SLI 指标</text>
    <text x="75" y="265" text-anchor="middle" font-size="10" fill="#475569">• 业务指标</text>
    <text x="75" y="285" text-anchor="middle" font-size="10" fill="#475569">• 基线区间</text>
    <text x="75" y="305" text-anchor="middle" font-size="10" fill="#475569">例：</text>
    <text x="75" y="323" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">P99 &lt; 200ms</text>
    <text x="75" y="340" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">QPS &gt; 1000</text>
    <text x="75" y="357" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">err &lt; 0.1%</text>
    <text x="75" y="385" text-anchor="middle" font-size="10" fill="#1e40af">⚡ 无假设=赌博</text>

    <rect x="145" y="200" width="110" height="200" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="200" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">控制范围</text>
    <text x="200" y="245" text-anchor="middle" font-size="10" fill="#475569">• 影响应用</text>
    <text x="200" y="265" text-anchor="middle" font-size="10" fill="#475569">• 影响 Pod 数</text>
    <text x="200" y="285" text-anchor="middle" font-size="10" fill="#475569">• 影响机房</text>
    <text x="200" y="305" text-anchor="middle" font-size="10" fill="#475569">原则：</text>
    <text x="200" y="323" text-anchor="middle" font-size="9" fill="#475569">prod &lt; 5%</text>
    <text x="200" y="343" text-anchor="middle" font-size="9" fill="#475569">staging 100%</text>
    <text x="200" y="385" text-anchor="middle" font-size="10" fill="#065f46">⚡ 先小后大</text>

    <rect x="270" y="200" width="110" height="200" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="325" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">故障类型</text>
    <text x="325" y="245" text-anchor="middle" font-size="10" fill="#475569">• Pod kill</text>
    <text x="325" y="265" text-anchor="middle" font-size="10" fill="#475569">• 网络丢包</text>
    <text x="325" y="285" text-anchor="middle" font-size="10" fill="#475569">• 网络延迟</text>
    <text x="325" y="305" text-anchor="middle" font-size="10" fill="#475569">• CPU/内存</text>
    <text x="325" y="325" text-anchor="middle" font-size="10" fill="#475569">• DNS 异常</text>
    <text x="325" y="345" text-anchor="middle" font-size="10" fill="#475569">• 时间偏移</text>
    <text x="325" y="385" text-anchor="middle" font-size="10" fill="#92400e">⚡ 可回滚</text>

    <rect x="395" y="200" width="110" height="200" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="450" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">观测指标</text>
    <text x="450" y="245" text-anchor="middle" font-size="10" fill="#475569">• Prometheus</text>
    <text x="450" y="265" text-anchor="middle" font-size="10" fill="#475569">• Grafana</text>
    <text x="450" y="285" text-anchor="middle" font-size="10" fill="#475569">• Trace</text>
    <text x="450" y="305" text-anchor="middle" font-size="10" fill="#475569">• 日志</text>
    <text x="450" y="325" text-anchor="middle" font-size="10" fill="#475569">• 业务告警</text>
    <text x="450" y="345" text-anchor="middle" font-size="10" fill="#475569">• 用户反馈</text>
    <text x="450" y="385" text-anchor="middle" font-size="10" fill="#5b21b6">⚡ 全链路</text>

    <rect x="520" y="200" width="60" height="200" rx="6" fill="#fce7f3" stroke="#ec4899"/>
    <text x="550" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">复盘</text>
    <text x="550" y="245" text-anchor="middle" font-size="10" fill="#475569">• 记录</text>
    <text x="550" y="265" text-anchor="middle" font-size="10" fill="#475569">• 改进</text>
    <text x="550" y="285" text-anchor="middle" font-size="10" fill="#475569">• 归档</text>
  </g>

  <g font-size="10" fill="#64748b">
    <rect x="20" y="420" width="560" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4"/>
    <text x="40" y="442" font-weight="700" fill="#1e293b">⚡ Netflix Chaos Monkey 原则</text>
    <text x="40" y="460">生产环境注入故障 → 逼出隐性依赖 → 让系统从"经常失败"中学到"如何恢复"</text>
  </g>
</svg>
