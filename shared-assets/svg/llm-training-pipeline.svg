<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >LLM 训练流水线</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">数据 → 预训练 → SFT → RLHF / DPO → 评估 → 部署</text>

  <!-- 横向 6 阶段 -->
  <g>
    <rect class="at-hover-card" x="20" y="90" width="80" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">数据</text>
    <text x="60" y="130" text-anchor="middle" font-size="9" fill="#475569">清洗</text>

    <rect class="at-hover-card" x="115" y="90" width="80" height="55" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="155" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Pretrain</text>
    <text x="155" y="130" text-anchor="middle" font-size="9" fill="#475569">B~T tokens</text>

    <rect class="at-hover-card" x="210" y="90" width="80" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="250" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">SFT</text>
    <text x="250" y="130" text-anchor="middle" font-size="9" fill="#475569">指令微调</text>

    <rect class="at-hover-card" x="305" y="90" width="80" height="55" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="345" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">RLHF</text>
    <text x="345" y="125" text-anchor="middle" font-size="9" fill="#5b21b6">/ DPO</text>
    <text x="345" y="137" text-anchor="middle" font-size="9" fill="#5b21b6">对齐</text>

    <rect class="at-hover-card" x="400" y="90" width="80" height="55" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="440" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">Eval</text>
    <text x="440" y="130" text-anchor="middle" font-size="9" fill="#475569">评测</text>

    <rect class="at-hover-card" x="495" y="90" width="80" height="55" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="535" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Deploy</text>
    <text x="535" y="130" text-anchor="middle" font-size="9" fill="#475569">部署</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M100,117 L115,117"/>
    <path d="M195,117 L210,117"/>
    <path d="M290,117 L305,117"/>
    <path d="M385,117 L400,117"/>
    <path d="M480,117 L495,117"/>
  </g>

  <!-- 详情行 1：数据 -->
  <g>
    <rect class="at-hover-card" x="20" y="170" width="555" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="40" y="192" font-size="11" font-weight="700" fill="#1e40af">① 数据准备</text>
    <text x="40" y="210" font-size="10" fill="#475569">原始语料（网页/书籍/代码）→ 去重（MinHash）→ 质量过滤 → 隐私脱敏 → 分词（BPE/SentencePiece）→ 1-10T tokens</text>
    <text x="40" y="224" font-size="10" fill="#475569">配比：通用 70% + 代码 15% + 数学 5% + 多语种 10% · 数据质量决定上限</text>
  </g>

  <!-- 详情行 2：预训练 -->
  <g>
    <rect class="at-hover-card" x="20" y="240" width="555" height="60" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="40" y="262" font-size="11" font-weight="700" fill="#065f46">② 预训练（Pretrain）</text>
    <text x="40" y="280" font-size="10" fill="#475569">任务：Next-Token Prediction（自回归）· Transformer Decoder · Loss = CrossEntropy</text>
    <text x="40" y="294" font-size="10" fill="#475569">并行：DP + TP + PP + ZeRO · 框架 DeepSpeed / Megatron-LM · 千卡 GPU 集群训练数周</text>
  </g>

  <!-- 详情行 3：SFT + RLHF -->
  <g>
    <rect class="at-hover-card" x="20" y="310" width="270" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="40" y="332" font-size="11" font-weight="700" fill="#92400e">③ SFT</text>
    <text x="40" y="350" font-size="10" fill="#475569">指令-回答对（10万-百万级）</text>
    <text x="40" y="363" font-size="10" fill="#475569">全参或 LoRA 微调</text>

    <rect class="at-hover-card" x="305" y="310" width="270" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="325" y="332" font-size="11" font-weight="700" fill="#5b21b6">④ RLHF / DPO</text>
    <text x="325" y="350" font-size="10" fill="#475569">RM（Reward Model）打分</text>
    <text x="325" y="363" font-size="10" fill="#475569">PPO 或直接偏好优化 DPO</text>
  </g>

  <!-- 详情行 4：Eval + Deploy -->
  <g>
    <rect class="at-hover-card" x="20" y="380" width="270" height="80" rx="6" fill="#fce7f3" stroke="#ec4899"/>
    <text x="40" y="402" font-size="11" font-weight="700" fill="#9d174d">⑤ 评估</text>
    <text x="40" y="420" font-size="10" fill="#475569">基准：MMLU / GSM8K / HumanEval</text>
    <text x="40" y="435" font-size="10" fill="#475569">安全：jailbreak / 偏见</text>
    <text x="40" y="450" font-size="10" fill="#475569">人工盲评 + 红队</text>

    <rect class="at-hover-card" x="305" y="380" width="270" height="80" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="325" y="402" font-size="11" font-weight="700" fill="#991b1b">⑥ 部署</text>
    <text x="325" y="420" font-size="10" fill="#475569">量化（INT8/INT4）· 蒸馏</text>
    <text x="325" y="435" font-size="10" fill="#475569">vLLM / TGI · KV Cache</text>
    <text x="325" y="450" font-size="10" fill="#475569">推理优化 PagedAttention</text>
  </g>
</svg>
