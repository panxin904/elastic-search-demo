<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Spring Bean 生命周期</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">实例化 → 初始化 → 销毁 · 9 大扩展点</text>

  <!-- BeanFactory 主线 -->
  <rect x="40" y="100" width="520" height="280" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="60" y="120" font-size="12" font-weight="700" fill="#1e293b">Bean 生命周期（容器视角）</text>

  <g font-size="11" font-weight="700">
    <circle cx="80" cy="180" r="30" fill="#3b82f6" opacity="0.95"/>
    <text x="80" y="178" text-anchor="middle" font-size="10" fill="white">① 实例化</text>
    <text x="80" y="190" text-anchor="middle" font-size="9" fill="#dbeafe">new</text>

    <circle cx="170" cy="180" r="30" fill="#3b82f6" opacity="0.95"/>
    <text x="170" y="178" text-anchor="middle" font-size="10" fill="white">② 属性注入</text>
    <text x="170" y="190" text-anchor="middle" font-size="9" fill="#dbeafe">DI</text>

    <circle cx="260" cy="180" r="30" fill="#10b981" opacity="0.95"/>
    <text x="260" y="175" text-anchor="middle" font-size="10" fill="white">③ Aware</text>
    <text x="260" y="187" text-anchor="middle" font-size="9" fill="#d1fae5">回调</text>

    <circle cx="350" cy="180" r="30" fill="#10b981" opacity="0.95"/>
    <text x="350" y="175" text-anchor="middle" font-size="10" fill="white">④ BeanPost</text>
    <text x="350" y="187" text-anchor="middle" font-size="9" fill="#d1fae5">前置</text>

    <circle cx="440" cy="180" r="30" fill="#f59e0b" opacity="0.95"/>
    <text x="440" y="175" text-anchor="middle" font-size="10" fill="white">⑤ 初始化</text>
    <text x="440" y="187" text-anchor="middle" font-size="9" fill="#fef3c7">init-method</text>

    <circle cx="520" cy="180" r="30" fill="#10b981" opacity="0.95"/>
    <text x="520" y="175" text-anchor="middle" font-size="10" fill="white">⑥ BeanPost</text>
    <text x="520" y="187" text-anchor="middle" font-size="9" fill="#d1fae5">后置</text>

    <circle cx="80" cy="290" r="30" fill="#10b981" opacity="0.95"/>
    <text x="80" y="288" text-anchor="middle" font-size="10" fill="white">使用</text>

    <circle cx="350" cy="290" r="30" fill="#ef4444" opacity="0.95"/>
    <text x="350" y="285" text-anchor="middle" font-size="10" fill="white">⑦ 销毁前</text>
    <text x="350" y="297" text-anchor="middle" font-size="9" fill="#fee2e2">@PreDestroy</text>

    <circle cx="520" cy="290" r="30" fill="#ef4444" opacity="0.95"/>
    <text x="520" y="288" text-anchor="middle" font-size="10" fill="white">⑧ 销毁</text>
  </g>

  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="110" y1="180" x2="140" y2="180"/>
    <line x1="200" y1="180" x2="230" y2="180"/>
    <line x1="290" y1="180" x2="320" y2="180"/>
    <line x1="380" y1="180" x2="410" y2="180"/>
    <line x1="470" y1="180" x2="490" y2="180"/>
    <line x1="520" y1="210" x2="520" y2="260"/>
    <line x1="350" y1="210" x2="350" y2="260"/>
    <line x1="80" y1="260" x2="80" y2="320"/>
    <line x1="350" y1="320" x2="490" y2="320"/>
    <line x1="490" y1="320" x2="520" y2="320"/>
  </g>

  <!-- 扩展接口清单 -->
  <g font-size="11">
    <rect x="40" y="400" width="520" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="60" y="420" font-weight="700" fill="#92400e">常用扩展接口</text>
    <text x="60" y="438" fill="#78350f">· BeanNameAware / ApplicationContextAware · BeanPostProcessor（前后置）</text>
    <text x="60" y="453" fill="#78350f">· InitializingBean / DisposableBean · @PostConstruct / @PreDestroy</text>
  </g>
</svg>
