<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">OAuth 2.0 授权码流程</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">4 角色 · 4 种 Flow · Authorization Code 最常用</text>

  <!-- 4 角色 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① OAuth 2.0 4 个核心角色</text>

    <rect class="at-hover-card" x="40" y="100" width="125" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="102" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Resource Owner</text>
    <text x="102" y="142" text-anchor="middle" font-size="9" fill="#475569">用户</text>
    <text x="102" y="162" text-anchor="middle" font-size="9" fill="#475569">数据所有者</text>

    <rect class="at-hover-card" x="175" y="100" width="125" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="237" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Client</text>
    <text x="237" y="142" text-anchor="middle" font-size="9" fill="#475569">第三方应用</text>
    <text x="237" y="162" text-anchor="middle" font-size="9" fill="#475569">想访问资源</text>

    <rect class="at-hover-card" x="310" y="100" width="125" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="372" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Authorization Server</text>
    <text x="372" y="142" text-anchor="middle" font-size="9" fill="#475569">授权服务器</text>
    <text x="372" y="162" text-anchor="middle" font-size="9" fill="#475569">发 token</text>

    <rect class="at-hover-card" x="445" y="100" width="115" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="502" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Resource Server</text>
    <text x="502" y="142" text-anchor="middle" font-size="9" fill="#475569">资源服务器</text>
    <text x="502" y="162" text-anchor="middle" font-size="9" fill="#475569">API 服务</text>
  </g>

  <!-- Authorization Code 流程 -->
  <g>
    <text x="50" y="200" font-size="13" font-weight="700" fill="#1e293b">② Authorization Code Flow（最安全）</text>

    <rect class="at-hover-card" x="40" y="210" width="520" height="155" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

    <!-- 4 个角色横排 -->
    <text x="100" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">User</text>
    <text x="237" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Client</text>
    <text x="402" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Auth Server</text>
    <text x="510" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">API</text>

    <line x1="100" y1="240" x2="100" y2="355" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="237" y1="240" x2="237" y2="355" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="402" y1="240" x2="402" y2="355" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="510" y1="240" x2="510" y2="355" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- 步骤 -->
    <text x="105" y="255" font-size="9" fill="#475569">① 登录授权请求</text>
    <path d="M105,260 L230,260" stroke="#1e40af" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <text x="240" y="275" font-size="9" fill="#475569">② 转发到 Auth</text>
    <path d="M243,280 L395,280" stroke="#047857" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <text x="410" y="295" font-size="9" fill="#475569">③ 用户同意</text>
    <path d="M395,300 L243,300" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <text x="240" y="315" font-size="9" fill="#475569">④ 回调 code</text>
    <path d="M243,320 L105,320" stroke="#047857" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <text x="240" y="335" font-size="9" fill="#475569">⑤ code → token</text>
    <path d="M243,340 L395,340" stroke="#047857" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <text x="240" y="350" font-size="9" fill="#475569">⑥ access_token</text>
    <path d="M395,355 L243,355" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <text x="405" y="370" font-size="9" fill="#475569">⑦ 用 token 调 API</text>
  </g>

  <!-- 4 种 Flow 对比 -->
  <g>
    <text x="50" y="385" font-size="13" font-weight="700" fill="#1e293b">③ 4 种 Flow 适用场景</text>

    <rect class="at-hover-card" x="40" y="395" width="125" height="65" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="102" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Auth Code</text>
    <text x="102" y="432" text-anchor="middle" font-size="9" fill="#475569">⭐ Web 服务端</text>
    <text x="102" y="447" text-anchor="middle" font-size="9" fill="#10b981">最安全</text>

    <rect class="at-hover-card" x="175" y="395" width="125" height="65" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="237" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">PKCE</text>
    <text x="237" y="432" text-anchor="middle" font-size="9" fill="#475569">SPA / Mobile</text>
    <text x="237" y="447" text-anchor="middle" font-size="9" fill="#3b82f6">防 code 拦截</text>

    <rect class="at-hover-card" x="310" y="395" width="125" height="65" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="372" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Client Credentials</text>
    <text x="372" y="432" text-anchor="middle" font-size="9" fill="#475569">服务间调用</text>
    <text x="372" y="447" text-anchor="middle" font-size="9" fill="#f59e0b">无用户参与</text>

    <rect class="at-hover-card" x="445" y="395" width="115" height="65" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="502" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Implicit</text>
    <text x="502" y="432" text-anchor="middle" font-size="9" fill="#475569">⚠️ 已废弃</text>
    <text x="502" y="447" text-anchor="middle" font-size="9" fill="#dc2626">改用 PKCE</text>
  </g>
</svg>
