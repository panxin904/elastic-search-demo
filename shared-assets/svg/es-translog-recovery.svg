<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Elasticsearch Translog 数据恢复</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">WAL 机制 · 写入先写 translog · 崩溃 replay 防丢失</text>

  <!-- 写入流程 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 写入流程（先 translog，再 segment）</text>

    <rect x="40" y="105" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="55" y="120" width="100" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="105" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Index Request</text>
    <text x="105" y="151" text-anchor="middle" font-size="8" fill="#475569">PUT /idx/_doc/1</text>

    <path d="M 155 137 L 180 137" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="180" y="120" width="100" height="35" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="230" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">translog</text>
    <text x="230" y="151" text-anchor="middle" font-size="8" fill="#475569">fsync 立即写</text>

    <path d="M 280 137 L 305 137" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="305" y="120" width="105" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="357" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">in-memory</text>
    <text x="357" y="151" text-anchor="middle" font-size="8" fill="#475569">buffer</text>

    <path d="M 410 137 L 435 137" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="435" y="120" width="115" height="35" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="492" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">segment</text>
    <text x="492" y="151" text-anchor="middle" font-size="8" fill="#475569">每 1s refresh</text>

    <text x="60" y="178" font-size="10" fill="#dc2626">⚠️ 关键顺序：先 fsync translog（200 OK）→ 再写 buffer → 1s 后才落 segment</text>
  </g>

  <!-- 恢复流程 -->
  <g>
    <text x="60" y="223" font-size="13" font-weight="700" fill="#1e293b">② 崩溃恢复流程（启动时）</text>

    <rect x="40" y="235" width="520" height="155" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <!-- Node 启动 -->
    <rect x="55" y="252" width="105" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Node 启动</text>
    <text x="107" y="283" text-anchor="middle" font-size="8" fill="#475569">crash 后</text>

    <path d="M 160 270 L 185 270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="185" y="252" width="105" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="237" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">读 commit</text>
    <text x="237" y="283" text-anchor="middle" font-size="8" fill="#475569">找 last flush 点</text>

    <path d="M 290 270 L 315 270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="315" y="252" width="115" height="35" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="372" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">replay translog</text>
    <text x="372" y="283" text-anchor="middle" font-size="8" fill="#475569">从 last flush 后</text>

    <path d="M 430 270 L 455 270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="455" y="252" width="95" height="35" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="502" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">重建</text>
    <text x="502" y="283" text-anchor="middle" font-size="8" fill="#475569">内存 buffer</text>

    <text x="60" y="310" font-size="10" fill="#475569">步骤 1：磁盘加载已 flush 的 segments（这些一定安全）</text>
    <text x="60" y="328" font-size="10" fill="#475569">步骤 2：找到 translog 中尚未 flush 的操作（last_flush_id+1 起）</text>
    <text x="60" y="346" font-size="10" fill="#475569">步骤 3：顺序重放这些操作到 in-memory buffer</text>
    <text x="60" y="364" font-size="10" fill="#475569">步骤 4：refresh → 新 segment → 文档可搜</text>
    <text x="60" y="382" font-size="10" font-weight="700" fill="#065f46">✅ 任何时刻客户端收到 200 OK 的数据，重启后都能找到</text>
  </g>

  <!-- 配置 -->
  <g>
    <text x="60" y="410" font-size="13" font-weight="700" fill="#1e293b">③ 关键配置（durability vs 性能）</text>

    <rect x="40" y="423" width="250" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="165" y="440" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">index.translog.durability</text>
    <text x="165" y="455" text-anchor="middle" font-size="9" fill="#475569">= request (默认，每次 fsync)</text>

    <rect x="310" y="423" width="250" height="40" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="435" y="440" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">index.translog.sync_interval</text>
    <text x="435" y="455" text-anchor="middle" font-size="9" fill="#475569">= 5s (async 模式)</text>
  </g>
</svg>
