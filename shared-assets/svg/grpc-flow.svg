<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">gRPC 调用流程</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Protobuf · HTTP/2 · 4 种调用模式 · 服务间高性能 RPC</text>

  <!-- Client / Server -->
  <g>
    <rect x="40" y="85" width="230" height="350" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="155" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">gRPC Client（Stub）</text>

    <rect x="55" y="120" width="200" height="50" rx="6" fill="white" stroke="#3b82f6"/>
    <text x="155" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Stub（本地代理）</text>
    <text x="155" y="158" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">user_stub.GetUser(req)</text>

    <rect x="55" y="180" width="200" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="155" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Serializer（Protobuf）</text>
    <text x="155" y="218" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">GetUserRequest → bytes</text>

    <rect x="55" y="240" width="200" height="60" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="155" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">HTTP/2 Client</text>
    <text x="155" y="280" text-anchor="middle" font-size="9" fill="#475569">HEADERS + DATA frame</text>
    <text x="155" y="293" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">多路复用 + 二进制</text>

    <rect x="55" y="310" width="200" height="60" rx="6" fill="white" stroke="#8b5cf6"/>
    <text x="155" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Channel / ConnPool</text>
    <text x="155" y="350" text-anchor="middle" font-size="9" fill="#475569">长连接 · TLS · keep-alive</text>

    <rect x="55" y="380" width="200" height="50" rx="6" fill="white" stroke="#ef4444"/>
    <text x="155" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">拦截器链</text>
    <text x="155" y="418" text-anchor="middle" font-size="9" fill="#475569">Auth · Trace · Retry</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="330" y="85" width="230" height="350" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="445" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">gRPC Server（Service）</text>

    <rect x="345" y="120" width="200" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="445" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">gRPC Server</text>
    <text x="445" y="158" text-anchor="middle" font-size="9" fill="#475569">监听 :50051 · HTTP/2</text>

    <rect x="345" y="180" width="200" height="50" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="445" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">反序列化</text>
    <text x="445" y="218" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">bytes → Request</text>

    <rect x="345" y="240" width="200" height="60" rx="6" fill="white" stroke="#8b5cf6"/>
    <text x="445" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Service 实现</text>
    <text x="445" y="280" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">class UserService</text>
    <text x="445" y="293" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">GetUser(ctx, req)</text>

    <rect x="345" y="310" width="200" height="60" rx="6" fill="white" stroke="#ec4899"/>
    <text x="445" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">拦截器 / 中间件</text>
    <text x="445" y="350" text-anchor="middle" font-size="9" fill="#475569">Auth · Logging · 监控</text>

    <rect x="345" y="380" width="200" height="50" rx="6" fill="white" stroke="#ef4444"/>
    <text x="445" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">反射注册</text>
    <text x="445" y="418" text-anchor="middle" font-size="9" fill="#475569">add_Service(svc)</text>
  </g>

  <!-- 中间 -->
  <g>
    <text x="300" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">HTTP/2 over TLS（TCP）</text>
    <text x="300" y="462" text-anchor="middle" font-size="10" fill="#475569">Protobuf 比 JSON 小 3-10 倍 · 序列化快 5-10 倍</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M255,145 L345,145"/>
    <path d="M255,205 L345,205"/>
    <path d="M255,270 L345,270"/>
    <path d="M255,340 L345,340"/>
  </g>

  <!-- 4 种调用模式 -->
  <g font-size="10" fill="#64748b">
    <rect x="20" y="475" width="0" height="0"/>
  </g>
</svg>
