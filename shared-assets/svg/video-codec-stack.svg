<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="400"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >视频技术栈分层</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">协议 → 容器 → 编码 → 像素 · 端到端链路</text>

  <g>
    <rect x="60" y="90" width="480" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="80" y="115" font-size="12" font-weight="700" fill="#5b21b6">协议层 Protocol</text>
    <text x="80" y="135" font-size="11" fill="#1e293b">HLS · DASH · RTMP · WebRTC · RTSP · SRT</text>

    <rect x="60" y="160" width="480" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="185" font-size="12" font-weight="700" fill="#1e40af">容器层 Container</text>
    <text x="80" y="205" font-size="11" fill="#1e293b">MP4 · MKV · WebM · FLV · TS · MOV</text>

    <rect x="60" y="230" width="480" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="255" font-size="12" font-weight="700" fill="#065f46">编码层 Codec</text>
    <text x="80" y="275" font-size="11" fill="#1e293b">H.264/AVC · H.265/HEVC · AV1 · VP9 · AVS3</text>

    <rect x="60" y="300" width="480" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="325" font-size="12" font-weight="700" fill="#92400e">像素层 Pixel</text>
    <text x="80" y="345" font-size="11" fill="#1e293b">YUV 4:2:0 · 8/10bit · HDR10 · HLG · Dolby Vision</text>
  </g>

  <line x1="40" y1="120" x2="55" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <line x1="40" y1="190" x2="55" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="40" y1="260" x2="55" y2="260" stroke="#64748b" stroke-width="1.5"/>
  <line x1="40" y1="330" x2="55" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <text x="20" y="225" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90 20 225)">网络视角</text>

  <text x="555" y="120" text-anchor="end" font-size="10" fill="#64748b">传输</text>
  <text x="555" y="190" text-anchor="end" font-size="10" fill="#64748b">封装</text>
  <text x="555" y="260" text-anchor="end" font-size="10" fill="#64748b">压缩</text>
  <text x="555" y="330" text-anchor="end" font-size="10" fill="#64748b">采样</text>

  <text x="300" y="385" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v6 · video</text>
</svg>
