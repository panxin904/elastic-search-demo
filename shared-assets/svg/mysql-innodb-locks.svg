<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">MySQL InnoDB 锁体系</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">行锁 · 间隙锁 · Next-Key Lock · 意向锁 · RR 隔离级防幻读</text>

  <!-- 锁类型总览 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 锁粒度（按锁定范围）</text>

    <rect x="40" y="105" width="120" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">行锁</text>
    <text x="100" y="145" text-anchor="middle" font-size="9" fill="#475569">Record Lock</text>
    <text x="100" y="162" text-anchor="middle" font-size="9" fill="#475569">单行索引记录</text>
    <text x="100" y="178" text-anchor="middle" font-size="9" fill="#475569">最小粒度</text>

    <rect x="170" y="105" width="120" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="230" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">间隙锁</text>
    <text x="230" y="145" text-anchor="middle" font-size="9" fill="#475569">Gap Lock</text>
    <text x="230" y="162" text-anchor="middle" font-size="9" fill="#475569">索引记录间隙</text>
    <text x="230" y="178" text-anchor="middle" font-size="9" fill="#475569">防插入</text>

    <rect x="300" y="105" width="130" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="365" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">临键锁</text>
    <text x="365" y="145" text-anchor="middle" font-size="9" fill="#475569">Next-Key Lock</text>
    <text x="365" y="162" text-anchor="middle" font-size="9" fill="#475569">行锁 + 间隙</text>
    <text x="365" y="178" text-anchor="middle" font-size="9" fill="#475569">RR 默认</text>

    <rect x="440" y="105" width="120" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="500" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">表锁</text>
    <text x="500" y="145" text-anchor="middle" font-size="9" fill="#475569">Table Lock</text>
    <text x="500" y="162" text-anchor="middle" font-size="9" fill="#475569">整张表</text>
    <text x="500" y="178" text-anchor="middle" font-size="9" fill="#475569">DDL / 兜底</text>
  </g>

  <!-- Next-Key Lock 可视化 -->
  <g>
    <text x="60" y="208" font-size="13" font-weight="700" fill="#1e293b">② Next-Key Lock 在索引上的范围</text>

    <rect x="40" y="220" width="520" height="110" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <!-- 索引区间 -->
    <line x1="80" y1="280" x2="540" y2="280" stroke="#1e293b" stroke-width="2"/>
    <text x="60" y="285" font-size="10" font-weight="700" fill="#1e293b">∞</text>
    <text x="545" y="285" font-size="10" font-weight="700" fill="#1e293b">+∞</text>

    <circle cx="120" cy="280" r="6" fill="#3b82f6"/>
    <text x="120" y="265" font-size="10" text-anchor="middle" fill="#1e40af" font-weight="700">10</text>

    <circle cx="200" cy="280" r="6" fill="#3b82f6"/>
    <text x="200" y="265" font-size="10" text-anchor="middle" fill="#1e40af" font-weight="700">20</text>

    <circle cx="280" cy="280" r="6" fill="#dc2626"/>
    <text x="280" y="265" font-size="10" text-anchor="middle" fill="#991b1b" font-weight="700">30 ★</text>

    <circle cx="360" cy="280" r="6" fill="#3b82f6"/>
    <text x="360" y="265" font-size="10" text-anchor="middle" fill="#1e40af" font-weight="700">40</text>

    <circle cx="440" cy="280" r="6" fill="#3b82f6"/>
    <text x="440" y="265" font-size="10" text-anchor="middle" fill="#1e40af" font-weight="700">50</text>

    <!-- Next-Key Lock 范围 (20, 40] -->
    <rect x="200" y="275" width="160" height="10" fill="#f59e0b" opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="280" y="305" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Next-Key Lock: (20, 40]</text>

    <text x="60" y="318" font-size="9" fill="#475569">SELECT * FROM t WHERE id=30 FOR UPDATE → 锁住 (20,40] 区间，阻止插入 25/35，保留 30 行</text>
  </g>

  <!-- 意向锁 -->
  <g>
    <text x="60" y="345" font-size="13" font-weight="700" fill="#1e293b">③ 意向锁（IX / IS）— 协调表锁与行锁</text>

    <rect x="40" y="360" width="250" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="165" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">意向共享 IS</text>
    <text x="55" y="398" font-size="10" fill="#475569">• 事务要加 S 行锁</text>
    <text x="55" y="414" font-size="10" fill="#475569">• 先在表上标 IS</text>
    <text x="55" y="430" font-size="10" fill="#475569">• 其他事务可加 IS</text>
    <text x="55" y="446" font-size="10" fill="#475569">• 阻塞 X 表锁</text>

    <rect x="310" y="360" width="250" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="435" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">意向排他 IX</text>
    <text x="325" y="398" font-size="10" fill="#475569">• 事务要加 X 行锁</text>
    <text x="325" y="414" font-size="10" fill="#475569">• 先在表上标 IX</text>
    <text x="325" y="430" font-size="10" fill="#475569">• 阻塞 X / S 表锁</text>
    <text x="325" y="446" font-size="10" fill="#475569">• 不阻塞其他 IX</text>
  </g>
</svg>
