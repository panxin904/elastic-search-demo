<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL binlog 组提交（Group Commit）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">三阶段提交 · Flush → Sync → Commit · 5.7 / 8.0 优化</text>

  <!-- 旧问题 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 旧版问题：每事务 fsync</text>

    <rect x="40" y="105" width="520" height="65" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="300" y="125" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">每条 commit 都触发 fsync → 磁盘 IO 抖动 → TPS 上不去</text>
    <text x="55" y="148" font-size="10" fill="#475569">t1: write → fsync ❌</text>
    <text x="195" y="148" font-size="10" fill="#475569">t2: write → fsync ❌</text>
    <text x="335" y="148" font-size="10" fill="#475569">t3: write → fsync ❌</text>
    <text x="475" y="148" font-size="10" fill="#475569">...</text>
  </g>

  <!-- 组提交三阶段 -->
  <g>
    <text x="60" y="195" font-size="13" font-weight="700" fill="#1e293b">② 三阶段组提交（MySQL 5.6+）</text>

    <rect x="40" y="210" width="155" height="180" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="117" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Flush 阶段</text>
    <text x="55" y="252" font-size="10" fill="#475569">• 内存中事务排队</text>
    <text x="55" y="268" font-size="10" fill="#475569">• 写到 binlog cache</text>
    <text x="55" y="284" font-size="10" fill="#475569">• 不刷盘</text>
    <text x="55" y="308" font-size="10" font-weight="700" fill="#1e293b">leader 选举：</text>
    <text x="55" y="324" font-size="9" font-family="monospace" fill="#475569">队列第一个事务</text>
    <text x="55" y="338" font-size="9" font-family="monospace" fill="#475569">成为 leader</text>
    <text x="55" y="354" font-size="10" font-weight="700" fill="#1e293b">leader 责任：</text>
    <text x="55" y="370" font-size="9" fill="#475569">带动整批 Flush</text>
    <text x="55" y="384" font-size="9" fill="#475569">+ Sync + Commit</text>

    <path d="M 195 280 L 220 280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="220" y="210" width="155" height="180" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="297" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Sync 阶段</text>
    <text x="235" y="252" font-size="10" fill="#475569">• leader 写 binlog 文件</text>
    <text x="235" y="268" font-size="10" fill="#475569">• 一次 fsync 刷盘</text>
    <text x="235" y="284" font-size="10" fill="#475569">• 所有事务共用</text>
    <text x="235" y="308" font-size="10" font-weight="700" fill="#1e293b">事务顺序：</text>
    <text x="235" y="324" font-size="9" fill="#475569">按进入队列顺序</text>
    <text x="235" y="338" font-size="9" fill="#475569">原子写入 binlog</text>
    <text x="235" y="358" font-size="10" font-weight="700" fill="#1e293b">IO 优化：</text>
    <text x="235" y="374" font-size="9" fill="#475569">N 事务 → 1 次 fsync</text>
    <text x="235" y="388" font-size="9" fill="#475569">fsync 次数 = 1/N</text>

    <path d="M 375 280 L 400 280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="400" y="210" width="160" height="180" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="480" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Commit 阶段</text>
    <text x="415" y="252" font-size="10" fill="#475569">• leader 按顺序</text>
    <text x="415" y="268" font-size="10" fill="#475569">  唤醒各事务</text>
    <text x="415" y="284" font-size="10" fill="#475569">• 各自提交返回</text>
    <text x="415" y="308" font-size="10" font-weight="700" fill="#1e293b">并行唤醒：</text>
    <text x="415" y="324" font-size="9" fill="#475569">innodb_use_thread</text>
    <text x="415" y="338" font-size="9" fill="#475569">_concurrency</text>
    <text x="415" y="358" font-size="10" font-weight="700" fill="#1e293b">8.0 优化：</text>
    <text x="415" y="374" font-size="9" fill="#475569">binlog_order_</text>
    <text x="415" y="388" font-size="9" fill="#475569">commits 拆分</text>
  </g>

  <!-- 性能对比 -->
  <g>
    <text x="60" y="412" font-size="13" font-weight="700" fill="#1e293b">③ 性能对比（TPS）</text>

    <rect x="40" y="427" width="170" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="125" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">无组提交</text>
    <text x="125" y="460" text-anchor="middle" font-size="10" fill="#475569">~200 TPS (fsync 限制)</text>

    <rect x="220" y="427" width="170" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="305" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">三阶段组提交</text>
    <text x="305" y="460" text-anchor="middle" font-size="10" fill="#475569">~3000 TPS (10x↑)</text>

    <rect x="400" y="427" width="160" height="40" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="480" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">8.0 并行提交</text>
    <text x="480" y="460" text-anchor="middle" font-size="10" fill="#475569">~6000 TPS (30x↑)</text>
  </g>
</svg>
