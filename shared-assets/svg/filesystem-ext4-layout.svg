<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="380"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >ext4 磁盘布局</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">超级块 / 组描述符 / inode 位图 / 数据位图 / inode 表 / 数据块</text>

  <!-- 块组结构 -->
  <g>
    <text x="40" y="92" font-size="12" font-weight="700" fill="#475569">块组 0（典型结构）</text>

    <rect x="40" y="100" width="100" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="90" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">超级块</text>
    <text x="90" y="132" text-anchor="middle" font-size="9" fill="#92400e">1 KB</text>

    <rect x="145" y="100" width="100" height="40" rx="4" fill="#fce7f3" stroke="#ec4899"/>
    <text x="195" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#9d174d">组描述符</text>
    <text x="195" y="132" text-anchor="middle" font-size="9" fill="#9d174d">block bitmap</text>

    <rect x="250" y="100" width="100" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="300" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">inode 位图</text>
    <text x="300" y="132" text-anchor="middle" font-size="9" fill="#5b21b6">已用 inode</text>

    <rect x="355" y="100" width="100" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="405" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">inode 表</text>
    <text x="405" y="132" text-anchor="middle" font-size="9" fill="#1e40af">N × 256 B</text>

    <rect x="460" y="100" width="100" height="40" rx="4" fill="#d1fae5" stroke="#10b981"/>
    <text x="510" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">数据块</text>
    <text x="510" y="132" text-anchor="middle" font-size="9" fill="#065f46">4 KB × N</text>

    <!-- 下箭头：下一个块组 -->
    <line x1="40" y1="160" x2="40" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <text x="50" y="175" font-size="9" fill="#475569">重复 N 个块组</text>

    <!-- inode 内部结构 -->
    <rect x="40" y="200" width="520" height="80" rx="6" fill="#fff" stroke="#e2e8f0"/>
    <text x="60" y="225" font-size="12" font-weight="700" fill="#7c3aed">inode 结构（256 字节）</text>
    <text x="60" y="248" font-size="10" fill="#1e293b">• mode · uid/gid · size · atime/mtime/ctime · link count</text>
    <text x="60" y="266" font-size="10" fill="#1e293b">• 12 个直接块 + 1 个间接块 + 2 个二级间接块</text>

    <!-- 性能提示 -->
    <rect x="40" y="295" width="520" height="65" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="60" y="320" font-size="11" font-weight="700" fill="#92400e">💡 调优点</text>
    <text x="60" y="338" font-size="10" fill="#475569">• block size = 4KB（默认）/ 1KB（小文件多）/ 64KB（大文件）</text>
    <text x="60" y="354" font-size="10" fill="#475569">• inode ratio = 16384 bytes/inode（小文件场景调小到 4096）</text>
  </g>

  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v7 · filesystem</text>
</svg>
