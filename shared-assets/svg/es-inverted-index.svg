<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Elasticsearch 倒排索引</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">词项 → 文档列表 · 词频 · 位置 · 评分 BM25</text>

  <!-- 文档示例 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 文档集合（3 篇）</text>

    <rect class="at-hover-card" x="40" y="105" width="520" height="90" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <text x="55" y="125" font-size="11" font-weight="700" fill="#1e40af">Doc 1</text>
    <text x="55" y="143" font-size="10" fill="#1e293b">"Elasticsearch is a search engine built on Lucene"</text>

    <text x="55" y="165" font-size="11" font-weight="700" fill="#065f46">Doc 2</text>
    <text x="55" y="183" font-size="10" fill="#1e293b">"Lucene is the core library of Elasticsearch"</text>
  </g>

  <!-- 倒排索引表 -->
  <g>
    <text x="60" y="220" font-size="13" font-weight="700" fill="#1e293b">② 倒排索引（Inverted Index）</text>

    <!-- 表头 -->
    <rect x="40" y="232" width="520" height="20" fill="#1e293b"/>
    <text x="80" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#f1f5f9">词项 (Term)</text>
    <text x="200" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#f1f5f9">文档ID</text>
    <text x="310" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#f1f5f9">词频 (TF)</text>
    <text x="420" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#f1f5f9">位置 (Pos)</text>
    <text x="525" y="246" text-anchor="middle" font-size="10" font-weight="700" fill="#f1f5f9">偏移</text>

    <!-- 行 1: elasticsearch -->
    <rect x="40" y="252" width="520" height="22" fill="#dbeafe"/>
    <text x="80" y="267" text-anchor="middle" font-size="10" fill="#1e40af" font-family="monospace">elasticsearch</text>
    <text x="200" y="267" text-anchor="middle" font-size="10" fill="#1e293b">[1, 2]</text>
    <text x="310" y="267" text-anchor="middle" font-size="10" fill="#1e293b">[1, 1]</text>
    <text x="420" y="267" text-anchor="middle" font-size="10" fill="#1e293b">[[0], [11]]</text>
    <text x="525" y="267" text-anchor="middle" font-size="10" fill="#1e293b">2</text>

    <!-- 行 2: lucene -->
    <rect x="40" y="274" width="520" height="22" fill="#dcfce7"/>
    <text x="80" y="289" text-anchor="middle" font-size="10" fill="#065f46" font-family="monospace">lucene</text>
    <text x="200" y="289" text-anchor="middle" font-size="10" fill="#1e293b">[1, 2]</text>
    <text x="310" y="289" text-anchor="middle" font-size="10" fill="#1e293b">[1, 1]</text>
    <text x="420" y="289" text-anchor="middle" font-size="10" fill="#1e293b">[[7], [4]]</text>
    <text x="525" y="289" text-anchor="middle" font-size="10" fill="#1e293b">2</text>

    <!-- 行 3: search -->
    <rect x="40" y="296" width="520" height="22" fill="#fef3c7"/>
    <text x="80" y="311" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">search</text>
    <text x="200" y="311" text-anchor="middle" font-size="10" fill="#1e293b">[1]</text>
    <text x="310" y="311" text-anchor="middle" font-size="10" fill="#1e293b">[1]</text>
    <text x="420" y="311" text-anchor="middle" font-size="10" fill="#1e293b">[[4]]</text>
    <text x="525" y="311" text-anchor="middle" font-size="10" fill="#1e293b">1</text>

    <!-- 行 4: engine -->
    <rect x="40" y="318" width="520" height="22" fill="#f3e8ff"/>
    <text x="80" y="333" text-anchor="middle" font-size="10" fill="#6b21a8" font-family="monospace">engine</text>
    <text x="200" y="333" text-anchor="middle" font-size="10" fill="#1e293b">[1]</text>
    <text x="310" y="333" text-anchor="middle" font-size="10" fill="#1e293b">[1]</text>
    <text x="420" y="333" text-anchor="middle" font-size="10" fill="#1e293b">[[5]]</text>
    <text x="525" y="333" text-anchor="middle" font-size="10" fill="#1e293b">1</text>

    <!-- 行 5: core -->
    <rect x="40" y="340" width="520" height="22" fill="#fee2e2"/>
    <text x="80" y="355" text-anchor="middle" font-size="10" fill="#991b1b" font-family="monospace">core</text>
    <text x="200" y="355" text-anchor="middle" font-size="10" fill="#1e293b">[2]</text>
    <text x="310" y="355" text-anchor="middle" font-size="10" fill="#1e293b">[1]</text>
    <text x="420" y="355" text-anchor="middle" font-size="10" fill="#1e293b">[[4]]</text>
    <text x="525" y="355" text-anchor="middle" font-size="10" fill="#1e293b">1</text>
  </g>

  <!-- 查询流程 -->
  <g>
    <text x="60" y="385" font-size="13" font-weight="700" fill="#1e293b">③ 查询 "elasticsearch lucene" 评分流程</text>

    <rect class="at-hover-card" x="40" y="400" width="130" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="105" y="418" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">分词 + 标准化</text>
    <text x="105" y="432" text-anchor="middle" font-size="9" fill="#475569">→ [elasticsearch, lucene]</text>

    <path d="M 170 420 L 195 420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="195" y="400" width="130" height="40" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="260" y="418" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">查 posting list</text>
    <text x="260" y="432" text-anchor="middle" font-size="9" fill="#475569">→ [1,2] ∩ [1,2] = [1,2]</text>

    <path d="M 325 420 L 350 420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="350" y="400" width="130" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="415" y="418" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">BM25 评分</text>
    <text x="415" y="432" text-anchor="middle" font-size="9" fill="#475569">→ score(D1)=1.42, D2=1.35</text>

    <path d="M 480 420 L 505 420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="505" y="400" width="65" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="537" y="418" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">排序</text>
    <text x="537" y="432" text-anchor="middle" font-size="9" fill="#475569">Top-N</text>
  </g>
</svg>
