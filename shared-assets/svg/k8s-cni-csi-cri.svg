<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Kubernetes CNI / CSI / CRI 插件体系</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">kubelet 三种 hook · 网络/存储/运行时解耦 · 标准化接口</text>

  <!-- kubelet 中心 -->
  <g>
    <text x="60" y="95" font-size="13" font-weight="700" fill="#1e293b">kubelet 三种插件接口</text>

    <rect class="at-hover-card" x="40" y="115" width="120" height="220" rx="8" fill="#1f2937"/>
    <text x="100" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#86efac">kubelet</text>
    <text x="100" y="153" text-anchor="middle" font-size="9" fill="#94a3b8">节点代理</text>

    <text x="100" y="180" text-anchor="middle" font-size="10" fill="#a5f3fc">↓ Pod 启动</text>
    <text x="100" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#fef3c7">CNI</text>
    <text x="100" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#fef3c7">CSI</text>
    <text x="100" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fef3c7">CRI</text>
    <text x="100" y="320" text-anchor="middle" font-size="9" fill="#94a3b8">三种 hook 调用</text>

    <!-- CNI 详情 -->
    <rect class="at-hover-card" x="220" y="105" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="300" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">CNI（网络）</text>
    <text x="300" y="143" text-anchor="middle" font-size="10" fill="#475569">Pod 网络配置</text>

    <!-- CSI 详情 -->
    <rect class="at-hover-card" x="220" y="165" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">CSI（存储）</text>
    <text x="300" y="203" text-anchor="middle" font-size="10" fill="#475569">Volume 挂载</text>

    <!-- CRI 详情 -->
    <rect class="at-hover-card" x="220" y="225" width="160" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">CRI（运行时）</text>
    <text x="300" y="263" text-anchor="middle" font-size="10" fill="#475569">容器进程管理</text>

    <!-- 箭头 -->
    <line x1="160" y1="195" x2="220" y2="130" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
    <line x1="160" y1="220" x2="220" y2="190" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="160" y1="245" x2="220" y2="250" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 右侧具体实现 -->
    <rect class="at-hover-card" x="420" y="105" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="490" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Calico / Flannel</text>
    <text x="490" y="142" text-anchor="middle" font-size="9" fill="#475569">Cilium / Weave</text>

    <rect class="at-hover-card" x="420" y="165" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="490" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">AWS EBS / Ceph</text>
    <text x="490" y="202" text-anchor="middle" font-size="9" fill="#475569">NFS / Longhorn</text>

    <rect class="at-hover-card" x="420" y="225" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="490" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">containerd / CRI-O</text>
    <text x="490" y="262" text-anchor="middle" font-size="9" fill="#475569">Docker (弃用)</text>

    <!-- 箭头 -->
    <line x1="380" y1="130" x2="420" y2="130" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrB)"/>
    <line x1="380" y1="190" x2="420" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="380" y1="250" x2="420" y2="250" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- 接口规范 -->
  <g>
    <text x="60" y="360" font-size="13" font-weight="700" fill="#1e293b">接口规范（gRPC 协议）</text>

    <rect class="at-hover-card" x="40" y="375" width="520" height="65" rx="6" fill="#1f2937"/>
    <text x="60" y="395" font-size="11" font-family="monospace" fill="#86efac">type CNI interface {</text>
    <text x="60" y="412" font-size="11" font-family="monospace" fill="#a5f3fc">  AddNetwork(net *NetworkConfig, rt *RuntimeConf) (types.Result, error)</text>
    <text x="60" y="429" font-size="11" font-family="monospace" fill="#a5f3fc">  DelNetwork(net *NetworkConfig, rt *RuntimeConf) error</text>
  </g>

  <!-- 优势 -->
  <g>
    <rect class="at-hover-card" x="40" y="450" width="525" height="20" rx="4" fill="#fef9c3" stroke="#facc15"/>
    <text x="60" y="465" font-size="11" font-weight="700" fill="#854d0e">价值：kubelet 不耦合任何厂商实现 → 自由切换网络/存储/运行时方案</text>
  </g>
</svg>
