<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Elasticsearch 集群架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Master / Data / Coordinating · 分片与副本</text>

  <!-- 顶部协调节点 -->
  <rect x="240" y="100" width="120" height="40" rx="6" fill="#3b82f6" opacity="0.9"/>
  <text x="300" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">Coordinating</text>

  <!-- 3 个节点列 -->
  <g font-size="11" font-weight="700">
    <!-- Master -->
    <rect x="40" y="180" width="160" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="120" y="205" text-anchor="middle" fill="white">Master (3 nodes)</text>

    <rect x="220" y="180" width="160" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="300" y="205" text-anchor="middle" fill="white">Data Node A</text>

    <rect x="400" y="180" width="160" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="480" y="205" text-anchor="middle" fill="white">Data Node B</text>
  </g>

  <!-- 分片示意 -->
  <g font-size="11" font-weight="700">
    <text x="120" y="245" text-anchor="middle" font-size="10" fill="#475569">集群状态 · 索引元数据</text>
    <text x="300" y="245" text-anchor="middle" font-size="10" fill="#475569">Shard 0 + 1 (主) · 副本</text>
    <text x="480" y="245" text-anchor="middle" font-size="10" fill="#475569">Shard 2 + 3 (主) · 副本</text>

    <rect x="230" y="260" width="140" height="40" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="300" y="285" text-anchor="middle" fill="white">Shard 0 (P) · 5GB</text>

    <rect x="230" y="305" width="140" height="40" rx="4" fill="#3b82f6" opacity="0.85"/>
    <text x="300" y="330" text-anchor="middle" fill="white">Shard 1 (P) · 5GB</text>

    <rect x="410" y="260" width="140" height="40" rx="4" fill="#10b981" opacity="0.85"/>
    <text x="480" y="285" text-anchor="middle" fill="white">Shard 2 (P) · 5GB</text>

    <rect x="410" y="305" width="140" height="40" rx="4" fill="#10b981" opacity="0.85"/>
    <text x="480" y="330" text-anchor="middle" fill="white">Shard 3 (P) · 5GB</text>
  </g>

  <!-- 副本节点 -->
  <g font-size="11" font-weight="700">
    <rect x="410" y="365" width="140" height="35" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="480" y="385" text-anchor="middle" font-size="10" fill="white">Shard 0 (R)</text>

    <rect x="410" y="405" width="140" height="35" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="480" y="425" text-anchor="middle" font-size="10" fill="white">Shard 1 (R)</text>

    <rect x="230" y="365" width="140" height="35" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="300" y="385" text-anchor="middle" font-size="10" fill="white">Shard 2 (R)</text>

    <rect x="230" y="405" width="140" height="35" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="300" y="425" text-anchor="middle" font-size="10" fill="white">Shard 3 (R)</text>
  </g>

  <!-- 副本同步箭头 -->
  <g stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="2 2" marker-end="url(#arrow)">
    <line x1="300" y1="345" x2="300" y2="365"/>
    <line x1="300" y1="345" x2="300" y2="405"/>
    <line x1="480" y1="345" x2="480" y2="365"/>
    <line x1="480" y1="345" x2="480" y2="405"/>
  </g>

  <text x="300" y="460" text-anchor="middle" font-size="11" fill="#94a3b8">replica=2 容错：1 主 + 2 副本 · 节点故障时自动选举 · 写入需 ≥半数副本确认</text>
</svg>
