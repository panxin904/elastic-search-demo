<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">Go GMP 调度模型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">G (Goroutine) · M (Machine) · P (Processor)</text>

  <!-- G (Goroutine) -->
  <text x="80" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">G (Goroutine)</text>
  <text x="80" y="118" text-anchor="middle" font-size="10" fill="#475569">协程 · 用户态轻量线程</text>

  <rect class="at-hover-card" x="30" y="130" width="100" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">G1 (run)</text>

  <rect class="at-hover-card" x="30" y="180" width="100" height="40" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="80" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">G2 (ready)</text>

  <rect class="at-hover-card" x="30" y="230" width="100" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">G3 (wait)</text>

  <rect class="at-hover-card" x="30" y="280" width="100" height="40" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="80" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">G4 (ready)</text>

  <!-- M (Machine / OS Thread) -->
  <text x="300" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">M (Machine)</text>
  <text x="300" y="118" text-anchor="middle" font-size="10" fill="#475569">OS 线程 · 由 runtime 管理</text>

  <rect class="at-hover-card" x="240" y="130" width="120" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">M1</text>
  <text x="300" y="178" text-anchor="middle" font-size="10" fill="#475569">执行 G1</text>
  <text x="300" y="195" text-anchor="middle" font-size="9" fill="#475569">syscall/blocking</text>

  <rect class="at-hover-card" x="240" y="230" width="120" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">M2 (空闲)</text>
  <text x="300" y="278" text-anchor="middle" font-size="10" fill="#475569">无 P 绑定</text>
  <text x="300" y="295" text-anchor="middle" font-size="9" fill="#475569">spinning thread</text>

  <!-- P (Processor) -->
  <text x="500" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">P (Processor)</text>
  <text x="500" y="118" text-anchor="middle" font-size="10" fill="#475569">逻辑处理器 · GOMAXPROCS</text>

  <rect class="at-hover-card" x="440" y="130" width="120" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">P1 (本地队列)</text>
  <text x="500" y="175" text-anchor="middle" font-size="10" fill="#475569">[G2, G4]</text>
  <text x="500" y="193" text-anchor="middle" font-size="9" fill="#475569">256 容量</text>

  <rect class="at-hover-card" x="440" y="230" width="120" height="80" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">P2 (空闲)</text>
  <text x="500" y="275" text-anchor="middle" font-size="10" fill="#475569">无本地 G</text>
  <text x="500" y="293" text-anchor="middle" font-size="9" fill="#475569">从全局偷</text>

  <!-- 全局队列 -->
  <rect x="200" y="345" width="220" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4,2"/>
  <text x="310" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Global Run Queue (GRQ)</text>
  <text x="310" y="385" text-anchor="middle" font-size="10" fill="#64748b">新创建 G · 偷窃平衡点</text>

  <!-- 边 -->
  <line x1="130" y1="150" x2="240" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="200" x2="440" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="300" x2="440" y2="195" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="170" x2="440" y2="170" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 关键点 -->
  <rect x="30" y="410" width="540" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="300" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">工作窃取 (Work Stealing)</text>
  <text x="50" y="450" font-size="10" fill="#334155">P 本地空 → 偷其他 P 一半 / 从 GRQ 取 1 个</text>
  <text x="50" y="465" font-size="10" fill="#334155">M 进入 syscall → P 解绑 → 新的/空闲 M 接管 P</text>
</svg>
