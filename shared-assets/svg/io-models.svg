<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Linux 5 种 IO 模型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">阻塞 · 非阻塞 · IO 多路复用 · 信号驱动 · 异步</text>

  <g font-size="11" font-weight="700">
    <!-- 阻塞 -->
    <rect x="40" y="90" width="105" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="92" y="110" text-anchor="middle" fill="#1e3a8a">① 阻塞 IO</text>
    <text x="92" y="130" text-anchor="middle" font-size="9" fill="#1e40af">Blocking</text>
    <text x="92" y="155" text-anchor="middle" font-size="10" fill="#1e40af">read 阻塞到数据</text>
    <text x="92" y="170" text-anchor="middle" font-size="10" fill="#1e40af">单线程</text>
    <text x="92" y="185" text-anchor="middle" font-size="9" fill="#3b82f6">最简单</text>

    <!-- 非阻塞 -->
    <rect x="155" y="90" width="105" height="100" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="207" y="110" text-anchor="middle" fill="#064e3b">② 非阻塞</text>
    <text x="207" y="130" text-anchor="middle" font-size="9" fill="#065f46">Non-blocking</text>
    <text x="207" y="155" text-anchor="middle" font-size="10" fill="#065f46">轮询 EAGAIN</text>
    <text x="207" y="170" text-anchor="middle" font-size="10" fill="#065f46">CPU 浪费</text>
    <text x="207" y="185" text-anchor="middle" font-size="9" fill="#10b981">少见</text>

    <!-- 多路复用 -->
    <rect x="270" y="90" width="105" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="322" y="110" text-anchor="middle" fill="#92400e">③ IO 多路复用</text>
    <text x="322" y="125" text-anchor="middle" font-size="9" fill="#78350f">Multiplexing</text>
    <text x="322" y="155" text-anchor="middle" font-size="10" fill="#78350f">select/poll/epoll</text>
    <text x="322" y="170" text-anchor="middle" font-size="10" fill="#78350f">单线程管多 fd</text>
    <text x="322" y="185" text-anchor="middle" font-size="9" fill="#f59e0b">★ Redis/Nginx</text>

    <!-- 信号驱动 -->
    <rect x="385" y="90" width="105" height="100" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="437" y="110" text-anchor="middle" fill="#9f1239">④ 信号驱动</text>
    <text x="437" y="125" text-anchor="middle" font-size="9" fill="#9d174d">Signal-Driven</text>
    <text x="437" y="155" text-anchor="middle" font-size="10" fill="#9d174d">SIGIO 通知</text>
    <text x="437" y="170" text-anchor="middle" font-size="10" fill="#9d174d">少用</text>
    <text x="437" y="185" text-anchor="middle" font-size="9" fill="#ec4899">不推荐</text>

    <!-- 异步 -->
    <rect x="500" y="90" width="80" height="100" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="540" y="110" text-anchor="middle" fill="#5b21b6">⑤ 异步</text>
    <text x="540" y="125" text-anchor="middle" font-size="9" fill="#6b21a8">Async I/O</text>
    <text x="540" y="155" text-anchor="middle" font-size="10" fill="#6b21a8">io_uring</text>
    <text x="540" y="170" text-anchor="middle" font-size="10" fill="#6b21a8">AIO · 内核接管</text>
    <text x="540" y="185" text-anchor="middle" font-size="9" fill="#8b5cf6">★ 现代</text>
  </g>

  <!-- 对比表 -->
  <g font-size="11">
    <rect x="40" y="220" width="540" height="180" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="240" text-anchor="middle" font-weight="700" fill="#1e293b">同步 vs 异步 / 阻塞 vs 非阻塞</text>

    <g font-size="10" font-weight="700">
      <text x="60" y="265" fill="#1e293b">同步阻塞：最传统 · 单连接单线程</text>
      <text x="60" y="285" fill="#1e293b">同步非阻塞：轮询 · CPU 浪费</text>
      <text x="60" y="305" fill="#1e293b">同步多路复用：select/poll/epoll · Redis 单线程</text>
      <text x="60" y="325" fill="#1e293b">异步阻塞：暂无（同步多路复用 + 阻塞 read）</text>
      <text x="60" y="345" fill="#1e293b">异步非阻塞：AIO · 内核完成通知回调</text>
      <text x="60" y="365" fill="#1e293b">★ Node.js / Netty：Reactor 模型 + 多路复用</text>
      <text x="60" y="385" fill="#1e293b">★ Java NIO / Go runtime：epoll + goroutine</text>
    </g>
  </g>

  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#94a3b8">epoll：内核事件表 · O(1) · LT/ET 模式 · 边缘触发需一次性读完</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">io_uring：Linux 5.1+ · 共享 ring buffer · 极致性能</text>
</svg>
