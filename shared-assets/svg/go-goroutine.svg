<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Go Goroutine 调度模型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">G-P-M 模型 · GMP · work stealing</text>

  <!-- M（OS 线程） -->
  <g font-size="11" font-weight="700">
    <rect x="40" y="100" width="150" height="280" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="120" text-anchor="middle" font-size="13" fill="#1e3a8a">M（线程）</text>
    <text x="115" y="135" text-anchor="middle" font-size="10" fill="#1e40af">OS Thread</text>

    <rect x="55" y="150" width="120" height="35" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="115" y="172" text-anchor="middle" fill="white">M1</text>

    <rect x="55" y="195" width="120" height="35" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="115" y="217" text-anchor="middle" fill="white">M2</text>

    <rect x="55" y="240" width="120" height="35" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="115" y="262" text-anchor="middle" fill="white">M3</text>

    <rect x="55" y="285" width="120" height="35" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="115" y="307" text-anchor="middle" fill="white">M4</text>

    <rect x="55" y="330" width="120" height="35" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="115" y="352" text-anchor="middle" fill="white">Mn</text>
  </g>

  <!-- P（逻辑处理器） -->
  <g font-size="11" font-weight="700">
    <rect x="210" y="100" width="180" height="280" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="120" text-anchor="middle" font-size="13" fill="#064e3b">P（逻辑处理器）</text>
    <text x="300" y="135" text-anchor="middle" font-size="10" fill="#065f46">GOMAXPROCS 默认 = CPU 数</text>

    <rect x="225" y="150" width="150" height="35" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="300" y="172" text-anchor="middle" fill="white">P1</text>

    <rect x="225" y="195" width="150" height="35" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="300" y="217" text-anchor="middle" fill="white">P2</text>

    <rect x="225" y="240" width="150" height="35" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="300" y="262" text-anchor="middle" fill="white">P3</text>

    <rect x="225" y="285" width="150" height="35" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="300" y="307" text-anchor="middle" fill="white">Pn</text>
  </g>

  <!-- G（Goroutine） -->
  <g font-size="11" font-weight="700">
    <rect x="410" y="100" width="150" height="280" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="485" y="120" text-anchor="middle" font-size="13" fill="#9f1239">G（协程）</text>
    <text x="485" y="135" text-anchor="middle" font-size="10" fill="#9d174d">Goroutine</text>

    <rect x="425" y="150" width="120" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="485" y="165" text-anchor="middle" font-size="9" fill="white">G1 · 2KB</text>

    <rect x="425" y="175" width="120" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="485" y="190" text-anchor="middle" font-size="9" fill="white">G2 · 2KB</text>

    <rect x="425" y="200" width="120" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="485" y="215" text-anchor="middle" font-size="9" fill="white">G3 · 2KB</text>

    <rect x="425" y="225" width="120" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="485" y="240" text-anchor="middle" font-size="9" fill="white">G4 · 2KB</text>

    <rect x="425" y="250" width="120" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="485" y="265" text-anchor="middle" font-size="9" fill="white">G5 · 2KB</text>

    <rect x="425" y="275" width="120" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="485" y="290" text-anchor="middle" font-size="9" fill="white">...</text>

    <text x="485" y="320" font-size="9" fill="#9d174d">轻量 · 数十万并发</text>
    <text x="485" y="335" font-size="9" fill="#9d174d">动态栈 2KB ~ 1GB</text>
  </g>

  <!-- 关系 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="168" x2="225" y2="168"/>
    <line x1="190" y1="213" x2="225" y2="213"/>
    <line x1="190" y1="258" x2="225" y2="258"/>
    <line x1="190" y1="303" x2="225" y2="303"/>
  </g>

  <!-- 调度策略 -->
  <g font-size="11">
    <rect x="40" y="400" width="520" height="65" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="420" text-anchor="middle" font-weight="700" fill="#1e293b">调度策略</text>
    <text x="60" y="438" fill="#475569">✓ work stealing：空闲 P 从其他 P 偷一半 G · 负载均衡</text>
    <text x="60" y="453" fill="#475569">✓ hand off：G 阻塞（syscall）→ M 释放 → 新 M 接管</text>
    <text x="60" y="465" fill="#475569">✓ preempt：协作式 · Go 1.14+ 信号抢占</text>
  </g>
</svg>
