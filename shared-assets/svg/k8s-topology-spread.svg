<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >K8s Pod 拓扑分布约束</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">topologySpreadConstraints · 多 AZ / 多 Node 均匀分布</text>

  <!-- 对比：默认 vs topologySpread -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 默认调度 vs 拓扑分布（多 AZ 场景）</text>

    <rect x="40" y="100" width="260" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="170" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">❌ 默认（Pod 集中）</text>
    <text x="55" y="142" font-size="10" fill="#475569">6 个 Pod 全在 AZ-A（运气）</text>
    <rect x="60" y="155" width="50" height="20" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="115" y="155" width="50" height="20" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="60" y="180" width="50" height="20" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="115" y="180" width="50" height="20" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="195" y="150" font-size="10" fill="#475569">AZ-A</text>
    <text x="195" y="195" font-size="10" fill="#dc2626">⚠️ AZ-A 挂了全丢</text>
    <text x="55" y="215" font-size="9" fill="#dc2626">单 AZ 故障 → 全军覆没</text>

    <rect x="310" y="100" width="250" height="125" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">✅ topologySpread 均衡</text>
    <text x="325" y="142" font-size="10" fill="#475569">2 个 Pod × 3 AZ = 高可用</text>
    <rect x="330" y="155" width="50" height="20" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <rect x="385" y="155" width="50" height="20" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="465" y="150" font-size="10" fill="#475569">AZ-A</text>
    <rect x="330" y="180" width="50" height="20" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <rect x="385" y="180" width="50" height="20" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="465" y="195" font-size="10" fill="#10b981">✅ 单 AZ 挂仍存活 2 个</text>
    <text x="325" y="215" font-size="9" fill="#10b981">任意 AZ 故障仍能提供服务</text>
  </g>

  <!-- 配置结构 -->
  <g>
    <text x="50" y="260" font-size="13" font-weight="700" fill="#1e293b">② 配置结构（3 个核心字段）</text>

    <rect x="40" y="270" width="520" height="120" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="292" font-size="10" fill="#e2e8f0" font-family="monospace">topologySpreadConstraints:</text>
    <text x="75" y="310" font-size="10" fill="#e2e8f0" font-family="monospace">- maxSkew: 1                    # 最大偏差（最少/最多相差 1）</text>
    <text x="75" y="328" font-size="10" fill="#e2e8f0" font-family="monospace">  topologyKey: topology.kubernetes.io/zone   # 分布维度（zone/hostname）</text>
    <text x="75" y="346" font-size="10" fill="#e2e8f0" font-family="monospace">  whenUnsatisfiable: DoNotSchedule  # 不满足时策略</text>
    <text x="75" y="364" font-size="10" fill="#e2e8f0" font-family="monospace">  labelSelector:                   # 匹配哪类 Pod</text>
    <text x="95" y="380" font-size="10" fill="#e2e8f0" font-family="monospace">matchLabels:</text>
    <text x="115" y="384" font-size="9" fill="#94a3b8"></text>
  </g>

  <!-- whenUnsatisfiable 3 种策略 -->
  <g>
    <text x="50" y="415" font-size="13" font-weight="700" fill="#1e293b">③ whenUnsatisfiable 3 种策略</text>

    <rect x="40" y="425" width="160" height="40" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">DoNotSchedule ⭐</text>
    <text x="120" y="457" text-anchor="middle" font-size="9" fill="#475569">不满足就 pending</text>

    <rect x="220" y="425" width="160" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">ScheduleAnyway</text>
    <text x="300" y="457" text-anchor="middle" font-size="9" fill="#475569">尽力调度</text>

    <rect x="400" y="425" width="160" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="480" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">ScheduleAnyway+honor</text>
    <text x="480" y="457" text-anchor="middle" font-size="9" fill="#475569">不影响现有</text>
  </g>

  <!-- 关键点 -->
  <text x="300" y="478" text-anchor="middle" font-size="9" fill="#64748b">💡 topologyKey 常用：zone（多 AZ）/ hostname（多 Node）/ rack（机房机柜）</text>
</svg>
