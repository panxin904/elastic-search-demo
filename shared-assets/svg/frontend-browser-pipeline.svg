<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="400"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >浏览器关键渲染路径 (CRP)</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">DOM → CSSOM → Render Tree → Layout → Paint → Composite</text>

  <!-- 6 个步骤（横向） -->
  <g>
    <!-- 1. HTML → DOM -->
    <rect class="at-hover-card" x="20" y="100" width="80" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">HTML</text>
    <text x="60" y="145" text-anchor="middle" font-size="10" fill="#1e40af">DOM Tree</text>

    <line x1="100" y1="130" x2="120" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 2. CSS → CSSOM -->
    <rect class="at-hover-card" x="120" y="100" width="80" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="160" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">CSS</text>
    <text x="160" y="145" text-anchor="middle" font-size="10" fill="#5b21b6">CSSOM</text>

    <line x1="200" y1="130" x2="220" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 3. Render Tree -->
    <rect class="at-hover-card" x="220" y="100" width="80" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="260" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Render</text>
    <text x="260" y="145" text-anchor="middle" font-size="10" fill="#065f46">Tree</text>

    <line x1="300" y1="130" x2="320" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 4. Layout -->
    <rect class="at-hover-card" x="320" y="100" width="80" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Layout</text>
    <text x="360" y="145" text-anchor="middle" font-size="10" fill="#92400e">回流</text>

    <line x1="400" y1="130" x2="420" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 5. Paint -->
    <rect class="at-hover-card" x="420" y="100" width="80" height="60" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="460" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">Paint</text>
    <text x="460" y="145" text-anchor="middle" font-size="10" fill="#9d174d">重绘</text>

    <line x1="500" y1="130" x2="520" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 6. Composite -->
    <rect class="at-hover-card" x="520" y="100" width="80" height="60" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="560" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">Composite</text>
    <text x="560" y="145" text-anchor="middle" font-size="10" fill="#6b21a8">合成</text>
  </g>

  <!-- 关键性能指标 (Web Vitals) -->
  <g>
    <rect class="at-hover-card" x="20" y="200" width="560" height="120" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <text x="40" y="225" font-size="13" font-weight="700" fill="#1e293b">⚡ Core Web Vitals 性能指标</text>

    <text x="40" y="255" font-size="11" fill="#1e293b">
      <tspan font-weight="700" fill="#059669">LCP</tspan>
      <tspan dx="6">Largest Contentful Paint</tspan>
      <tspan dx="20" font-weight="700" fill="#059669">&lt; 2.5s</tspan>
    </text>
    <text x="40" y="275" font-size="11" fill="#1e293b">
      <tspan font-weight="700" fill="#059669">INP</tspan>
      <tspan dx="14">Interaction to Next Paint</tspan>
      <tspan dx="20" font-weight="700" fill="#059669">&lt; 200ms</tspan>
    </text>
    <text x="40" y="295" font-size="11" fill="#1e293b">
      <tspan font-weight="700" fill="#059669">CLS</tspan>
      <tspan dx="14">Cumulative Layout Shift</tspan>
      <tspan dx="20" font-weight="700" fill="#059669">&lt; 0.1</tspan>
    </text>
  </g>

  <!-- 优化技巧 -->
  <text x="40" y="345" font-size="10" font-weight="700" fill="#7c3aed">💡 优化提示：</text>
  <text x="40" y="365" font-size="10" fill="#475569">
    <tspan>• CSS 放 head · JS 放 body 底  ·  关键 CSS inline</tspan>
  </text>
  <text x="40" y="383" font-size="10" fill="#475569">
    <tspan>• transform / opacity 触发 GPU 合成 · 避开 layout 触发</tspan>
  </text>

  <text x="300" y="400" text-anchor="middle" font-size="10" fill="#64748b" dy="-10">§8.72+ v6 · frontend</text>
</svg>
