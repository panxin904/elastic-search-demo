<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Chaos Mesh 架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Controller Manager · Chaos Daemon · Sidecar · CRD 驱动</text>

  <!-- Control Plane -->
  <g>
    <rect x="30" y="85" width="540" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Control Plane（控制平面）</text>

    <rect x="50" y="125" width="120" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="110" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">ControllerManager</text>
    <text x="110" y="163" text-anchor="middle" font-size="9" fill="#475569">CRD 监听</text>
    <text x="110" y="180" text-anchor="middle" font-size="9" fill="#475569">调度器</text>

    <rect x="185" y="125" width="120" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="245" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Chaos Dashboard</text>
    <text x="245" y="163" text-anchor="middle" font-size="9" fill="#475569">Web UI</text>
    <text x="245" y="180" text-anchor="middle" font-size="9" fill="#475569">/ 编排</text>

    <rect x="320" y="125" width="120" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="380" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Chaosctl</text>
    <text x="380" y="163" text-anchor="middle" font-size="9" fill="#475569">CLI</text>
    <text x="380" y="180" text-anchor="middle" font-size="9" fill="#475569">命令行</text>

    <rect x="455" y="125" width="100" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="505" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">CRD 资源</text>
    <text x="505" y="170" text-anchor="middle" font-size="9" fill="#475569">PodChaos</text>
    <text x="505" y="184" text-anchor="middle" font-size="9" fill="#475569">NetworkChaos</text>
  </g>

  <!-- Worker Node -->
  <g>
    <rect x="30" y="225" width="260" height="195" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="160" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Worker Node 1</text>

    <rect x="50" y="265" width="220" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="160" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Chaos Daemon（DaemonSet）</text>
    <text x="160" y="302" text-anchor="middle" font-size="9" fill="#475569">特权 Pod · 调用 tc / iptables</text>

    <rect x="50" y="325" width="100" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="100" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">App Pod 1</text>
    <circle cx="100" cy="365" r="12" fill="#fee2e2" stroke="#ef4444"/>
    <text x="100" y="370" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">注入</text>
    <text x="100" y="395" text-anchor="middle" font-size="9" fill="#475569">业务容器</text>

    <rect x="170" y="325" width="100" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="220" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">App Pod 2</text>
    <text x="220" y="395" text-anchor="middle" font-size="9" fill="#475569">业务容器</text>
  </g>

  <!-- Worker Node 2 -->
  <g>
    <rect x="310" y="225" width="260" height="195" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="440" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Worker Node 2</text>

    <rect x="330" y="265" width="220" height="50" rx="6" fill="white" stroke="#10b981"/>
    <text x="440" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Chaos Daemon（DaemonSet）</text>
    <text x="440" y="302" text-anchor="middle" font-size="9" fill="#475569">特权 Pod · 调用 tc / iptables</text>

    <rect x="330" y="325" width="100" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="380" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">App Pod 3</text>
    <text x="380" y="395" text-anchor="middle" font-size="9" fill="#475569">业务容器</text>

    <rect x="450" y="325" width="100" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="500" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">App Pod 4</text>
    <circle cx="500" cy="365" r="12" fill="#fee2e2" stroke="#ef4444"/>
    <text x="500" y="370" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">注入</text>
    <text x="500" y="395" text-anchor="middle" font-size="9" fill="#475569">业务容器</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M160,205 L160,265"/>
    <path d="M440,205 L440,265"/>
    <path d="M160,315 L160,325"/>
    <path d="M440,315 L440,325"/>
  </g>

  <g font-size="10" fill="#64748b">
    <rect x="30" y="435" width="540" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4"/>
    <text x="50" y="455">⚡ 注入原理：Daemon 通过 eBPF / tc-netem / nftables 操控 Pod 网络与 IO；CRD 触发后按 selector 选目标 Pod</text>
  </g>
</svg>
