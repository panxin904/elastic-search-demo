<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Elasticsearch Bulk 批量写入</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">NDJSON 协议 · 5-15MB batch · 减少网络往返</text>

  <!-- 单条写入 vs 批量对比 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 单条 vs 批量（性能差距 10-100x）</text>

    <rect class="at-hover-card" x="40" y="100" width="260" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="170" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">❌ 单条写入（慢）</text>
    <text x="55" y="142" font-size="10" fill="#475569">POST /_doc  →  1 次 HTTP</text>
    <text x="55" y="158" font-size="10" fill="#475569">POST /_doc  →  1 次 HTTP</text>
    <text x="55" y="174" font-size="10" fill="#475569">POST /_doc  →  1 次 HTTP</text>
    <text x="55" y="190" font-size="10" fill="#dc2626">1000 次往返 = 网络瓶颈</text>

    <rect class="at-hover-card" x="310" y="100" width="250" height="100" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">✅ Bulk 批量（快）</text>
    <text x="325" y="142" font-size="10" fill="#475569">POST /_bulk → 1 次 HTTP</text>
    <text x="325" y="158" font-size="10" fill="#475569">1000 条文档一次性提交</text>
    <text x="325" y="174" font-size="10" fill="#475569">ES 内部串行处理</text>
    <text x="435" y="190" text-anchor="middle" font-size="10" fill="#10b981">吞吐量提升 10-100x</text>
  </g>

  <!-- NDJSON 协议 -->
  <g>
    <text x="50" y="230" font-size="13" font-weight="700" fill="#1e293b">② NDJSON 协议（每行一个 JSON）</text>

    <rect class="at-hover-card" x="40" y="240" width="520" height="105" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="262" font-size="10" font-weight="700" fill="#10b981">POST /_bulk</text>
    <text x="55" y="278" font-size="10" fill="#e2e8f0" font-family="monospace">{ "index" : { "_index" : "logs", "_id" : "1" } }</text>
    <text x="55" y="294" font-size="10" fill="#e2e8f0" font-family="monospace">{ "user" : "alice", "action" : "login", "ts" : 1693824000 }</text>
    <text x="55" y="310" font-size="10" fill="#e2e8f0" font-family="monospace">{ "index" : { "_index" : "logs", "_id" : "2" } }</text>
    <text x="55" y="326" font-size="10" fill="#e2e8f0" font-family="monospace">{ "user" : "bob",   "action" : "click", "ts" : 1693824060 }</text>
    <text x="55" y="340" font-size="9" fill="#94a3b8">// 每两行一组：第 1 行 action + meta，第 2 行 doc 主体</text>
  </g>

  <!-- Batch size 调优 -->
  <g>
    <text x="50" y="375" font-size="13" font-weight="700" fill="#1e293b">③ Batch Size 调优（甜区 5-15MB）</text>

    <rect class="at-hover-card" x="40" y="385" width="160" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1-5 MB</text>
    <text x="120" y="418" text-anchor="middle" font-size="9" fill="#475569">请求频繁 · GC 压力</text>

    <rect class="at-hover-card" x="220" y="385" width="160" height="40" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">5-15 MB ⭐</text>
    <text x="300" y="418" text-anchor="middle" font-size="9" fill="#475569">性能甜区 · 推荐</text>

    <rect class="at-hover-card" x="400" y="385" width="160" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="480" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">15-100 MB</text>
    <text x="480" y="418" text-anchor="middle" font-size="9" fill="#475569">队列堆积 · 失败回滚</text>
  </g>

  <!-- 关键点 -->
  <text x="300" y="455" text-anchor="middle" font-size="10" fill="#64748b">💡 按字节调优（非文档数）· 监控 bulk.queue_size · 失败重试需指数退避</text>
  <text x="300" y="472" text-anchor="middle" font-size="10" fill="#10b981">📌 index buffer 默认 JVM 堆 10%，达到阈值触发 refresh</text>
</svg>
