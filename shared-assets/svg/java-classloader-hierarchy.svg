<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">Java ClassLoader 双亲委派</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">层级关系 · 委派顺序 · 可见性</text>

  <!-- 3 个 ClassLoader -->
  <rect class="at-hover-card" x="200" y="90" width="200" height="65" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="300" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Bootstrap ClassLoader</text>
  <text x="300" y="135" text-anchor="middle" font-size="10" fill="#334155">启动类加载器 · C++ 实现</text>
  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#475569">加载 JAVA_HOME/lib/rt.jar 等核心类</text>

  <rect class="at-hover-card" x="200" y="175" width="200" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Extension ClassLoader</text>
  <text x="300" y="220" text-anchor="middle" font-size="10" fill="#334155">扩展类加载器 · ExtClassLoader</text>
  <text x="300" y="235" text-anchor="middle" font-size="10" fill="#475569">加载 JAVA_HOME/lib/ext/</text>

  <rect class="at-hover-card" x="200" y="260" width="200" height="65" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="300" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Application ClassLoader</text>
  <text x="300" y="305" text-anchor="middle" font-size="10" fill="#334155">应用类加载器 · AppClassLoader</text>
  <text x="300" y="320" text-anchor="middle" font-size="10" fill="#475569">加载 classpath / -cp 指定路径</text>

  <rect class="at-hover-card" x="200" y="345" width="200" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Custom ClassLoader</text>
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#475569">继承 AppClassLoader · 自定义加载源</text>

  <!-- 箭头（父委派） -->
  <line x1="300" y1="155" x2="300" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="240" x2="300" y2="257" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="325" x2="300" y2="342" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 左侧说明 -->
  <rect x="40" y="90" width="140" height="310" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="110" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">双亲委派</text>
  <text x="50" y="140" font-size="10" fill="#334155">1. 收到加载请求</text>
  <text x="50" y="158" font-size="10" fill="#334155">2. 委托父加载器</text>
  <text x="50" y="176" font-size="10" fill="#334155">3. 父 → 祖父 → 根</text>
  <text x="50" y="194" font-size="10" fill="#334155">4. 根找不到才自己找</text>
  <text x="50" y="220" font-size="11" font-weight="700" fill="#1e293b">可见性：</text>
  <text x="50" y="238" font-size="10" fill="#334155">· 子可见父</text>
  <text x="50" y="256" font-size="10" fill="#334155">· 父不可见子</text>
  <text x="50" y="274" font-size="10" fill="#64748b" font-style="italic">同层不委派</text>
  <text x="50" y="300" font-size="11" font-weight="700" fill="#1e293b">打破场景：</text>
  <text x="50" y="318" font-size="10" fill="#334155">· Tomcat WebApp</text>
  <text x="50" y="336" font-size="10" fill="#334155">· JDBC SPI</text>
  <text x="50" y="354" font-size="10" fill="#334155">· 热部署/热加载</text>

  <!-- 右侧：loadClass 流程 -->
  <rect x="420" y="90" width="140" height="310" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="490" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">loadClass 流程</text>
  <text x="430" y="140" font-size="9" fill="#334155">if (parent != null) {</text>
  <text x="438" y="156" font-size="9" fill="#334155">parent.loadClass</text>
  <text x="430" y="174" font-size="9" fill="#334155">} else {</text>
  <text x="438" y="190" font-size="9" fill="#334155">bootstrap.find</text>
  <text x="430" y="206" font-size="9" fill="#334155">}</text>
  <text x="430" y="230" font-size="9" fill="#334155">if (found) return;</text>
  <text x="430" y="248" font-size="9" fill="#334155">// 自己 findClass</text>
  <text x="430" y="266" font-size="9" fill="#334155">byte[] → defineClass</text>

  <text x="430" y="298" font-size="10" font-weight="700" fill="#1e293b">缓存：</text>
  <text x="430" y="316" font-size="9" fill="#334155">已加载直接返回</text>
  <text x="430" y="334" font-size="9" fill="#334155">避免重复加载</text>
  <text x="430" y="352" font-size="9" fill="#64748b" font-style="italic">全盘负责 + 父类委托</text>

  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#475569">JVM 唯一性：同一个类加载器 + 同一个类 = 唯一 Class 对象</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#475569">不同加载器加载同名类 → Class 隔离 → 强转 ClassCastException</text>
</svg>
