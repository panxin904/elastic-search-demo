<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >K8s kube-scheduler 调度框架</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Predicates + Priorities · 2 阶段调度 · 扩展点机制</text>

  <!-- 两阶段调度 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 两阶段调度流程</text>

    <rect class="at-hover-card" x="40" y="105" width="520" height="120" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <!-- Pod 待调度 -->
    <rect class="at-hover-card" x="55" y="125" width="80" height="80" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="95" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Pod</text>
    <text x="95" y="166" text-anchor="middle" font-size="9" fill="#475569">未调度</text>
    <text x="95" y="184" text-anchor="middle" font-size="9" fill="#475569">spec.nodeName=空</text>

    <path d="M 135 165 L 175 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 过滤 -->
    <rect class="at-hover-card" x="175" y="125" width="155" height="80" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="252" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">① 过滤（Filter）</text>
    <text x="252" y="168" text-anchor="middle" font-size="9" fill="#475569">NodeResourcesFit</text>
    <text x="252" y="183" text-anchor="middle" font-size="9" fill="#475569">NodeSelector / Affinity</text>
    <text x="252" y="198" text-anchor="middle" font-size="9" fill="#475569">Taints / Tolerations</text>

    <path d="M 330 165 L 370 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 打分 -->
    <rect class="at-hover-card" x="370" y="125" width="175" height="80" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="457" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">② 打分（Score）</text>
    <text x="457" y="168" text-anchor="middle" font-size="9" fill="#475569">LeastAllocated (1-10)</text>
    <text x="457" y="183" text-anchor="middle" font-size="9" fill="#475569">BalancedAllocation</text>
    <text x="457" y="198" text-anchor="middle" font-size="9" fill="#475569">+ 自定义 Plugin</text>

    <text x="60" y="220" font-size="9" fill="#475569">过滤阶段排除不满足条件的 Node（粗筛），打分阶段对剩余 Node 评分（精选）</text>
  </g>

  <!-- 扩展点 -->
  <g>
    <text x="60" y="245" font-size="13" font-weight="700" fill="#1e293b">② Scheduler Framework 扩展点</text>

    <rect class="at-hover-card" x="40" y="258" width="520" height="135" rx="6" fill="#1e293b"/>

    <text x="55" y="278" font-size="10" font-family="monospace" fill="#a7f3d0">1. PreFilter   → 预处理（检查集群规模）</text>
    <text x="55" y="295" font-size="10" font-family="monospace" fill="#a7f3d0">2. Filter      → NodeName / PodFitsHost</text>
    <text x="55" y="312" font-size="10" font-family="monospace" fill="#a7f3d0">3. PostFilter  → 抢占逻辑</text>
    <text x="55" y="329" font-size="10" font-family="monospace" fill="#fde68a">4. PreScore    → 打分前信息收集</text>
    <text x="55" y="346" font-size="10" font-family="monospace" fill="#fde68a">5. Score       → 打分（独立计算 0-100）</text>
    <text x="55" y="363" font-size="10" font-family="monospace" fill="#a7f3d0">6. NormalizeScore → 多插件分数归一化</text>
    <text x="55" y="380" font-size="10" font-family="monospace" fill="#a7f3d0">7. Reserve     → 预留资源（再确认）</text>
    <text x="55" y="395" font-size="9" font-family="monospace" fill="#94a3b8">   Permit / PreBind / Bind / PostBind</text>
  </g>

  <!-- 绑定流程 -->
  <g>
    <text x="60" y="410" font-size="13" font-weight="700" fill="#1e293b">③ 绑定流程（异步乐观并发）</text>

    <rect class="at-hover-card" x="40" y="423" width="520" height="45" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="432" width="95" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="102" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">选最优 Node</text>

    <path d="M 150 446 L 180 446" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="180" y="432" width="115" height="28" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="237" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">BIND（spec.nodeName）</text>

    <path d="M 295 446 L 325 446" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="325" y="432" width="115" height="28" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="382" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">etcd 持久化</text>

    <path d="M 440 446 L 470 446" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="470" y="432" width="80" height="28" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="510" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">kubelet 启动</text>
  </g>
</svg>
