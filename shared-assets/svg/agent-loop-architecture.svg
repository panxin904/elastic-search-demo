<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">AI Agent 循环架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">ReAct · Planning · Memory · 4 步循环</text>

  <!-- ReAct 循环 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① ReAct 循环（4 步重复）</text>

    <rect class="at-hover-card" x="40" y="100" width="125" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="102" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1. Thought</text>
    <text x="102" y="142" text-anchor="middle" font-size="9" fill="#475569">思考</text>
    <text x="102" y="160" text-anchor="middle" font-size="9" fill="#3b82f6">LLM 推理</text>

    <path d="M165,140 L195,140" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="195" y="100" width="125" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="257" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">2. Action</text>
    <text x="257" y="142" text-anchor="middle" font-size="9" fill="#475569">行动</text>
    <text x="257" y="160" text-anchor="middle" font-size="9" fill="#10b981">调工具/API</text>

    <path d="M320,140 L350,140" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="350" y="100" width="125" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="412" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3. Observation</text>
    <text x="412" y="142" text-anchor="middle" font-size="9" fill="#475569">观察</text>
    <text x="412" y="160" text-anchor="middle" font-size="9" fill="#f59e0b">获取结果</text>

    <path d="M475,140 L505,140" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="505" y="100" width="55" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="532" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">4.</text>
    <text x="532" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Final</text>
    <text x="532" y="160" text-anchor="middle" font-size="9" fill="#475569">最终</text>
    <text x="532" y="174" text-anchor="middle" font-size="9" fill="#8b5cf6">答案</text>

    <path d="M505,165 L505,230 L102,230 L102,180" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="305" y="222" text-anchor="middle" font-size="9" fill="#64748b">循环</text>
  </g>

  <!-- 4 个核心组件 -->
  <g>
    <text x="50" y="265" font-size="13" font-weight="700" fill="#1e293b">② 4 个核心组件</text>

    <rect class="at-hover-card" x="40" y="275" width="125" height="105" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="102" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Memory</text>
    <text x="55" y="318" font-size="9" fill="#475569">短期：上下文窗口</text>
    <text x="55" y="334" font-size="9" fill="#475569">长期：向量数据库</text>
    <text x="55" y="350" font-size="9" fill="#475569">情景：trajectory</text>
    <text x="55" y="366" font-size="9" fill="#10b981">跨对话持久</text>

    <rect class="at-hover-card" x="175" y="275" width="125" height="105" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="237" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Planning</text>
    <text x="190" y="318" font-size="9" fill="#475569">任务分解</text>
    <text x="190" y="334" font-size="9" fill="#475569">CoT 思维链</text>
    <text x="190" y="350" font-size="9" fill="#475569">Sub-task 排序</text>
    <text x="190" y="366" font-size="9" fill="#3b82f6">Replan 失败重试</text>

    <rect class="at-hover-card" x="310" y="275" width="125" height="105" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="372" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Tools</text>
    <text x="325" y="318" font-size="9" fill="#475569">Function call</text>
    <text x="325" y="334" font-size="9" fill="#475569">MCP / OpenAPI</text>
    <text x="325" y="350" font-size="9" fill="#475569">浏览器/代码执行</text>
    <text x="325" y="366" font-size="9" fill="#f59e0b">沙箱隔离执行</text>

    <rect class="at-hover-card" x="445" y="275" width="115" height="105" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="502" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Reflection</text>
    <text x="460" y="318" font-size="9" fill="#475569">自我评估</text>
    <text x="460" y="334" font-size="9" fill="#475569">错误重试</text>
    <text x="460" y="350" font-size="9" fill="#475569">Critic 评估</text>
    <text x="460" y="366" font-size="9" fill="#8b5cf6">提高鲁棒性</text>
  </g>

  <!-- 实战框架 -->
  <g>
    <text x="50" y="405" font-size="13" font-weight="700" fill="#1e293b">③ 主流 Agent 框架</text>

    <rect class="at-hover-card" x="40" y="415" width="520" height="50" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="437" font-size="10" font-weight="700" fill="#10b981">LangGraph</text>
    <text x="135" y="437" font-size="10" fill="#e2e8f0">图结构编排 + checkpoint 持久化</text>
    <text x="345" y="437" font-size="10" font-weight="700" fill="#10b981">AutoGen</text>
    <text x="420" y="437" font-size="10" fill="#e2e8f0">多 Agent 对话</text>
    <text x="55" y="454" font-size="10" font-weight="700" fill="#10b981">CrewAI</text>
    <text x="120" y="454" font-size="10" fill="#e2e8f0">角色协作（role/goal/backstory）</text>
    <text x="330" y="454" font-size="10" font-weight="700" fill="#10b981">Dify/Coze</text>
    <text x="410" y="454" font-size="10" fill="#e2e8f0">可视化编排（低代码）</text>
  </g>
</svg>
