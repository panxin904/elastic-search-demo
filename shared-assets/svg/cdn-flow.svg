<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >CDN 内容分发网络</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">边缘节点 · 智能调度 · 缓存策略</text>

  <!-- 源站 -->
  <rect x="40" y="220" width="100" height="40" rx="6" fill="#3b82f6" opacity="0.9"/>
  <text x="90" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="white">源站</text>

  <!-- DNS 调度 -->
  <rect x="200" y="220" width="100" height="40" rx="6" fill="#10b981" opacity="0.9"/>
  <text x="250" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="white">DNS 调度</text>

  <!-- 用户 -->
  <g font-size="11" font-weight="700">
    <rect x="430" y="100" width="120" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="490" y="125" text-anchor="middle" fill="white">用户 · 北京</text>

    <rect x="430" y="160" width="120" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="490" y="185" text-anchor="middle" fill="white">用户 · 上海</text>

    <rect x="430" y="220" width="120" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="490" y="245" text-anchor="middle" fill="white">用户 · 广州</text>

    <rect x="430" y="280" width="120" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="490" y="305" text-anchor="middle" fill="white">用户 · 成都</text>
  </g>

  <!-- 边缘节点 4 个 -->
  <g font-size="11" font-weight="700">
    <rect x="320" y="100" width="100" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="370" y="125" text-anchor="middle" fill="white">边缘 BJ</text>

    <rect x="320" y="160" width="100" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="370" y="185" text-anchor="middle" fill="white">边缘 SH</text>

    <rect x="320" y="220" width="100" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="370" y="245" text-anchor="middle" fill="white">边缘 GZ</text>

    <rect x="320" y="280" width="100" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="370" y="305" text-anchor="middle" fill="white">边缘 CD</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="240" x2="200" y2="240"/>
  </g>
  <g stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="220" x2="320" y2="120"/>
    <line x1="300" y1="225" x2="320" y2="180"/>
    <line x1="300" y1="240" x2="320" y2="240"/>
    <line x1="300" y1="255" x2="320" y2="300"/>
  </g>
  <g stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="420" y1="120" x2="430" y2="120"/>
    <line x1="420" y1="180" x2="430" y2="180"/>
    <line x1="420" y1="240" x2="430" y2="240"/>
    <line x1="420" y1="300" x2="430" y2="300"/>
  </g>

  <!-- 关键点 -->
  <g font-size="11">
    <rect x="40" y="360" width="520" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="380" text-anchor="middle" font-weight="700" fill="#1e293b">核心机制</text>
    <text x="60" y="402" fill="#475569">✓ 智能 DNS：GeoIP / Anycast · 解析到最近边缘</text>
    <text x="60" y="420" fill="#475569">✓ 缓存策略：Cache-Control / ETag / 304 · TTL 分层</text>
    <text x="60" y="438" fill="#475569">✓ 回源：边缘未命中 → 回源站 · 主动预热（Warmup）</text>
    <text x="320" y="402" fill="#475569">✓ 动静分离：静态 CDN 加速 · 动态走专线</text>
    <text x="320" y="420" fill="#475569">✓ 安全：防 DDoS / WAF / HTTPS 卸载</text>
    <text x="320" y="438" fill="#475569">✓ 厂商：阿里云 / 酷盾 / Cloudflare / Akamai</text>
  </g>
</svg>
