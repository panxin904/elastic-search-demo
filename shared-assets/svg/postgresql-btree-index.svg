<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">PostgreSQL B-Tree 索引结构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">多路平衡树 · 默认索引类型 · O(log n) 查找</text>

  <!-- 根节点 -->
  <rect class="at-hover-card" x="220" y="90" width="160" height="55" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">根 Root</text>
  <text x="300" y="132" text-anchor="middle" font-size="10" fill="#475569">[ 50 | 100 ]</text>

  <!-- 内部节点 -->
  <rect class="at-hover-card" x="80" y="180" width="140" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">内部 Branch</text>
  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#475569">[ 10 | 30 | 50 ]</text>

  <rect class="at-hover-card" x="240" y="180" width="140" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">内部 Branch</text>
  <text x="310" y="222" text-anchor="middle" font-size="10" fill="#475569">[ 60 | 80 | 100 ]</text>

  <rect class="at-hover-card" x="400" y="180" width="140" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">内部 Branch</text>
  <text x="470" y="222" text-anchor="middle" font-size="10" fill="#475569">[ 110 | 130 | 150 ]</text>

  <!-- 叶子节点（含 heap pointer） -->
  <rect class="at-hover-card" x="50" y="280" width="100" height="70" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="100" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Leaf 1</text>
  <text x="100" y="320" text-anchor="middle" font-size="9" fill="#334155">[1,5,10]</text>
  <text x="100" y="336" text-anchor="middle" font-size="9" fill="#64748b">→ heap</text>

  <rect class="at-hover-card" x="160" y="280" width="100" height="70" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="210" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Leaf 2</text>
  <text x="210" y="320" text-anchor="middle" font-size="9" fill="#334155">[20,30,40]</text>
  <text x="210" y="336" text-anchor="middle" font-size="9" fill="#64748b">→ heap</text>

  <rect class="at-hover-card" x="270" y="280" width="100" height="70" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Leaf 3</text>
  <text x="320" y="320" text-anchor="middle" font-size="9" fill="#334155">[50,55,60]</text>
  <text x="320" y="336" text-anchor="middle" font-size="9" fill="#64748b">→ heap</text>

  <rect class="at-hover-card" x="380" y="280" width="100" height="70" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="430" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Leaf 4</text>
  <text x="430" y="320" text-anchor="middle" font-size="9" fill="#334155">[70,80,90]</text>
  <text x="430" y="336" text-anchor="middle" font-size="9" fill="#64748b">→ heap</text>

  <rect class="at-hover-card" x="490" y="280" width="80" height="70" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="530" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Leaf 5</text>
  <text x="530" y="320" text-anchor="middle" font-size="9" fill="#334155">[100,...]</text>

  <!-- 边 -->
  <line x1="270" y1="145" x2="150" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="145" x2="310" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <line x1="330" y1="145" x2="470" y2="180" stroke="#64748b" stroke-width="1.5"/>

  <line x1="120" y1="235" x2="100" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <line x1="150" y1="235" x2="210" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="235" x2="320" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <line x1="280" y1="235" x2="430" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <line x1="310" y1="235" x2="530" y2="280" stroke="#64748b" stroke-width="1.5"/>

  <!-- 叶子链表（双向） -->
  <line x1="150" y1="315" x2="160" y2="315" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="315" x2="270" y2="315" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="315" x2="380" y2="315" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="315" x2="490" y2="315" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="370" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">叶子节点双向链表 — 支持 ORDER BY / 范围扫描</text>

  <!-- 关键属性 -->
  <rect x="40" y="390" width="520" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="300" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">关键属性</text>
  <text x="60" y="432" font-size="10" fill="#334155">· 默认索引类型（CREATE INDEX 不带 USING）</text>
  <text x="60" y="450" font-size="10" fill="#334155">· 多版本：MVCC 索引项包含 t_xmin/t_xmax，处理更新不重建</text>
  <text x="320" y="432" font-size="10" fill="#334155">· 复合索引：列顺序遵循最左前缀</text>
  <text x="320" y="450" font-size="10" fill="#334155">· 索引膨胀：DELETE 不立刻回收，HOT update 绕过</text>
</svg>
