<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Elasticsearch Cluster 状态机</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">GREEN/YELLOW/RED 触发条件 · 主分片 vs 副本分片 · 分配决策</text>

  <!-- 三状态示意 -->
  <g>
    <!-- GREEN -->
    <rect class="at-hover-card" x="40" y="90" width="165" height="100" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="122" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">GREEN（绿）</text>
    <text x="60" y="138" font-size="11" font-weight="700" fill="#10b981">✓ 健康</text>
    <text x="60" y="155" font-size="10" fill="#475569">所有主+副本分片</text>
    <text x="60" y="170" font-size="10" fill="#475569">正常分配</text>
    <text x="60" y="185" font-size="10" fill="#475569">写入/查询不受限</text>

    <!-- YELLOW -->
    <rect class="at-hover-card" x="220" y="90" width="165" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="302" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">YELLOW（黄）</text>
    <text x="240" y="138" font-size="11" font-weight="700" fill="#f59e0b">⚠ 警告</text>
    <text x="240" y="155" font-size="10" fill="#475569">主分片正常</text>
    <text x="240" y="170" font-size="10" fill="#475569">部分副本未分配</text>
    <text x="240" y="185" font-size="10" fill="#475569">查询正常，写入有风险</text>

    <!-- RED -->
    <rect class="at-hover-card" x="400" y="90" width="165" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="482" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">RED（红）</text>
    <text x="420" y="138" font-size="11" font-weight="700" fill="#dc2626">✗ 异常</text>
    <text x="420" y="155" font-size="10" fill="#475569">至少一个主分片</text>
    <text x="420" y="170" font-size="10" fill="#475569">未分配</text>
    <text x="420" y="185" font-size="10" fill="#475569">该索引数据部分丢失</text>
  </g>

  <!-- 状态转换 -->
  <g>
    <text x="60" y="215" font-size="13" font-weight="700" fill="#1e293b">状态转换触发条件</text>

    <!-- GREEN → YELLOW -->
    <line x1="205" y1="140" x2="220" y2="140" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="212" y="135" text-anchor="middle" font-size="9" fill="#92400e">节点宕机</text>
    <text x="212" y="148" text-anchor="middle" font-size="9" fill="#92400e">副本未补</text>

    <!-- YELLOW → GREEN -->
    <line x1="220" y1="155" x2="205" y2="155" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)" stroke-dasharray="3"/>
    <text x="212" y="170" text-anchor="middle" font-size="9" fill="#065f46">副本恢复</text>

    <!-- YELLOW → RED -->
    <line x1="385" y1="125" x2="400" y2="125" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
    <text x="392" y="118" text-anchor="middle" font-size="9" fill="#7f1d1d">主宕+无副本</text>
    <text x="392" y="130" text-anchor="middle" font-size="9" fill="#7f1d1d">可升主</text>

    <!-- RED → YELLOW -->
    <line x1="400" y1="155" x2="385" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3"/>
    <text x="392" y="148" text-anchor="middle" font-size="9" fill="#92400e">副本补齐</text>
  </g>

  <!-- 分配决策矩阵 -->
  <g>
    <text x="60" y="255" font-size="13" font-weight="700" fill="#1e293b">分配决策（Allocation Deciders）</text>

    <rect class="at-hover-card" x="40" y="270" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>

    <text x="60" y="290" font-size="10" fill="#475569">• <tspan font-weight="700">same_shard</tspan>：主副本不放同节点</text>
    <text x="60" y="305" font-size="10" fill="#475569">• <tspan font-weight="700">disk_threshold</tspan>：磁盘水位 low/high/flood_stage</text>
    <text x="60" y="320" font-size="10" fill="#475569">• <tspan font-weight="700">shard_size</tspan>：cluster.routing.allocation.balance.shard</text>
    <text x="60" y="335" font-size="10" fill="#475569">• <tspan font-weight="700">awareness</tspan>：zone/rack 维度分配</text>
    <text x="60" y="350" font-size="10" fill="#475569">• <tspan font-weight="700">enable</tspan>：allocation.enabled（none/primaries/new_primaries/all）</text>
    <text x="60" y="365" font-size="10" fill="#475569">• <tspan font-weight="700">filter</tspan>：include/exclude by IP/host</text>
  </g>

  <!-- 排查流程 -->
  <g>
    <text x="60" y="395" font-size="13" font-weight="700" fill="#1e293b">YELLOW 排查流程</text>

    <rect class="at-hover-card" x="40" y="410" width="525" height="55" rx="6" fill="#1f2937"/>
    <text x="60" y="432" font-size="11" font-family="monospace" fill="#86efac">GET _cluster/allocation/explain   # 解释为什么某分片未分配</text>
    <text x="60" y="450" font-size="11" font-family="monospace" fill="#a5f3fc">GET _cat/shards?h=index,shard,prirep,state,node,unassigned.reason</text>
  </g>
</svg>
