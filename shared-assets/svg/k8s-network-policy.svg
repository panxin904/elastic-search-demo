<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Kubernetes NetworkPolicy</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">命名空间级流量控制 · 白名单 · 依赖 CNI 插件</text>

  <!-- 默认策略 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 默认 vs NetworkPolicy 行为对比</text>

    <rect class="at-hover-card" x="40" y="105" width="250" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="165" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">默认（无 NetworkPolicy）</text>
    <text x="55" y="148" font-size="10" fill="#475569">• Pod 接受所有入站流量</text>
    <text x="55" y="164" font-size="10" fill="#475569">• 可发往所有出站</text>
    <text x="55" y="180" font-size="10" fill="#475569">• Pod 间全互通</text>
    <text x="55" y="196" font-size="10" fill="#dc2626">⚠️ 零信任场景不够安全</text>

    <rect class="at-hover-card" x="310" y="105" width="250" height="100" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">启用 NetworkPolicy 后</text>
    <text x="325" y="148" font-size="10" fill="#475569">• 默认拒绝（白名单）</text>
    <text x="325" y="164" font-size="10" fill="#475569">• 显式 allow 才放行</text>
    <text x="325" y="180" font-size="10" fill="#475569">• 需配合 CNI（Calico/Cilium）</text>
    <text x="325" y="196" font-size="10" fill="#065f46">✅ 零信任 / 微隔离</text>
  </g>

  <!-- 流量方向 -->
  <g>
    <text x="60" y="225" font-size="13" font-weight="700" fill="#1e293b">② 4 类规则（按方向）</text>

    <rect class="at-hover-card" x="40" y="240" width="120" height="80" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="100" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Ingress</text>
    <text x="100" y="282" text-anchor="middle" font-size="9" fill="#475569">入站白名单</text>
    <text x="100" y="300" text-anchor="middle" font-size="9" fill="#475569">谁能访问我</text>

    <rect class="at-hover-card" x="170" y="240" width="120" height="80" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="230" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Egress</text>
    <text x="230" y="282" text-anchor="middle" font-size="9" fill="#475569">出站白名单</text>
    <text x="230" y="300" text-anchor="middle" font-size="9" fill="#475569">我能访问谁</text>

    <rect class="at-hover-card" x="300" y="240" width="120" height="80" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="360" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">policyTypes</text>
    <text x="360" y="282" text-anchor="middle" font-size="9" fill="#475569">策略类型</text>
    <text x="360" y="300" text-anchor="middle" font-size="9" fill="#475569">Ingress/Egress</text>

    <rect class="at-hover-card" x="430" y="240" width="130" height="80" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="495" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">podSelector</text>
    <text x="495" y="282" text-anchor="middle" font-size="9" fill="#475569">作用范围</text>
    <text x="495" y="300" text-anchor="middle" font-size="9" fill="#475569">按 label 选</text>
  </g>

  <!-- 示例拓扑 -->
  <g>
    <text x="60" y="340" font-size="13" font-weight="700" fill="#1e293b">③ 示例：frontend → backend（白名单）</text>

    <rect class="at-hover-card" x="40" y="355" width="520" height="110" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <!-- Frontend -->
    <rect class="at-hover-card" x="60" y="375" width="100" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="110" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">frontend</text>
    <text x="110" y="412" text-anchor="middle" font-size="9" fill="#475569">app=ui</text>

    <path d="M 160 400 L 215 400" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="187" y="393" font-size="9" font-weight="700" fill="#065f46">allow</text>

    <!-- Backend -->
    <rect class="at-hover-card" x="215" y="375" width="100" height="50" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="265" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">backend</text>
    <text x="265" y="412" text-anchor="middle" font-size="9" fill="#475569">app=api</text>

    <!-- DB -->
    <rect class="at-hover-card" x="370" y="375" width="100" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="420" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">database</text>
    <text x="420" y="412" text-anchor="middle" font-size="9" fill="#475569">app=db</text>

    <!-- 阻断线 -->
    <path d="M 315 400 L 370 400" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="342" y="393" font-size="9" font-weight="700" fill="#dc2626">deny</text>

    <!-- frontend->db deny -->
    <path d="M 110 425 L 420 440" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="265" y="453" font-size="9" font-weight="700" fill="#dc2626">frontend→database ❌ 拒绝（必须经 backend）</text>
  </g>
</svg>
