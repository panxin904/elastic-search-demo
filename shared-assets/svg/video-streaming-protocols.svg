<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">流媒体协议对比</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">按延迟 × 场景选型 · 直播 / 点播 / 实时通信</text>

  <!-- 横轴延迟 -->
  <line x1="80" y1="340" x2="540" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="360" font-size="10" fill="#64748b" text-anchor="middle">实时</text>
  <text x="200" y="360" font-size="10" fill="#64748b" text-anchor="middle">亚秒</text>
  <text x="320" y="360" font-size="10" fill="#64748b" text-anchor="middle">3-10s</text>
  <text x="440" y="360" font-size="10" fill="#64748b" text-anchor="middle">10-30s</text>
  <text x="540" y="360" font-size="10" fill="#64748b" text-anchor="middle">点播</text>
  <text x="300" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">延迟（端到端）</text>

  <!-- 4 个协议 -->
  <g>
    <!-- WebRTC -->
    <rect x="60" y="100" width="80" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="100" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">WebRTC</text>
    <text x="100" y="145" text-anchor="middle" font-size="10" fill="#7f1d1d">&lt; 500ms</text>
    <text x="100" y="165" text-anchor="middle" font-size="9" fill="#64748b">实时通信</text>

    <!-- SRT -->
    <rect x="170" y="100" width="80" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="210" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">SRT</text>
    <text x="210" y="145" text-anchor="middle" font-size="10" fill="#92400e">~ 1s</text>
    <text x="210" y="165" text-anchor="middle" font-size="9" fill="#64748b">专业直播</text>

    <!-- RTMP -->
    <rect x="280" y="100" width="80" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="320" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">RTMP</text>
    <text x="320" y="145" text-anchor="middle" font-size="10" fill="#1e40af">~ 3s</text>
    <text x="320" y="165" text-anchor="middle" font-size="9" fill="#64748b">传统直播</text>

    <!-- HLS -->
    <rect x="390" y="100" width="80" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="430" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">HLS</text>
    <text x="430" y="145" text-anchor="middle" font-size="10" fill="#065f46">10-30s</text>
    <text x="430" y="165" text-anchor="middle" font-size="9" fill="#64748b">点播+直播</text>

    <!-- DASH -->
    <rect x="500" y="100" width="80" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="540" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">DASH</text>
    <text x="540" y="145" text-anchor="middle" font-size="10" fill="#5b21b6">10-30s</text>
    <text x="540" y="165" text-anchor="middle" font-size="9" fill="#64748b">自适应码率</text>
  </g>

  <!-- 关键场景说明 -->
  <g>
    <rect x="60" y="220" width="240" height="80" rx="6" fill="#fff" stroke="#e2e8f0"/>
    <text x="80" y="245" font-size="11" font-weight="700" fill="#1e293b">⚡ 低延迟场景</text>
    <text x="80" y="265" font-size="10" fill="#475569">视频会议 · 互动直播 · 远程控制</text>
    <text x="80" y="285" font-size="10" fill="#475569">→ 选 WebRTC / SRT</text>

    <rect x="320" y="220" width="260" height="80" rx="6" fill="#fff" stroke="#e2e8f0"/>
    <text x="340" y="245" font-size="11" font-weight="700" fill="#1e293b">📺 高兼容场景</text>
    <text x="340" y="265" font-size="10" fill="#475569">移动端点播 · CDN 加速 · 多分辨率</text>
    <text x="340" y="285" font-size="10" fill="#475569">→ 选 HLS / DASH</text>
  </g>

  <text x="300" y="385" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v6 · video</text>
</svg>
