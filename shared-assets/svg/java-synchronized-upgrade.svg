<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">synchronized 锁升级路线</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">无锁 → 偏向 → 轻量级 → 重量级（不可逆）</text>

  <!-- 4 状态卡 -->
  <rect class="at-hover-card" x="30" y="90" width="125" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="92" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">① 无锁</text>
  <text x="92" y="138" text-anchor="middle" font-size="9" fill="#334155">Unlocked</text>
  <text x="40" y="160" font-size="9" fill="#334155">· 对象刚 new</text>
  <text x="40" y="178" font-size="9" fill="#334155">· 无竞争</text>
  <text x="40" y="200" font-size="9" fill="#64748b" font-style="italic">markword = hash</text>

  <rect class="at-hover-card" x="170" y="90" width="125" height="130" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="232" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">② 偏向锁</text>
  <text x="232" y="138" text-anchor="middle" font-size="9" fill="#334155">Biased</text>
  <text x="180" y="160" font-size="9" fill="#334155">· 单线程反复进入</text>
  <text x="180" y="178" font-size="9" fill="#334155">· CAS 写 thread id</text>
  <text x="180" y="200" font-size="9" fill="#64748b" font-style="italic">几乎零开销</text>

  <rect class="at-hover-card" x="310" y="90" width="125" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="372" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">③ 轻量级锁</text>
  <text x="372" y="138" text-anchor="middle" font-size="9" fill="#334155">Lightweight</text>
  <text x="320" y="160" font-size="9" fill="#334155">· 多线程交替进入</text>
  <text x="320" y="178" font-size="9" fill="#334155">· 自旋 CAS</text>
  <text x="320" y="200" font-size="9" fill="#64748b" font-style="italic">不阻塞用户态</text>

  <rect class="at-hover-card" x="450" y="90" width="125" height="130" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="512" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">④ 重量级锁</text>
  <text x="512" y="138" text-anchor="middle" font-size="9" fill="#334155">Heavyweight</text>
  <text x="460" y="160" font-size="9" fill="#334155">· 自旋超阈值</text>
  <text x="460" y="178" font-size="9" fill="#334155">· mutex 系统调用</text>
  <text x="460" y="200" font-size="9" fill="#64748b" font-style="italic">线程挂起/唤醒</text>

  <!-- 升级箭头 -->
  <line x1="155" y1="155" x2="170" y2="155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="295" y1="155" x2="310" y2="155" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="435" y1="155" x2="450" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 触发条件 -->
  <rect x="30" y="240" width="260" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="160" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">升级触发条件</text>
  <text x="50" y="282" font-size="10" fill="#334155">· 偏向 → 轻量：其他线程 CAS 抢锁</text>
  <text x="50" y="300" font-size="10" fill="#334155">· 轻量 → 重量：自旋次数 &gt; 10 或</text>
  <text x="60" y="316" font-size="10" fill="#334155">等待线程数 &gt; CPU 数 / 2</text>
  <text x="50" y="332" font-size="10" fill="#64748b" font-style="italic">注：JDK 15+ 默认关闭偏向锁 -XX:-UseBiasedLocking</text>

  <rect x="310" y="240" width="265" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="442" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">降级？</text>
  <text x="325" y="285" font-size="10" fill="#334155">· 重量级锁退出后</text>
  <text x="325" y="305" font-size="10" fill="#334155">· 直接变为「无锁」状态</text>
  <text x="325" y="325" font-size="10" fill="#dc2626" font-style="italic">不能反向降级回轻量/偏向</text>

  <!-- MarkWord 示意 -->
  <rect x="30" y="360" width="545" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="300" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">对象头 MarkWord（64 位）状态</text>
  <rect x="50" y="395" width="120" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="110" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">01 hash age 0</text>
  <text x="110" y="446" text-anchor="middle" font-size="9" fill="#475569">无锁</text>

  <rect x="180" y="395" width="120" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="240" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">101 thread epoch age</text>
  <text x="240" y="446" text-anchor="middle" font-size="9" fill="#1e40af">偏向锁</text>

  <rect x="310" y="395" width="120" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="370" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">00 ptr_to_lock_record</text>
  <text x="370" y="446" text-anchor="middle" font-size="9" fill="#92400e">轻量级锁</text>

  <rect x="440" y="395" width="125" height="35" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="502" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">10 ptr_to_heavyweight</text>
  <text x="502" y="446" text-anchor="middle" font-size="9" fill="#991b1b">重量级锁</text>
</svg>
