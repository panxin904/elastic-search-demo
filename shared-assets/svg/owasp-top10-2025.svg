<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">OWASP Top 10（2025 版）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Web 应用 10 大安全风险 · A01-A10 速览</text>

  <!-- Top 10 列表 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 10 大风险（按风险等级排序）</text>

    <rect class="at-hover-card" x="40" y="100" width="520" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="55" y="120" font-size="11" font-weight="700" fill="#991b1b">A01</text>
    <text x="95" y="120" font-size="11" fill="#1e293b">Broken Access Control 访问控制失效</text>
    <text x="450" y="120" font-size="9" fill="#dc2626">⭐ 最常见</text>

    <rect class="at-hover-card" x="40" y="132" width="520" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="55" y="152" font-size="11" font-weight="700" fill="#991b1b">A02</text>
    <text x="95" y="152" font-size="11" fill="#1e293b">Cryptographic Failures 加密失败</text>
    <text x="450" y="152" font-size="9" fill="#dc2626">弱算法/明文存储</text>

    <rect class="at-hover-card" x="40" y="164" width="520" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="55" y="184" font-size="11" font-weight="700" fill="#991b1b">A03</text>
    <text x="95" y="184" font-size="11" fill="#1e293b">Injection 注入（SQL/NoSQL/Command）</text>
    <text x="450" y="184" font-size="9" fill="#dc2626">OWASP 经典</text>

    <rect class="at-hover-card" x="40" y="196" width="520" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="216" font-size="11" font-weight="700" fill="#92400e">A04</text>
    <text x="95" y="216" font-size="11" fill="#1e293b">Insecure Design 不安全设计</text>
    <text x="450" y="216" font-size="9" fill="#f59e0b">架构层缺陷</text>

    <rect class="at-hover-card" x="40" y="228" width="520" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="248" font-size="11" font-weight="700" fill="#92400e">A05</text>
    <text x="95" y="248" font-size="11" fill="#1e293b">Security Misconfiguration 安全配置错误</text>
    <text x="450" y="248" font-size="9" fill="#f59e0b">默认密码/调试模式</text>

    <rect class="at-hover-card" x="40" y="260" width="520" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="55" y="280" font-size="11" font-weight="700" fill="#1e40af">A06</text>
    <text x="95" y="280" font-size="11" fill="#1e293b">Vulnerable Components 脆弱组件</text>
    <text x="450" y="280" font-size="9" fill="#3b82f6">依赖漏洞</text>

    <rect class="at-hover-card" x="40" y="292" width="520" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="55" y="312" font-size="11" font-weight="700" fill="#1e40af">A07</text>
    <text x="95" y="312" font-size="11" fill="#1e293b">Auth Failures 识别/认证失败</text>
    <text x="450" y="312" font-size="9" fill="#3b82f6">弱密码/会话</text>

    <rect class="at-hover-card" x="40" y="324" width="520" height="28" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="55" y="344" font-size="11" font-weight="700" fill="#047857">A08</text>
    <text x="95" y="344" font-size="11" fill="#1e293b">Software/Data Integrity 软件/数据完整性</text>
    <text x="450" y="344" font-size="9" fill="#10b981">CI/CD 供应链</text>

    <rect class="at-hover-card" x="40" y="356" width="520" height="28" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="55" y="376" font-size="11" font-weight="700" fill="#047857">A09</text>
    <text x="95" y="376" font-size="11" fill="#1e293b">Logging/Monitoring Failures 日志监控失效</text>
    <text x="450" y="376" font-size="9" fill="#10b981">看不见的攻击</text>

    <rect class="at-hover-card" x="40" y="388" width="520" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="55" y="408" font-size="11" font-weight="700" fill="#991b1b">A10</text>
    <text x="95" y="408" font-size="11" fill="#1e293b">SSRF 服务端请求伪造</text>
    <text x="450" y="408" font-size="9" fill="#dc2626">云时代高危</text>
  </g>

  <!-- 防御总则 -->
  <g>
    <rect class="at-hover-card" x="40" y="430" width="520" height="35" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="452" font-size="11" font-weight="700" fill="#10b981">💡 防御总原则：</text>
    <text x="150" y="452" font-size="10" fill="#e2e8f0">输入验证 + 输出编码 + 最小权限 + 纵深防御 + 默认安全 + 持续监控</text>
  </g>
</svg>
