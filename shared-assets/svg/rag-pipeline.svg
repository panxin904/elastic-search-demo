<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">RAG 检索增强生成流水线</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Query → Embedding → 向量检索 → Prompt 拼接 → LLM 生成</text>

  <!-- 流程 5 步骤 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 5 步核心流程（Inference 路径）</text>

    <rect class="at-hover-card" x="40" y="100" width="100" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1. Query</text>
    <text x="90" y="142" text-anchor="middle" font-size="9" fill="#475569">用户问题</text>
    <text x="90" y="160" text-anchor="middle" font-size="9" fill="#3b82f6">"Java GC?"</text>

    <path d="M140,140 L165,140" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="165" y="100" width="100" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="215" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">2. Embedding</text>
    <text x="215" y="142" text-anchor="middle" font-size="9" fill="#475569">向量化</text>
    <text x="215" y="160" text-anchor="middle" font-size="9" fill="#10b981">[0.12, 0.87,...]</text>

    <path d="M265,140 L290,140" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="290" y="100" width="100" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="340" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3. Retrieve</text>
    <text x="340" y="142" text-anchor="middle" font-size="9" fill="#475569">向量检索</text>
    <text x="340" y="160" text-anchor="middle" font-size="9" fill="#f59e0b">Top-K 文档</text>

    <path d="M390,140 L415,140" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="415" y="100" width="100" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="465" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">4. Prompt</text>
    <text x="465" y="142" text-anchor="middle" font-size="9" fill="#475569">拼接</text>
    <text x="465" y="160" text-anchor="middle" font-size="9" fill="#8b5cf6">context + q</text>

    <path d="M515,140 L535,140 L535,220 L520,220" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="415" y="220" width="100" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="465" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">5. LLM</text>
    <text x="465" y="262" text-anchor="middle" font-size="9" fill="#475569">生成</text>
    <text x="465" y="280" text-anchor="middle" font-size="9" fill="#dc2626">带源答案</text>

    <path d="M415,260 L140,260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="280" y="252" text-anchor="middle" font-size="9" fill="#64748b">流式响应</text>
  </g>

  <!-- 索引路径 -->
  <g>
    <text x="50" y="195" font-size="13" font-weight="700" fill="#1e293b">② 离线索引路径（文档 → 向量库）</text>

    <rect class="at-hover-card" x="40" y="350" width="125" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="102" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">原始文档</text>
    <text x="102" y="390" text-anchor="middle" font-size="9" fill="#475569">PDF/MD/HTML</text>
    <text x="102" y="404" text-anchor="middle" font-size="9" fill="#475569">+ 图片</text>

    <path d="M165,380 L195,380" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="195" y="350" width="135" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="262" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">分块 + Embed</text>
    <text x="262" y="390" text-anchor="middle" font-size="9" fill="#475569">chunk_size=500</text>
    <text x="262" y="404" text-anchor="middle" font-size="9" fill="#f59e0b">overlap=50</text>

    <path d="M330,380 L360,380" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="360" y="350" width="200" height="60" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="460" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">向量数据库</text>
    <text x="460" y="390" text-anchor="middle" font-size="9" fill="#475569">Milvus / Qdrant / Chroma / pgvector</text>
    <text x="460" y="404" text-anchor="middle" font-size="9" fill="#10b981">ANN 索引（HNSW/IVF）</text>

    <text x="50" y="425" font-size="11" fill="#475569">⚠️ 离线索引一次，反复查询；检索质量决定 RAG 答案上限</text>
  </g>

  <!-- 高级模式 -->
  <g>
    <text x="50" y="445" font-size="13" font-weight="700" fill="#1e293b">③ 高级模式</text>
    <text x="50" y="465" font-size="10" fill="#475569">Reranking（二次精排）+ Query Rewrite（多轮改写）+ Self-RAG（自检）+ Agentic RAG（多跳）</text>
  </g>
</svg>
