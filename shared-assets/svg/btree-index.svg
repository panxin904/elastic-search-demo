<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL B+Tree 索引</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">聚簇 / 二级索引 · 叶子节点链表 · 3-4 层树高</text>

  <!-- 根节点 -->
  <g font-size="11" font-weight="700">
    <rect x="190" y="100" width="220" height="55" rx="6" fill="#3b82f6" opacity="0.95"/>
    <text x="300" y="120" text-anchor="middle" fill="white">根节点（内存常驻）</text>
    <g font-size="10" font-weight="700" fill="white">
      <rect x="200" y="130" width="50" height="22" rx="3" fill="#1e40af"/>
      <text x="225" y="145" text-anchor="middle">&lt; 50</text>

      <rect x="255" y="130" width="50" height="22" rx="3" fill="#1e40af"/>
      <text x="280" y="145" text-anchor="middle">50-100</text>

      <rect x="310" y="130" width="50" height="22" rx="3" fill="#1e40af"/>
      <text x="335" y="145" text-anchor="middle">100-200</text>

      <rect x="365" y="130" width="45" height="22" rx="3" fill="#1e40af"/>
      <text x="387" y="145" text-anchor="middle">&gt; 200</text>
    </g>
  </g>

  <!-- 中间节点 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="225" y1="158" x2="120" y2="200"/>
    <line x1="280" y1="158" x2="230" y2="200"/>
    <line x1="335" y1="158" x2="370" y2="200"/>
    <line x1="387" y1="158" x2="490" y2="200"/>
  </g>

  <g font-size="10" font-weight="700">
    <rect x="50" y="200" width="140" height="50" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="120" y="218" text-anchor="middle" fill="white">中间节点</text>
    <text x="120" y="234" text-anchor="middle" fill="white">[10, 30, 50]</text>

    <rect x="180" y="200" width="100" height="50" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="230" y="218" text-anchor="middle" fill="white">中间节点</text>
    <text x="230" y="234" text-anchor="middle" fill="white">[60, 80]</text>

    <rect x="320" y="200" width="100" height="50" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="370" y="218" text-anchor="middle" fill="white">中间节点</text>
    <text x="370" y="234" text-anchor="middle" fill="white">[120, 150]</text>

    <rect x="430" y="200" width="120" height="50" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="490" y="218" text-anchor="middle" fill="white">中间节点</text>
    <text x="490" y="234" text-anchor="middle" fill="white">[220, 260, 300]</text>
  </g>

  <!-- 叶子节点 -->
  <g stroke="#64748b" stroke-width="1" fill="none" stroke-dasharray="2 2">
    <line x1="120" y1="250" x2="80" y2="290"/>
    <line x1="120" y1="250" x2="160" y2="290"/>
    <line x1="230" y1="250" x2="200" y2="290"/>
    <line x1="230" y1="250" x2="260" y2="290"/>
    <line x1="370" y1="250" x2="340" y2="290"/>
    <line x1="370" y1="250" x2="400" y2="290"/>
    <line x1="490" y1="250" x2="460" y2="290"/>
    <line x1="490" y1="250" x2="520" y2="290"/>
  </g>

  <g font-size="10" font-weight="600">
    <rect x="40" y="290" width="80" height="55" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="80" y="308" text-anchor="middle" fill="white">叶子</text>
    <text x="80" y="324" text-anchor="middle" fill="white">(5, 8, 12)</text>
    <text x="80" y="338" text-anchor="middle" fill="white">row_ptr</text>

    <rect x="130" y="290" width="80" height="55" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="170" y="308" text-anchor="middle" fill="white">叶子</text>
    <text x="170" y="324" text-anchor="middle" fill="white">(20, 25, 30)</text>
    <text x="170" y="338" text-anchor="middle" fill="white">row_ptr</text>

    <rect x="220" y="290" width="80" height="55" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="260" y="308" text-anchor="middle" fill="white">叶子</text>
    <text x="260" y="324" text-anchor="middle" fill="white">(60, 75, 80)</text>
    <text x="260" y="338" text-anchor="middle" fill="white">row_ptr</text>

    <rect x="310" y="290" width="80" height="55" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="350" y="308" text-anchor="middle" fill="white">叶子</text>
    <text x="350" y="324" text-anchor="middle" fill="white">(120, 140)</text>
    <text x="350" y="338" text-anchor="middle" fill="white">row_ptr</text>

    <rect x="400" y="290" width="80" height="55" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="440" y="308" text-anchor="middle" fill="white">叶子</text>
    <text x="440" y="324" text-anchor="middle" fill="white">(220, 240)</text>
    <text x="440" y="338" text-anchor="middle" fill="white">row_ptr</text>

    <rect x="490" y="290" width="80" height="55" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="530" y="308" text-anchor="middle" fill="white">叶子</text>
    <text x="530" y="324" text-anchor="middle" fill="white">(280, 300)</text>
    <text x="530" y="338" text-anchor="middle" fill="white">row_ptr</text>
  </g>

  <!-- 叶子链表 -->
  <g stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="345" x2="130" y2="345"/>
    <line x1="210" y1="345" x2="220" y2="345"/>
    <line x1="300" y1="345" x2="310" y2="345"/>
    <line x1="390" y1="345" x2="400" y2="345"/>
    <line x1="480" y1="345" x2="490" y2="345"/>
  </g>
  <text x="300" y="370" text-anchor="middle" font-size="10" font-weight="700" fill="#9f1239">叶子节点双向链表（范围扫描）</text>

  <!-- 关键事实 -->
  <g font-size="11">
    <rect x="50" y="385" width="160" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="130" y="402" text-anchor="middle" font-weight="700" fill="#1e3a8a">聚簇索引</text>
    <text x="130" y="418" text-anchor="middle" fill="#1e40af">叶子 = 数据行</text>
    <text x="130" y="433" text-anchor="middle" fill="#1e40af">InnoDB 主键</text>

    <rect x="230" y="385" width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="310" y="402" text-anchor="middle" font-weight="700" fill="#92400e">二级索引</text>
    <text x="310" y="418" text-anchor="middle" fill="#78350f">叶子 = 主键值</text>
    <text x="310" y="433" text-anchor="middle" fill="#78350f">回表查询</text>

    <rect x="410" y="385" width="150" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="485" y="402" text-anchor="middle" font-weight="700" fill="#064e3b">树高</text>
    <text x="485" y="418" text-anchor="middle" fill="#065f46">3-4 层 · 千万级</text>
    <text x="485" y="433" text-anchor="middle" fill="#065f46">磁盘页 16K</text>
  </g>
</svg>
