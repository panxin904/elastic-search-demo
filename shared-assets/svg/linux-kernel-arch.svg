<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Linux Kernel 架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">User Space ↔ Kernel Space · System Call · VFS · 7 大子系统</text>

  <!-- User Space -->
  <g>
    <rect class="at-hover-card" x="30" y="90" width="540" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">User Space（用户态）</text>

    <rect class="at-hover-card" x="50" y="125" width="100" height="50" rx="6" fill="white" stroke="#94a3b8"/>
    <text x="100" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Shell</text>
    <text x="100" y="160" text-anchor="middle" font-size="9" fill="#94a3b8">bash / zsh</text>

    <rect class="at-hover-card" x="165" y="125" width="100" height="50" rx="6" fill="white" stroke="#94a3b8"/>
    <text x="215" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">应用</text>
    <text x="215" y="160" text-anchor="middle" font-size="9" fill="#94a3b8">Java · Python</text>

    <rect class="at-hover-card" x="280" y="125" width="100" height="50" rx="6" fill="white" stroke="#94a3b8"/>
    <text x="330" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">glibc</text>
    <text x="330" y="160" text-anchor="middle" font-size="9" fill="#94a3b8">系统调用包装</text>

    <rect class="at-hover-card" x="395" y="125" width="155" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="472" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">System Call</text>
    <text x="472" y="160" text-anchor="middle" font-size="9" fill="#92400e">用户态 ↔ 内核态切换</text>
  </g>

  <!-- Kernel Space -->
  <g>
    <rect class="at-hover-card" x="30" y="210" width="540" height="210" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Kernel Space（内核态 · Ring 0）</text>

    <rect class="at-hover-card" x="50" y="250" width="150" height="80" rx="6" fill="white" stroke="#10b981"/>
    <text x="125" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Process Scheduler</text>
    <text x="125" y="288" text-anchor="middle" font-size="9" fill="#475569">进程 / 线程调度</text>
    <text x="125" y="305" text-anchor="middle" font-size="9" fill="#475569">CFS · RT · Deadline</text>
    <text x="125" y="322" text-anchor="middle" font-size="9" fill="#475569">Cgroups</text>

    <rect class="at-hover-card" x="215" y="250" width="150" height="80" rx="6" fill="white" stroke="#3b82f6"/>
    <text x="290" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Memory Mgmt</text>
    <text x="290" y="288" text-anchor="middle" font-size="9" fill="#475569">虚拟内存 · MMU</text>
    <text x="290" y="305" text-anchor="middle" font-size="9" fill="#475569">页表 · TLB</text>
    <text x="290" y="322" text-anchor="middle" font-size="9" fill="#475569">OOM Killer</text>

    <rect class="at-hover-card" x="380" y="250" width="170" height="80" rx="6" fill="white" stroke="#8b5cf6"/>
    <text x="465" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">VFS + 文件系统</text>
    <text x="465" y="288" text-anchor="middle" font-size="9" fill="#475569">VFS（虚拟文件系统）</text>
    <text x="465" y="305" text-anchor="middle" font-size="9" fill="#475569">ext4 · xfs · btrfs</text>
    <text x="465" y="322" text-anchor="middle" font-size="9" fill="#475569">Page Cache</text>

    <rect class="at-hover-card" x="50" y="345" width="150" height="65" rx="6" fill="white" stroke="#ec4899"/>
    <text x="125" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">Network Stack</text>
    <text x="125" y="383" text-anchor="middle" font-size="9" fill="#475569">TCP/IP · Netfilter</text>
    <text x="125" y="400" text-anchor="middle" font-size="9" fill="#475569">eBPF / tc</text>

    <rect class="at-hover-card" x="215" y="345" width="150" height="65" rx="6" fill="white" stroke="#ef4444"/>
    <text x="290" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">设备驱动</text>
    <text x="290" y="383" text-anchor="middle" font-size="9" fill="#475569">字符 / 块 / 网络</text>
    <text x="290" y="400" text-anchor="middle" font-size="9" fill="#475569">DMA · 中断</text>

    <rect class="at-hover-card" x="380" y="345" width="170" height="65" rx="6" fill="white" stroke="#06b6d4"/>
    <text x="465" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#155e75">IPC + Security</text>
    <text x="465" y="383" text-anchor="middle" font-size="9" fill="#475569">Pipe · Socket · Signal</text>
    <text x="465" y="400" text-anchor="middle" font-size="9" fill="#475569">SELinux · Capabilities</text>
  </g>

  <!-- Hardware -->
  <g>
    <rect class="at-hover-card" x="30" y="435" width="115" height="35" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text x="87" y="457" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">CPU</text>

    <rect class="at-hover-card" x="155" y="435" width="115" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="212" y="457" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">内存</text>

    <rect class="at-hover-card" x="280" y="435" width="115" height="35" rx="6" fill="#fce7f3" stroke="#ec4899"/>
    <text x="337" y="457" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">网卡</text>

    <rect class="at-hover-card" x="405" y="435" width="155" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="482" y="457" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">磁盘 / 总线</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M300,190 L300,210"/>
    <path d="M125,420 L125,435"/>
    <path d="M290,420 L290,435"/>
    <path d="M465,420 L465,435"/>
  </g>
</svg>
