<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">可观测性驱动混沌工程闭环</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">稳态假设 → 实验 → 度量 → 反馈 → 调整</text>

  <!-- 中心：稳态假设 -->
  <circle cx="300" cy="240" r="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">稳态假设</text>
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="#78350f">Steady State</text>
  <text x="300" y="270" text-anchor="middle" font-size="10" fill="#92400e">Hypothesis</text>

  <!-- 4 节点 -->
  <!-- 1 定义 -->
  <rect class="at-hover-card" x="60" y="100" width="140" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">① 定义指标</text>
  <text x="130" y="148" text-anchor="middle" font-size="10" fill="#334155">SLI + SLO</text>

  <!-- 2 注入 -->
  <rect class="at-hover-card" x="400" y="100" width="140" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="470" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">② 注入故障</text>
  <text x="470" y="148" text-anchor="middle" font-size="10" fill="#334155">Chaos Experiment</text>

  <!-- 3 度量 -->
  <rect class="at-hover-card" x="400" y="310" width="140" height="70" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">③ 度量偏差</text>
  <text x="470" y="358" text-anchor="middle" font-size="10" fill="#334155">Δ SLI vs Baseline</text>

  <!-- 4 反馈 -->
  <rect class="at-hover-card" x="60" y="310" width="140" height="70" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="130" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">④ 反馈改进</text>
  <text x="130" y="358" text-anchor="middle" font-size="10" fill="#334155">加固 / 调参 / 扩容</text>

  <!-- 箭头（顺时针） -->
  <line x1="200" y1="135" x2="400" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="170" x2="470" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="345" x2="200" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="310" x2="130" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="270" y="130" text-anchor="middle" font-size="9" fill="#475569">SLO</text>
  <text x="485" y="245" text-anchor="middle" font-size="9" fill="#475569">注入</text>
  <text x="270" y="340" text-anchor="middle" font-size="9" fill="#475569">观测</text>
  <text x="115" y="245" text-anchor="middle" font-size="9" fill="#475569">复盘</text>

  <text x="300" y="430" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">核心思想：没有可观测性 → 混沌实验只是赌博</text>
  <text x="300" y="450" text-anchor="middle" font-size="10" fill="#64748b">先建 dashboard / alerting → 再做 chaos → 度量 SLO 偏差</text>
</svg>
