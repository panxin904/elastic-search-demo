<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="400"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Rust 所有权与借用</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">编译期保证内存安全 · 无 GC · 零成本抽象</text>

  <!-- 3 大规则 -->
  <g>
    <rect x="40" y="90" width="160" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">① 所有权 Ownership</text>
    <text x="120" y="138" text-anchor="middle" font-size="10" fill="#92400e">每个值有唯一所有者</text>
    <text x="120" y="155" text-anchor="middle" font-size="9" fill="#475569">所有者离开作用域 → drop</text>

    <rect x="220" y="90" width="160" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="300" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">② 借用 Borrow</text>
    <text x="300" y="138" text-anchor="middle" font-size="10" fill="#1e40af">&amp; 不可变引用 × N</text>
    <text x="300" y="155" text-anchor="middle" font-size="9" fill="#475569">&amp;mut 可变引用 × 1</text>

    <rect x="400" y="90" width="160" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">③ 生命周期 Lifetime</text>
    <text x="480" y="138" text-anchor="middle" font-size="10" fill="#065f46">'a 'b 'static</text>
    <text x="480" y="155" text-anchor="middle" font-size="9" fill="#475569">引用有效范围</text>
  </g>

  <!-- 示例代码 -->
  <rect x="40" y="190" width="520" height="120" rx="6" fill="#1e293b"/>
  <text x="60" y="212" font-size="10" fill="#94a3b8" font-weight="700">// 1. 所有权转移</text>
  <text x="60" y="228" font-size="11" fill="#fbbf24" font-family="ui-monospace,'SF Mono',monospace">let s1 = String::from("hello");</text>
  <text x="60" y="244" font-size="11" fill="#fbbf24" font-family="ui-monospace,'SF Mono',monospace">let s2 = s1;             // s1 move 到 s2</text>
  <text x="60" y="263" font-size="10" fill="#94a3b8" font-weight="700">// 2. 借用</text>
  <text x="60" y="279" font-size="11" fill="#a7f3d0" font-family="ui-monospace,'SF Mono',monospace">fn len(s: &amp;String) -&gt; usize { s.len() }</text>
  <text x="60" y="295" font-size="11" fill="#a7f3d0" font-family="ui-monospace,'SF Mono',monospace">let l = len(&amp;s2);          // &amp; 不可变借用</text>

  <!-- 对比：GC vs Rust -->
  <g>
    <rect x="40" y="325" width="250" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="60" y="348" font-size="11" font-weight="700" fill="#7f1d1d">Java/Go 风格（GC）</text>
    <text x="60" y="364" font-size="10" fill="#7f1d1d">运行时 GC · 短暂 STW · 内存峰值高</text>
    <text x="60" y="378" font-size="10" fill="#7f1d1d">→ 简单但不可预测</text>

    <rect x="310" y="325" width="250" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="330" y="348" font-size="11" font-weight="700" fill="#065f46">Rust 风格（编译期）</text>
    <text x="330" y="364" font-size="10" fill="#065f46">无 GC · drop 即释放 · 内存可预测</text>
    <text x="330" y="378" font-size="10" fill="#065f46">→ 学习曲线陡 · 但零运行时开销</text>
  </g>

  <text x="300" y="400" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v7 · rust</text>
</svg>
