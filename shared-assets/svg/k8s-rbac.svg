<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Kubernetes RBAC 权限模型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Role/ClusterRole · Binding · Subject · verbs × resources</text>

  <!-- RBAC 四要素 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① RBAC 四要素</text>

    <rect class="at-hover-card" x="40" y="105" width="120" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Subject</text>
    <text x="100" y="143" text-anchor="middle" font-size="9" fill="#475569">谁</text>
    <text x="100" y="160" text-anchor="middle" font-size="9" fill="#475569">User / Group /</text>
    <text x="100" y="175" text-anchor="middle" font-size="9" fill="#475569">ServiceAccount</text>

    <path d="M 160 145 L 190 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="190" y="105" width="125" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="252" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Role/ClusterRole</text>
    <text x="252" y="143" text-anchor="middle" font-size="9" fill="#475569">什么权限</text>
    <text x="252" y="160" text-anchor="middle" font-size="9" fill="#475569">verbs ×</text>
    <text x="252" y="175" text-anchor="middle" font-size="9" fill="#475569">resources</text>

    <path d="M 315 145 L 345 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="345" y="105" width="130" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="410" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Binding</text>
    <text x="410" y="143" text-anchor="middle" font-size="9" fill="#475569">关联</text>
    <text x="410" y="160" text-anchor="middle" font-size="9" fill="#475569">RoleBinding /</text>
    <text x="410" y="175" text-anchor="middle" font-size="9" fill="#475569">ClusterRoleBinding</text>

    <path d="M 475 145 L 500 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="500" y="105" width="60" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="530" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Resource</text>
    <text x="530" y="160" text-anchor="middle" font-size="9" fill="#475569">对象</text>
  </g>

  <!-- 权限矩阵 -->
  <g>
    <text x="60" y="208" font-size="13" font-weight="700" fill="#1e293b">② verbs × resources 矩阵（典型组合）</text>

    <rect class="at-hover-card" x="40" y="220" width="520" height="100" rx="6" fill="#1e293b"/>
    <text x="60" y="240" font-size="10" font-family="monospace" fill="#a7f3d0">kind: Role</text>
    <text x="60" y="255" font-size="10" font-family="monospace" fill="#a7f3d0">rules:</text>
    <text x="60" y="270" font-size="10" font-family="monospace" fill="#fde68a">- apiGroups: [""]              # 核心组</text>
    <text x="60" y="285" font-size="10" font-family="monospace" fill="#fde68a">  resources: ["pods", "services"]</text>
    <text x="60" y="300" font-size="10" font-family="monospace" fill="#fde68a">  verbs: ["get", "list", "watch", "create", "update", "delete"]</text>

    <text x="380" y="245" font-size="10" font-weight="700" fill="#a7f3d0">常用 verbs</text>
    <text x="380" y="262" font-size="9" font-family="monospace" fill="#cbd5e1">get  list  watch</text>
    <text x="380" y="278" font-size="9" font-family="monospace" fill="#cbd5e1">create  update  patch</text>
    <text x="380" y="294" font-size="9" font-family="monospace" fill="#cbd5e1">delete  deletecollection</text>
    <text x="380" y="310" font-size="9" font-family="monospace" fill="#cbd5e1">*  (通配)</text>
  </g>

  <!-- 决策流程 -->
  <g>
    <text x="60" y="345" font-size="13" font-weight="700" fill="#1e293b">③ 鉴权决策流程（kubectl get pods）</text>

    <rect class="at-hover-card" x="40" y="360" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="375" width="100" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="105" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">kubectl</text>
    <text x="105" y="406" text-anchor="middle" font-size="8" fill="#475569">请求 get pods</text>

    <path d="M 155 392 L 180 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="180" y="375" width="100" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="230" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">API Server</text>
    <text x="230" y="406" text-anchor="middle" font-size="8" fill="#475569">认证 + 鉴权</text>

    <path d="M 280 392 L 305 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="305" y="375" width="120" height="35" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="365" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">RBAC Authorizer</text>
    <text x="365" y="406" text-anchor="middle" font-size="8" fill="#475569">查 RoleBinding</text>

    <path d="M 425 392 L 450 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="450" y="375" width="100" height="35" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="500" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Allow/Deny</text>
    <text x="500" y="406" text-anchor="middle" font-size="8" fill="#475569">返回结果</text>

    <text x="300" y="438" font-size="9" fill="#475569" text-anchor="middle">Subject 鉴权: User alice → RoleBinding pod-reader → Role pods:get → ✅ 允许 / ❌ 403 Forbidden</text>
  </g>
</svg>
