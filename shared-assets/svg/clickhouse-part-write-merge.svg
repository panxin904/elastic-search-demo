<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">ClickHouse MergeTree 引擎</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">LSM-Tree 变体 · 后台合并 · 列存 + 主键索引</text>

  <!-- 数据写入 -->
  <g>
    <rect x="30" y="90" width="100" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Insert</text>
    <text x="80" y="132" text-anchor="middle" font-size="9" fill="#1e40af">10w 行/s</text>

    <line x1="130" y1="115" x2="160" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="130" y1="125" x2="160" y2="115" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Part 1 -->
  <g>
    <rect x="160" y="90" width="120" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="220" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Part 1（新）</text>
    <text x="220" y="130" text-anchor="middle" font-size="9" fill="#92400e">20260801_1_1_0</text>
    <text x="220" y="144" text-anchor="middle" font-size="9" fill="#64748b">列存 · 排序 · mark</text>
  </g>

  <line x1="280" y1="120" x2="310" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Part 2 -->
  <g>
    <rect x="310" y="90" width="120" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="370" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Part 2</text>
    <text x="370" y="130" text-anchor="middle" font-size="9" fill="#92400e">20260801_2_2_0</text>
    <text x="370" y="144" text-anchor="middle" font-size="9" fill="#64748b">列存 · 排序 · mark</text>
  </g>

  <line x1="430" y1="120" x2="460" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 合并中 -->
  <g>
    <rect x="460" y="90" width="110" height="60" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="515" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">合并</text>
    <text x="515" y="130" text-anchor="middle" font-size="9" fill="#9d174d">后台</text>
    <text x="515" y="144" text-anchor="middle" font-size="9" fill="#64748b">background</text>
  </g>

  <!-- 第二行：合并产物 + 查询 -->
  <line x1="515" y1="150" x2="515" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="380" y="180" width="200" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">合并后大 Part</text>
  <text x="480" y="220" text-anchor="middle" font-size="9" fill="#065f46">20260801_1_3_1 · 列存合并 · mark 重写</text>

  <!-- 查询路径 -->
  <line x1="80" y1="155" x2="80" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arr)"/>
  <rect x="20" y="220" width="120" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="80" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">SELECT</text>
  <text x="80" y="260" text-anchor="middle" font-size="9" fill="#5b21b6">稀疏索引定位</text>

  <line x1="140" y1="245" x2="380" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="260" y="238" text-anchor="middle" font-size="9" fill="#475569">主键索引 → granule → mark → 列读取</text>

  <!-- 关键特性 -->
  <rect x="20" y="290" width="560" height="70" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="40" y="313" font-size="12" font-weight="700" fill="#7c3aed">⚡ MergeTree 家族特性</text>
  <text x="40" y="333" font-size="10" fill="#1e293b">
    <tspan>• ReplacingMergeTree</tspan>
    <tspan dx="10">• SummingMergeTree</tspan>
    <tspan dx="10">• AggregatingMergeTree</tspan>
    <tspan dx="10">• CollapsingMergeTree</tspan>
    <tspan dx="10">• VersionedCollapsing</tspan>
  </text>
  <text x="40" y="351" font-size="10" fill="#475569">→ 通过 PARTITION BY + ORDER BY + 主键 三元组定义存储策略</text>

  <text x="300" y="378" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v7 · clickhouse</text>
</svg>
