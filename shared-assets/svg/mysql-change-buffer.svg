<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL InnoDB Change Buffer</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">非唯一二级索引变更缓冲 · 减少随机 IO 4-9x</text>

  <!-- 原理 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 问题：二级索引写入是随机 IO</text>

    <rect class="at-hover-card" x="40" y="105" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="60" y="125" width="105" height="65" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="112" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Buffer Pool</text>
    <text x="112" y="160" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">聚簇索引 page</text>
    <text x="112" y="178" text-anchor="middle" font-size="8" fill="#475569">在内存 ✅</text>

    <path d="M 165 155 L 195 155" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="180" y="148" font-size="9" font-weight="700" fill="#dc2626">❌ 读盘</text>

    <rect class="at-hover-card" x="195" y="125" width="105" height="65" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="247" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">磁盘</text>
    <text x="247" y="160" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">二级索引 page</text>
    <text x="247" y="178" text-anchor="middle" font-size="8" fill="#475569">随机 IO 慢</text>

    <text x="325" y="142" font-size="10" font-weight="700" fill="#1e293b">为什么慢？</text>
    <text x="325" y="160" font-size="9" fill="#475569">• 二级索引 page 通常</text>
    <text x="325" y="175" font-size="9" fill="#475569">  不在 Buffer Pool</text>
    <text x="325" y="190" font-size="9" fill="#475569">• 每次更新要先读盘</text>
    <text x="325" y="205" font-size="9" fill="#dc2626">  → 4 次随机 IO / insert</text>
  </g>

  <!-- Change Buffer 机制 -->
  <g>
    <text x="60" y="225" font-size="13" font-weight="700" fill="#1e293b">② Change Buffer 解决：先缓存，后合并</text>

    <rect class="at-hover-card" x="40" y="240" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="60" y="258" width="105" height="65" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="112" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Buffer Pool</text>
    <text x="112" y="293" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">聚簇 page</text>
    <text x="112" y="312" text-anchor="middle" font-size="8" fill="#475569">直接更新 ✅</text>

    <path d="M 165 290 L 195 290" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="180" y="282" font-size="9" font-weight="700" fill="#065f46">✅ 内存</text>

    <rect class="at-hover-card" x="195" y="258" width="105" height="65" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="247" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Change Buffer</text>
    <text x="247" y="293" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">记录变更</text>
    <text x="247" y="312" text-anchor="middle" font-size="8" fill="#475569">不读盘 ✅</text>

    <text x="325" y="278" font-size="10" font-weight="700" fill="#1e293b">合时机：</text>
    <text x="325" y="296" font-size="9" fill="#475569">1. 后续读 page → 触发 merge</text>
    <text x="325" y="312" font-size="9" fill="#475569">2. 后台 master thread</text>
    <text x="325" y="328" font-size="9" fill="#065f46">3. 数据库关闭时强制 merge</text>
  </g>

  <!-- 限制条件 -->
  <g>
    <text x="60" y="360" font-size="13" font-weight="700" fill="#1e293b">③ 适用条件：非唯一二级索引</text>

    <rect class="at-hover-card" x="40" y="375" width="520" height="90" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="60" y="392" width="180" height="55" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="150" y="410" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">✅ 适用</text>
    <text x="75" y="427" font-size="9" fill="#475569">普通索引 / 前缀索引</text>
    <text x="75" y="442" font-size="9" fill="#475569">INSERT 不会检查唯一性</text>

    <rect class="at-hover-card" x="255" y="392" width="180" height="55" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="345" y="410" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">❌ 不适用</text>
    <text x="270" y="427" font-size="9" fill="#475569">主键 / 唯一索引</text>
    <text x="270" y="442" font-size="9" fill="#475569">（必须立即读盘判断唯一）</text>

    <rect class="at-hover-card" x="450" y="392" width="100" height="55" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="500" y="410" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">配置</text>
    <text x="465" y="427" font-size="9" font-family="monospace" fill="#1e293b">innodb_change_</text>
    <text x="465" y="442" font-size="9" font-family="monospace" fill="#1e293b">buffering = all</text>
  </g>
</svg>
