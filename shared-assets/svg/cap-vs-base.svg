<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >分布式理论演进</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">CAP · BASE · 最终一致 · NewSQL</text>

  <!-- 时间线 -->
  <line x1="40" y1="270" x2="560" y2="270" stroke="#94a3b8" stroke-width="2"/>

  <!-- 4 个理论节点 -->
  <g font-size="12" font-weight="700">
    <circle cx="100" cy="270" r="50" fill="#3b82f6" opacity="0.95"/>
    <text x="100" y="268" text-anchor="middle" fill="white">CAP</text>
    <text x="100" y="285" text-anchor="middle" font-size="9" fill="#dbeafe">2000</text>

    <circle cx="240" cy="270" r="50" fill="#10b981" opacity="0.95"/>
    <text x="240" y="262" text-anchor="middle" fill="white">BASE</text>
    <text x="240" y="280" text-anchor="middle" font-size="9" fill="#d1fae5">2008</text>
    <text x="240" y="294" text-anchor="middle" font-size="9" fill="#d1fae5">eBay</text>

    <circle cx="380" cy="270" r="50" fill="#f59e0b" opacity="0.95"/>
    <text x="380" y="262" text-anchor="middle" fill="white">NoSQL</text>
    <text x="380" y="280" text-anchor="middle" font-size="9" fill="#fef3c7">2008-</text>
    <text x="380" y="294" text-anchor="middle" font-size="9" fill="#fef3c7">实践期</text>

    <circle cx="520" cy="270" r="50" fill="#ec4899" opacity="0.95"/>
    <text x="520" y="262" text-anchor="middle" fill="white">NewSQL</text>
    <text x="520" y="280" text-anchor="middle" font-size="9" fill="#fce7f3">2012-</text>
    <text x="520" y="294" text-anchor="middle" font-size="9" fill="#fce7f3">Spanner</text>
  </g>

  <!-- 连接 -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="270" x2="190" y2="270"/>
    <line x1="290" y1="270" x2="330" y2="270"/>
    <line x1="430" y1="270" x2="470" y2="270"/>
  </g>

  <!-- 详情卡 -->
  <g font-size="11">
    <!-- CAP -->
    <rect x="40" y="100" width="120" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="100" y="120" text-anchor="middle" font-weight="700" fill="#1e3a8a">CAP 2000</text>
    <text x="100" y="138" text-anchor="middle" fill="#1e40af">C/A/P 三选二</text>
    <text x="100" y="151" text-anchor="middle" fill="#1e40af">Brewer 猜想</text>

    <!-- BASE -->
    <rect x="180" y="100" width="120" height="55" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="240" y="120" text-anchor="middle" font-weight="700" fill="#064e3b">BASE 2008</text>
    <text x="240" y="138" text-anchor="middle" fill="#065f46">基本可用 + 最终一致</text>
    <text x="240" y="151" text-anchor="middle" fill="#065f46">牺牲强一致换可用</text>

    <!-- NoSQL -->
    <rect x="320" y="100" width="120" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="380" y="120" text-anchor="middle" font-weight="700" fill="#92400e">NoSQL</text>
    <text x="380" y="138" text-anchor="middle" fill="#78350f">KV / Document / Column</text>
    <text x="380" y="151" text-anchor="middle" fill="#78350f">水平扩展 + 最终一致</text>

    <!-- NewSQL -->
    <rect x="460" y="100" width="120" height="55" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="520" y="120" text-anchor="middle" font-weight="700" fill="#9f1239">NewSQL</text>
    <text x="520" y="138" text-anchor="middle" fill="#9d174d">SQL + 水平扩展</text>
    <text x="520" y="151" text-anchor="middle" fill="#9d174d">强一致 + 高可用</text>
  </g>

  <!-- 关键比较 -->
  <g font-size="11">
    <rect x="40" y="340" width="520" height="115" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="360" text-anchor="middle" font-weight="700" fill="#1e293b">CAP vs BASE</text>
    <text x="60" y="382" fill="#475569">CAP：证明分布式系统不可能三角 · 理论上限</text>
    <text x="60" y="400" fill="#475569">BASE：放弃强一致换可用性 · 实践选择</text>
    <text x="60" y="418" fill="#475569">ACID：原子 / 一致 / 隔离 / 持久 · 传统 RDBMS</text>
    <text x="60" y="436" fill="#475569">Paxos / Raft：分布式共识算法</text>
    <text x="320" y="382" fill="#475569">PA / PC / EL：分区容忍必选</text>
    <text x="320" y="400" fill="#475569">强一致 vs 最终一致：业务取舍</text>
    <text x="320" y="418" fill="#475569">NewSQL 突破：TrueTime + 多版本</text>
    <text x="320" y="436" fill="#475569">工程实践：先 AP 再追求 C</text>
  </g>
</svg>
