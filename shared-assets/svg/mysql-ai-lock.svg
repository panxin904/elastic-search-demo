<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">MySQL 自增 ID 锁机制</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">innodb_autoinc_lock_mode · 0/1/2 三种模式</text>

  <!-- 三种模式 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 三种模式对比（默认 mode=2）</text>

    <rect x="40" y="105" width="170" height="135" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="125" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">mode=0 (传统)</text>
    <text x="55" y="148" text-anchor="middle" font-size="9" fill="#475569">传统锁</text>
    <text x="55" y="166" font-size="9" fill="#475569">INSERT 后释放</text>
    <text x="55" y="184" font-size="9" fill="#dc2626">❌ 简单语句阻塞</text>
    <text x="55" y="204" font-size="9" fill="#dc2626">❌ statement 复制</text>
    <text x="55" y="220" font-size="9" fill="#dc2626">❌ 大量连续</text>
    <text x="55" y="232" font-size="9" font-weight="700" fill="#991b1b">已弃用</text>

    <rect x="220" y="105" width="170" height="135" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="305" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">mode=1 (连续)</text>
    <text x="235" y="148" font-size="9" fill="#475569">简单 INSERT</text>
    <text x="235" y="164" font-size="9" fill="#475569">预分配连续 ID</text>
    <text x="235" y="184" font-size="9" fill="#475569">批量 INSERT</text>
    <text x="235" y="200" font-size="9" fill="#475569">释放前完成分配</text>
    <text x="235" y="220" font-size="9" font-weight="700" fill="#10b981">✅ 行复制安全</text>
    <text x="235" y="232" font-size="9" font-weight="700" fill="#92400e">默认</text>

    <rect x="400" y="105" width="160" height="135" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="480" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">mode=2 (交错)</text>
    <text x="415" y="148" font-size="9" fill="#475569">轻量级 mutex</text>
    <text x="415" y="164" font-size="9" fill="#475569">每次 alloc 即释放</text>
    <text x="415" y="184" font-size="9" fill="#475569">并发 INSERT 性能 ↑</text>
    <text x="415" y="200" font-size="9" fill="#475569">⚠️ ID 不连续</text>
    <text x="415" y="220" font-size="9" font-weight="700" fill="#065f46">✅ 默认（8.0+）</text>
  </g>

  <!-- 锁获取流程 -->
  <g>
    <text x="60" y="262" font-size="13" font-weight="700" fill="#1e293b">② mode=2 获取 AI 锁流程</text>

    <rect x="40" y="275" width="520" height="95" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="55" y="290" width="110" height="65" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="110" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">申请 AI 锁</text>
    <text x="110" y="326" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">trx 视角</text>
    <text x="110" y="343" text-anchor="middle" font-size="8" fill="#475569">申请分配 N 个</text>

    <path d="M 165 322 L 195 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="195" y="290" width="115" height="65" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="252" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">轻量 mutex</text>
    <text x="252" y="326" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">dict_sys mutex</text>
    <text x="252" y="343" text-anchor="middle" font-size="8" fill="#475569">分配 1 个</text>

    <path d="M 310 322 L 340 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="340" y="290" width="115" height="65" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="397" y="308" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">立即释放</text>
    <text x="397" y="326" text-anchor="middle" font-size="9" fill="#475569">不持有到事务结束</text>
    <text x="397" y="343" text-anchor="middle" font-size="8" fill="#475569">其他 trx 可并发</text>

    <path d="M 455 322 L 485 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="485" y="290" width="65" height="65" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="517" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">返回</text>
    <text x="517" y="328" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">id=42</text>
    <text x="517" y="343" text-anchor="middle" font-size="8" fill="#475569">单调递增</text>
  </g>

  <!-- 典型问题 -->
  <g>
    <text x="60" y="390" font-size="13" font-weight="700" fill="#1e293b">③ mode=2 的问题与规避</text>

    <rect x="40" y="405" width="520" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="55" y="418" width="245" height="40" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="178" y="434" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">ID 不连续</text>
    <text x="70" y="450" font-size="9" fill="#475569">回滚后 ID 不复用，跳号</text>

    <rect x="320" y="418" width="240" height="40" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="440" y="434" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">应对方案</text>
    <text x="335" y="450" font-size="9" fill="#475569">雪花算法 / UUID / batch id</text>
  </g>
</svg>
