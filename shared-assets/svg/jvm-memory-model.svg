<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">JVM 运行时数据区</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">线程私有 vs 线程共享 · 堆/栈/方法区</text>

  <!-- 线程共享（左侧） -->
  <rect x="40" y="90" width="240" height="350" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">线程共享</text>

  <g font-size="11" font-weight="700">
    <rect x="55" y="125" width="210" height="50" rx="6" fill="#3b82f6" opacity="0.95"/>
    <text x="160" y="148" text-anchor="middle" fill="white">Heap（堆）</text>
    <text x="160" y="163" text-anchor="middle" font-size="9" fill="#dbeafe">Young（Eden+S0+S1）+ Old</text>

    <rect x="55" y="185" width="210" height="50" rx="6" fill="#10b981" opacity="0.95"/>
    <text x="160" y="208" text-anchor="middle" fill="white">Method Area</text>
    <text x="160" y="223" text-anchor="middle" font-size="9" fill="#d1fae5">类元数据 + 常量池 + 静态变量</text>

    <rect x="55" y="245" width="210" height="50" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="160" y="268" text-anchor="middle" fill="white">Runtime Constant Pool</text>
    <text x="160" y="283" text-anchor="middle" font-size="9" fill="#fef3c7">字面量 · 符号引用</text>

    <rect x="55" y="305" width="210" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="160" y="328" text-anchor="middle" fill="white">Direct Memory</text>
    <text x="160" y="341" text-anchor="middle" font-size="9" fill="#fce7f3">NIO · 堆外内存</text>

    <rect x="55" y="355" width="210" height="50" rx="6" fill="#94a3b8" opacity="0.85"/>
    <text x="160" y="378" text-anchor="middle" fill="white">Metaspace（元空间）</text>
    <text x="160" y="393" text-anchor="middle" font-size="9" fill="#f1f5f9">JDK 8+ 替代 PermGen</text>
  </g>

  <!-- 线程私有（右侧） -->
  <rect x="300" y="90" width="260" height="350" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">线程私有</text>

  <g font-size="11" font-weight="700">
    <rect x="315" y="125" width="230" height="60" rx="6" fill="#10b981" opacity="0.95"/>
    <text x="430" y="148" text-anchor="middle" fill="white">VM Stack（虚拟机栈）</text>
    <text x="430" y="165" text-anchor="middle" font-size="9" fill="#d1fae5">Stack Frame：局部变量表</text>
    <text x="430" y="178" text-anchor="middle" font-size="9" fill="#d1fae5">操作数栈 + 动态链接</text>

    <rect x="315" y="195" width="110" height="50" rx="6" fill="#3b82f6" opacity="0.9"/>
    <text x="370" y="218" text-anchor="middle" font-size="10" fill="white">Native Stack</text>
    <text x="370" y="233" text-anchor="middle" font-size="9" fill="#dbeafe">JNI 方法</text>

    <rect x="435" y="195" width="110" height="50" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="490" y="218" text-anchor="middle" font-size="10" fill="white">PC Register</text>
    <text x="490" y="233" text-anchor="middle" font-size="9" fill="#fef3c7">指令指针</text>

    <rect x="315" y="255" width="230" height="100" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="430" y="278" text-anchor="middle" fill="white">Stack Frame 详解</text>
    <text x="430" y="298" text-anchor="middle" font-size="9" fill="#fce7f3">· 局部变量表：基本类型 + 对象引用</text>
    <text x="430" y="313" text-anchor="middle" font-size="9" fill="#fce7f3">· 操作数栈：方法执行的临时数据区</text>
    <text x="430" y="328" text-anchor="middle" font-size="9" fill="#fce7f3">· 动态链接：符号引用 → 直接引用</text>
    <text x="430" y="343" text-anchor="middle" font-size="9" fill="#fce7f3">· 方法出口：返回地址 + 异常</text>
  </g>

  <!-- 执行引擎 -->
  <g font-size="11">
    <rect x="315" y="370" width="230" height="65" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="430" y="392" text-anchor="middle" font-weight="700" fill="#92400e">Execution Engine</text>
    <text x="430" y="410" text-anchor="middle" font-size="9" fill="#78350f">Interpreter（解释器）</text>
    <text x="430" y="425" text-anchor="middle" font-size="9" fill="#78350f">JIT Compiler（C1 / C2）</text>
  </g>

  <text x="300" y="455" text-anchor="middle" font-size="11" fill="#94a3b8">GC 关注堆：Minor GC（Young）+ Major GC（Old）· ZGC / G1 / Parallel</text>
</svg>
