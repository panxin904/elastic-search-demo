<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >事务隔离级别</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">RU / RC / RR / SERIALIZABLE · 并发问题</text>

  <g font-size="11" font-weight="700">
    <!-- RU -->
    <rect x="40" y="100" width="130" height="320" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="105" y="125" text-anchor="middle" font-size="13" fill="#dc2626">RU</text>
    <text x="105" y="142" text-anchor="middle" font-size="10" fill="#991b1b">Read Uncommitted</text>
    <text x="105" y="158" text-anchor="middle" font-size="10" fill="#991b1b">读未提交</text>
    <text x="55" y="180" font-size="9" fill="#991b1b">✓ 性能最高</text>
    <text x="55" y="198" font-size="9" fill="#991b1b">✗ 脏读</text>
    <text x="55" y="216" font-size="9" fill="#991b1b">✗ 不可重复读</text>
    <text x="55" y="234" font-size="9" fill="#991b1b">✗ 幻读</text>
    <text x="55" y="260" font-size="10" fill="#7f1d1d" font-weight="700">并发问题：</text>
    <text x="55" y="280" font-size="9" fill="#7f1d1d">事务读到未提交</text>
    <text x="55" y="295" font-size="9" fill="#7f1d1d">的脏数据</text>
    <text x="55" y="330" font-size="10" font-weight="700" fill="#dc2626">实际很少用</text>
    <text x="55" y="350" font-size="9" fill="#991b1b">仅诊断场景</text>

    <!-- RC -->
    <rect x="180" y="100" width="130" height="320" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="245" y="125" text-anchor="middle" font-size="13" fill="#92400e">RC</text>
    <text x="245" y="142" text-anchor="middle" font-size="10" fill="#78350f">Read Committed</text>
    <text x="245" y="158" text-anchor="middle" font-size="10" fill="#78350f">读已提交</text>
    <text x="195" y="180" font-size="9" fill="#78350f">✓ 解决脏读</text>
    <text x="195" y="198" font-size="9" fill="#78350f">✗ 不可重复读</text>
    <text x="195" y="216" font-size="9" fill="#78350f">✗ 幻读</text>
    <text x="195" y="240" font-size="10" font-weight="700" fill="#92400e">机制：</text>
    <text x="195" y="260" font-size="9" fill="#78350f">每次 SELECT</text>
    <text x="195" y="275" font-size="9" fill="#78350f">生成新 ReadView</text>
    <text x="195" y="295" font-size="9" fill="#78350f">Oracle / PG 默认</text>
    <text x="195" y="320" font-size="10" font-weight="700" fill="#92400e">应用最广</text>
    <text x="195" y="340" font-size="9" fill="#78350f">实时数据</text>

    <!-- RR -->
    <rect x="320" y="100" width="130" height="320" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="385" y="125" text-anchor="middle" font-size="13" fill="#064e3b">RR</text>
    <text x="385" y="142" text-anchor="middle" font-size="10" fill="#065f46">Repeatable Read</text>
    <text x="385" y="158" text-anchor="middle" font-size="10" fill="#065f46">可重复读</text>
    <text x="335" y="180" font-size="9" fill="#065f46">✓ 解决脏读</text>
    <text x="335" y="198" font-size="9" fill="#065f46">✓ 不可重复读</text>
    <text x="335" y="216" font-size="9" fill="#065f46">✗ 幻读（部分）</text>
    <text x="335" y="240" font-size="10" font-weight="700" fill="#064e3b">机制：</text>
    <text x="335" y="260" font-size="9" fill="#065f46">事务首个 SELECT</text>
    <text x="335" y="275" font-size="9" fill="#065f46">ReadView · 不变</text>
    <text x="335" y="295" font-size="9" fill="#065f46">MySQL InnoDB 默认</text>
    <text x="335" y="320" font-size="10" font-weight="700" fill="#064e3b">Next-Key Lock</text>
    <text x="335" y="340" font-size="9" fill="#065f46">解决幻读</text>

    <!-- SERIALIZABLE -->
    <rect x="460" y="100" width="120" height="320" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="520" y="125" text-anchor="middle" font-size="13" fill="#5b21b6">SERIAL</text>
    <text x="520" y="142" text-anchor="middle" font-size="10" fill="#6b21a8">Serializable</text>
    <text x="520" y="158" text-anchor="middle" font-size="10" fill="#6b21a8">可串行化</text>
    <text x="475" y="180" font-size="9" fill="#6b21a8">✓ 解决所有问题</text>
    <text x="475" y="198" font-size="9" fill="#6b21a8">✓ 脏读/不可重复</text>
    <text x="475" y="216" font-size="9" fill="#6b21a8">✓ 幻读</text>
    <text x="475" y="240" font-size="10" font-weight="700" fill="#5b21b6">机制：</text>
    <text x="475" y="260" font-size="9" fill="#6b21a8">强制串行</text>
    <text x="475" y="275" font-size="9" fill="#6b21a8">等价单线程</text>
    <text x="475" y="295" font-size="9" fill="#6b21a8">MVCC 失效</text>
    <text x="475" y="320" font-size="10" font-weight="700" fill="#5b21b6">性能最低</text>
    <text x="475" y="340" font-size="9" fill="#6b21a8">极少生产用</text>
  </g>

  <text x="300" y="445" text-anchor="middle" font-size="11" fill="#94a3b8">默认：MySQL InnoDB=RR · Oracle=RC · PostgreSQL=RC · SQL Server=RC</text>
</svg>
