<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Linux 虚拟内存</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">虚拟地址 → MMU → 物理地址 · 页表 + TLB</text>

  <!-- 进程虚拟地址空间 -->
  <g font-size="11" font-weight="700">
    <rect x="50" y="100" width="160" height="320" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="120" text-anchor="middle" fill="#1e3a8a">进程虚拟地址</text>
    <text x="130" y="135" text-anchor="middle" font-size="10" fill="#1e40af">Virtual Address Space</text>

    <rect x="60" y="145" width="140" height="30" rx="4" fill="#3b82f6" opacity="0.9"/>
    <text x="130" y="165" text-anchor="middle" fill="white">内核区</text>

    <rect x="60" y="180" width="140" height="35" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="130" y="201" text-anchor="middle" fill="white">栈</text>
    <text x="130" y="212" text-anchor="middle" font-size="9" fill="#d1fae5">向下增长</text>

    <rect x="60" y="220" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.4"/>
    <text x="130" y="240" text-anchor="middle" fill="#475569" font-size="10">...</text>

    <rect x="60" y="255" width="140" height="30" rx="4" fill="#ec4899" opacity="0.9"/>
    <text x="130" y="275" text-anchor="middle" fill="white">堆</text>

    <rect x="60" y="290" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.4"/>
    <text x="130" y="310" text-anchor="middle" fill="#475569" font-size="10">mmap 区域</text>

    <rect x="60" y="325" width="140" height="30" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="130" y="345" text-anchor="middle" fill="white">BSS/Data</text>

    <rect x="60" y="360" width="140" height="30" rx="4" fill="#3b82f6" opacity="0.9"/>
    <text x="130" y="380" text-anchor="middle" fill="white">代码段</text>

    <rect x="60" y="395" width="140" height="20" rx="4" fill="#475569"/>
    <text x="130" y="410" text-anchor="middle" font-size="10" fill="#f1f5f9">未映射</text>
  </g>

  <!-- MMU -->
  <rect x="260" y="200" width="80" height="60" rx="8" fill="#f59e0b" opacity="0.95"/>
  <text x="300" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="white">MMU</text>
  <text x="300" y="245" text-anchor="middle" font-size="10" fill="#fef3c7">硬件翻译</text>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="230" x2="260" y2="230"/>
    <line x1="340" y1="230" x2="400" y2="230"/>
  </g>

  <!-- 物理地址 -->
  <g font-size="11" font-weight="700">
    <rect x="400" y="100" width="160" height="320" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="120" text-anchor="middle" fill="#064e3b">物理内存</text>
    <text x="480" y="135" text-anchor="middle" font-size="10" fill="#065f46">Physical Memory</text>

    <rect x="410" y="145" width="140" height="30" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="480" y="165" text-anchor="middle" fill="white">页框 0</text>

    <rect x="410" y="180" width="140" height="30" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="480" y="200" text-anchor="middle" fill="white">页框 1</text>

    <rect x="410" y="215" width="140" height="30" rx="4" fill="#3b82f6" opacity="0.9"/>
    <text x="480" y="235" text-anchor="middle" fill="white">页框 2</text>

    <rect x="410" y="250" width="140" height="30" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="480" y="270" text-anchor="middle" fill="white">页框 3</text>

    <rect x="410" y="285" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.5"/>
    <text x="480" y="305" text-anchor="middle" fill="#475569" font-size="10">空闲</text>

    <rect x="410" y="320" width="140" height="30" rx="4" fill="#ec4899" opacity="0.9"/>
    <text x="480" y="340" text-anchor="middle" fill="white">页框 N</text>

    <rect x="410" y="355" width="140" height="30" rx="4" fill="#94a3b8" opacity="0.5"/>
    <text x="480" y="375" text-anchor="middle" fill="#475569" font-size="10">交换分区</text>

    <text x="480" y="405" text-anchor="middle" font-size="10" fill="#475569">→ 磁盘</text>
  </g>

  <!-- 页表 + TLB -->
  <g font-size="11">
    <rect x="240" y="290" width="120" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="300" y="308" text-anchor="middle" font-weight="700" fill="#9f1239">TLB（页表缓存）</text>
    <text x="300" y="328" text-anchor="middle" fill="#9d174d">命中 → 1 周期</text>

    <rect x="240" y="350" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="368" text-anchor="middle" font-weight="700" fill="#92400e">页表</text>
    <text x="300" y="388" text-anchor="middle" fill="#78350f">多级：PGD/PUD/PMD/PTE</text>
  </g>

  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">缺页中断 → 加载磁盘页 → 更新页表 → 重新执行 · swap 触发条件：内存压力</text>
</svg>
