<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >HDFS 架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">NameNode + SecondaryNameNode + DataNodes · Block 副本策略</text>

  <!-- Client -->
  <g>
    <rect class="at-hover-card" x="30" y="90" width="100" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Client</text>
    <text x="80" y="130" text-anchor="middle" font-size="10" fill="#475569">HDFS API</text>
  </g>

  <!-- NameNode -->
  <g>
    <rect class="at-hover-card" x="180" y="80" width="180" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="270" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">NameNode（Master）</text>
    <text x="270" y="123" text-anchor="middle" font-size="10" fill="#475569">内存元数据</text>
    <text x="270" y="140" text-anchor="middle" font-size="10" fill="#475569">├── FsImage（元数据快照）</text>
    <text x="270" y="156" text-anchor="middle" font-size="10" fill="#475569">├── EditLog（操作日志）</text>
    <text x="270" y="173" text-anchor="middle" font-size="10" fill="#475569">├── Block Map（块映射）</text>
    <text x="270" y="189" text-anchor="middle" font-size="10" fill="#475569">└── RPC Server: 9000</text>
  </g>

  <!-- SecondaryNameNode -->
  <g>
    <rect class="at-hover-card" x="380" y="80" width="180" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="470" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">SecondaryNameNode</text>
    <text x="470" y="123" text-anchor="middle" font-size="10" fill="#475569">Checkpoint 节点</text>
    <text x="470" y="148" text-anchor="middle" font-size="10" fill="#475569">定期合并：</text>
    <text x="470" y="164" text-anchor="middle" font-size="10" fill="#475569">FsImage + EditLog</text>
    <text x="470" y="180" text-anchor="middle" font-size="10" fill="#475569">→ 新 FsImage</text>
    <text x="470" y="194" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">非热备，HA 由 JournalNode</text>
  </g>

  <!-- DataNodes -->
  <g>
    <rect class="at-hover-card" x="30" y="240" width="160" height="150" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">DataNode 1</text>
    <rect class="at-hover-card" x="50" y="275" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="75" y="295" text-anchor="middle" font-size="9" fill="#065f46">B1</text>
    <rect class="at-hover-card" x="110" y="275" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="135" y="295" text-anchor="middle" font-size="9" fill="#065f46">B2</text>
    <rect class="at-hover-card" x="50" y="315" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="75" y="335" text-anchor="middle" font-size="9" fill="#065f46">B3</text>
    <rect class="at-hover-card" x="110" y="315" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="135" y="335" text-anchor="middle" font-size="9" fill="#065f46">B4</text>
    <text x="110" y="370" text-anchor="middle" font-size="9" fill="#475569">heartbeat 3s</text>

    <rect class="at-hover-card" x="220" y="240" width="160" height="150" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">DataNode 2</text>
    <rect class="at-hover-card" x="240" y="275" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="265" y="295" text-anchor="middle" font-size="9" fill="#065f46">B1'</text>
    <rect class="at-hover-card" x="300" y="275" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="325" y="295" text-anchor="middle" font-size="9" fill="#065f46">B3'</text>
    <rect class="at-hover-card" x="240" y="315" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="265" y="335" text-anchor="middle" font-size="9" fill="#065f46">B5</text>
    <rect class="at-hover-card" x="300" y="315" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="325" y="335" text-anchor="middle" font-size="9" fill="#065f46">B6</text>

    <rect class="at-hover-card" x="410" y="240" width="160" height="150" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">DataNode 3</text>
    <rect class="at-hover-card" x="430" y="275" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="455" y="295" text-anchor="middle" font-size="9" fill="#065f46">B1''</text>
    <rect class="at-hover-card" x="490" y="275" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="515" y="295" text-anchor="middle" font-size="9" fill="#065f46">B2'</text>
    <rect class="at-hover-card" x="430" y="315" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="455" y="335" text-anchor="middle" font-size="9" fill="#065f46">B4'</text>
    <rect class="at-hover-card" x="490" y="315" width="50" height="30" rx="3" fill="white" stroke="#10b981"/>
    <text x="515" y="335" text-anchor="middle" font-size="9" fill="#065f46">B6'</text>
  </g>

  <!-- Rack -->
  <g>
    <rect class="at-hover-card" x="30" y="410" width="540" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3"/>
    <text x="300" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Rack Awareness 副本策略（默认 3 副本）</text>
    <text x="300" y="448" text-anchor="middle" font-size="10" fill="#64748b">Block 1 → [DN1, DN2, DN3] · 2 副本同机架 + 1 副本异机架（容错 + 网络优化）</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M130,115 L180,115"/>
    <path d="M360,140 L380,140"/>
    <path d="M190,200 L110,240"/>
    <path d="M270,200 L300,240"/>
    <path d="M380,200 L490,240"/>
  </g>
</svg>
