<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >ES Searcher 打开与快照</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">SearcherManager · Refresh 重建 · Snapshot API 备份</text>

  <!-- Searcher 生命周期 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① Searcher 生命周期（SearcherManager）</text>

    <rect class="at-hover-card" x="40" y="105" width="520" height="110" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="125" width="105" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Searcher #1</text>
    <text x="107" y="157" text-anchor="middle" font-size="8" fill="#475569">segments: [s0,s1]</text>

    <path d="M 160 142 L 195 142" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
    <text x="177" y="135" font-size="8" font-weight="700" fill="#065f46">refresh</text>

    <rect class="at-hover-card" x="195" y="125" width="105" height="35" rx="3" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="247" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Searcher #2</text>
    <text x="247" y="157" text-anchor="middle" font-size="8" fill="#475569">segments: [s0,s1,s2]</text>

    <path d="M 300 142 L 335 142" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
    <text x="317" y="135" font-size="8" font-weight="700" fill="#065f46">refresh</text>

    <rect class="at-hover-card" x="335" y="125" width="105" height="35" rx="3" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="387" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Searcher #3</text>
    <text x="387" y="157" text-anchor="middle" font-size="8" fill="#475569">segments: [s2,s3]</text>

    <path d="M 440 142 L 475 142" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
    <text x="457" y="135" font-size="8" font-weight="700" fill="#065f46">refresh</text>

    <rect class="at-hover-card" x="475" y="125" width="75" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="512" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Searcher #4</text>
    <text x="512" y="157" text-anchor="middle" font-size="8" fill="#475569">...</text>

    <text x="55" y="185" font-size="9" fill="#475569">每个 Searcher 包含一组不可变 segment 视图；查询始终用最新（current Searcher）</text>
    <text x="55" y="200" font-size="9" fill="#475569">旧 Searcher 在用完后被 close（释放 FSDir/Heap）</text>
  </g>

  <!-- Refresh 机制 -->
  <g>
    <text x="60" y="235" font-size="13" font-weight="700" fill="#1e293b">② Refresh 触发 Searcher 重建</text>

    <rect class="at-hover-card" x="40" y="248" width="520" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="265" width="105" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="107" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">新 segment</text>
    <text x="107" y="297" text-anchor="middle" font-size="8" fill="#475569">buffer → segment</text>

    <path d="M 160 282 L 195 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <text x="178" y="275" font-size="8" fill="#475569" text-anchor="middle">+</text>

    <rect class="at-hover-card" x="195" y="265" width="120" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="255" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">DirectoryReader</text>
    <text x="255" y="297" text-anchor="middle" font-size="8" fill="#475569">openIfChanged()</text>

    <path d="M 315 282 L 350 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="350" y="265" width="120" height="35" rx="3" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="410" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">新 Searcher</text>
    <text x="410" y="297" text-anchor="middle" font-size="8" fill="#475569">原子切换</text>

    <path d="M 470 282 L 500 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="500" y="265" width="50" height="35" rx="3" fill="#1e293b"/>
    <text x="525" y="288" text-anchor="middle" font-size="9" font-weight="700" fill="#a7f3d0">warm</text>

    <text x="55" y="320" font-size="9" fill="#475569">⚠️ 切换是原子的（无锁，volatile 引用）→ 旧 Searcher 在所有查询结束后才被 close</text>
    <text x="55" y="335" font-size="9" fill="#475569">这是 ES NRT（近实时）核心：写入到可查 1s 延迟</text>
  </g>

  <!-- Snapshot API -->
  <g>
    <text x="60" y="370" font-size="13" font-weight="700" fill="#1e293b">③ Snapshot API 备份流程</text>

    <rect class="at-hover-card" x="40" y="383" width="520" height="80" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="398" width="100" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="105" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">PUT /_snapshot</text>
    <text x="105" y="430" text-anchor="middle" font-size="8" fill="#475569">repo / my_backup</text>

    <path d="M 155 415 L 185 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="185" y="398" width="100" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="235" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Copy segments</text>
    <text x="235" y="430" text-anchor="middle" font-size="8" fill="#475569">硬链接 / S3</text>

    <path d="M 285 415 L 315 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="315" y="398" width="105" height="35" rx="3" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="367" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Snapshot metadata</text>
    <text x="367" y="430" text-anchor="middle" font-size="8" fill="#475569">include_global_state</text>

    <path d="M 420 415 L 450 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="450" y="398" width="100" height="35" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="500" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">done</text>
    <text x="500" y="430" text-anchor="middle" font-size="8" fill="#475569">fsync + close</text>

    <text x="60" y="450" font-size="9" fill="#475569">⚠️ 不需要停写入，segment 不可变 → 拷贝瞬间即可；按 segment 增量（后续仅复制新 segment）</text>
  </g>
</svg>
