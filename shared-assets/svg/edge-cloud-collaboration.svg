<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">云边协同架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">端 → 边 → 云 · 分层处理 · 算力下沉</text>

  <!-- 3 层架构 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 端边云 3 层架构（数据流向）</text>

    <rect class="at-hover-card" x="40" y="100" width="120" height="280" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="100" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">端（Device）</text>
    <text x="55" y="148" font-size="10" fill="#475569">传感器 / PLC</text>
    <text x="55" y="166" font-size="10" fill="#475569">摄像头 / 网关</text>
    <text x="55" y="186" font-size="10" fill="#475569">· 采集原始数据</text>
    <text x="55" y="204" font-size="10" fill="#475569">· 简单预处理</text>
    <text x="55" y="222" font-size="10" fill="#10b981">· 资源受限</text>
    <text x="55" y="240" font-size="10" fill="#10b981">  低功耗 MCU</text>
    <text x="55" y="258" font-size="10" fill="#475569">· 协议：Modbus</text>
    <text x="55" y="274" font-size="10" fill="#475569">  MQTT</text>
    <text x="100" y="300" text-anchor="middle" font-size="9" fill="#10b981">数据上行</text>
    <text x="100" y="316" text-anchor="middle" font-size="9" fill="#10b981">指令下行</text>
    <text x="100" y="350" text-anchor="middle" font-size="9" fill="#475569">📍 现场层</text>

    <path d="M160,200 L195,200" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M195,260 L160,260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="195" y="100" width="120" height="280" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="255" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">边缘（Edge）</text>
    <text x="210" y="148" font-size="10" fill="#475569">边缘网关</text>
    <text x="210" y="166" font-size="10" fill="#475569">边缘节点 / K3s</text>
    <text x="210" y="186" font-size="10" fill="#475569">· 协议转换</text>
    <text x="210" y="204" font-size="10" fill="#475569">· 本地实时分析</text>
    <text x="210" y="222" font-size="10" fill="#475569">· AI 推理下沉</text>
    <text x="210" y="240" font-size="10" fill="#f59e0b">· 数据过滤</text>
    <text x="210" y="256" font-size="10" fill="#f59e0b">  减少上传带宽</text>
    <text x="210" y="276" font-size="10" fill="#475569">· KubeEdge / OpenYurt</text>
    <text x="255" y="350" text-anchor="middle" font-size="9" fill="#475569">📍 现场层</text>

    <path d="M315,200 L350,200" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M350,260 L315,260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="350" y="100" width="120" height="280" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="410" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">云（Cloud）</text>
    <text x="365" y="148" font-size="10" fill="#475569">K8s / 大数据集群</text>
    <text x="365" y="166" font-size="10" fill="#475569">AI 训练 / 大模型</text>
    <text x="365" y="186" font-size="10" fill="#475569">· 全局数据汇聚</text>
    <text x="365" y="204" font-size="10" fill="#475569">· 模型训练</text>
    <text x="365" y="222" font-size="10" fill="#475569">· 长期存储</text>
    <text x="365" y="240" font-size="10" fill="#1e40af">· 全局决策</text>
    <text x="365" y="258" font-size="10" fill="#1e40af">· 远程管理</text>
    <text x="365" y="276" font-size="10" fill="#475569">· 大数据查询</text>
    <text x="410" y="350" text-anchor="middle" font-size="9" fill="#475569">📍 中心层</text>

    <rect class="at-hover-card" x="485" y="100" width="75" height="280" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="522" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">典型场景</text>
    <text x="495" y="148" font-size="9" fill="#475569">· 工厂 IoT</text>
    <text x="495" y="164" font-size="9" fill="#475569">· 智能交通</text>
    <text x="495" y="180" font-size="9" fill="#475569">· 车联网</text>
    <text x="495" y="196" font-size="9" fill="#475569">· 智慧城市</text>
    <text x="495" y="212" font-size="9" fill="#475569">· 视频监控</text>
    <text x="495" y="228" font-size="9" fill="#475569">· 自动驾驶</text>
    <text x="522" y="260" text-anchor="middle" font-size="9" fill="#8b5cf6">延迟敏感</text>
    <text x="522" y="276" text-anchor="middle" font-size="9" fill="#8b5cf6">→ 边缘处理</text>
    <text x="522" y="295" text-anchor="middle" font-size="9" fill="#8b5cf6">训练密集</text>
    <text x="522" y="311" text-anchor="middle" font-size="9" fill="#8b5cf6">→ 云端处理</text>
  </g>

  <!-- 关键优势 -->
  <g>
    <text x="50" y="405" font-size="13" font-weight="700" fill="#1e293b">② 云边协同 4 大优势</text>

    <rect class="at-hover-card" x="40" y="415" width="125" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="102" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">低延迟</text>
    <text x="102" y="455" text-anchor="middle" font-size="9" fill="#475569">边缘就近处理</text>

    <rect class="at-hover-card" x="175" y="415" width="125" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="237" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">省带宽</text>
    <text x="237" y="455" text-anchor="middle" font-size="9" fill="#475569">本地预处理</text>

    <rect class="at-hover-card" x="310" y="415" width="125" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="372" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">高可用</text>
    <text x="372" y="455" text-anchor="middle" font-size="9" fill="#475569">断网可自治</text>

    <rect class="at-hover-card" x="445" y="415" width="115" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="502" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">易扩展</text>
    <text x="502" y="455" text-anchor="middle" font-size="9" fill="#475569">云端横向扩</text>
  </g>
</svg>
