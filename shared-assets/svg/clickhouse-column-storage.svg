<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">列存 vs 行存</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">OLAP 场景：只读几列聚合 → 列存 I/O 减少 10-100x</text>

  <!-- 行存示例 -->
  <g>
    <text x="40" y="92" font-size="12" font-weight="700" fill="#475569">行存（MySQL 默认）· 按行连续</text>

    <!-- 表头 -->
    <rect x="40" y="100" width="520" height="24" fill="#1e293b"/>
    <text x="105" y="116" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">id</text>
    <text x="225" y="116" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">name</text>
    <text x="345" y="116" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">city</text>
    <text x="465" y="116" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">score</text>

    <!-- 4 行 -->
    <g font-size="10">
      <rect x="40" y="124" width="170" height="20" fill="#fef3c7"/><text x="105" y="138" text-anchor="middle">1</text>
      <rect x="210" y="124" width="170" height="20" fill="#fef3c7"/><text x="295" y="138" text-anchor="middle">Alice</text>
      <rect x="380" y="124" width="80" height="20" fill="#fef3c7"/><text x="420" y="138" text-anchor="middle">BJ</text>
      <rect x="460" y="124" width="100" height="20" fill="#fef3c7"/><text x="510" y="138" text-anchor="middle">85</text>

      <rect x="40" y="144" width="170" height="20" fill="#fff"/><text x="105" y="158" text-anchor="middle">2</text>
      <rect x="210" y="144" width="170" height="20" fill="#fff"/><text x="295" y="158" text-anchor="middle">Bob</text>
      <rect x="380" y="144" width="80" height="20" fill="#fff"/><text x="420" y="158" text-anchor="middle">SH</text>
      <rect x="460" y="144" width="100" height="20" fill="#fff"/><text x="510" y="158" text-anchor="middle">92</text>

      <rect x="40" y="164" width="170" height="20" fill="#fef3c7"/><text x="105" y="178" text-anchor="middle">3</text>
      <rect x="210" y="164" width="170" height="20" fill="#fef3c7"/><text x="295" y="178" text-anchor="middle">Cara</text>
      <rect x="380" y="164" width="80" height="20" fill="#fef3c7"/><text x="420" y="178" text-anchor="middle">BJ</text>
      <rect x="460" y="164" width="100" height="20" fill="#fef3c7"/><text x="510" y="178" text-anchor="middle">78</text>
    </g>

    <!-- 选中区域 -->
    <rect x="370" y="100" width="100" height="84" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3"/>
    <text x="420" y="200" text-anchor="middle" font-size="9" fill="#dc2626">SELECT city, AVG(score)</text>
    <text x="420" y="213" text-anchor="middle" font-size="9" fill="#dc2626">→ 读 4 行全部字段 ❌</text>
  </g>

  <!-- 列存示例 -->
  <g>
    <text x="40" y="240" font-size="12" font-weight="700" fill="#475569">列存（ClickHouse）· 按列连续</text>

    <!-- 4 列并排 -->
    <g font-size="10">
      <rect x="40" y="250" width="100" height="80" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="90" y="270" text-anchor="middle" font-weight="700" fill="#1e40af">id</text>
      <text x="90" y="290" text-anchor="middle">1</text>
      <text x="90" y="305" text-anchor="middle">2</text>
      <text x="90" y="320" text-anchor="middle">3</text>

      <rect x="145" y="250" width="120" height="80" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="205" y="270" text-anchor="middle" font-weight="700" fill="#5b21b6">name</text>
      <text x="205" y="290" text-anchor="middle">Alice</text>
      <text x="205" y="305" text-anchor="middle">Bob</text>
      <text x="205" y="320" text-anchor="middle">Cara</text>

      <rect x="270" y="250" width="100" height="80" fill="#d1fae5" stroke="#10b981"/>
      <text x="320" y="270" text-anchor="middle" font-weight="700" fill="#065f46">city</text>
      <text x="320" y="290" text-anchor="middle">BJ</text>
      <text x="320" y="305" text-anchor="middle">SH</text>
      <text x="320" y="320" text-anchor="middle">BJ</text>

      <rect x="375" y="250" width="120" height="80" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="435" y="270" text-anchor="middle" font-weight="700" fill="#92400e">score</text>
      <text x="435" y="290" text-anchor="middle">85</text>
      <text x="435" y="305" text-anchor="middle">92</text>
      <text x="435" y="320" text-anchor="middle">78</text>
    </g>

    <!-- 选中列 -->
    <rect x="260" y="245" width="120" height="90" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="3"/>
    <rect x="370" y="245" width="130" height="90" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="3"/>

    <text x="320" y="350" text-anchor="middle" font-size="9" fill="#059669">SELECT city, AVG(score) → 只读 city + score 两列 ✓</text>
    <text x="320" y="365" text-anchor="middle" font-size="9" fill="#059669">+ 同列压缩比 5-10x（Delta/RLE/Dict）</text>
  </g>

  <text x="300" y="378" text-anchor="middle" font-size="10" fill="#64748b">§8.72+ v7 · clickhouse</text>
</svg>
