<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >K8s 健康/就绪/启动探针</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">livenessProbe · readinessProbe · startupProbe · Pod 生命周期</text>

  <!-- 3 探针对比 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① 3 种探针对比</text>

    <rect class="at-hover-card" x="40" y="100" width="170" height="115" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="125" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">livenessProbe</text>
    <text x="125" y="142" text-anchor="middle" font-size="10" fill="#475569">存活探针</text>
    <text x="55" y="162" font-size="10" fill="#475569">失败 → 重启 Pod</text>
    <text x="55" y="180" font-size="10" fill="#475569">问：进程还活着吗？</text>
    <text x="55" y="198" font-size="9" fill="#dc2626">⚠️ 不要指向外部依赖</text>
    <text x="55" y="212" font-size="9" fill="#475569">例：HTTP /healthz</text>

    <rect class="at-hover-card" x="220" y="100" width="170" height="115" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="305" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">readinessProbe</text>
    <text x="305" y="142" text-anchor="middle" font-size="10" fill="#475569">就绪探针</text>
    <text x="235" y="162" font-size="10" fill="#475569">失败 → 摘除 Service</text>
    <text x="235" y="180" font-size="10" fill="#475569">问：能接流量吗？</text>
    <text x="235" y="198" font-size="9" fill="#10b981">✅ 可依赖外部服务</text>
    <text x="235" y="212" font-size="9" fill="#475569">例：HTTP /ready</text>

    <rect class="at-hover-card" x="400" y="100" width="170" height="115" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="485" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">startupProbe</text>
    <text x="485" y="142" text-anchor="middle" font-size="10" fill="#475569">启动探针（1.20+）</text>
    <text x="415" y="162" font-size="10" fill="#475569">保护慢启动应用</text>
    <text x="415" y="180" font-size="10" fill="#475569">成功前暂停另两个</text>
    <text x="415" y="198" font-size="9" fill="#3b82f6">⏱ 慢启动场景必备</text>
    <text x="415" y="212" font-size="9" fill="#475569">例：Java 启动 60s</text>
  </g>

  <!-- Pod 生命周期 -->
  <g>
    <text x="50" y="245" font-size="13" font-weight="700" fill="#1e293b">② Pod 生命周期（探针状态机）</text>

    <rect class="at-hover-card" x="40" y="255" width="105" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="92" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Pending</text>
    <text x="92" y="295" text-anchor="middle" font-size="9" fill="#475569">调度中</text>

    <path d="M145,283 L175,283" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="175" y="255" width="105" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="227" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Initializing</text>
    <text x="227" y="295" text-anchor="middle" font-size="9" fill="#475569">startupProbe</text>

    <path d="M280,283 L310,283" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="310" y="255" width="105" height="55" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="362" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Running</text>
    <text x="362" y="295" text-anchor="middle" font-size="9" fill="#475569">readiness + liveness</text>

    <path d="M415,283 L445,283" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="445" y="255" width="115" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="502" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Terminated</text>
    <text x="502" y="295" text-anchor="middle" font-size="9" fill="#475569">liveness 失败重启</text>
  </g>

  <!-- 关键参数 -->
  <g>
    <text x="50" y="345" font-size="13" font-weight="700" fill="#1e293b">③ 探针 4 个核心参数</text>

    <rect class="at-hover-card" x="40" y="355" width="120" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="100" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="monospace">initialDelay</text>
    <text x="55" y="398" font-size="9" fill="#475569">首次延迟</text>
    <text x="55" y="411" font-size="9" fill="#475569">建议 0 或短</text>

    <rect class="at-hover-card" x="170" y="355" width="120" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="230" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" font-family="monospace">periodSeconds</text>
    <text x="185" y="398" font-size="9" fill="#475569">检测周期</text>
    <text x="185" y="411" font-size="9" fill="#475569">默认 10s</text>

    <rect class="at-hover-card" x="300" y="355" width="120" height="60" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="360" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#047857" font-family="monospace">timeoutSeconds</text>
    <text x="315" y="398" font-size="9" fill="#475569">超时时间</text>
    <text x="315" y="411" font-size="9" fill="#475569">默认 1s</text>

    <rect class="at-hover-card" x="430" y="355" width="130" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="495" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" font-family="monospace">failureThreshold</text>
    <text x="445" y="398" font-size="9" fill="#475569">失败阈值</text>
    <text x="445" y="411" font-size="9" fill="#475569">默认 3 次</text>
  </g>

  <!-- 关键点 -->
  <text x="300" y="455" text-anchor="middle" font-size="10" fill="#64748b">💡 liveness 不要指外部依赖（DB 挂了 ≠ Pod 该死）· readiness 用于滚动更新期间摘流量</text>
  <text x="300" y="472" text-anchor="middle" font-size="10" fill="#10b981">📌 startupProbe 适合 Java/ELK 等冷启动慢的应用（failureThreshold 可调高到 30）</text>
</svg>
