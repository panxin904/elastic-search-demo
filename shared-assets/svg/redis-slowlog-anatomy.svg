<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Redis 慢查询分析</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">SLOWLOG GET · 阈值配置 · 4 步定位法</text>

  <!-- SLOWLOG 三命令 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① SLOWLOG 三个核心命令</text>

    <rect x="40" y="100" width="160" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af" font-family="monospace">SLOWLOG GET [n]</text>
    <text x="55" y="145" font-size="10" fill="#475569">查看最近 n 条慢日志</text>
    <text x="55" y="161" font-size="10" fill="#475569">默认返回所有</text>
    <text x="55" y="175" font-size="9" fill="#3b82f6">例: SLOWLOG GET 10</text>

    <rect x="220" y="100" width="160" height="80" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#047857" font-family="monospace">SLOWLOG LEN</text>
    <text x="235" y="145" font-size="10" fill="#475569">当前慢日志条数</text>
    <text x="235" y="161" font-size="10" fill="#475569">用于监控告警</text>
    <text x="235" y="175" font-size="9" fill="#10b981">例: > 100 告警</text>

    <rect x="400" y="100" width="160" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="480" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" font-family="monospace">SLOWLOG RESET</text>
    <text x="415" y="145" font-size="10" fill="#475569">清空慢日志</text>
    <text x="415" y="161" font-size="10" fill="#475569">运维诊断后清理</text>
    <text x="415" y="175" font-size="9" fill="#dc2626">⚠️ 重置后无法恢复</text>
  </g>

  <!-- 慢日志条目结构 -->
  <g>
    <text x="50" y="210" font-size="13" font-weight="700" fill="#1e293b">② 慢日志条目结构（4 个字段）</text>

    <rect x="40" y="220" width="520" height="70" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="242" font-size="10" font-weight="700" fill="#10b981">1) id</text>
    <text x="100" y="242" font-size="10" fill="#e2e8f0" font-family="monospace">唯一递增 ID</text>
    <text x="280" y="242" font-size="10" font-weight="700" fill="#10b981">2) timestamp</text>
    <text x="380" y="242" font-size="10" fill="#e2e8f0" font-family="monospace">Unix 时间戳</text>
    <text x="55" y="262" font-size="10" font-weight="700" fill="#10b981">3) duration</text>
    <text x="135" y="262" font-size="10" fill="#e2e8f0" font-family="monospace">耗时（微秒）</text>
    <text x="280" y="262" font-size="10" font-weight="700" fill="#10b981">4) command + args</text>
    <text x="55" y="282" font-size="9" fill="#94a3b8">GET food:counter  ·  200ms  ·  KEYS user:*  ·  O(N) 全表扫描</text>
  </g>

  <!-- 配置 -->
  <g>
    <text x="50" y="320" font-size="13" font-weight="700" fill="#1e293b">③ 关键配置（slowlog-log-slower-than / max-len）</text>

    <rect x="40" y="330" width="255" height="75" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="352" font-size="11" font-weight="700" fill="#92400e" font-family="monospace">slowlog-log-slower-than</text>
    <text x="55" y="372" font-size="10" fill="#475569">阈值（微秒），超过才记录</text>
    <text x="55" y="388" font-size="10" fill="#475569">10000 = 10ms</text>
    <text x="55" y="402" font-size="9" font-weight="700" fill="#92400e">建议: 5-10ms（业务敏感型）</text>

    <rect x="305" y="330" width="255" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="320" y="352" font-size="11" font-weight="700" fill="#1e40af" font-family="monospace">slowlog-max-len</text>
    <text x="320" y="372" font-size="10" fill="#475569">最多保留条数（FIFO 队列）</text>
    <text x="320" y="388" font-size="10" fill="#475569">默认 128，可调到 1000</text>
    <text x="320" y="402" font-size="9" font-weight="700" fill="#1e40af">建议: 1000（足够诊断）</text>
  </g>

  <!-- 4 步定位法 -->
  <g>
    <text x="50" y="430" font-size="13" font-weight="700" fill="#1e293b">④ 慢查询定位 4 步法</text>

    <text x="50" y="452" font-size="11" fill="#475569">① SLOWLOG GET 10  →  ② 找出 O(N) 命令（KEYS/HGETALL/SMEMBERS）  →  ③ 替换为 SSCAN/HSCAN/ZSCAN  →  ④ 建立 bigkey 监控</text>
  </g>
</svg>
