<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">ES Mapping 字段类型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">text / keyword / numeric / date / object · 是否分词</text>

  <!-- 核心类型 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 字符串类型：text vs keyword</text>

    <rect x="40" y="105" width="250" height="155" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="165" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">text（全文检索）</text>
    <text x="55" y="150" font-size="10" fill="#475569">• 默认分词（standard）</text>
    <text x="55" y="166" font-size="10" fill="#475569">• 倒排索引</text>
    <text x="55" y="182" font-size="10" fill="#475569">• 不支持聚合 / 排序</text>
    <text x="55" y="198" font-size="10" font-family="monospace" fill="#1e293b">"Hello World"</text>
    <text x="55" y="213" font-size="9" fill="#1e293b">→ [hello, world]</text>
    <text x="55" y="230" font-size="10" font-weight="700" fill="#1e40af">场景：文章正文、描述</text>
    <text x="55" y="247" font-size="9" font-family="monospace" fill="#475569">"type": "text"</text>

    <rect x="310" y="105" width="250" height="155" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">keyword（精确匹配）</text>
    <text x="325" y="150" font-size="10" fill="#475569">• 不分词，完整存储</text>
    <text x="325" y="166" font-size="10" fill="#475569">• 倒排索引（整字符串）</text>
    <text x="325" y="182" font-size="10" fill="#475569">• 支持聚合 / 排序</text>
    <text x="325" y="198" font-size="10" font-family="monospace" fill="#1e293b">"Hello World"</text>
    <text x="325" y="213" font-size="9" fill="#1e293b">→ ["Hello World"]</text>
    <text x="325" y="230" font-size="10" font-weight="700" fill="#065f46">场景：tag、status、枚举</text>
    <text x="325" y="247" font-size="9" font-family="monospace" fill="#475569">"type": "keyword"</text>
  </g>

  <!-- 数值/日期 -->
  <g>
    <text x="60" y="280" font-size="13" font-weight="700" fill="#1e293b">② 数值 / 日期 / 对象类型</text>

    <rect x="40" y="295" width="125" height="80" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="102" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">numeric</text>
    <text x="55" y="332" font-size="9" fill="#475569">long / integer /</text>
    <text x="55" y="347" font-size="9" fill="#475569">short / byte /</text>
    <text x="55" y="362" font-size="9" fill="#475569">double / float</text>

    <rect x="170" y="295" width="125" height="80" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="232" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">date</text>
    <text x="185" y="332" font-size="9" fill="#475569">"2026-09-04"</text>
    <text x="185" y="347" font-size="9" font-family="monospace" fill="#1e293b">epoch_millis</text>
    <text x="185" y="362" font-size="9" fill="#475569">"yyyy-MM-dd"</text>

    <rect x="300" y="295" width="125" height="80" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="362" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">boolean</text>
    <text x="315" y="332" font-size="9" fill="#475569">true / false</text>
    <text x="315" y="347" font-size="9" fill="#475569">存为 0/1</text>
    <text x="315" y="362" font-size="9" fill="#475569">不索引</text>

    <rect x="430" y="295" width="130" height="80" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="495" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">object / nested</text>
    <text x="445" y="332" font-size="9" fill="#475569">嵌套对象</text>
    <text x="445" y="347" font-size="9" fill="#475569">nested 保留关系</text>
    <text x="445" y="362" font-size="9" fill="#475569">object 拍平</text>
  </g>

  <!-- 复合类型 -->
  <g>
    <text x="60" y="395" font-size="13" font-weight="700" fill="#1e293b">③ 复合 / 特殊类型</text>

    <rect x="40" y="410" width="165" height="55" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="122" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">array</text>
    <text x="55" y="445" font-size="9" fill="#475569">同类型元素数组</text>
    <text x="55" y="459" font-size="9" font-family="monospace" fill="#1e293b">tags: [a, b, c]</text>

    <rect x="220" y="410" width="165" height="55" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="302" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">geo_point / geo_shape</text>
    <text x="235" y="445" font-size="9" fill="#475569">地理位置</text>
    <text x="235" y="459" font-size="9" font-family="monospace" fill="#1e293b">{lat, lon}</text>

    <rect x="400" y="410" width="160" height="55" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="480" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">ip / completion</text>
    <text x="415" y="445" font-size="9" fill="#475569">IP 范围 / 自动补全</text>
    <text x="415" y="459" font-size="9" font-family="monospace" fill="#1e293b">"192.168.1.0/24"</text>
  </g>
</svg>
