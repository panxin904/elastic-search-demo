<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >ConfigMap vs Secret</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">K8s 两种配置存储方式 · 明文 vs base64 · 挂载方式</text>

  <!-- ConfigMap 列 -->
  <g>
    <rect class="at-hover-card" x="30" y="80" width="265" height="350" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="162" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">ConfigMap</text>
    <text x="162" y="123" text-anchor="middle" font-size="10" fill="#475569">非敏感配置 · 明文存储</text>

    <text x="45" y="150" font-size="11" font-weight="700" fill="#1e293b">典型用途</text>
    <text x="45" y="167" font-size="10" fill="#475569">• 应用配置文件（nginx.conf）</text>
    <text x="45" y="183" font-size="10" fill="#475569">• 环境变量</text>
    <text x="45" y="199" font-size="10" fill="#475569">• 命令行参数</text>
    <text x="45" y="215" font-size="10" fill="#475569">• 证书公钥（证书文件）</text>

    <text x="45" y="240" font-size="11" font-weight="700" fill="#1e293b">数据结构</text>
    <rect class="at-hover-card" x="45" y="250" width="235" height="80" rx="3" fill="#1e293b"/>
    <text x="55" y="268" font-size="9" font-family="monospace" fill="#a7f3d0">data:</text>
    <text x="55" y="282" font-size="9" font-family="monospace" fill="#a7f3d0">  app.conf: |</text>
    <text x="55" y="296" font-size="9" font-family="monospace" fill="#fde68a">    server.port=8080</text>
    <text x="55" y="310" font-size="9" font-family="monospace" fill="#fde68a">    db.host=mysql</text>
    <text x="55" y="324" font-size="9" font-family="monospace" fill="#a7f3d0">  log.level: "info"</text>

    <text x="45" y="350" font-size="11" font-weight="700" fill="#1e293b">大小限制</text>
    <text x="45" y="367" font-size="10" fill="#475569">1 MiB（etcd 限制）</text>

    <text x="45" y="392" font-size="11" font-weight="700" fill="#1e293b">安全</text>
    <text x="45" y="409" font-size="10" fill="#475569">明文 · 可被 RBAC 读</text>
  </g>

  <!-- Secret 列 -->
  <g>
    <rect class="at-hover-card" x="305" y="80" width="265" height="350" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="437" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Secret</text>
    <text x="437" y="123" text-anchor="middle" font-size="10" fill="#475569">敏感配置 · base64 编码</text>

    <text x="320" y="150" font-size="11" font-weight="700" fill="#1e293b">典型用途</text>
    <text x="320" y="167" font-size="10" fill="#475569">• 密码 / API Token</text>
    <text x="320" y="183" font-size="10" fill="#475569">• TLS 私钥</text>
    <text x="320" y="199" font-size="10" fill="#475569">• Docker registry 凭证</text>
    <text x="320" y="215" font-size="10" fill="#475569">• OAuth client_secret</text>

    <text x="320" y="240" font-size="11" font-weight="700" fill="#1e293b">数据结构</text>
    <rect class="at-hover-card" x="320" y="250" width="235" height="80" rx="3" fill="#1e293b"/>
    <text x="330" y="268" font-size="9" font-family="monospace" fill="#a7f3d0">data:</text>
    <text x="330" y="282" font-size="9" font-family="monospace" fill="#fca5a5">  db-password:</text>
    <text x="330" y="296" font-size="9" font-family="monospace" fill="#fde68a">    cGFzc3dvcmQxMjM=</text>
    <text x="330" y="310" font-size="9" font-family="monospace" fill="#fca5a5">  tls.key:</text>
    <text x="330" y="324" font-size="9" font-family="monospace" fill="#fde68a">    LS0tLS1CRUdJTi...</text>

    <text x="320" y="350" font-size="11" font-weight="700" fill="#1e293b">类型</text>
    <text x="320" y="367" font-size="10" fill="#475569">Opaque / kubernetes.io/tls</text>

    <text x="320" y="392" font-size="11" font-weight="700" fill="#1e293b">安全增强</text>
    <text x="320" y="409" font-size="10" fill="#475569">encryption at rest · RBAC</text>
  </g>

  <!-- 共享挂载方式 -->
  <g>
    <rect class="at-hover-card" x="30" y="445" width="540" height="22" rx="4" fill="#fef9c3" stroke="#facc15"/>
    <text x="300" y="461" text-anchor="middle" font-size="10" fill="#854d0e">挂载方式相同：envFrom / volumeMounts（subPath 隔离单 key）· 两者在 Pod 内都是文件，无安全差异</text>
  </g>
</svg>
