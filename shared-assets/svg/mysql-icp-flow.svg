<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL ICP 索引下推优化</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Index Condition Pushdown · 5.6+ 默认开启 · 减少回表</text>

  <!-- ICP 关闭 vs 开启对比 -->
  <g>
    <text x="50" y="90" font-size="13" font-weight="700" fill="#1e293b">① ICP 关闭 vs 开启（执行流程对比）</text>

    <rect x="40" y="100" width="260" height="155" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="170" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">❌ ICP 关闭（老版本）</text>
    <text x="55" y="143" font-size="10" fill="#475569">SQL: SELECT * WHERE name LIKE '张%' AND age &gt; 20</text>
    <text x="55" y="162" font-size="10" fill="#475569">1️⃣ 索引：扫到 name='张%'（100 条）</text>
    <text x="55" y="180" font-size="10" fill="#475569">2️⃣ 逐条回表查完整行</text>
    <text x="55" y="198" font-size="10" fill="#475569">3️⃣ Server 层过滤 age &gt; 20</text>
    <text x="55" y="216" font-size="10" fill="#dc2626">⚠️ 100 次回表，99 次是浪费</text>
    <text x="55" y="234" font-size="9" fill="#475569">回表 IO：100 次</text>
    <text x="55" y="246" font-size="9" fill="#dc2626">网络传输：100 行完整数据</text>

    <rect x="310" y="100" width="250" height="155" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">✅ ICP 开启（5.6+ 默认）</text>
    <text x="325" y="143" font-size="10" fill="#475569">SQL: 同上</text>
    <text x="325" y="162" font-size="10" fill="#475569">1️⃣ 索引：扫到 name='张%'</text>
    <text x="325" y="180" font-size="10" fill="#10b981">2️⃣ 引擎层直接过滤 age &gt; 20</text>
    <text x="325" y="198" font-size="10" fill="#475569">3️⃣ 仅回表满足条件的 10 条</text>
    <text x="325" y="216" font-size="10" fill="#10b981">✅ 提前过滤掉 90 条无效回表</text>
    <text x="325" y="234" font-size="9" fill="#475569">回表 IO：10 次（-90%）</text>
    <text x="325" y="246" font-size="9" fill="#10b981">网络传输：10 行（-90%）</text>
  </g>

  <!-- 索引下推流程图 -->
  <g>
    <text x="50" y="285" font-size="13" font-weight="700" fill="#1e293b">② ICP 执行流程（5 步）</text>

    <rect x="40" y="295" width="100" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Server 层</text>
    <text x="90" y="335" text-anchor="middle" font-size="9" fill="#475569">下推条件</text>

    <path d="M140,322 L175,322" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="175" y="295" width="100" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="225" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">索引扫描</text>
    <text x="225" y="335" text-anchor="middle" font-size="9" fill="#475569">name='张%'</text>

    <path d="M275,322 L310,322" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="310" y="295" width="120" height="55" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="370" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">ICP 过滤</text>
    <text x="370" y="335" text-anchor="middle" font-size="9" fill="#475569">age &gt; 20（引擎层）</text>

    <path d="M430,322 L465,322" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="465" y="295" width="95" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="512" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">回表</text>
    <text x="512" y="335" text-anchor="middle" font-size="9" fill="#475569">仅返回行</text>
  </g>

  <!-- 关键配置 -->
  <g>
    <text x="50" y="380" font-size="13" font-weight="700" fill="#1e293b">③ 关键配置 + 适用场景</text>

    <rect x="40" y="390" width="255" height="65" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
    <text x="55" y="412" font-size="10" font-weight="700" fill="#10b981"># 默认 ON（5.6+）</text>
    <text x="55" y="427" font-size="10" fill="#e2e8f0" font-family="monospace">SET optimizer_switch='index_condition_pushdown=on';</text>
    <text x="55" y="445" font-size="9" fill="#94a3b8">EXPLAIN 中 Extra: Using index condition = 命中 ICP</text>

    <rect x="305" y="390" width="255" height="65" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="320" y="412" font-size="11" font-weight="700" fill="#1e40af">✅ 适用场景</text>
    <text x="320" y="428" font-size="10" fill="#475569">复合索引 · LIKE 前缀 · 范围条件</text>
    <text x="320" y="445" font-size="9" fill="#3b82f6">⚠️ 不适用：覆盖索引 / 主键查询</text>
  </g>
</svg>
