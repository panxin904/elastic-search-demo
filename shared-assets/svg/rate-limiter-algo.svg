<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >限流算法对比</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">固定窗口 / 滑动窗口 / 令牌桶 / 漏桶</text>

  <!-- 4 个算法卡片 -->
  <g font-size="11" font-weight="700">
    <!-- 固定窗口 -->
    <rect x="40" y="100" width="125" height="240" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="102" y="125" text-anchor="middle" font-size="13" fill="#1e3a8a">固定窗口</text>
    <text x="102" y="142" text-anchor="middle" font-size="10" fill="#1e40af">Fixed Window</text>

    <rect x="50" y="155" width="105" height="22" rx="3" fill="#3b82f6" opacity="0.9"/>
    <text x="102" y="170" text-anchor="middle" font-size="10" fill="white">00-01s · 100</text>

    <rect x="50" y="178" width="105" height="22" rx="3" fill="#10b981" opacity="0.9"/>
    <text x="102" y="193" text-anchor="middle" font-size="10" fill="white">01-02s · 100</text>

    <text x="102" y="220" text-anchor="middle" font-size="10" fill="#1e40af">简单 · 边界突刺</text>
    <text x="102" y="240" text-anchor="middle" font-size="10" fill="#1e40af">99/01 各 100</text>
    <text x="102" y="255" text-anchor="middle" font-size="10" fill="#1e40af">= 200/s 实际</text>

    <!-- 滑动窗口 -->
    <rect x="180" y="100" width="125" height="240" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="242" y="125" text-anchor="middle" font-size="13" fill="#064e3b">滑动窗口</text>
    <text x="242" y="142" text-anchor="middle" font-size="10" fill="#065f46">Sliding</text>

    <rect x="190" y="155" width="105" height="22" rx="3" fill="#10b981" opacity="0.9"/>
    <text x="242" y="170" text-anchor="middle" font-size="10" fill="white">最近 1s · 100</text>

    <rect x="190" y="178" width="105" height="22" rx="3" fill="#10b981" opacity="0.9"/>
    <text x="242" y="193" text-anchor="middle" font-size="10" fill="white">精确 · 平滑</text>

    <text x="242" y="220" text-anchor="middle" font-size="10" fill="#065f46">滑动 log/counter</text>
    <text x="242" y="240" text-anchor="middle" font-size="10" fill="#065f46">内存成本高</text>

    <!-- 令牌桶 -->
    <rect x="320" y="100" width="125" height="240" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="382" y="125" text-anchor="middle" font-size="13" fill="#92400e">令牌桶</text>
    <text x="382" y="142" text-anchor="middle" font-size="10" fill="#78350f">Token Bucket</text>

    <ellipse cx="382" cy="178" rx="35" ry="12" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="365" cy="178" r="3" fill="#f59e0b"/>
    <circle cx="380" cy="175" r="3" fill="#f59e0b"/>
    <circle cx="395" cy="180" r="3" fill="#f59e0b"/>

    <text x="382" y="220" text-anchor="middle" font-size="10" fill="#78350f">恒定速率补充</text>
    <text x="382" y="240" text-anchor="middle" font-size="10" fill="#78350f">允许突发流量</text>

    <!-- 漏桶 -->
    <rect x="460" y="100" width="100" height="240" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="510" y="125" text-anchor="middle" font-size="13" fill="#9f1239">漏桶</text>
    <text x="510" y="142" text-anchor="middle" font-size="10" fill="#9d174d">Leaky Bucket</text>

    <path d="M470,165 L550,165 L545,225 L475,225 Z" fill="none" stroke="#ec4899" stroke-width="2"/>
    <line x1="510" y1="225" x2="510" y2="245" stroke="#ec4899" stroke-width="2"/>
    <path d="M505,245 L515,245 L510,255" fill="none" stroke="#ec4899" stroke-width="2"/>

    <text x="510" y="220" text-anchor="middle" font-size="10" fill="#9d174d">恒定速率流出</text>
    <text x="510" y="240" text-anchor="middle" font-size="10" fill="#9d174d">强制平滑</text>
  </g>

  <!-- 选型矩阵 -->
  <g font-size="11">
    <rect x="40" y="365" width="520" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="385" text-anchor="middle" font-weight="700" fill="#1e293b">选型指南</text>
    <text x="60" y="405" fill="#475569">固定窗口：简单场景 · 监控告警</text>
    <text x="60" y="423" fill="#475569">滑动窗口：精确控制 · API 网关配额</text>
    <text x="60" y="441" fill="#475569">令牌桶：允许突发 · 用户体验优先</text>
    <text x="320" y="405" fill="#475569">漏桶：严格平滑 · 保护下游</text>
    <text x="320" y="423" fill="#475569">组合：网关用令牌桶 + 后端用漏桶</text>
    <text x="320" y="441" fill="#475569">分布式：Redis + Lua 原子脚本</text>
  </g>
</svg>
