<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >CPython 解释器架构</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">.py → AST → Bytecode → PVM · GIL · 内存管理</text>

  <!-- 流水线 -->
  <g>
    <text x="300" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">解释执行流水线</text>

    <g>
      <rect x="20" y="105" width="100" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="70" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">.py 源码</text>
      <text x="70" y="145" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">def foo():</text>

      <rect x="135" y="105" width="100" height="55" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="185" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Tokenizer</text>
      <text x="185" y="145" text-anchor="middle" font-size="9" fill="#475569">词法分析</text>

      <rect x="250" y="105" width="100" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="300" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Parser</text>
      <text x="300" y="145" text-anchor="middle" font-size="9" fill="#475569">→ AST</text>

      <rect x="365" y="105" width="100" height="55" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="415" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Compiler</text>
      <text x="415" y="145" text-anchor="middle" font-size="9" fill="#475569">AST → Code</text>

      <rect x="480" y="105" width="100" height="55" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
      <text x="530" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">PVM</text>
      <text x="530" y="145" text-anchor="middle" font-size="9" fill="#475569">执行字节码</text>
    </g>

    <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
      <path d="M120,132 L135,132"/>
      <path d="M235,132 L250,132"/>
      <path d="M350,132 L365,132"/>
      <path d="M465,132 L480,132"/>
    </g>
  </g>

  <!-- PVM 内部 -->
  <g>
    <rect x="20" y="180" width="560" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Python Virtual Machine（PVM）</text>

    <rect x="35" y="220" width="130" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="100" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Code Object</text>
    <text x="100" y="256" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">co_code / co_consts</text>
    <text x="100" y="270" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">co_names / co_varnames</text>

    <rect x="175" y="220" width="130" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="240" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Frame（栈帧）</text>
    <text x="240" y="256" text-anchor="middle" font-size="9" fill="#475569">valuestack · locals</text>
    <text x="240" y="270" text-anchor="middle" font-size="9" fill="#475569">globals · bytecode ptr</text>

    <rect x="315" y="220" width="120" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="375" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Interpreter</text>
    <text x="375" y="256" text-anchor="middle" font-size="9" fill="#475569">eval loop</text>
    <text x="375" y="270" text-anchor="middle" font-size="9" fill="#475569">100+ 字节码指令</text>

    <rect x="445" y="220" width="120" height="65" rx="6" fill="white" stroke="#f59e0b"/>
    <text x="505" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">C Extension</text>
    <text x="505" y="256" text-anchor="middle" font-size="9" fill="#475569">numpy · pandas · lxml</text>
    <text x="505" y="270" text-anchor="middle" font-size="9" fill="#475569">直接调 C 库</text>
  </g>

  <!-- 内存 + GIL -->
  <g>
    <rect x="20" y="315" width="270" height="160" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="155" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">内存管理</text>

    <rect x="35" y="350" width="240" height="30" rx="4" fill="white" stroke="#10b981"/>
    <text x="155" y="370" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">引用计数（主策略）</text>

    <rect x="35" y="385" width="240" height="30" rx="4" fill="white" stroke="#10b981"/>
    <text x="155" y="405" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">GC（循环引用检测）</text>

    <rect x="35" y="420" width="240" height="50" rx="4" fill="white" stroke="#10b981"/>
    <text x="155" y="438" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">分代 GC（3 代）</text>
    <text x="155" y="452" text-anchor="middle" font-size="9" fill="#475569">0 / 1 / 2 · 阈值触发</text>
    <text x="155" y="465" text-anchor="middle" font-size="9" fill="#475569">gc.get_threshold() 默认 (700,10,10)</text>
  </g>

  <g>
    <rect x="310" y="315" width="270" height="160" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="445" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">GIL（全局解释器锁）</text>

    <rect x="325" y="350" width="240" height="50" rx="4" fill="white" stroke="#ef4444"/>
    <text x="445" y="370" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">同一时刻只有 1 线程执行字节码</text>
    <text x="445" y="385" text-anchor="middle" font-size="9" fill="#475569">保护 CPython 内存管理不被并发破坏</text>
    <text x="445" y="397" text-anchor="middle" font-size="9" fill="#475569">I/O 等待时主动释放（time.sleep / 网络）</text>

    <rect x="325" y="410" width="240" height="55" rx="4" fill="white" stroke="#ef4444"/>
    <text x="445" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">绕过方案</text>
    <text x="445" y="442" text-anchor="middle" font-size="9" fill="#475569">multiprocessing（多进程）</text>
    <text x="445" y="454" text-anchor="middle" font-size="9" fill="#475569">C 扩展（numpy 释放 GIL）</text>
    <text x="445" y="463" text-anchor="middle" font-size="9" fill="#475569">async/await（单线程协作）</text>
  </g>
</svg>
