<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >Kubernetes CRD 扩展机制</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">CustomResourceDefinition · OpenAPI schema · Operator 控制器</text>

  <!-- 三层架构 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① CRD 三层扩展模型</text>

    <rect class="at-hover-card" x="40" y="105" width="520" height="125" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <!-- 用户层 -->
    <rect class="at-hover-card" x="60" y="120" width="160" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">用户层</text>
    <text x="140" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">CR (CustomResource)</text>
    <text x="75" y="185" font-size="9" fill="#475569">kubectl apply -f</text>
    <text x="75" y="200" font-size="9" fill="#475569">my-app.yaml</text>
    <text x="75" y="215" font-size="9" font-weight="700" fill="#1e293b">类比：CRD 是 class</text>

    <!-- API 层 -->
    <rect class="at-hover-card" x="240" y="120" width="160" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">API 层</text>
    <text x="320" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">CRD 定义</text>
    <text x="255" y="185" font-size="9" fill="#475569">OpenAPI v3 schema</text>
    <text x="255" y="200" font-size="9" fill="#475569">验证 + 持久化到 etcd</text>
    <text x="255" y="215" font-size="9" font-weight="700" fill="#1e293b">类比：CR 是 instance</text>

    <!-- 控制层 -->
    <rect class="at-hover-card" x="420" y="120" width="120" height="100" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">控制层</text>
    <text x="480" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Controller</text>
    <text x="435" y="185" font-size="9" fill="#475569">watch CR 变化</text>
    <text x="435" y="200" font-size="9" fill="#475569">reconcile 调谐</text>
    <text x="435" y="215" font-size="9" font-weight="700" fill="#1e293b">类比：方法</text>

    <!-- 箭头 -->
    <path d="M 220 170 L 240 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 400 170 L 420 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 480 220 L 320 230 L 140 220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3,2"/>
  </g>

  <!-- CRD YAML 例子 -->
  <g>
    <text x="60" y="252" font-size="13" font-weight="700" fill="#1e293b">② CRD 定义（OpenAPI schema）</text>

    <rect class="at-hover-card" x="40" y="265" width="520" height="120" rx="4" fill="#1e293b"/>
    <text x="55" y="283" font-size="10" font-family="monospace" fill="#a7f3d0">apiVersion: apiextensions.k8s.io/v1</text>
    <text x="55" y="297" font-size="10" font-family="monospace" fill="#a7f3d0">kind: CustomResourceDefinition</text>
    <text x="55" y="311" font-size="10" font-family="monospace" fill="#a7f3d0">metadata:</text>
    <text x="55" y="325" font-size="10" font-family="monospace" fill="#a7f3d0">  name: applications.demo.example.com</text>
    <text x="55" y="339" font-size="10" font-family="monospace" fill="#a7f3d0">spec:</text>
    <text x="55" y="353" font-size="10" font-family="monospace" fill="#fde68a">  group: demo.example.com</text>
    <text x="55" y="367" font-size="10" font-family="monospace" fill="#fde68a">  scope: Namespaced</text>
    <text x="55" y="381" font-size="10" font-family="monospace" fill="#fde68a">  names: kind: Application plural: applications</text>
  </g>

  <!-- Operator reconcile loop -->
  <g>
    <text x="60" y="405" font-size="13" font-weight="700" fill="#1e293b">③ Operator Reconcile Loop</text>

    <ellipse cx="300" cy="450" rx="35" ry="20" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Observe</text>

    <path d="M 335 450 L 400 450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <ellipse cx="450" cy="450" rx="40" ry="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="450" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Analyze</text>

    <path d="M 490 450 Q 530 460 490 470 Q 460 478 410 470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <ellipse cx="370" cy="450" rx="35" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="370" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Act</text>
  </g>
</svg>
