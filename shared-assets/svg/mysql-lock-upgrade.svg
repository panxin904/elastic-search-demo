<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >MySQL InnoDB 锁机制</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">行锁 → 间隙锁 → 临键锁（Next-Key Lock）· RR 隔离级特殊行为</text>

  <!-- 四种锁对比表 -->
  <g>
    <rect x="40" y="90" width="520" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>

    <!-- 标题行 -->
    <text x="100" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">锁类型</text>
    <text x="220" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">范围</text>
    <text x="370" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">加锁方式</text>
    <text x="510" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">场景</text>

    <line x1="40" y1="125" x2="560" y2="125" stroke="#cbd5e1"/>

    <!-- Record Lock -->
    <text x="100" y="148" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="700">Record Lock</text>
    <text x="220" y="148" text-anchor="middle" font-size="10" fill="#475569">单条记录</text>
    <text x="370" y="148" text-anchor="middle" font-size="10" fill="#475569">唯一索引精确命中</text>
    <text x="510" y="148" text-anchor="middle" font-size="10" fill="#475569">SELECT ... FOR UPDATE</text>

    <!-- Gap Lock -->
    <text x="100" y="175" text-anchor="middle" font-size="11" fill="#10b981" font-weight="700">Gap Lock</text>
    <text x="220" y="175" text-anchor="middle" font-size="10" fill="#475569">区间（不含记录）</text>
    <text x="370" y="175" text-anchor="middle" font-size="10" fill="#475569">RR 隔离级范围查询</text>
    <text x="510" y="175" text-anchor="middle" font-size="10" fill="#475569">防幻读</text>

    <!-- Next-Key Lock -->
    <text x="100" y="202" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="700">Next-Key Lock</text>
    <text x="220" y="202" text-anchor="middle" font-size="10" fill="#475569">记录 + 前区间</text>
    <text x="370" y="202" text-anchor="middle" font-size="10" fill="#475569">RR + 非唯一索引</text>
    <text x="510" y="202" text-anchor="middle" font-size="10" fill="#475569">RR 默认行为</text>

    <!-- Insert Intention -->
    <text x="100" y="229" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">Insert Intention</text>
    <text x="220" y="229" text-anchor="middle" font-size="10" fill="#475569">插入意向</text>
    <text x="370" y="229" text-anchor="middle" font-size="10" fill="#475569">INSERT 前申请</text>
    <text x="510" y="229" text-anchor="middle" font-size="10" fill="#475569">多 INSERT 并发互斥</text>
  </g>

  <!-- 间隙锁示意 -->
  <g>
    <text x="60" y="290" font-size="13" font-weight="700" fill="#1e293b">Next-Key Lock 加锁区间示意（RR）</text>

    <text x="60" y="320" font-size="11" fill="#475569">现有数据：id = 10, 20, 30</text>
    <text x="60" y="335" font-size="11" fill="#475569">SELECT * FROM t WHERE id &gt; 15 AND id &lt; 25 FOR UPDATE</text>

    <!-- 时间轴 -->
    <line x1="80" y1="365" x2="540" y2="365" stroke="#94a3b8" stroke-width="2"/>
    <!-- 节点 -->
    <circle cx="100" cy="365" r="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">10</text>

    <circle cx="200" cy="365" r="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="200" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">20</text>

    <circle cx="300" cy="365" r="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">30</text>

    <!-- 锁定区间 (15, 25) -->
    <rect x="110" y="345" width="180" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" fill-opacity="0.5"/>
    <text x="200" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Next-Key Lock</text>
    <text x="200" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">(15, 25]</text>

    <!-- 不可插入 -->
    <text x="120" y="410" font-size="10" fill="#dc2626">× INSERT id=18</text>
    <text x="120" y="425" font-size="10" fill="#dc2626">× INSERT id=22</text>
    <text x="120" y="440" font-size="10" fill="#dc2626">× INSERT id=25</text>

    <!-- 可插入 -->
    <text x="320" y="410" font-size="10" fill="#10b981">✓ INSERT id=12</text>
    <text x="320" y="425" font-size="10" fill="#10b981">✓ INSERT id=26</text>
    <text x="320" y="440" font-size="10" fill="#10b981">✓ INSERT id=8</text>
  </g>

  <!-- 死锁警示 -->
  <g>
    <rect x="40" y="455" width="520" height="20" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="300" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">⚠️ Next-Key Lock 是 RR 下死锁高发原因（多 session 范围查询重叠）</text>
  </g>
</svg>
