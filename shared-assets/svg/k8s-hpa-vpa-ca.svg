<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >K8s 三种自动扩缩</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">HPA（横向副本）· VPA（纵向资源）· CA（集群节点）</text>

  <!-- 三种对比 -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① 三种扩缩对比</text>

    <!-- HPA -->
    <rect class="at-hover-card" x="40" y="105" width="165" height="200" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="122" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">HPA</text>
    <text x="122" y="145" text-anchor="middle" font-size="9" fill="#475569">Horizontal Pod</text>
    <text x="122" y="160" text-anchor="middle" font-size="9" fill="#475569">Autoscaler</text>

    <text x="55" y="184" font-size="10" font-weight="700" fill="#1e293b">扩缩对象</text>
    <text x="55" y="200" font-size="9" fill="#475569">Pod 副本数</text>

    <text x="55" y="220" font-size="10" font-weight="700" fill="#1e293b">触发指标</text>
    <text x="55" y="236" font-size="9" fill="#475569">CPU / Mem / 自定义</text>

    <text x="55" y="256" font-size="10" font-weight="700" fill="#1e293b">应用场景</text>
    <text x="55" y="272" font-size="9" fill="#475569">流量突增</text>
    <text x="55" y="287" font-size="9" fill="#475569">无状态服务</text>

    <text x="55" y="300" font-size="9" font-weight="700" fill="#1e40af">最常用 ✅</text>

    <!-- VPA -->
    <rect class="at-hover-card" x="220" y="105" width="165" height="200" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="302" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">VPA</text>
    <text x="302" y="145" text-anchor="middle" font-size="9" fill="#475569">Vertical Pod</text>
    <text x="302" y="160" text-anchor="middle" font-size="9" fill="#475569">Autoscaler</text>

    <text x="235" y="184" font-size="10" font-weight="700" fill="#1e293b">扩缩对象</text>
    <text x="235" y="200" font-size="9" fill="#475569">Pod 的 CPU/Mem</text>
    <text x="235" y="215" font-size="9" fill="#475569">requests / limits</text>

    <text x="235" y="235" font-size="10" font-weight="700" fill="#1e293b">触发指标</text>
    <text x="235" y="251" font-size="9" fill="#475569">历史使用率</text>

    <text x="235" y="271" font-size="10" font-weight="700" fill="#1e293b">应用场景</text>
    <text x="235" y="287" font-size="9" fill="#475569">资源利用率优化</text>

    <text x="235" y="300" font-size="9" font-weight="700" fill="#dc2626">需重启 Pod</text>

    <!-- CA -->
    <rect class="at-hover-card" x="400" y="105" width="160" height="200" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">CA</text>
    <text x="480" y="145" text-anchor="middle" font-size="9" fill="#475569">Cluster</text>
    <text x="480" y="160" text-anchor="middle" font-size="9" fill="#475569">Autoscaler</text>

    <text x="415" y="184" font-size="10" font-weight="700" fill="#1e293b">扩缩对象</text>
    <text x="415" y="200" font-size="9" fill="#475569">Node 节点数</text>

    <text x="415" y="220" font-size="10" font-weight="700" fill="#1e293b">触发指标</text>
    <text x="415" y="236" font-size="9" fill="#475569">Pod 调度失败 / 资源</text>

    <text x="415" y="256" font-size="10" font-weight="700" fill="#1e293b">应用场景</text>
    <text x="415" y="272" font-size="9" fill="#475569">云上弹性节点组</text>
    <text x="415" y="287" font-size="9" fill="#475569">AWS ASG / CA</text>

    <text x="415" y="300" font-size="9" font-weight="700" fill="#92400e">依赖云厂商</text>
  </g>

  <!-- HPA 工作原理 -->
  <g>
    <text x="60" y="325" font-size="13" font-weight="700" fill="#1e293b">② HPA 工作流程（30s 一次同步）</text>

    <rect class="at-hover-card" x="40" y="338" width="520" height="125" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect class="at-hover-card" x="55" y="355" width="105" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Metrics Server</text>
    <text x="107" y="386" text-anchor="middle" font-size="8" fill="#475569">采集 Pod CPU</text>

    <path d="M 160 372 L 190 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="190" y="355" width="115" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="247" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">HPA Controller</text>
    <text x="247" y="386" text-anchor="middle" font-size="8" fill="#475569">计算目标副本</text>

    <path d="M 305 372 L 335 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="335" y="355" width="105" height="35" rx="3" fill="#dcfce7" stroke="#10b981"/>
    <text x="387" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Deployment</text>
    <text x="387" y="386" text-anchor="middle" font-size="8" fill="#475569">scale 副本</text>

    <path d="M 440 372 L 470 372" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect class="at-hover-card" x="470" y="355" width="80" height="35" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="510" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">扩容</text>
    <text x="510" y="386" text-anchor="middle" font-size="8" fill="#475569">新 Pod</text>

    <text x="60" y="410" font-size="10" fill="#475569">公式：期望副本 = ceil[当前副本 × (当前指标 / 目标指标)]</text>
    <text x="60" y="427" font-size="9" font-family="monospace" fill="#1e293b">例：3 Pod × (80% / 50%) = ceil(4.8) = 5 Pod</text>
    <text x="60" y="445" font-size="9" fill="#475569">⚠️ 限制：min ≤ replicas ≤ max（默认 1-10），HPA 与 VPA 不能同时用</text>
  </g>
</svg>
