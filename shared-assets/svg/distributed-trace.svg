<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" >分布式追踪（Distributed Tracing）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Trace + Span · traceId 串联 · OpenTelemetry</text>

  <!-- Trace 时间轴 -->
  <line x1="40" y1="270" x2="560" y2="270" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 5 个 Span -->
  <g font-size="10" font-weight="700">
    <rect x="50" y="120" width="200" height="22" rx="3" fill="#3b82f6" opacity="0.9"/>
    <text x="60" y="135" fill="white">API Gateway</text>
    <text x="245" y="135" text-anchor="end" fill="white">120ms</text>

    <rect x="100" y="155" width="140" height="22" rx="3" fill="#10b981" opacity="0.9"/>
    <text x="110" y="170" fill="white">Auth Service</text>
    <text x="235" y="170" text-anchor="end" fill="white">45ms</text>

    <rect x="100" y="190" width="100" height="22" rx="3" fill="#10b981" opacity="0.9"/>
    <text x="110" y="205" fill="white">User DB</text>
    <text x="195" y="205" text-anchor="end" fill="white">20ms</text>

    <rect x="250" y="155" width="200" height="22" rx="3" fill="#f59e0b" opacity="0.9"/>
    <text x="260" y="170" fill="white">Order Service</text>
    <text x="445" y="170" text-anchor="end" fill="white">85ms</text>

    <rect x="450" y="190" width="80" height="22" rx="3" fill="#f59e0b" opacity="0.9"/>
    <text x="460" y="205" fill="white">Order DB</text>
    <text x="525" y="205" text-anchor="end" fill="white">30ms</text>

    <rect x="250" y="225" width="150" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="260" y="240" fill="white">Payment Service</text>
    <text x="395" y="240" text-anchor="end" fill="white">60ms</text>

    <rect x="400" y="260" width="100" height="22" rx="3" fill="#ec4899" opacity="0.9"/>
    <text x="410" y="275" fill="white">Payment GW</text>
    <text x="495" y="275" text-anchor="end" fill="white">40ms</text>
  </g>

  <!-- traceId 标注 -->
  <text x="40" y="115" font-size="10" fill="#475569" font-weight="600">traceId=abc123</text>

  <!-- 关键概念 -->
  <g font-size="11">
    <rect x="50" y="320" width="160" height="130" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="130" y="340" text-anchor="middle" font-weight="700" fill="#1e3a8a">Span</text>
    <text x="130" y="358" text-anchor="middle" fill="#1e40af">一个工作单元</text>
    <text x="130" y="375" text-anchor="middle" fill="#1e40af">spanId + parentId</text>
    <text x="130" y="392" text-anchor="middle" fill="#1e40af">start / duration</text>
    <text x="130" y="409" text-anchor="middle" fill="#1e40af">attributes / events</text>
    <text x="130" y="426" text-anchor="middle" fill="#1e40af">status: OK / ERROR</text>

    <rect x="230" y="320" width="160" height="130" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="310" y="340" text-anchor="middle" font-weight="700" fill="#064e3b">Trace</text>
    <text x="310" y="358" text-anchor="middle" fill="#065f46">完整请求链路</text>
    <text x="310" y="375" text-anchor="middle" fill="#065f46">traceId 全局唯一</text>
    <text x="310" y="392" text-anchor="middle" fill="#065f46">树形 Span 集合</text>
    <text x="310" y="409" text-anchor="middle" fill="#065f46">传递：HTTP/gRPC/Kafka</text>
    <text x="310" y="426" text-anchor="middle" fill="#065f46">traceparent header</text>

    <rect x="410" y="320" width="160" height="130" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="490" y="340" text-anchor="middle" font-weight="700" fill="#92400e">OTel</text>
    <text x="490" y="358" text-anchor="middle" fill="#78350f">OpenTelemetry</text>
    <text x="490" y="375" text-anchor="middle" fill="#78350f">统一标准</text>
    <text x="490" y="392" text-anchor="middle" fill="#78350f">SDK 探针自动埋点</text>
    <text x="490" y="409" text-anchor="middle" fill="#78350f">Jaeger / Zipkin</text>
    <text x="490" y="426" text-anchor="middle" fill="#78350f">采样策略（1%-100%）</text>
  </g>
</svg>
