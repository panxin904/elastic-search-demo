<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">六边形架构（端口与适配器）</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">业务核心与外部解耦 · Alistair Cockburn</text>

  <!-- 中心：领域核心 -->
  <circle cx="300" cy="280" r="70" fill="#3b82f6" opacity="0.95"/>
  <text x="300" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="white">Domain Core</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="white">业务核心</text>
  <text x="300" y="308" text-anchor="middle" font-size="10" fill="#dbeafe">实体 + 用例</text>

  <!-- 适配器（外圈 6 个） -->
  <g font-size="10" font-weight="700">
    <!-- 顶部 -->
    <rect x="240" y="100" width="120" height="40" rx="6" fill="#10b981" opacity="0.9"/>
    <text x="300" y="120" text-anchor="middle" fill="white">REST API</text>
    <text x="300" y="132" text-anchor="middle" font-size="9" fill="#d1fae5">入站适配器</text>

    <!-- 右上 -->
    <rect x="430" y="180" width="100" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>
    <text x="480" y="200" text-anchor="middle" fill="white">CLI / UI</text>
    <text x="480" y="212" text-anchor="middle" font-size="9" fill="#fef3c7">入站</text>

    <!-- 右下 -->
    <rect x="430" y="340" width="100" height="40" rx="6" fill="#ec4899" opacity="0.9"/>
    <text x="480" y="360" text-anchor="middle" fill="white">DB Adapter</text>
    <text x="480" y="372" text-anchor="middle" font-size="9" fill="#fce7f3">出站</text>

    <!-- 底部 -->
    <rect x="240" y="420" width="120" height="40" rx="6" fill="#8b5cf6" opacity="0.9"/>
    <text x="300" y="440" text-anchor="middle" fill="white">Message Bus</text>
    <text x="300" y="452" text-anchor="middle" font-size="9" fill="#ede9fe">出站适配器</text>

    <!-- 左下 -->
    <rect x="70" y="340" width="100" height="40" rx="6" fill="#06b6d4" opacity="0.9"/>
    <text x="120" y="360" text-anchor="middle" fill="white">External API</text>
    <text x="120" y="372" text-anchor="middle" font-size="9" fill="#cffafe">出站</text>

    <!-- 左上 -->
    <rect x="70" y="180" width="100" height="40" rx="6" fill="#facc15" opacity="0.95"/>
    <text x="120" y="200" text-anchor="middle" fill="black">Message</text>
    <text x="120" y="212" text-anchor="middle" font-size="9" fill="#713f12">入站</text>
  </g>

  <!-- 端口（接口） -->
  <g font-size="9">
    <text x="300" y="160" text-anchor="middle" font-weight="700" fill="#475569">⬇ Port</text>
    <text x="405" y="245" text-anchor="middle" font-weight="700" fill="#475569" transform="rotate(60 405 245)">Port ⬇</text>
    <text x="405" y="335" text-anchor="middle" font-weight="700" fill="#475569" transform="rotate(-60 405 335)">Port ⬇</text>
    <text x="300" y="400" text-anchor="middle" font-weight="700" fill="#475569">⬇ Port</text>
    <text x="195" y="335" text-anchor="middle" font-weight="700" fill="#475569" transform="rotate(60 195 335)">Port ⬇</text>
    <text x="195" y="245" text-anchor="middle" font-weight="700" fill="#475569" transform="rotate(-60 195 245)">Port ⬇</text>
  </g>

  <!-- 关键原则 -->
  <g font-size="11">
    <rect x="40" y="100" width="120" height="0" fill="#f1f5f9"/>
    <rect x="40" y="380" width="520" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="400" text-anchor="middle" font-weight="700" fill="#1e293b">核心原则</text>
    <text x="60" y="418" fill="#475569">✓ 业务核心不依赖外部（依赖倒置）· 端口定义接口</text>
    <text x="60" y="432" fill="#475569">✓ 适配器实现端口 · 替换不影响业务</text>
  </g>
</svg>
