<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="at-svg-bg" width="600" height="480"/>
  <text class="at-svg-title" x="300" y="32" text-anchor="middle" font-size="20" font-weight="600">HashMap 内部结构与演进</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">数组 + 链表 + 红黑树 · 树化阈值 8 / 退树阈值 6</text>

  <!-- 左侧：桶数组 -->
  <text x="160" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">桶数组 Node&lt;K,V&gt;[] table</text>
  <text x="160" y="108" text-anchor="middle" font-size="10" fill="#475569">初始容量 16 · 负载因子 0.75</text>

  <!-- 桶 0..6 -->
  <rect class="at-hover-card" x="50" y="120" width="60" height="35" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">0</text>

  <rect class="at-hover-card" x="110" y="120" width="60" height="35" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="140" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">1</text>
  <text x="140" y="170" text-anchor="middle" font-size="9" fill="#334155">A→B→C</text>
  <text x="140" y="183" text-anchor="middle" font-size="9" fill="#64748b">(链表)</text>

  <rect class="at-hover-card" x="170" y="120" width="60" height="35" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="200" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">2</text>

  <rect class="at-hover-card" x="230" y="120" width="60" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">5</text>
  <text x="260" y="170" text-anchor="middle" font-size="9" fill="#334155">D</text>
  <text x="260" y="183" text-anchor="middle" font-size="9" fill="#64748b">(单节点)</text>

  <rect class="at-hover-card" x="290" y="120" width="60" height="35" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="320" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">3</text>

  <rect class="at-hover-card" x="350" y="120" width="60" height="35" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">9</text>
  <text x="380" y="170" text-anchor="middle" font-size="9" fill="#334155">长链表</text>
  <text x="380" y="183" text-anchor="middle" font-size="9" fill="#64748b">(≥8 转红黑树)</text>

  <rect class="at-hover-card" x="410" y="120" width="60" height="35" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="440" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">...</text>

  <!-- 右侧：演进路径 -->
  <text x="430" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">链表 → 红黑树 演进</text>

  <rect class="at-hover-card" x="350" y="235" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">单链表</text>
  <text x="440" y="275" text-anchor="middle" font-size="9" fill="#475569">插入 O(1) · 查找 O(n)</text>

  <text x="440" y="305" text-anchor="middle" font-size="14" fill="#64748b">↓ 桶内 ≥ 8 且容量 ≥ 64</text>

  <rect class="at-hover-card" x="350" y="315" width="180" height="55" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="440" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">红黑树 TreeNode</text>
  <text x="440" y="355" text-anchor="middle" font-size="9" fill="#475569">查找/插入 O(log n) · 自平衡</text>

  <text x="440" y="385" text-anchor="middle" font-size="11" fill="#64748b">↓ 树节点 ≤ 6 退化为链表</text>

  <!-- 底部关键参数 -->
  <rect x="40" y="395" width="520" height="70" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="300" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">关键阈值与扩容</text>
  <text x="60" y="436" font-size="10" fill="#334155">· TREEIFY_THRESHOLD = 8（链表→树）</text>
  <text x="60" y="452" font-size="10" fill="#334155">· UNTREEIFY_THRESHOLD = 6（树→链表）</text>
  <text x="320" y="436" font-size="10" fill="#334155">· MIN_TREEIFY_CAPACITY = 64</text>
  <text x="320" y="452" font-size="10" fill="#334155">· 负载 0.75 → size &gt; cap*0.75 时 2 倍扩容 rehash</text>
</svg>
