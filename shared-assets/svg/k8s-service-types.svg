<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">K8s Service 三种类型</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">ClusterIP（集群内）· NodePort（节点）· LoadBalancer（云 LB）</text>

  <!-- ClusterIP -->
  <g>
    <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">① ClusterIP（默认）— 集群内部访问</text>

    <rect x="40" y="105" width="520" height="85" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="60" y="120" width="80" height="50" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="100" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Pod A</text>
    <text x="100" y="158" text-anchor="middle" font-size="8" fill="#475569">client</text>

    <path d="M 140 145 L 180 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <text x="160" y="138" font-size="8" fill="#475569" text-anchor="middle">访问</text>

    <rect x="180" y="115" width="160" height="60" rx="3" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="260" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">ClusterIP Service</text>
    <text x="260" y="153" text-anchor="middle" font-size="9" font-family="monospace" fill="#1e293b">10.96.0.100:80</text>
    <text x="260" y="168" text-anchor="middle" font-size="9" fill="#475569">虚拟 IP（仅集群内）</text>

    <path d="M 340 145 L 380 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="380" y="120" width="80" height="20" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="420" y="134" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Pod B</text>

    <rect x="380" y="145" width="80" height="20" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="420" y="159" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Pod C</text>

    <text x="60" y="183" font-size="9" fill="#475569">默认类型，iptables/IPVS 转发；外部无法直接访问</text>
  </g>

  <!-- NodePort -->
  <g>
    <text x="60" y="210" font-size="13" font-weight="700" fill="#1e293b">② NodePort — 节点端口暴露（开发/测试）</text>

    <rect x="40" y="225" width="520" height="85" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="60" y="245" width="100" height="40" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="110" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">外部</text>
    <text x="110" y="280" text-anchor="middle" font-size="8" fill="#475569">client</text>

    <path d="M 160 265 L 200 265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <text x="180" y="258" font-size="8" font-family="monospace" fill="#475569" text-anchor="middle">:30080</text>

    <rect x="200" y="240" width="140" height="50" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="270" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">NodePort</text>
    <text x="270" y="276" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">NodeIP:30080</text>
    <text x="270" y="290" text-anchor="middle" font-size="8" fill="#475569">每 Node 监听</text>

    <path d="M 340 265 L 380 265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="380" y="240" width="80" height="20" rx="2" fill="#dcfce7" stroke="#10b981"/>
    <text x="420" y="254" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">Pod B</text>

    <rect x="380" y="265" width="80" height="20" rx="2" fill="#dcfce7" stroke="#10b981"/>
    <text x="420" y="279" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">Pod C</text>

    <text x="60" y="303" font-size="9" fill="#475569">端口范围 30000-32767；不推荐生产（需手动管理 Node IP）</text>
  </g>

  <!-- LoadBalancer -->
  <g>
    <text x="60" y="328" font-size="13" font-weight="700" fill="#1e293b">③ LoadBalancer — 云厂商 LB（生产）</text>

    <rect x="40" y="343" width="520" height="115" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

    <rect x="60" y="365" width="100" height="50" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="110" y="385" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">用户</text>
    <text x="110" y="402" text-anchor="middle" font-size="8" fill="#475569">公网</text>

    <path d="M 160 390 L 200 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="200" y="358" width="140" height="60" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="270" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">云 LB</text>
    <text x="270" y="395" text-anchor="middle" font-size="8" font-family="monospace" fill="#1e293b">公网 IP</text>
    <text x="270" y="408" text-anchor="middle" font-size="8" fill="#475569">AWS ELB / GCP LB</text>

    <path d="M 340 390 L 380 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="380" y="365" width="80" height="20" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="420" y="379" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Node 1</text>

    <rect x="380" y="390" width="80" height="20" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="420" y="404" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Node 2</text>

    <rect x="470" y="365" width="80" height="20" rx="2" fill="#dcfce7" stroke="#10b981"/>
    <text x="510" y="379" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">Pod B</text>

    <rect x="470" y="390" width="80" height="20" rx="2" fill="#dcfce7" stroke="#10b981"/>
    <text x="510" y="404" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">Pod C</text>

    <text x="60" y="430" font-size="9" font-weight="700" fill="#991b1b">⚠️ 缺点：每 Service 一个 LB，昂贵 → 推荐用 Ingress 替代（七层路由）</text>
    <text x="60" y="448" font-size="9" fill="#475569">层级：LoadBalancer（云 LB）→ NodePort → ClusterIP（嵌套）</text>
  </g>
</svg>
