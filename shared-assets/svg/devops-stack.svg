<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="600" height="480" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">DevOps 全景</text>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#64748b">Plan · Code · Build · Test · Release · Deploy · Operate · Monitor</text>

  <!-- 8 个阶段（环形布局） -->
  <g font-size="11" font-weight="700">
    <circle cx="300" cy="180" r="40" fill="#3b82f6" opacity="0.95"/>
    <text x="300" y="180" text-anchor="middle" fill="white">Plan</text>
    <text x="300" y="195" text-anchor="middle" font-size="9" fill="#dbeafe">计划</text>

    <circle cx="420" cy="220" r="40" fill="#10b981" opacity="0.95"/>
    <text x="420" y="220" text-anchor="middle" fill="white">Code</text>
    <text x="420" y="235" text-anchor="middle" font-size="9" fill="#d1fae5">编码</text>

    <circle cx="460" cy="320" r="40" fill="#f59e0b" opacity="0.95"/>
    <text x="460" y="320" text-anchor="middle" fill="white">Build</text>
    <text x="460" y="335" text-anchor="middle" font-size="9" fill="#fef3c7">构建</text>

    <circle cx="420" cy="420" r="40" fill="#ef4444" opacity="0.95"/>
    <text x="420" y="420" text-anchor="middle" fill="white">Test</text>
    <text x="420" y="435" text-anchor="middle" font-size="9" fill="#fee2e2">测试</text>

    <circle cx="300" cy="460" r="40" fill="#8b5cf6" opacity="0.95"/>
    <text x="300" y="460" text-anchor="middle" fill="white">Release</text>
    <text x="300" y="475" text-anchor="middle" font-size="9" fill="#ede9fe">发布</text>

    <circle cx="180" cy="420" r="40" fill="#ec4899" opacity="0.95"/>
    <text x="180" y="420" text-anchor="middle" fill="white">Deploy</text>
    <text x="180" y="435" text-anchor="middle" font-size="9" fill="#fce7f3">部署</text>

    <circle cx="140" cy="320" r="40" fill="#06b6d4" opacity="0.95"/>
    <text x="140" y="320" text-anchor="middle" fill="white">Operate</text>
    <text x="140" y="335" text-anchor="middle" font-size="9" fill="#cffafe">运营</text>

    <circle cx="180" cy="220" r="40" fill="#84cc16" opacity="0.95"/>
    <text x="180" y="220" text-anchor="middle" fill="white">Monitor</text>
    <text x="180" y="235" text-anchor="middle" font-size="9" fill="#ecfccb">监控</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M340,180 Q380,195 390,200"/>
    <path d="M450,255 Q470,290 470,295"/>
    <path d="M445,355 Q430,390 410,400"/>
    <path d="M380,460 Q320,470 320,470"/>
    <path d="M260,460 Q220,470 220,470"/>
    <path d="M155,380 Q130,355 130,340"/>
    <path d="M165,275 Q185,240 185,235"/>
    <path d="M225,200 Q260,180 280,180"/>
  </g>

  <!-- 工具映射 -->
  <g font-size="11">
    <rect x="40" y="115" width="115" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="97" y="133" text-anchor="middle" font-weight="700" fill="#1e3a8a">Jira / 禅道</text>
    <text x="97" y="148" text-anchor="middle" font-size="9" fill="#1e40af">需求 / 任务</text>

    <rect x="450" y="115" width="115" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="507" y="133" text-anchor="middle" font-weight="700" fill="#064e3b">Git / GitHub</text>
    <text x="507" y="148" text-anchor="middle" font-size="9" fill="#065f46">代码托管</text>

    <rect x="500" y="270" width="85" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="542" y="288" text-anchor="middle" font-weight="700" fill="#92400e">Maven</text>
    <text x="542" y="303" text-anchor="middle" font-size="9" fill="#78350f">Gradle</text>

    <rect x="450" y="380" width="115" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="507" y="398" text-anchor="middle" font-weight="700" fill="#7f1d1d">SonarQube</text>
    <text x="507" y="413" text-anchor="middle" font-size="9" fill="#991b1b">Junit / Postman</text>

    <rect x="430" y="465" width="115" height="0" fill="#fff"/>
  </g>

  <text x="300" y="35" text-anchor="middle" font-size="11" fill="#94a3b8">持续集成 / 持续交付 / 持续部署（CI / CD）</text>
</svg>
